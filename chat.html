<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Chat</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 10px;
        }

        #app {
            height: 100vh;
            height: 100dvh;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
            min-height: 52px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            padding: 6px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .chat-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
            min-width: 0;
        }

        .chat-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #8B5CF6;
            overflow: hidden;
            flex-shrink: 0;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-name {
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-name .verified-badge {
            color: #1DA1F2;
            font-size: 13px;
        }

        .chat-status {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
        }

        .chat-status.online {
            color: #22c55e;
        }

        .chat-status.typing {
            color: #06B6D4;
            font-style: italic;
        }

        .header-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }

        .header-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 15px;
            padding: 6px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-actions button:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== MESSAGES CONTAINER ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px 6px 14px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            scroll-behavior: smooth;
            overflow-x: hidden;
            gap: 2px;
        }

        /* ===== DATE DIVIDER ===== */
        .date-divider {
            text-align: center;
            padding: 8px 0 12px 0;
            font-size: 11px;
            color: rgba(255,255,255,0.25);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 500;
        }

        .date-divider::before,
        .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }

        /* ===== MESSAGE ===== */
        .message {
            margin-bottom: 2px;
            max-width: 92%;
            align-self: flex-start;
            animation: fadeInMsg 0.2s ease;
        }

        .message.own {
            align-self: flex-end;
        }

        .message.own .msg-bubble {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(6, 182, 212, 0.15));
            border-color: rgba(139, 92, 246, 0.15);
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message .msg-bubble {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            padding: 8px 10px;
        }

        .message .msg-sender {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .message .msg-sender .sender-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }

        .message .msg-sender .sender-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message .msg-sender .sender-name {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
            flex: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message .msg-sender .sender-name .verified-badge {
            color: #1DA1F2;
            font-size: 11px;
        }

        .message .msg-sender .msg-time {
            font-size: 9px;
            color: rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .message .msg-text {
            font-size: 13px;
            color: #fff;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message .msg-text a {
            color: #8B5CF6;
            text-decoration: underline;
        }

        .message .msg-text.deleted {
            color: rgba(255,255,255,0.25);
            font-style: italic;
            font-size: 12px;
        }

        /* System message */
        .message.system {
            max-width: 100%;
            align-self: center;
        }

        .message.system .msg-bubble {
            background: rgba(255,255,255,0.02);
            border-color: rgba(255,255,255,0.03);
            padding: 3px 12px;
        }

        .message.system .msg-text {
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            text-align: center;
            font-style: italic;
        }

        /* Reply */
        .msg-reply {
            padding: 3px 8px;
            margin-bottom: 3px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            border-left: 2px solid #8B5CF6;
            cursor: pointer;
        }

        .msg-reply .reply-sender {
            font-size: 9px;
            font-weight: 600;
            color: #8B5CF6;
        }

        .msg-reply .reply-content {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Media */
        .msg-media {
            border-radius: 8px;
            overflow: hidden;
            margin-top: 4px;
            cursor: pointer;
            max-width: 100%;
            max-height: 200px;
        }

        .msg-media img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
        }

        .msg-media .video-placeholder {
            width: 100%;
            height: 140px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
        }

        /* Reactions */
        .msg-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 4px;
        }

        .msg-reactions .reaction {
            padding: 1px 5px;
            background: rgba(26, 16, 60, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
            font-size: 10px;
            cursor: pointer;
        }

        /* ===== NO MESSAGES ===== */
        .no-messages {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 120px;
        }

        .no-messages .icon {
            font-size: 40px;
            color: rgba(255,255,255,0.04);
        }

        .no-messages .text {
            color: rgba(255,255,255,0.15);
            font-size: 13px;
            margin-top: 10px;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 6px 10px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            min-height: 52px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-row button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-row button:hover {
            background: rgba(255,255,255,0.05);
        }

        .input-row .input-field {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 8px 14px;
            border: none;
            color: #fff;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            min-height: 36px;
        }

        .input-row .input-field::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .input-row .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            font-size: 18px;
            transition: transform 0.2s;
        }

        .input-row .action-btn:hover {
            transform: scale(1.05);
        }

        .input-row .action-btn.send {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            font-size: 16px;
            display: none;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }

        .input-row .action-btn.send.show {
            display: flex;
        }

        .input-row .action-btn.mic {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            display: flex;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }

        .input-row .action-btn.mic.hide {
            display: none;
        }

        .input-row .action-btn .spinner-small {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== EMOJI PICKER ===== */
        .emoji-picker {
            background: rgba(26, 16, 60, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.04);
            padding: 6px 10px;
            display: none;
            flex-shrink: 0;
            max-height: 140px;
            overflow-y: auto;
        }

        .emoji-picker.show {
            display: block;
        }

        .emoji-picker .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
        }

        .emoji-picker .emoji-grid .emoji {
            font-size: 20px;
            cursor: pointer;
            padding: 3px;
            text-align: center;
            border-radius: 5px;
        }

        .emoji-picker .emoji-grid .emoji:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 16, 60, 0.95);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
            z-index: 3000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .toast.show {
            display: block;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            background: rgba(239, 68, 68, 0.06);
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            background: rgba(74, 222, 128, 0.06);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: rgba(26, 16, 60, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 60vh;
            padding: 14px 18px 18px 18px;
            overflow-y: auto;
        }

        .modal-handle {
            width: 32px;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            margin: 0 auto 10px auto;
        }

        .modal-option {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 2px;
        }

        .modal-option:hover {
            background: rgba(255,255,255,0.04);
        }

        .modal-option .opt-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 14px;
        }

        .modal-option .opt-label {
            color: #fff;
            font-size: 13px;
        }

        .attach-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            padding: 4px 0;
        }

        .attach-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
        }

        .attach-item .att-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #8B5CF6;
        }

        .attach-item .att-label {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-top: 3px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .message {
                max-width: 94%;
            }
            .header {
                padding: 6px 10px;
                min-height: 44px;
            }
            .chat-avatar {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }
            .chat-name {
                font-size: 13px;
            }
            .input-area {
                padding: 4px 8px;
                min-height: 46px;
            }
            .input-row .input-field {
                font-size: 12px;
                padding: 6px 10px;
                min-height: 32px;
            }
            .input-row .action-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .messages-container {
                padding: 4px 10px 4px 10px;
            }
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="window.location.href='chats.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="chat-info" onclick="goToProfile()">
                <div class="chat-avatar" id="chatAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <div>
                    <div class="chat-name" id="chatName">Chat</div>
                    <div class="chat-status" id="chatStatus">Online</div>
                </div>
            </div>
            <div class="header-actions">
                <button onclick="startCall(true)" title="Video Call">
                    <i class="fas fa-video"></i>
                </button>
                <button onclick="startCall(false)" title="Voice Call">
                    <i class="fas fa-phone"></i>
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages-container" id="messagesContainer">
            <div class="no-messages">
                <div class="icon"><i class="fas fa-comment"></i></div>
                <div class="text">Loading messages...</div>
            </div>
        </div>

        <!-- Emoji Picker -->
        <div class="emoji-picker" id="emojiPicker">
            <div class="emoji-grid" id="emojiGrid"></div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-row">
                <button onclick="showAttachmentMenu()">
                    <i class="fas fa-plus"></i>
                </button>
                <button onclick="toggleEmojiPicker()">
                    <i class="fas fa-smile"></i>
                </button>
                <input class="input-field" id="messageInput" placeholder="Message..." oninput="onInputChange()" />
                <button class="action-btn mic" id="micBtn" onclick="sendMessage()">
                    <i class="fas fa-microphone"></i>
                </button>
                <button class="action-btn send" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Modals -->
    <div class="modal-overlay" id="attachModal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <div style="font-size:15px;font-weight:600;color:#fff;text-align:center;margin-bottom:10px;">Attach</div>
            <div class="attach-grid">
                <button class="attach-item" onclick="pickImage()">
                    <div class="att-icon"><i class="fas fa-image"></i></div>
                    <span class="att-label">Gallery</span>
                </button>
                <button class="attach-item" onclick="takePhoto()">
                    <div class="att-icon"><i class="fas fa-camera"></i></div>
                    <span class="att-label">Camera</span>
                </button>
                <button class="attach-item" onclick="pickVideo()">
                    <div class="att-icon"><i class="fas fa-video"></i></div>
                    <span class="att-label">Video</span>
                </button>
                <button class="attach-item" onclick="pickFile()">
                    <div class="att-icon"><i class="fas fa-file"></i></div>
                    <span class="att-label">File</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelected(event)" />
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleImageSelected(event)" />
    <input type="file" id="videoInput" accept="video/*" style="display:none" onchange="handleVideoSelected(event)" />
    <input type="file" id="fileInput" style="display:none" onchange="handleFileSelected(event)" />

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // ─── STATE ─────────────────────────────────────────────────────
        let currentUserId = null;
        let currentUserData = {};
        let chatId = null;
        let chatName = '';
        let chatAvatar = '';
        let otherUserId = null;
        let messages = [];
        let selectedImage = null;
        let selectedVideo = null;
        let selectedFile = null;
        let messagesUnsubscribe = null;
        let isFirstLoad = true;
        let showEmojiPicker = false;

        // ─── USER CACHE ──────────────────────────────────────────────
        const userCache = {};

        // ─── DOM REFS ─────────────────────────────────────────────────
        const messagesContainer = document.getElementById('messagesContainer');
        const chatNameEl = document.getElementById('chatName');
        const chatAvatarEl = document.getElementById('chatAvatar');
        const toast = document.getElementById('toast');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const emojiPicker = document.getElementById('emojiPicker');
        const emojiGrid = document.getElementById('emojiGrid');

        // ─── TOAST ────────────────────────────────────────────────────
        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ─── NAVIGATION ──────────────────────────────────────────────
        function goToProfile() {
            if (otherUserId) {
                window.location.href = 'public_profile.html?userId=' + otherUserId;
            }
        }

        function startCall(video) {
            showToast('Call feature coming soon', '');
        }

        // ─── GET URL PARAMS ──────────────────────────────────────────
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),
                name: params.get('name'),
                avatar: params.get('avatar') || ''
            };
        }

        // ─── CHECK AUTH ──────────────────────────────────────────────
        function checkAuth() {
            const userId = localStorage.getItem('mock_user_id');
            if (userId) {
                currentUserId = userId;
                return true;
            }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                localStorage.setItem('mock_user_id', currentUserId);
                return true;
            }
            return false;
        }

        // ─── UTILITY ──────────────────────────────────────────────────
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

            if (msgDate.getTime() === today.getTime()) return 'Today';
            if (msgDate.getTime() === yesterday.getTime()) return 'Yesterday';
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function isVerified(email) {
            if (!email) return false;
            return email.toLowerCase().trim().endsWith('@aurachat.app');
        }

        // ─── FETCH USER DATA ─────────────────────────────────────────
        async function fetchUserData(userId) {
            if (!userId) return null;
            if (userCache[userId]) return userCache[userId];

            try {
                const doc = await db.collection('users').doc(userId).get();
                if (doc.exists) {
                    const data = doc.data();
                    const userData = {
                        uid: userId,
                        username: data.username || 'Unknown',
                        display_name: data.display_name || data.username || 'Unknown',
                        avatar_url: data.avatar_url || null,
                        email: data.email || null,
                        is_verified: isVerified(data.email)
                    };
                    userCache[userId] = userData;
                    return userData;
                }
            } catch(e) {
                console.error('Fetch user error:', userId, e);
            }

            const fallback = {
                uid: userId,
                username: 'Unknown',
                display_name: 'Unknown',
                avatar_url: null,
                email: null,
                is_verified: false
            };
            userCache[userId] = fallback;
            return fallback;
        }

        // ─── LOAD CHAT INFO ──────────────────────────────────────────
        async function loadChatInfo() {
            try {
                const doc = await db.collection('chats').doc(chatId).get();
                if (doc.exists) {
                    const data = doc.data();
                    
                    // For direct chat, get other user
                    const participants = data.participants || [];
                    otherUserId = participants.find(id => id !== currentUserId) || null;

                    if (otherUserId) {
                        const otherUser = await fetchUserData(otherUserId);
                        chatName = otherUser.display_name || otherUser.username || 'Chat';
                        chatAvatar = otherUser.avatar_url;

                        // Update header
                        if (chatAvatar) {
                            chatAvatarEl.innerHTML = `<img src="${chatAvatar}" alt="${chatName}" />`;
                        } else {
                            chatAvatarEl.innerHTML = `<i class="fas fa-user"></i>`;
                        }

                        const verified = otherUser.is_verified 
                            ? '<span class="verified-badge"><i class="fas fa-check-circle"></i></span>' 
                            : '';
                        chatNameEl.innerHTML = escapeHtml(chatName) + ' ' + verified;
                    }
                }
            } catch(e) {
                console.error('Load chat info error:', e);
            }
        }

        // ─── LOAD MESSAGES (SIMPLE QUERY - NO COMPOSITE INDEX) ──────
        function loadMessages() {
            if (!chatId) return;

            if (messagesUnsubscribe) messagesUnsubscribe();

            console.log('📥 Loading messages for chat:', chatId);

            // ✅ SIMPLE QUERY - no where clause, just orderBy
            messagesUnsubscribe = db.collection('chats').doc(chatId)
                .collection('messages')
                .orderBy('created_at', 'desc')
                .limit(200)
                .onSnapshot((snapshot) => {
                    console.log('📥 Snapshot received, docs:', snapshot.size);
                    
                    messages = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        
                        // Filter deleted messages client-side
                        if (data.deleted_for_everyone === true) return;
                        
                        // Filter messages deleted for me
                        const deletedFor = data.deleted_for || [];
                        if (deletedFor.includes(currentUserId)) return;

                        data.id = doc.id;
                        messages.push(data);
                    });

                    console.log('📥 Messages after filter:', messages.length);

                    // Prefetch all senders
                    prefetchSenders().then(() => {
                        renderMessages();
                    });
                }, (error) => {
                    console.error('❌ Messages error:', error);
                    messagesContainer.innerHTML = `
                        <div class="no-messages">
                            <div class="icon"><i class="fas fa-exclamation-circle"></i></div>
                            <div class="text">Error loading messages</div>
                        </div>
                    `;
                });
        }

        // ─── PREFETCH SENDERS ────────────────────────────────────────
        async function prefetchSenders() {
            const senderIds = new Set();
            messages.forEach(msg => {
                if (msg.sender_id && !userCache[msg.sender_id]) {
                    senderIds.add(msg.sender_id);
                }
            });

            if (senderIds.size === 0) return;

            console.log('📥 Prefetching', senderIds.size, 'senders');
            await Promise.all([...senderIds].map(id => fetchUserData(id)));
        }

        // ─── RENDER MESSAGES ─────────────────────────────────────────
        function renderMessages() {
            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="no-messages">
                        <div class="icon"><i class="fas fa-comment"></i></div>
                        <div class="text">No messages yet</div>
                    </div>
                `;
                return;
            }

            let html = '';
            let lastDate = null;
            // Reverse to show oldest first (since we queried desc)
            const sortedMessages = [...messages].reverse();

            sortedMessages.forEach((msg) => {
                const isMe = msg.sender_id === currentUserId;
                const text = msg.text || msg.content || '';
                const mediaType = msg.media_type || '';
                const mediaUrl = msg.media_url || '';
                const reactions = msg.reactions || {};
                const isSystem = msg.type === 'system';

                // Get sender from cache
                const senderInfo = msg.sender_id ? userCache[msg.sender_id] : null;
                const senderName = senderInfo?.display_name || senderInfo?.username || 'Unknown';
                const senderAvatar = senderInfo?.avatar_url;
                const senderVerified = senderInfo?.is_verified || false;

                // Date divider
                const dateKey = formatDate(msg.created_at);
                if (dateKey !== lastDate) {
                    lastDate = dateKey;
                    html += `<div class="date-divider">${dateKey}</div>`;
                }

                const msgClass = isSystem ? 'system' : (isMe ? 'own' : '');

                html += `<div class="message ${msgClass}">`;
                html += `<div class="msg-bubble">`;

                // Sender info (only for others' messages)
                if (!isSystem && !isMe) {
                    html += `<div class="msg-sender">`;
                    if (senderAvatar) {
                        html += `<div class="sender-avatar"><img src="${senderAvatar}" alt="${senderName}" /></div>`;
                    } else {
                        html += `<div class="sender-avatar">${(senderName || 'U')[0].toUpperCase()}</div>`;
                    }
                    html += `<span class="sender-name">`;
                    html += escapeHtml(senderName);
                    if (senderVerified) {
                        html += ` <span class="verified-badge"><i class="fas fa-check-circle"></i></span>`;
                    }
                    html += `</span>`;
                    html += `<span class="msg-time">${formatTime(msg.created_at)}</span>`;
                    html += `</div>`;
                }

                // For own messages, show time inline
                if (!isSystem && isMe) {
                    html += `<div class="msg-sender">`;
                    html += `<span class="sender-name" style="font-weight:600;color:rgba(255,255,255,0.5);">You</span>`;
                    html += `<span class="msg-time">${formatTime(msg.created_at)}</span>`;
                    html += `</div>`;
                }

                // Reply
                if (msg.reply_to) {
                    html += `<div class="msg-reply">`;
                    html += `<div class="reply-sender">${escapeHtml(msg.reply_to_sender || 'Unknown')}</div>`;
                    html += `<div class="reply-content">${escapeHtml(msg.reply_to_content || 'Media')}</div>`;
                    html += `</div>`;
                }

                // Content
                if (isSystem) {
                    html += `<div class="msg-text">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'image' && mediaUrl) {
                    html += `<div class="msg-media" onclick="window.open('${mediaUrl}','_blank')"><img src="${mediaUrl}" alt="Image" /></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:4px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'video' && mediaUrl) {
                    html += `<div class="msg-media"><div class="video-placeholder" onclick="window.open('${mediaUrl}','_blank')"><i class="fas fa-play-circle"></i></div></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:4px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'file') {
                    html += `<div style="padding:8px 10px;background:rgba(255,255,255,0.02);border-radius:10px;display:flex;align-items:center;gap:8px;min-width:140px;">`;
                    html += `<div style="color:#8B5CF6;font-size:18px;"><i class="fas fa-file"></i></div>`;
                    html += `<div style="flex:1;min-width:0;">`;
                    html += `<div style="font-weight:500;color:#fff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(msg.file_name || text || 'File')}</div>`;
                    if (msg.file_size) html += `<div style="font-size:10px;color:rgba(255,255,255,0.25);">${msg.file_size}</div>`;
                    html += `</div></div>`;
                } else if (text) {
                    const linkedText = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
                    html += `<div class="msg-text">${linkedText}</div>`;
                }

                // Reactions
                if (Object.keys(reactions).length > 0) {
                    html += `<div class="msg-reactions">`;
                    for (const [emoji, users] of Object.entries(reactions)) {
                        const count = users.length;
                        html += `<span class="reaction">${emoji} ${count > 1 ? count : ''}</span>`;
                    }
                    html += `</div>`;
                }

                html += `</div></div>`;
            });

            messagesContainer.innerHTML = html;
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 100);
        }

        // ─── SEND MESSAGE ────────────────────────────────────────────
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !selectedImage && !selectedVideo && !selectedFile) return;

            const userDoc = await db.collection('users').doc(currentUserId).get();
            const userData = userDoc.exists ? userDoc.data() : {};
            const senderName = userData.display_name || userData.username || 'You';
            const senderAvatar = userData.avatar_url || null;

            let mediaUrl = null;
            let mediaType = 'text';
            let fileName = null;
            let fileSize = null;

            if (selectedImage) {
                mediaUrl = await uploadFile(selectedImage);
                mediaType = 'image';
            } else if (selectedVideo) {
                mediaUrl = await uploadFile(selectedVideo);
                mediaType = 'video';
                fileName = selectedVideo.name;
            } else if (selectedFile) {
                mediaUrl = await uploadFile(selectedFile);
                mediaType = 'file';
                fileName = selectedFile.name;
                fileSize = formatFileSize(selectedFile.size);
            }

            const msgRef = db.collection('chats').doc(chatId).collection('messages').doc();
            await msgRef.set({
                id: msgRef.id,
                text: text || null,
                content: text || null,
                media_url: mediaUrl,
                media_type: mediaType,
                file_name: fileName,
                file_size: fileSize,
                sender_id: currentUserId,
                sender_name: senderName,
                sender_avatar: senderAvatar,
                created_at: firebase.firestore.FieldValue.serverTimestamp(),
                is_edited: false,
                deleted_for_everyone: false,
                reactions: {}
            });

            await db.collection('chats').doc(chatId).update({
                last_message: text || '📎 Media',
                last_message_at: firebase.firestore.FieldValue.serverTimestamp()
            });

            messageInput.value = '';
            selectedImage = null;
            selectedVideo = null;
            selectedFile = null;
            onInputChange();
        }

        async function uploadFile(file) {
            const storageRef = storage.ref();
            const path = `aurachat/chats/${chatId}/${Date.now()}_${file.name}`;
            const fileRef = storageRef.child(path);
            await fileRef.put(file);
            return await fileRef.getDownloadURL();
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // ─── INPUT HANDLERS ──────────────────────────────────────────
        function onInputChange() {
            const text = messageInput.value.trim();
            if (text.length > 0) {
                micBtn.classList.add('hide');
                sendBtn.classList.add('show');
            } else {
                micBtn.classList.remove('hide');
                sendBtn.classList.remove('show');
            }
        }

        // ─── ATTACHMENTS ────────────────────────────────────────────
        function showAttachmentMenu() {
            document.getElementById('attachModal').classList.add('active');
        }

        function pickImage() { closeModal(); document.getElementById('imageInput').click(); }
        function takePhoto() { closeModal(); document.getElementById('cameraInput').click(); }
        function pickVideo() { closeModal(); document.getElementById('videoInput').click(); }
        function pickFile() { closeModal(); document.getElementById('fileInput').click(); }

        function closeModal() {
            document.getElementById('attachModal').classList.remove('active');
        }

        function handleImageSelected(e) {
            const file = e.target.files[0]; if (!file) return;
            selectedImage = file;
            showToast('📷 ' + file.name, '');
            e.target.value = '';
        }
        function handleVideoSelected(e) {
            const file = e.target.files[0]; if (!file) return;
            selectedVideo = file;
            showToast('🎥 ' + file.name, '');
            e.target.value = '';
        }
        function handleFileSelected(e) {
            const file = e.target.files[0]; if (!file) return;
            selectedFile = file;
            showToast('📎 ' + file.name, '');
            e.target.value = '';
        }

        // ─── EMOJI ────────────────────────────────────────────────────
        const emojis = ['😀', '😁', '😂', '🤣', '😃', '😄', '😅', '😆', '😉', '😊', '😋', '😎', '😍', '🥰', '😘', '😗', '😙', '😚', '🙂', '🤗', '🤩', '🤔', '🤨', '😐', '😑', '😶', '🙄', '😏', '😣', '😥', '😮', '🤐', '😯', '😪', '😫', '😴', '😌', '😛', '😜', '😝', '🤤', '😒', '😓', '😔', '😕', '🙃', '🤑', '😲', '☹️', '🙁', '😖', '😞', '😟', '😤', '😢', '😭', '😦', '😧', '😨', '😩', '🤯', '😬', '😰', '😱', '🥵', '🥶', '😳', '🤪', '😵', '😡', '😠', '🤬'];

        function toggleEmojiPicker() {
            showEmojiPicker = !showEmojiPicker;
            if (showEmojiPicker) {
                emojiPicker.classList.add('show');
                emojiGrid.innerHTML = emojis.map(e => `<span class="emoji" onclick="insertEmoji('${e}')">${e}</span>`).join('');
            } else {
                emojiPicker.classList.remove('show');
            }
        }

        function insertEmoji(emoji) {
            messageInput.value += emoji;
            messageInput.focus();
            onInputChange();
        }

        // ─── INIT ─────────────────────────────────────────────────────
        async function init() {
            if (!checkAuth()) {
                window.location.href = 'email_verification.html';
                return;
            }

            const params = getUrlParams();
            chatId = params.id;
            chatName = params.name || 'Chat';
            chatAvatar = params.avatar || '';

            if (!chatId) {
                messagesContainer.innerHTML = '<div class="no-messages"><div class="text">Invalid chat</div></div>';
                return;
            }

            console.log('🚀 Initializing chat:', chatId);

            // Set initial header
            chatNameEl.textContent = chatName;
            if (chatAvatar) {
                chatAvatarEl.innerHTML = `<img src="${chatAvatar}" alt="${chatName}" />`;
            }

            // Load chat info (gets other user for DM)
            await loadChatInfo();

            // Load messages
            loadMessages();
        }

        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    localStorage.setItem('mock_user_id', currentUserId);
                    init();
                } else {
                    const userId = localStorage.getItem('mock_user_id');
                    if (userId) {
                        currentUserId = userId;
                        init();
                    } else {
                        window.location.href = 'email_verification.html';
                    }
                }
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('attachModal').classList.remove('active');
                if (showEmojiPicker) {
                    showEmojiPicker = false;
                    emojiPicker.classList.remove('show');
                }
            }
            if (e.key === 'Enter' && !e.shiftKey && document.activeElement === messageInput) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>

</body>
