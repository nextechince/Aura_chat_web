<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Chat</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 10px;
        }

        #app {
            height: 100vh;
            height: 100dvh;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
            min-height: 52px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            padding: 6px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .chat-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
            min-width: 0;
        }

        .chat-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #8B5CF6;
            overflow: hidden;
            flex-shrink: 0;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-name {
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-name .verified-badge {
            color: #1DA1F2;
            font-size: 13px;
        }

        .chat-status {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
        }

        .chat-status.online {
            color: #22c55e;
        }

        .chat-status.typing {
            color: #06B6D4;
            font-style: italic;
        }

        .chat-status.blocked {
            color: #ef4444;
        }

        .header-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }

        .header-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 15px;
            padding: 6px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-actions button:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== DATE DIVIDER ===== */
        .date-divider {
            text-align: center;
            padding: 8px 0 12px 0;
            font-size: 11px;
            color: rgba(255,255,255,0.25);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 500;
        }

        .date-divider::before,
        .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }

        /* ===== MESSAGES CONTAINER ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px 6px 14px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            scroll-behavior: smooth;
            overflow-x: hidden;
            gap: 2px;
        }

        /* ===== MESSAGE ===== */
        .message {
            margin-bottom: 2px;
            max-width: 92%;
            align-self: flex-start;
            animation: fadeInMsg 0.2s ease;
        }

        .message.own {
            align-self: flex-end;
        }

        .message.own .msg-bubble {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(6, 182, 212, 0.15));
            border-color: rgba(139, 92, 246, 0.15);
        }

        .message.own .msg-sender .sender-name {
            color: rgba(255,255,255,0.4);
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message .msg-bubble {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            padding: 8px 10px;
        }

        .message .msg-sender {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .message .msg-sender .sender-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }

        .message .msg-sender .sender-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message .msg-sender .sender-name {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
            flex: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message .msg-sender .sender-name:hover {
            color: #8B5CF6;
        }

        .message .msg-sender .sender-name .verified-badge {
            color: #1DA1F2;
            font-size: 11px;
        }

        .message .msg-sender .sender-name.owner {
            color: #8B5CF6;
        }

        .message .msg-sender .msg-time {
            font-size: 9px;
            color: rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .message .msg-text {
            font-size: 13px;
            color: #fff;
            line-height: 1.4;
            word-wrap: break-word;
            font-weight: 400;
        }

        .message .msg-text a {
            color: #8B5CF6;
            text-decoration: underline;
        }

        .message .msg-text.deleted {
            color: rgba(255,255,255,0.25);
            font-style: italic;
            font-size: 12px;
        }

        /* System message */
        .message.system {
            max-width: 100%;
            align-self: center;
        }

        .message.system .msg-bubble {
            background: rgba(255,255,255,0.02);
            border-color: rgba(255,255,255,0.03);
            padding: 3px 12px;
        }

        .message.system .msg-text {
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            text-align: center;
            font-style: italic;
        }

        /* Reply indicator */
        .msg-reply {
            padding: 3px 8px;
            margin-bottom: 3px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            border-left: 2px solid #8B5CF6;
            cursor: pointer;
        }

        .msg-reply:hover {
            background: rgba(0,0,0,0.3);
        }

        .msg-reply .reply-sender {
            font-size: 9px;
            font-weight: 600;
            color: #8B5CF6;
        }

        .msg-reply .reply-content {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Media */
        .msg-media {
            border-radius: 8px;
            overflow: hidden;
            margin-top: 4px;
            cursor: pointer;
            max-width: 100%;
            max-height: 200px;
        }

        .msg-media img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
        }

        .msg-media .video-placeholder {
            width: 100%;
            height: 140px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
        }

        /* Reactions */
        .msg-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 4px;
        }

        .msg-reactions .reaction {
            padding: 1px 5px;
            background: rgba(26, 16, 60, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
            font-size: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .msg-reactions .reaction:hover {
            background: rgba(139, 92, 246, 0.12);
        }

        /* ===== BLOCKED BANNER ===== */
        .blocked-banner {
            width: 100%;
            padding: 10px 16px;
            background: rgba(239, 68, 68, 0.08);
            border-bottom: 1px solid rgba(239, 68, 68, 0.1);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .blocked-banner.show {
            display: flex;
        }

        .blocked-banner .blocked-icon {
            color: rgba(239, 68, 68, 0.7);
            font-size: 14px;
        }

        .blocked-banner .blocked-text {
            color: rgba(239, 68, 68, 0.8);
            font-size: 12px;
        }

        /* ===== TYPING INDICATOR ===== */
        .typing-indicator {
            padding: 4px 16px 8px 16px;
            display: none;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .typing-indicator.show {
            display: flex;
        }

        .typing-indicator .typing-dots {
            display: flex;
            gap: 4px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
        }

        .typing-indicator .typing-dots .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8B5CF6;
            animation: typingDot 1.4s infinite;
        }

        .typing-indicator .typing-dots .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator .typing-dots .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .typing-indicator .typing-text {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            font-style: italic;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 6px 10px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            min-height: 52px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-row .attach-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-row .attach-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .input-row .emoji-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-row .emoji-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .input-row .input-field {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 8px 14px;
            border: none;
            color: #fff;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            min-height: 36px;
        }

        .input-row .input-field::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .input-row .input-field:focus {
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .input-row .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            font-size: 18px;
        }

        .input-row .action-btn:hover {
            transform: scale(1.05);
        }

        .input-row .action-btn:active {
            transform: scale(0.92);
        }

        .input-row .action-btn.send {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            font-size: 16px;
            display: none;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }

        .input-row .action-btn.send.show {
            display: flex;
        }

        .input-row .action-btn.mic {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            display: flex;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }

        .input-row .action-btn.mic.hide {
            display: none;
        }

        .input-row .action-btn.mic.recording {
            background: #ef4444;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
            animation: pulseRec 1s infinite;
        }

        @keyframes pulseRec {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .input-row .action-btn .spinner-small {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== REPLY INDICATOR ===== */
        .reply-indicator {
            padding: 4px 14px;
            background: rgba(26, 16, 60, 0.95);
            display: none;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.04);
            min-height: 34px;
        }

        .reply-indicator.show {
            display: flex;
        }

        .reply-indicator .reply-line {
            width: 2px;
            height: 22px;
            background: #8B5CF6;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .reply-indicator .reply-info {
            flex: 1;
            min-width: 0;
        }

        .reply-indicator .reply-sender {
            font-size: 10px;
            font-weight: 600;
            color: #8B5CF6;
        }

        .reply-indicator .reply-content {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reply-indicator .cancel-reply {
            background: none;
            border: none;
            color: rgba(255,255,255,0.25);
            font-size: 12px;
            cursor: pointer;
            padding: 4px;
        }

        /* ===== MEDIA PREVIEW ===== */
        .media-preview {
            padding: 4px 14px;
            background: rgba(26, 16, 60, 0.95);
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.04);
            min-height: 36px;
        }

        .media-preview.show {
            display: flex;
        }

        .media-preview .preview-label {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            font-weight: 500;
        }

        .media-preview .remove-media {
            background: rgba(239, 68, 68, 0.12);
            border: none;
            color: #ef4444;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        /* ===== EMOJI PICKER ===== */
        .emoji-picker {
            background: rgba(26, 16, 60, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.04);
            padding: 6px 10px;
            display: none;
            flex-shrink: 0;
            max-height: 140px;
            overflow-y: auto;
        }

        .emoji-picker.show {
            display: block;
        }

        .emoji-picker .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
        }

        .emoji-picker .emoji-grid .emoji {
            font-size: 20px;
            cursor: pointer;
            padding: 3px;
            text-align: center;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .emoji-picker .emoji-grid .emoji:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== RECORDING INDICATOR ===== */
        .recording-indicator {
            padding: 6px 14px;
            background: rgba(239, 68, 68, 0.08);
            display: none;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            border-top: 1px solid rgba(239, 68, 68, 0.1);
            min-height: 44px;
        }

        .recording-indicator.show {
            display: flex;
        }

        .recording-indicator .rec-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .recording-indicator .rec-time {
            color: #ef4444;
            font-weight: 700;
            font-size: 14px;
        }

        .recording-indicator .rec-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .recording-indicator .rec-actions button {
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        .recording-indicator .rec-actions .cancel-rec {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .recording-indicator .rec-actions .send-rec {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 16, 60, 0.95);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
            z-index: 3000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            background: rgba(74, 222, 128, 0.06);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            background: rgba(239, 68, 68, 0.06);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: rgba(26, 16, 60, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 60vh;
            padding: 14px 18px 18px 18px;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .modal-handle {
            width: 32px;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            margin: 0 auto 10px auto;
        }

        .modal-option {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 2px;
        }

        .modal-option:hover {
            background: rgba(255,255,255,0.04);
        }

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────

        // ─── USER CACHE (so we don't re-fetch the same user) ────────

        // ─── TOAST ────────────────────────────────────────────────────
        function showToast(message, type = '') {
            toast.textContent = message;

            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ─── NAVIGATION ──────────────────────────────────────────────
        function goToProfile() {
            if (isGroup || isChannel) {
                window.location.href = 'group_info.html?id=' + chatId + '&name=' + encodeURIComponent(chatName) + '&type=' + (isChannel ? 'channel' : 'group');
            } else if (otherUserId) {
                window.location.href = 'public_profile.html?userId=' + otherUserId + '&username=' + encodeURIComponent(chatName) + '&avatarUrl=' + encodeURIComponent(chatAvatar || '');
            }

        // ─── GET URL PARAMS ──────────────────────────────────────────
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),
                name: params.get('name'),
                avatar: params.get('avatar') || '',
                group: params.get('group') === 'true',
                channel: params.get('channel') === 'true'
            };
        }

        // ─── CHECK AUTH ──────────────────────────────────────────────
        function checkAuth() {
            const userId = localStorage.getItem('mock_user_id');
            if (userId) {
                currentUserId = userId;
                return true;
            }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                localStorage.setItem('mock_user_id', currentUserId);
                return true;
            }
            return false;
        }

        // ─── UTILITY ──────────────────────────────────────────────────
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

            if (msgDate.getTime() === today.getTime()) return 'Today';
            if (msgDate.getTime() === yesterday.getTime()) return 'Yesterday';
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function formatDuration(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return m + ':' + s;
        }

        function getTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return diffMins + 'm ago';
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return diffHours + 'h ago';
            return formatDate(date);
        }

        function isVerified(email) {
            if (!email) return false;
            return email.toLowerCase().trim().endsWith('@aurachat.app');
        }

        // ─── FETCH USER DATA (with caching) ──────────────────────────
        async function fetchUserData(userId) {
            if (!userId) return null;
            
            // Check cache first
            if (userCache[userId]) {
                return userCache[userId];
            }

            try {
                const doc = await db.collection('users').doc(userId).get();
                if (doc.exists) {
                    const data = doc.data();
                    const userData = {
                        uid: userId,
                        username: data.username || data.display_name || data.name || 'Unknown',
                        display_name: data.display_name || data.username || data.name || 'Unknown',
                        avatar_url: data.avatar_url || null,
                        bio: data.bio || null,
                        email: data.email || null,
                        is_verified: isVerified(data.email)
                    };
                    userCache[userId] = userData;
                    return userData;
                }
            } catch(e) {
                console.error('Fetch user error:', userId, e);
            }

            const fallback = {
                uid: userId,
                username: 'Unknown',
                display_name: 'Unknown',
                avatar_url: null,
                bio: null,
                email: null,
                is_verified: false
            };
            userCache[userId] = fallback;
            return fallback;
        }

        // ─── PREFETCH ALL SENDER DATA ────────────────────────────────
        async function prefetchSenders(messages) {
            const senderIds = new Set();
            messages.forEach(msg => {
                if (msg.sender_id && !userCache[msg.sender_id]) {
                    senderIds.add(msg.sender_id);
                }
            });

            if (senderIds.size === 0) return;

            const promises = [...senderIds].map(id => fetchUserData(id));
            await Promise.all(promises);
        }

        // ─── EMOJIS ──────────────────────────────────────────────────
        const emojis = ['😀', '😁', '😂', '🤣', '😃', '😄', '😅', '😆', '😉', '😊', '😋', '😎', '😍', '🥰', '😘', '😗', '😙', '😚', '🙂', '🤗', '🤩', '🤔', '🤨', '😐', '😑', '😶', '🙄', '😏', '😣', '😥', '😮', '🤐', '😯', '😪', '😫', '😴', '😌', '😛', '😜', '😝', '🤤', '😒', '😓', '😔', '😕', '🙃', '🤑', '😲', '☹️', '🙁', '😖', '😞', '😟', '😤', '😢', '😭', '😦', '😧', '😨', '😩', '🤯', '😬', '😰', '😱', '🥵', '🥶', '😳', '🤪', '😵', '😡', '😠', '🤬'];

        // ─── LOAD CURRENT USER ───────────────────────────────────────
        async function loadCurrentUser() {
            try {
                const doc = await db.collection('users').doc(currentUserId).get();
                if (doc.exists) {
                    currentUserData = doc.data();
                }
            } catch(e) {
                console.error('Load current user error:', e);
            }
        }

        // ─── LOAD CHAT INFO ──────────────────────────────────────────
        async function loadChatInfo() {
            try {
                const doc = await db.collection('chats').doc(chatId).get();
                if (doc.exists) {
                    const data = doc.data();
                    chatName = data.name || chatName;
                    chatAvatar = data.avatar_url || chatAvatar;
                    
                    // Get my role
                    const participantsData = data.participants_data || {};
                    const myData = participantsData[currentUserId] || {};
                    myRole = myData.role || 'member';
                    const isAdmin = myRole === 'owner' || myRole === 'admin';
                    const settings = data.settings || {};
                    canSend = !(settings.chat_disabled === true && !isAdmin);
                    isAnnouncementsOnly = settings.announcements_only === true && !isAdmin;

                    // For direct chat - get OTHER user's data
                    if (!isGroup && !isChannel) {
                        const participants = data.participants || [];
                        otherUserId = participants.find(id => id !== currentUserId) || null;
                        
                        if (otherUserId) {
                            const otherUser = await fetchUserData(otherUserId);
                            if (otherUser) {
                                // Use other user's name & avatar for header
                                chatName = otherUser.display_name || otherUser.username || 'Chat';
                                chatAvatar = otherUser.avatar_url;
                            }
                            await checkBlockStatus();
                            subscribeToBlockStatus();
                            subscribeToTyping();
                            subscribeToOtherUserStatus();
                        }
                    }

                    // Update header UI
                    updateHeaderUI();
                }
            } catch(e) {
                console.error('Load chat info error:', e);
            }
        }

            const verified = otherUser?.is_verified ? '<span class="verified-badge"><i class="fas fa-check-circle"></i></span>' : '';
            chatNameEl.innerHTML = `${escapeHtml(chatName)} ${verified}`;

        // ─── CHECK BLOCK STATUS ──────────────────────────────────────
        async function checkBlockStatus() {
            if (isGroup || !otherUserId) return;

            try {
                const currentUserDoc = await db.collection('users').doc(currentUserId).get();
                const otherUserDoc = await db.collection('users').doc(otherUserId).get();

                const myBlocked = currentUserDoc.exists ? currentUserDoc.data().blocked_users || [] : [];
                const theirBlocked = otherUserDoc.exists ? otherUserDoc.data().blocked_users || [] : [];

                iBlockedThem = myBlocked.includes(otherUserId);
                theyBlockedMe = theirBlocked.includes(currentUserId);
                isBlocked = iBlockedThem || theyBlockedMe;

                updateBlockedUI();
            } catch(e) {
                console.error('Block check error:', e);
            }
        }

        // ─── SUBSCRIBE TO BLOCK STATUS ──────────────────────────────
        function subscribeToBlockStatus() {
            if (isGroup || !otherUserId) return;

            db.collection('users').doc(currentUserId).onSnapshot(async (myDoc) => {
                if (!myDoc.exists) return;
                const myBlocked = myDoc.data().blocked_users || [];

                const theirDoc = await db.collection('users').doc(otherUserId).get();
                const theirBlocked = theirDoc.exists ? theirDoc.data().blocked_users || [] : [];

                iBlockedThem = myBlocked.includes(otherUserId);
                theyBlockedMe = theirBlocked.includes(currentUserId);
                isBlocked = iBlockedThem || theyBlockedMe;

                updateBlockedUI();
            });
        }

        // ─── SUBSCRIBE TO OTHER USER STATUS ─────────────────────────
        function subscribeToOtherUserStatus() {
            if (isGroup || !otherUserId) return;

            db.collection('users').doc(otherUserId).onSnapshot((doc) => {
                if (!doc.exists) return;

                if (iBlockedThem || theyBlockedMe) {
                    otherUserStatus = null;
                    otherUserTyping = false;
                    updateStatusUI();
                    return;
                }

                const data = doc.data();
                
                // Update cache with fresh data
                if (!userCache[otherUserId]) {
                    userCache[otherUserId] = {};
                }
                userCache[otherUserId] = {
                    ...userCache[otherUserId],
                    uid: otherUserId,
                    username: data.username || data.display_name || 'Unknown',
                    display_name: data.display_name || data.username || 'Unknown',
                    avatar_url: data.avatar_url || null,
                    email: data.email || null,
                    is_verified: isVerified(data.email)
                };

                // Update header with fresh data
                chatName = userCache[otherUserId].display_name || 'Chat';
                chatAvatar = userCache[otherUserId].avatar_url;
                updateHeaderUI();

                // Update status
                const isOnline = data.is_online === true;
                const lastSeen = data.last_seen;

                if (isOnline) {
                    otherUserStatus = 'Online';
                } else if (lastSeen) {
                    const date = lastSeen.toDate ? lastSeen.toDate() : new Date(lastSeen);
                    otherUserStatus = 'Last seen ' + getTimeAgo(date);
                } else {
                    otherUserStatus = null;
                }

                updateStatusUI();
            });
        }

        // ─── SUBSCRIBE TO TYPING ─────────────────────────────────────
        function subscribeToTyping() {
            if (isGroup || !chatId || !otherUserId) return;

            db.collection('chats').doc(chatId)
                .collection('typing').doc(otherUserId)
                .onSnapshot((doc) => {
                    if (iBlockedThem || theyBlockedMe) {
                        otherUserTyping = false;
                        updateStatusUI();
                        return;
                    }

                    if (doc.exists) {
                        const data = doc.data();
                        const timestamp = data.timestamp;
                        if (timestamp) {
                            const typedAt = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                            const now = new Date();
                            otherUserTyping = (now - typedAt) < 5000;
                        } else {
                            otherUserTyping = false;
                        }
                    } else {
                        otherUserTyping = false;
                    }
                    updateStatusUI();
                });
        }

        // ─── UPDATE UI ───────────────────────────────────────────────
        function updateBlockedUI() {
            if (isBlocked) {
                blockedBanner.classList.add('show');
                if (iBlockedThem) {
                    blockedText.textContent = 'You blocked this user. Tap to unblock.';
                } else if (theyBlockedMe) {
                    blockedText.textContent = 'This user blocked you. You cannot send messages.';
                }
            } else {
                blockedBanner.classList.remove('show');
            }
            updateInputState();
        }

        function updateStatusUI() {
            if (isBlocked) {
                chatStatusEl.textContent = iBlockedThem ? 'You blocked this user' : 'Blocked';
                chatStatusEl.className = 'chat-status blocked';
                return;
            }

            if (otherUserTyping) {
                chatStatusEl.textContent = 'typing...';
                chatStatusEl.className = 'chat-status typing';
                typingIndicator.classList.add('show');
                return;
            }

            chatStatusEl.className = 'chat-status online';
            chatStatusEl.textContent = otherUserStatus || 'Online';
            typingIndicator.classList.remove('show');
        }

        function updateInputState() {
            const disabled = isBlocked || !canSend || isAnnouncementsOnly;
            messageInput.disabled = disabled;
            if (disabled) {
                messageInput.placeholder = isBlocked ? 'You cannot message this user' :
                    isAnnouncementsOnly ? 'Only admins can send messages' : 'Chat is disabled';
            } else {
                messageInput.placeholder = 'Message';
            }
        }

        // ─── LOAD MESSAGES ────────────────────────────────────────────
        function loadMessages() {
            if (!chatId) return;

            if (messagesUnsubscribe) messagesUnsubscribe();

            messagesUnsubscribe = db.collection('chats').doc(chatId)
                .collection('messages')
                .where('deleted_for_everyone', '==', false)
                .orderBy('created_at', 'desc')
                .onSnapshot(async (snapshot) => {
                    messages = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        data.id = doc.id;
                        messages.push(data);
                    });

                    // ✅ CRITICAL FIX: Prefetch all sender user data
                    await prefetchSenders(messages);

                    renderMessages();

                    if (isFirstLoad) {
                        isFirstLoad = false;
                        scrollToBottom();
                    }
                }, (error) => {
                    console.error('Messages error:', error);
                });
        }

        // ─── RENDER MESSAGES ─────────────────────────────────────────
        function renderMessages() {
            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:120px;">
                        <div style="font-size:40px;color:rgba(255,255,255,0.04);"><i class="fas fa-comment"></i></div>
                        <div style="color:rgba(255,255,255,0.15);font-size:13px;margin-top:10px;font-weight:400;">No messages yet</div>
                    </div>
                `;
                return;
            }

            let html = '';
            let lastDate = null;
            const sortedMessages = [...messages].reverse();

            sortedMessages.forEach((msg, index) => {
                const isMe = msg.sender_id === currentUserId;
                const isDeleted = msg.deleted_for_everyone === true;
                const mediaType = msg.media_type || '';
                const mediaUrl = msg.media_url || '';
                const reactions = msg.reactions || {};
                const text = msg.text || msg.content || '';
                const isSystem = msg.type === 'system';

                // ✅ Get sender info from cache (prefetched)
                const senderInfo = msg.sender_id ? userCache[msg.sender_id] : null;
                const senderName = senderInfo?.display_name || senderInfo?.username || 'Unknown';
                const senderAvatar = senderInfo?.avatar_url;
                const senderVerified = senderInfo?.is_verified || false;
                const senderEmail = senderInfo?.email;

                const dateKey = formatDate(msg.created_at);
                if (dateKey !== lastDate) {
                    lastDate = dateKey;
                    html += `<div class="date-divider">${dateKey}</div>`;
                }

                const msgClass = isSystem ? 'system' : (isMe ? 'own' : '');

                html += `<div class="message ${msgClass}" onclick="${!isSystem ? `showMessageOptions('${msg.id}')` : ''}">`;
                html += `<div class="msg-bubble">`;

                if (!isSystem) {
                    html += `<div class="msg-sender">`;
                    
                    // ✅ Avatar
                    if (senderAvatar) {
                        html += `<div class="sender-avatar" onclick="event.stopPropagation();viewProfile('${msg.sender_id}')"><img src="${senderAvatar}" alt="${senderName}" /></div>`;
                    } else {
                        const initial = (senderName || 'U')[0].toUpperCase();
                        html += `<div class="sender-avatar" onclick="event.stopPropagation();viewProfile('${msg.sender_id}')">${initial}</div>`;
                    }
                    
                    // ✅ Name with verified badge
                    html += `<span class="sender-name" onclick="event.stopPropagation();viewProfile('${msg.sender_id}')">`;
                    html += escapeHtml(senderName);
                    if (senderVerified) {
                        html += ` <span class="verified-badge"><i class="fas fa-check-circle"></i></span>`;
                    }
                    html += `</span>`;
                    
                    html += `<span class="msg-time">${formatTime(msg.created_at)}</span>`;
                    html += `</div>`;
                }

                if (msg.reply_to) {
                    html += `<div class="msg-reply">`;
                    html += `<div class="reply-sender">${escapeHtml(msg.reply_to_sender || 'Unknown')}</div>`;
                    html += `<div class="reply-content">${escapeHtml(msg.reply_to_content || 'Media')}</div>`;
                    html += `</div>`;
                }

                if (isDeleted) {
                    html += `<div class="msg-text deleted">This message was deleted</div>`;
                } else if (isSystem) {
                    html += `<div class="msg-text">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'image' && mediaUrl) {
                    html += `<div class="msg-media" onclick="event.stopPropagation();viewImage('${mediaUrl}')"><img src="${mediaUrl}" alt="Image" /></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:4px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'video' && mediaUrl) {
                    html += `<div class="msg-media"><div class="video-placeholder" onclick="event.stopPropagation();viewVideo('${mediaUrl}')"><i class="fas fa-play-circle"></i></div></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:4px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'file') {
                    html += `<div style="padding:8px 10px;background:rgba(255,255,255,0.02);border-radius:10px;display:flex;align-items:center;gap:8px;min-width:140px;">`;
                    html += `<div style="color:#8B5CF6;font-size:18px;"><i class="fas fa-file"></i></div>`;
                    html += `<div style="flex:1;min-width:0;">`;
                    html += `<div style="font-weight:500;color:#fff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(msg.file_name || text || 'File')}</div>`;
                    if (msg.file_size) html += `<div style="font-size:10px;color:rgba(255,255,255,0.25);">${msg.file_size}</div>`;
                    html += `</div></div>`;
                } else {
                    const linkedText = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
                    html += `<div class="msg-text">${linkedText}</div>`;
                }

                if (Object.keys(reactions).length > 0) {
                    html += `<div class="msg-reactions">`;
                    for (const [emoji, users] of Object.entries(reactions)) {
                        const count = users.length;
                        html += `<span class="reaction" onclick="event.stopPropagation();addReaction('${msg.id}', '${emoji}')">${emoji} ${count > 1 ? count : ''}</span>`;
                    }
                    html += `</div>`;
                }

                html += `</div></div>`;
            });

            messagesContainer.innerHTML = html;
            if (!isFirstLoad) {
                scrollToBottom();
            }
        }

        // ─── SCROLL ──────────────────────────────────────────────────
        function scrollToBottom() {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 100);
        }

        // ─── VIEW PROFILE ─────────────────────────────────────────────
        function viewProfile(userId) {
            if (userId && userId !== currentUserId) {
                window.location.href = 'public_profile.html?userId=' + userId;
            }
        }

        function viewImage(url) {
            window.open(url, '_blank');
        }

        function viewVideo(url) {
            window.open(url, '_blank');
        }

        // ─── SEND MESSAGE ────────────────────────────────────────────
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !selectedImage && !selectedVideo && !selectedFile) return;

            if (isBlocked) {
                showToast('You cannot message this user', 'error');
                return;
            }

            if (!canSend || isAnnouncementsOnly) {
                showToast('Only admins can send messages', 'error');
                return;
            }

            setLoading(true);

            try {
                const senderName = currentUserData.display_name || currentUserData.username || currentUserData.name || 'You';
                const senderAvatar = currentUserData.avatar_url || null;

                let mediaUrl = null;
                let mediaType = 'text';
                let fileName = null;
                let fileSize = null;

                if (selectedImage) {
                    mediaUrl = await uploadFile(selectedImage, 'image');
                    mediaType = 'image';
                }
                if (selectedVideo) {
                    mediaUrl = await uploadFile(selectedVideo, 'video');
                    mediaType = 'video';
                    fileName = selectedVideo.name;
                }
                if (selectedFile) {
                    mediaUrl = await uploadFile(selectedFile, 'file');
                    mediaType = 'file';
                    fileName = selectedFile.name;
                    fileSize = formatFileSize(selectedFile.size);
                }

                const msgRef = db.collection('chats').doc(chatId).collection('messages').doc();
                const msgData = {
                    id: msgRef.id,
                    text: text || null,
                    content: text || null,
                    media_url: mediaUrl,
                    media_type: mediaType,
                    file_name: fileName,
                    file_size: fileSize,
                    sender_id: currentUserId,
                    sender_name: senderName,
                    sender_avatar: senderAvatar,
                    reply_to: replyingTo || null,
                    reply_to_content: replyingToContent || null,
                    reply_to_sender: replyingToSender || null,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    is_edited: false,
                    deleted_for_everyone: false,
                    reactions: {}
                };

                await msgRef.set(msgData);

                const lastMessage = text || (mediaType === 'image' ? '📷 Image' : mediaType === 'video' ? '🎥 Video' : '📎 File');
                await db.collection('chats').doc(chatId).update({
                    last_message: lastMessage,
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message_type: mediaType
                });

                messageInput.value = '';
                selectedImage = null;
                selectedVideo = null;
                selectedFile = null;
                replyingTo = null;
                replyingToContent = null;
                replyingToSender = null;
                replyIndicator.classList.remove('show');
                mediaPreview.classList.remove('show');
                onInputChange();
                stopTyping();

            } catch(e) {
                console.error('Send error:', e);
                showToast('Failed to send: ' + e.message, 'error');
            }

            setLoading(false);
        }

        async function uploadFile(file, type) {
            const storageRef = storage.ref();
            const path = `aurachat/chats/${chatId}/${Date.now()}_${file.name || 'file'}`;
            const fileRef = storageRef.child(path);
            await fileRef.put(file);
            return await fileRef.getDownloadURL();
        }

        function setLoading(loading) {
            if (loading) {
                sendBtn.innerHTML = '<div class="spinner-small"></div>';
                sendBtn.disabled = true;
            } else {
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                sendBtn.disabled = false;
            }
        }

        // ─── INPUT HANDLERS ──────────────────────────────────────────
        function onInputChange() {
            const text = messageInput.value.trim();
            if (text.length > 0) {
                micBtn.classList.add('hide');
                sendBtn.classList.add('show');
            } else {
                micBtn.classList.remove('hide');
                sendBtn.classList.remove('show');
            }
        }

        function startTyping() {
            if (isGroup || isBlocked || !chatId) return;
            if (typingTimeout) clearTimeout(typingTimeout);
            db.collection('chats').doc(chatId)
                .collection('typing').doc(currentUserId)
                .set({ timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            typingTimeout = setTimeout(stopTyping, 3000);
        }

        function stopTyping() {
            if (isGroup || !chatId) return;
            if (typingTimeout) clearTimeout(typingTimeout);
            db.collection('chats').doc(chatId)
                .collection('typing').doc(currentUserId)
                .delete().catch(() => {});
        }

        // ─── RECORDING ───────────────────────────────────────────────
        function toggleRecording() {
            if (isRecording) stopRecordingAndSend();
            else startRecording();
        }

        function startRecording() {
            if (isBlocked || !canSend || isAnnouncementsOnly) return;
            isRecording = true;
            recSeconds = 0;
            recTime.textContent = '00:00';
            recordingIndicator.classList.add('show');
            micBtn.classList.add('recording');
            recTimer = setInterval(() => {
                recSeconds++;
                recTime.textContent = formatDuration(recSeconds);
            }, 1000);
            showToast('🎤 Recording...', '');
        }

        function stopRecordingAndSend() {
            if (recTimer) clearInterval(recTimer);
            recordingIndicator.classList.remove('show');
            micBtn.classList.remove('recording');
            isRecording = false;
            if (recSeconds > 0) {
                const blob = new Blob(['dummy'], {type: 'audio/m4a'});
                selectedFile = new File([blob], `voice_${Date.now()}.m4a`, {type: 'audio/m4a'});
                previewLabel.textContent = '🎤 Voice note: ' + formatDuration(recSeconds);
                mediaPreview.classList.add('show');
                showToast('Voice note ready!', 'success');
            }
            recSeconds = 0;
        }

        function cancelRecording() {
            if (recTimer) clearInterval(recTimer);
            recordingIndicator.classList.remove('show');
            micBtn.classList.remove('recording');
            isRecording = false;
            recSeconds = 0;
            showToast('Recording cancelled', '');
        }

        // ─── REACTIONS ──────────────────────────────────────────────
        async function addReaction(msgId, emoji) {
            const msgRef = db.collection('chats').doc(chatId).collection('messages').doc(msgId);
            const doc = await msgRef.get();
            if (!doc.exists) return;

            const data = doc.data();
            const reactions = data.reactions || {};
            const users = reactions[emoji] || [];

            if (users.includes(currentUserId)) {
                const idx = users.indexOf(currentUserId);
                users.splice(idx, 1);
                if (users.length === 0) delete reactions[emoji];
                else reactions[emoji] = users;
            } else {
                users.push(currentUserId);
                reactions[emoji] = users;
            }

            await msgRef.update({ reactions });
        }

        // ─── MESSAGE OPTIONS ─────────────────────────────────────────
        function showMessageOptions(msgId) {

            if (!msg || msg.type === 'system') return;

            });
            html += `</div><div style="border-top:1px solid rgba(255,255,255,0.04);margin:4px 0 6px 0;"></div>`;

            if (!isDeleted) {
                html += `<div class="modal-option" onclick="replyToMessage('${msgId}')"><div class="opt-icon" style="background:rgba(6,182,212,0.1);color:#06B6D4;"><i class="fas fa-reply"></i></div><span class="opt-label">Reply</span></div>`;

                replyingTo = msgId;

                messageInput.focus();

        }

            replyingTo = null;
            replyingToContent = null;
            replyingToSender = null;
            replyIndicator.classList.remove('show');
        }

        function showEditDialog(msgId) {
            closeModal('msgOptionsModal');
            editingMessageId = msgId;

            if (msg) {
                document.getElementById('editInput').value = msg.text || msg.content || '';

                text: newContent, content: newContent, is_edited: true,
                updated_at: firebase.firestore.FieldValue.serverTimestamp()
            });
            closeDialog('editDialog');
            showToast('Message edited', 'success');
            editingMessageId = null;

            deletingMessageId = msgId;
            document.getElementById('deleteDialog').classList.add('active');

                deleted_for_everyone: true,

                document.getElementById('blockDialog').classList.add('active');

        async function unblockUser() {
            closeDialog('blockDialog');
            await db.collection('users').doc(currentUserId).update({
                blocked_users: firebase.firestore.FieldValue.arrayRemove([otherUserId])
            });
            iBlockedThem = false;
            isBlocked = theyBlockedMe;
            updateBlockedUI();
            showToast('User unblocked', 'success');
        }

        // ─── ATTACHMENTS ────────────────────────────────────────────
        function showAttachmentMenu() {
            if (isBlocked || !canSend || isAnnouncementsOnly) { showToast('Cannot send', 'error'); return; }
            openModal('attachModal');
        }

        function pickImage() { closeModal('attachModal'); document.getElementById('imageInput').click(); }
        function takePhoto() { closeModal('attachModal'); document.getElementById('cameraInput').click(); }
        function pickVideo() { closeModal('attachModal'); document.getElementById('videoInput').click(); }
        function recordVideo() { closeModal('attachModal'); document.getElementById('recordInput').click(); }
        function pickFile() { closeModal('attachModal'); document.getElementById('fileInput').click(); }

        function handleImageSelected(e) {
            const file = e.target.files[0]; if (!file) return;
            selectedImage = file;
            previewLabel.textContent = '📷 ' + file.name;
            mediaPreview.classList.add('show');
            e.target.value = '';
        }
        function handleVideoSelected(e) {
            const file = e.target.files[0]; if (!file) return;
            selectedVideo = file;
            previewLabel.textContent = '🎥 ' + file.name;
            mediaPreview.classList.add('show');
            e.target.value = '';
        }
        function handleFileSelected(e) {
            const file = e.target.files[0]; if (!file) return;
            selectedFile = file;
            previewLabel.textContent = '📎 ' + file.name;
            mediaPreview.classList.add('show');
            e.target.value = '';
        }
        function removeMedia() {
            selectedImage = null; selectedVideo = null; selectedFile = null;
            mediaPreview.classList.remove('show');
        }

        // ─── EMOJI ────────────────────────────────────────────────────
        function toggleEmojiPicker() {
            showEmojiPicker = !showEmojiPicker;
            if (showEmojiPicker) { emojiPicker.classList.add('show'); renderEmojis(); }
            else emojiPicker.classList.remove('show');
        }
        function renderEmojis() {
            emojiGrid.innerHTML = emojis.map(e => `<span class="emoji" onclick="insertEmoji('${e}')">${e}</span>`).join('');
        }
        function insertEmoji(emoji) {
            messageInput.value += emoji;
            messageInput.focus();
            onInputChange();
        }

        // ─── MODALS ──────────────────────────────────────────────────
        function openModal(id) { document.getElementById(id).classList.add('active'); document.body.style.overflow = 'hidden'; }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); document.body.style.overflow = ''; }
        function closeDialog(id) { document.getElementById(id).classList.remove('active'); document.body.style.overflow = ''; }

        document.querySelectorAll('.modal-overlay, .dialog-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) { el.classList.remove('active'); document.body.style.overflow = ''; }
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active, .dialog-overlay.active').forEach(el => el.classList.remove('active'));
                if (showEmojiPicker) { showEmojiPicker = false; emojiPicker.classList.remove('show'); }
            }
            if (e.key === 'Enter' && !e.shiftKey && document.activeElement === messageInput) {
                e.preventDefault(); sendMessage();
            }
        });

        // ─── INIT ─────────────────────────────────────────────────────
        async function init() {
            if (!checkAuth()) {
                window.location.href = 'email_verification.html';
                return;
            }

            const params = getUrlParams();
            chatId = params.id;
            chatName = params.name || 'Chat';
            chatAvatar = params.avatar || '';
            isGroup = params.group === true;
            isChannel = params.channel === true;

            if (!chatId) {
                messagesContainer.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">Invalid chat</div>';
                return;
            }

            await loadCurrentUser();
            await loadChatInfo();
            loadMessages();

            console.log('💬 Chat loaded:', chatId);
        }

        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    localStorage.setItem('mock_user_id', currentUserId);
                    init();
                } else {
                    const userId = localStorage.getItem('mock_user_id');
                    if (userId) { currentUserId = userId; init(); }
                    else window.location.href = 'email_verification.html';
                }
            });
        });
    </script>

</body>
</html>
