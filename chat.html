<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Chat</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 10px; }

        #app {
            height: 100vh; height: 100dvh;
            background: radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                        #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            padding: 8px 12px;
            display: flex; align-items: center; gap: 8px;
            flex-shrink: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            min-height: 52px;
        }
        .back-btn {
            background: none; border: none; color: #fff; font-size: 18px;
            padding: 6px; cursor: pointer; border-radius: 50%;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-info { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; min-width: 0; }
        .chat-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #8B5CF6; overflow: hidden;
            flex-shrink: 0; position: relative;
        }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .online-indicator {
            position: absolute; bottom: 0; right: 0;
            width: 12px; height: 12px; border-radius: 50%;
            background: #22c55e; border: 2px solid #0A0A0F;
            display: none;
        }
        .online-indicator.show { display: block; }
        .chat-name {
            font-weight: 600; font-size: 15px; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center; gap: 4px;
        }
        .chat-name .verified-badge { color: #1DA1F2; font-size: 13px; }
        .chat-status { font-size: 10px; color: rgba(255,255,255,0.35); }
        .chat-status.online { color: #22c55e; font-weight: 500; }
        .chat-status.typing { color: #06B6D4; font-style: italic; }
        .header-actions button {
            background: none; border: none; color: rgba(255,255,255,0.6);
            font-size: 18px; padding: 6px; cursor: pointer;
            border-radius: 50%; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
        }

        /* MESSAGES */
        .messages-container {
            flex: 1; overflow-y: auto;
            padding: 8px 14px 6px 14px;
            display: flex; flex-direction: column;
            min-height: 0; overflow-x: hidden; gap: 2px;
        }
        .date-divider {
            text-align: center; padding: 8px 0 12px 0;
            font-size: 11px; color: rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            gap: 12px; font-weight: 500;
        }
        .date-divider::before, .date-divider::after {
            content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06);
        }

        /* MESSAGE WRAPPER (for swipe/reply) */
        .message-wrapper {
            position: relative;
            margin-bottom: 2px;
            max-width: 92%;
            align-self: flex-start;
            transition: transform 0.2s ease;
        }
        .message-wrapper.own { align-self: flex-end; }

        /* Reply icon that appears on hover/swipe */
        .reply-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex; align-items: center; justify-content: center;
            color: #8B5CF6; font-size: 14px;
            opacity: 0; transition: all 0.2s ease;
            pointer-events: none;
        }
        .message-wrapper:not(.own) .reply-icon { left: -40px; }
        .message-wrapper.own .reply-icon { right: -40px; }
        .message-wrapper.swiping .reply-icon,
        .message-wrapper:hover .reply-icon {
            transform: translateY(-50%) scale(1);
            opacity: 1;
        }

        .message {
            display: flex; flex-direction: column;
        }

        .message .msg-bubble {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            padding: 8px 10px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .message .msg-bubble:hover {
            background: rgba(255,255,255,0.06);
        }
        .message.own .msg-bubble {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(6, 182, 212, 0.15));
            border-color: rgba(139, 92, 246, 0.15);
        }
        .message.own .msg-bubble:hover {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(6, 182, 212, 0.2));
        }

        .message .msg-sender {
            display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
        }
        .message .msg-sender .sender-avatar {
            width: 22px; height: 22px; border-radius: 50%;
            background: rgba(139, 92, 246, 0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700; color: #fff;
            overflow: hidden; flex-shrink: 0; cursor: pointer;
        }
        .message .msg-sender .sender-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .message .msg-sender .sender-name {
            font-size: 12px; font-weight: 700;
            color: rgba(255,255,255,0.7); flex: 1; cursor: pointer;
            display: flex; align-items: center; gap: 4px;
        }
        .message .msg-sender .sender-name .verified-badge { color: #1DA1F2; font-size: 11px; }
        .message .msg-sender .msg-time {
            font-size: 9px; color: rgba(255,255,255,0.2); flex-shrink: 0;
        }

        /* Message footer (time + ticks) */
        .msg-footer {
            display: flex; align-items: center; justify-content: flex-end;
            gap: 4px; margin-top: 2px;
        }
        .msg-footer .msg-time-footer {
            font-size: 9px; color: rgba(255,255,255,0.35);
        }
        .msg-footer .tick {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
        }
        .msg-footer .tick.delivered { color: rgba(255,255,255,0.6); }
        .msg-footer .tick.read { color: #06B6D4; }
        .msg-footer .tick.sending { color: rgba(255,255,255,0.3); font-size: 10px; }

        .message .msg-text {
            font-size: 13px; color: #fff;
            line-height: 1.4; word-wrap: break-word;
        }
        .message .msg-text a { color: #8B5CF6; text-decoration: underline; }

        .msg-media {
            border-radius: 8px; overflow: hidden;
            margin-top: 4px; cursor: pointer;
            max-width: 100%; max-height: 250px;
        }
        .msg-media img { width: 100%; max-height: 250px; object-fit: cover; display: block; }
        .msg-media .video-placeholder {
            width: 100%; height: 180px; background: #000;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 42px;
        }
        .msg-file {
            padding: 10px 12px; background: rgba(255,255,255,0.03);
            border-radius: 10px; display: flex; align-items: center;
            gap: 10px; min-width: 180px; cursor: pointer;
        }
        .msg-file .file-icon {
            width: 40px; height: 40px; border-radius: 8px;
            background: rgba(139, 92, 246, 0.15);
            display: flex; align-items: center; justify-content: center;
            color: #8B5CF6; font-size: 18px; flex-shrink: 0;
        }
        .msg-file .file-name { font-weight: 500; color: #fff; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .msg-file .file-size { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 2px; }

        .voice-note { display: flex; align-items: center; gap: 10px; padding: 4px 0; min-width: 200px; }
        .voice-note .play-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            border: none; color: #8B5CF6; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }
        .voice-note .play-btn.playing { background: #8B5CF6; color: #fff; }
        .voice-note .waveform { flex: 1; height: 24px; display: flex; align-items: center; gap: 2px; }
        .voice-note .waveform .bar { width: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        .voice-note .duration { font-size: 11px; color: rgba(255,255,255,0.4); flex-shrink: 0; }

        /* Reply preview inside message */
        .msg-reply-preview {
            padding: 4px 8px;
            margin-bottom: 6px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            border-left: 3px solid #8B5CF6;
        }
        .msg-reply-preview .reply-sender { font-size: 10px; font-weight: 600; color: #8B5CF6; }
        .msg-reply-preview .reply-content {
            font-size: 11px; color: rgba(255,255,255,0.4);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Reactions */
        .msg-reactions { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
        .msg-reactions .reaction {
            padding: 2px 6px; background: rgba(26, 16, 60, 0.5);
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);
            font-size: 11px; cursor: pointer;
        }

        /* SKELETON */
        .skeleton { display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
        .skeleton-msg {
            height: 50px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 100%);
            background-size: 200% 100%;
            border-radius: 12px;
            animation: shimmer 1.5s infinite;
        }
        .skeleton-msg:nth-child(1) { width: 60%; }
        .skeleton-msg:nth-child(2) { width: 75%; align-self: flex-end; }
        .skeleton-msg:nth-child(3) { width: 45%; }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* REPLY BAR */
        .reply-bar {
            padding: 6px 14px;
            background: rgba(26, 16, 60, 0.98);
            display: none;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .reply-bar.show { display: flex; }
        .reply-bar .reply-line {
            width: 3px; height: 36px;
            background: #8B5CF6; border-radius: 2px; flex-shrink: 0;
        }
        .reply-bar .reply-info { flex: 1; min-width: 0; }
        .reply-bar .reply-sender { font-size: 11px; font-weight: 600; color: #8B5CF6; }
        .reply-bar .reply-content {
            font-size: 12px; color: rgba(255,255,255,0.5);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .reply-bar .cancel-reply {
            background: none; border: none;
            color: rgba(255,255,255,0.4); font-size: 16px;
            cursor: pointer; padding: 4px;
        }

        /* RECORDING */
        .recording-bar {
            padding: 10px 16px;
            background: rgba(239, 68, 68, 0.08);
            border-top: 1px solid rgba(239, 68, 68, 0.15);
            display: none; align-items: center; gap: 12px; flex-shrink: 0;
        }
        .recording-bar.show { display: flex; }
        .recording-bar .rec-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ef4444; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .recording-bar .rec-timer { color: #ef4444; font-weight: 700; font-size: 14px; min-width: 45px; }
        .recording-bar .rec-wave { flex: 1; height: 24px; display: flex; align-items: center; gap: 2px; }
        .recording-bar .rec-wave .bar {
            width: 3px; background: rgba(239, 68, 68, 0.6); border-radius: 2px;
            animation: recWave 0.8s infinite ease-in-out;
        }
        @keyframes recWave { 0%, 100% { height: 4px; } 50% { height: 20px; } }
        .recording-bar .rec-actions { display: flex; gap: 8px; margin-left: auto; }
        .recording-bar .rec-actions button {
            width: 40px; height: 40px; border: none; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .recording-bar .rec-actions .cancel-rec { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .recording-bar .rec-actions .send-rec {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4); color: #fff;
        }

        /* INPUT */
        .input-area {
            padding: 6px 10px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0; min-height: 52px;
        }
        .input-row { display: flex; align-items: center; gap: 4px; }
        .input-row button {
            background: none; border: none;
            color: rgba(255,255,255,0.4);
            font-size: 18px; cursor: pointer;
            padding: 5px; border-radius: 50%;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .input-row .input-field {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 8px 14px;
            border: none; color: #fff;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none; min-height: 36px;
        }
        .input-row .input-field::placeholder { color: rgba(255,255,255,0.25); }
        .input-row .action-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 18px;
        }
        .input-row .action-btn.send {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff; font-size: 16px; display: none;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }
        .input-row .action-btn.send.show { display: flex; }
        .input-row .action-btn.mic {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff; display: flex;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }
        .input-row .action-btn.mic.hide { display: none; }
        .input-row .action-btn.mic.recording {
            background: #ef4444;
            animation: pulse 1s infinite;
        }

        /* EMOJI PICKER */
        .emoji-picker {
            background: rgba(26, 16, 60, 0.98);
            border-top: 1px solid rgba(255,255,255,0.04);
            display: none; flex-shrink: 0;
            max-height: 280px; flex-direction: column;
        }
        .emoji-picker.show { display: flex; }
        .emoji-tabs {
            display: flex; padding: 8px 12px 0 12px;
            gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.04);
            overflow-x: auto;
        }
        .emoji-tab {
            padding: 8px 12px; background: none; border: none;
            color: rgba(255,255,255,0.4); font-size: 18px;
            cursor: pointer; border-radius: 8px 8px 0 0;
            border-bottom: 2px solid transparent;
            white-space: nowrap; flex-shrink: 0;
        }
        .emoji-tab.active {
            color: #fff; border-bottom-color: #8B5CF6;
            background: rgba(139, 92, 246, 0.1);
        }
        .emoji-content { flex: 1; overflow-y: auto; padding: 10px 12px; max-height: 220px; }
        .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
        .emoji { font-size: 22px; cursor: pointer; padding: 4px; text-align: center; border-radius: 6px; }
        .emoji:hover { background: rgba(139, 92, 246, 0.15); }

        /* TOAST */
        .toast {
            position: fixed; bottom: 70px; left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 16, 60, 0.95);
            color: #fff; padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            font-size: 12px; z-index: 3000;
            display: none; max-width: 90%; text-align: center;
        }
        .toast.show { display: block; }
        .toast.error { border-color: rgba(239, 68, 68, 0.15); background: rgba(239, 68, 68, 0.06); }
        .toast.success { border-color: rgba(74, 222, 128, 0.15); background: rgba(74, 222, 128, 0.06); }

        /* MODALS */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000; display: none;
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: rgba(26, 16, 60, 0.98);
            border-radius: 18px 18px 0 0;
            width: 100%; max-width: 480px;
            max-height: 70vh; padding: 14px 18px 18px 18px;
            overflow-y: auto;
        }
        .modal-handle {
            width: 32px; height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px; margin: 0 auto 10px auto;
        }
        .modal-title { font-size: 15px; font-weight: 600; color: #fff; text-align: center; margin-bottom: 12px; }
        .modal-option {
            display: flex; align-items: center;
            padding: 10px 12px; border-radius: 10px;
            cursor: pointer; margin-bottom: 2px;
        }
        .modal-option:hover { background: rgba(255,255,255,0.04); }
        .modal-option .opt-icon {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px; font-size: 15px; flex-shrink: 0;
        }
        .modal-option .opt-label { color: #fff; font-size: 14px; font-weight: 500; }
        .modal-option.danger .opt-label { color: #ef4444; }
        .modal-option.danger .opt-icon { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        /* Quick reactions row */
        .quick-reactions {
            display: flex; gap: 8px; padding: 10px 0;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 8px;
        }
        .quick-reactions .quick-emoji {
            font-size: 26px; cursor: pointer;
            padding: 6px; border-radius: 50%;
            transition: transform 0.15s;
        }
        .quick-reactions .quick-emoji:hover {
            transform: scale(1.3);
            background: rgba(139, 92, 246, 0.15);
        }

        .attach-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 4px 0; }
        .attach-item {
            display: flex; flex-direction: column;
            align-items: center; background: none; border: none;
            cursor: pointer; padding: 12px 4px; border-radius: 12px;
        }
        .attach-item .att-icon {
            width: 52px; height: 52px; border-radius: 50%;
            background: rgba(139, 92, 246, 0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: #8B5CF6;
        }
        .attach-item .att-label { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 6px; }

        /* DIALOG */
        .dialog-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2500; display: none;
            align-items: center; justify-content: center; padding: 20px;
        }
        .dialog-overlay.active { display: flex; }
        .dialog-content {
            background: rgba(26, 16, 60, 0.98);
            border-radius: 14px; padding: 20px;
            width: 100%; max-width: 340px;
        }
        .dialog-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 12px; }
        .dialog-input {
            width: 100%; padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; color: #fff;
            font-size: 14px; font-family: 'Inter', sans-serif;
            outline: none; margin-bottom: 12px;
        }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .dialog-btn {
            padding: 8px 18px; border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .dialog-btn-cancel { background: transparent; color: rgba(255,255,255,0.4); }
        .dialog-btn-primary { background: #8B5CF6; color: #fff; }
        .dialog-btn-danger { background: #ef4444; color: #fff; }

        /* MEDIA VIEWER */
        .media-viewer {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.98);
            z-index: 5000; display: none;
            flex-direction: column;
            align-items: center; justify-content: center;
        }
        .media-viewer.active { display: flex; }
        .media-viewer .viewer-content {
            flex: 1; width: 100%;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .media-viewer img, .media-viewer video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .media-viewer .viewer-close {
            position: absolute; top: 16px; right: 16px;

</head>

    <script>
        // ═══════════════════════════════════════════════════════════
        // FIREBASE
        // ═══════════════════════════════════════════════════════════
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // ═══════════════════════════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════════════════════════
        let currentUserId = null;
        let chatId = null;
        let chatName = '';
        let otherUserId = null;
        let messages = [];
        let selectedImage = null;
        let selectedVideo = null;
        let selectedFile = null;
        let messagesUnsubscribe = null;
        let statusUnsubscribe = null;
        let typingUnsubscribe = null;
        let showEmojiPicker = false;
        let isRecording = false;
        let recSeconds = 0;
        let recTimer = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let replyingTo = null;
        let replyingToContent = null;
        let replyingToSender = null;
        let selectedMessageId = null;
        let editingMessageId = null;
        let deletingMessageId = null;
        const userCache = {};
        const audioPlayers = {};

        // ═══════════════════════════════════════════════════════════
        // DOM
        // ═══════════════════════════════════════════════════════════
        const messagesContainer = document.getElementById('messagesContainer');
        const chatNameEl = document.getElementById('chatName');
        const chatAvatarEl = document.getElementById('chatAvatar');
        const chatStatusEl = document.getElementById('chatStatus');
        const toast = document.getElementById('toast');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const emojiPicker = document.getElementById('emojiPicker');
        const emojiGrid = document.getElementById('emojiGrid');
        const emojiTabs = document.getElementById('emojiTabs');
        const recordingBar = document.getElementById('recordingBar');
        const recTimerEl = document.getElementById('recTimer');
        const recWave = document.getElementById('recWave');
        const mediaViewer = document.getElementById('mediaViewer');
        const viewerContent = document.getElementById('viewerContent');
        const replyBar = document.getElementById('replyBar');
        const replySender = document.getElementById('replySender');
        const replyContent = document.getElementById('replyContent');

        // ═══════════════════════════════════════════════════════════
        // HELPERS
        // ═══════════════════════════════════════════════════════════
        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function goToProfile() {
            if (otherUserId) window.location.href = 'public_profile.html?userId=' + otherUserId;
        }

        function showMenu() {
            document.getElementById('menuModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function closeDialog(id) {
            document.getElementById(id).classList.remove('active');
        }

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return { id: params.get('id'), name: params.get('name'), avatar: params.get('avatar') || '' };
        }

        function checkAuth() {
            const userId = localStorage.getItem('mock_user_id');
            if (userId) { currentUserId = userId; return true; }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                localStorage.setItem('mock_user_id', currentUserId);
                return true;
            }
            return false;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            if (msgDate.getTime() === today.getTime()) return 'Today';
            if (msgDate.getTime() === yesterday.getTime()) return 'Yesterday';
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function formatDuration(s) {
            return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }

        function formatFileSize(b) {
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function isVerified(email) {
            if (!email) return false;
            return email.toLowerCase().trim().endsWith('@aurachat.app');
        }

        function getTimeAgo(date) {
            const diff = new Date() - date;
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return hrs + 'h ago';
            return formatDate(date);
        }

        // ═══════════════════════════════════════════════════════════
        // FETCH USER
        // ═══════════════════════════════════════════════════════════
        async function fetchUserData(userId) {
            if (!userId) return null;
            if (userCache[userId]) return userCache[userId];
            try {
                const doc = await db.collection('users').doc(userId).get();
                if (doc.exists) {
                    const data = doc.data();
                    const userData = {
                        uid: userId,
                        username: data.username || 'Unknown',
                        display_name: data.display_name || data.username || 'Unknown',
                        avatar_url: data.avatar_url || null,
                        email: data.email || null,
                        is_verified: isVerified(data.email),
                        is_online: data.is_online || false,
                        last_seen: data.last_seen || null
                    };
                    userCache[userId] = userData;
                    return userData;
                }
            } catch(e) { console.error('Fetch user error:', e); }
            const fallback = { uid: userId, username: 'Unknown', display_name: 'Unknown', avatar_url: null, email: null, is_verified: false, is_online: false, last_seen: null };
            userCache[userId] = fallback;
            return fallback;
        }

        // ═══════════════════════════════════════════════════════════
        // LOAD CHAT
        // ═══════════════════════════════════════════════════════════
        async function loadChatInfo() {
            try {
                const doc = await db.collection('chats').doc(chatId).get();
                if (!doc.exists) return;
                const data = doc.data();
                const participants = data.participants || [];
                otherUserId = participants.find(id => id !== currentUserId) || null;

                if (otherUserId) {
                    const otherUser = await fetchUserData(otherUserId);
                    chatName = otherUser.display_name || otherUser.username || 'Chat';

                    if (otherUser.avatar_url) {
                        chatAvatarEl.innerHTML = `<img src="${otherUser.avatar_url}" alt="${chatName}" /><div class="online-indicator ${otherUser.is_online ? 'show' : ''}" id="onlineIndicator"></div>`;
                    } else {
                        chatAvatarEl.innerHTML = `<i class="fas fa-user"></i><div class="online-indicator ${otherUser.is_online ? 'show' : ''}" id="onlineIndicator"></div>`;
                    }

                    const verified = otherUser.is_verified ? '<span class="verified-badge"><i class="fas fa-check-circle"></i></span>' : '';
                    chatNameEl.innerHTML = escapeHtml(chatName) + ' ' + verified;

                    if (otherUser.is_online) {
                        chatStatusEl.textContent = 'Online';
                        chatStatusEl.className = 'chat-status online';
                    } else if (otherUser.last_seen) {
                        const date = otherUser.last_seen.toDate ? otherUser.last_seen.toDate() : new Date(otherUser.last_seen);
                        chatStatusEl.textContent = 'Last seen ' + getTimeAgo(date);
                    } else {
                        chatStatusEl.textContent = 'Offline';
                    }

                    subscribeToUserStatus();
                    subscribeToTyping();
                }
            } catch(e) { console.error('Load chat info error:', e); }
        }

        function subscribeToUserStatus() {
            if (!otherUserId) return;
            if (statusUnsubscribe) statusUnsubscribe();

            statusUnsubscribe = db.collection('users').doc(otherUserId).onSnapshot((doc) => {
                if (!doc.exists) return;
                const data = doc.data();
                const isOnline = data.is_online === true;
                const lastSeen = data.last_seen;

                if (userCache[otherUserId]) {
                    userCache[otherUserId].is_online = isOnline;
                    userCache[otherUserId].last_seen = lastSeen;
                }

                const indicator = chatAvatarEl.querySelector('.online-indicator');
                if (indicator) indicator.classList.toggle('show', isOnline);

                if (isOnline) {
                    chatStatusEl.textContent = 'Online';
                    chatStatusEl.className = 'chat-status online';
                } else if (lastSeen) {
                    const date = lastSeen.toDate ? lastSeen.toDate() : new Date(lastSeen);
                    chatStatusEl.textContent = 'Last seen ' + getTimeAgo(date);
                    chatStatusEl.className = 'chat-status';
                } else {
                    chatStatusEl.textContent = 'Offline';
                    chatStatusEl.className = 'chat-status';
                }
            });
        }

        function subscribeToTyping() {
            if (!chatId || !otherUserId) return;
            if (typingUnsubscribe) typingUnsubscribe();

            typingUnsubscribe = db.collection('chats').doc(chatId)
                .collection('typing').doc(otherUserId)
                .onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        const timestamp = data.timestamp;
                        if (timestamp) {
                            const typedAt = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                            if ((new Date() - typedAt) < 5000) {
                                chatStatusEl.textContent = 'typing...';
                                chatStatusEl.className = 'chat-status typing';
                            }
                        }
                    }
                });
        }

        // ═══════════════════════════════════════════════════════════
        // LOAD MESSAGES
        // ═══════════════════════════════════════════════════════════
        function loadMessages() {
            if (!chatId) return;
            if (messagesUnsubscribe) messagesUnsubscribe();

            messagesUnsubscribe = db.collection('chats').doc(chatId)
                .collection('messages')
                .orderBy('created_at', 'desc')
                .limit(100)
                .onSnapshot((snapshot) => {
                    messages = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.deleted_for_everyone === true) return;
                        const deletedFor = data.deleted_for || [];
                        if (deletedFor.includes(currentUserId)) return;
                        data.id = doc.id;
                        messages.push(data);
                    });

                    // Mark incoming messages as read
                    markMessagesAsRead();

                    const senderIds = new Set();
                    messages.forEach(msg => {
                        if (msg.sender_id && !userCache[msg.sender_id]) senderIds.add(msg.sender_id);
                    });

                    if (senderIds.size > 0) {
                        Promise.all([...senderIds].map(id => fetchUserData(id)))
                            .then(() => renderMessages());
                    } else {
                        renderMessages();
                    }
                }, (error) => {
                    console.error('Messages error:', error);
                });
        }

        // ═══════════════════════════════════════════════════════════
        // MARK MESSAGES AS READ (updates ticks!)
        // ═══════════════════════════════════════════════════════════
        async function markMessagesAsRead() {
            try {
                const unreadSnapshot = await db.collection('chats').doc(chatId)
                    .collection('messages')
                    .where('is_read', '==', false)
                    .get();

                if (unreadSnapshot.empty) return;

                const batch = db.batch();
                unreadSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.sender_id !== currentUserId) {
                        batch.update(doc.ref, { is_read: true });
                    }
                });
                await batch.commit();
            } catch(e) {
                console.error('Mark read error:', e);
            }
        }

        // ═══════════════════════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════════════════════
        function renderMessages() {
            if (messages.length === 0) {
                messagesContainer.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">No messages yet</div>';
                return;
            }

            let html = '';
            let lastDate = null;
            const sorted = [...messages].reverse();

            sorted.forEach((msg) => {
                const isMe = msg.sender_id === currentUserId;
                const text = msg.text || msg.content || '';
                const mediaType = msg.media_type || '';
                const mediaUrl = msg.media_url || '';
                const isSystem = msg.type === 'system';
                const isRead = msg.is_read === true;
                const reactions = msg.reactions || {};

                const senderInfo = msg.sender_id ? userCache[msg.sender_id] : null;
                const senderName = senderInfo?.display_name || senderInfo?.username || 'User';
                const senderAvatar = senderInfo?.avatar_url;
                const senderVerified = senderInfo?.is_verified || false;

                const dateKey = formatDate(msg.created_at);
                if (dateKey !== lastDate) {
                    lastDate = dateKey;
                    html += `<div class="date-divider">${dateKey}</div>`;
                }

                const wrapperClass = isMe ? 'own' : '';
                html += `<div class="message-wrapper ${wrapperClass}" data-msg-id="${msg.id}">`;
                html += `<div class="reply-icon"><i class="fas fa-reply"></i></div>`;
                html += `<div class="message ${isSystem ? '' : (isMe ? 'own' : '')}"><div class="msg-bubble">`;

                if (!isSystem && !isMe) {
                    html += `<div class="msg-sender">`;
                    if (senderAvatar) {
                        html += `<div class="sender-avatar"><img src="${senderAvatar}" /></div>`;
                    } else {
                        html += `<div class="sender-avatar">${(senderName || 'U')[0].toUpperCase()}</div>`;
                    }
                    html += `<span class="sender-name">${escapeHtml(senderName)}`;
                    if (senderVerified) html += ` <span class="verified-badge"><i class="fas fa-check-circle"></i></span>`;
                    html += `</span></div>`;
                }

                // Reply preview
                if (msg.reply_to) {
                    html += `<div class="msg-reply-preview">
                        <div class="reply-sender">${escapeHtml(msg.reply_to_sender || 'Unknown')}</div>
                        <div class="reply-content">${escapeHtml(msg.reply_to_content || 'Media')}</div>
                    </div>`;
                }

                if (isSystem) {
                    html += `<div class="msg-text" style="font-style:italic;color:rgba(255,255,255,0.4);text-align:center;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'image' && mediaUrl) {
                    html += `<div class="msg-media" onclick="event.stopPropagation();openMediaViewer('image', '${mediaUrl}')"><img src="${mediaUrl}" /></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:6px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'video' && mediaUrl) {
                    html += `<div class="msg-media" onclick="event.stopPropagation();openMediaViewer('video', '${mediaUrl}')"><div class="video-placeholder"><i class="fas fa-play-circle"></i></div></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:6px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'audio' && mediaUrl) {
                    html += `<div class="voice-note">
                        <button class="play-btn" onclick="event.stopPropagation();playVoiceNote('${msg.id}', '${mediaUrl}')">
                            <i class="fas fa-play" id="icon-${msg.id}"></i>
                        </button>
                        <div class="waveform">${generateWaveform()}</div>
                        <span class="duration">${formatDuration(msg.duration || 0)}</span>
                    </div>`;
                } else if (mediaType === 'file' && mediaUrl) {
                    html += `<div class="msg-file" onclick="event.stopPropagation();window.open('${mediaUrl}','_blank')">
                        <div class="file-icon"><i class="fas fa-file"></i></div>
                        <div class="file-info">
                            <div class="file-name">${escapeHtml(msg.file_name || text || 'File')}</div>
                            ${msg.file_size ? `<div class="file-size">${msg.file_size}</div>` : ''}
                        </div>
                    </div>`;
                } else if (text) {
                    const linked = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" onclick="event.stopPropagation()">$1</a>');
                    html += `<div class="msg-text">${linked}</div>`;
                }

                // Footer: time + ticks (only for own messages)
                if (!isSystem && isMe) {
                    let tickClass = '';
                    let tickHtml = '';
                    if (isRead) {
                        tickClass = 'read';
                        tickHtml = '<i class="fas fa-check-double"></i>';
                    } else {
                        tickClass = 'delivered';
                        tickHtml = '<i class="fas fa-check"></i>';
                    }
                    html += `<div class="msg-footer">
                        <span class="msg-time-footer">${formatTime(msg.created_at)}</span>
                        <span class="tick ${tickClass}">${tickHtml}</span>
                    </div>`;
                } else if (!isSystem) {
                    html += `<div class="msg-footer">
                        <span class="msg-time-footer">${formatTime(msg.created_at)}</span>
                    </div>`;
                }

                // Reactions
                if (Object.keys(reactions).length > 0) {
                    html += `<div class="msg-reactions">`;
                    for (const [emoji, users] of Object.entries(reactions)) {
                        const count = users.length;
                        html += `<span class="reaction" onclick="event.stopPropagation();quickReact('${msg.id}', '${emoji}')">${emoji} ${count > 1 ? count : ''}</span>`;
                    }
                    html += `</div>`;
                }

                html += `</div></div></div>`;
            });

            messagesContainer.innerHTML = html;
            attachMessageListeners();
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 50);
        }

        function generateWaveform() {
            let html = '';
            for (let i = 0; i < 30; i++) {
                const h = 4 + Math.random() * 16;
                html += `<div class="bar" style="height:${h}px;"></div>`;
            }
            return html;
        }

        // ═══════════════════════════════════════════════════════════
        // ATTACH LISTENERS — tap to show options, hover to reply
        // ═══════════════════════════════════════════════════════════
        function attachMessageListeners() {
            document.querySelectorAll('.message-wrapper').forEach(wrapper => {
                const msgId = wrapper.dataset.msgId;

                // Tap on bubble → show options
                const bubble = wrapper.querySelector('.msg-bubble');
                bubble.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showMessageOptions(msgId);
                });

                // Hover on reply icon → set reply
                const replyIcon = wrapper.querySelector('.reply-icon');
                replyIcon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setReply(msgId);
                });

                // Swipe right to reply (touch devices)
                let startX = 0;
                let isDragging = false;
                bubble.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    isDragging = false;
                }, { passive: true });

                bubble.addEventListener('touchmove', (e) => {
                    const diff = e.touches[0].clientX - startX;
                    if (Math.abs(diff) > 20) {
                        isDragging = true;
                        if (diff > 0 && !wrapper.classList.contains('own')) {
                            wrapper.classList.add('swiping');
                        } else if (diff < 0 && wrapper.classList.contains('own')) {
                            wrapper.classList.add('swiping');
                        }
                    }
                }, { passive: true });

                bubble.addEventListener('touchend', (e) => {
                    if (isDragging) {
                        const diff = e.changedTouches[0].clientX - startX;
                        if (Math.abs(diff) > 60) {
                            setReply(msgId);
                        }
                    }
                    wrapper.classList.remove('swiping');
                    isDragging = false;
                });
            });
        }

        // ═══════════════════════════════════════════════════════════
        // MESSAGE ACTIONS
        // ═══════════════════════════════════════════════════════════
        async function addReaction(emoji) {
            if (!selectedMessageId) return;
            closeModal('msgOptionsModal');
            await quickReact(selectedMessageId, emoji);
        }

        async function quickReact(msgId, emoji) {
            try {
                const msgRef = db.collection('chats').doc(chatId).collection('messages').doc(msgId);
                const doc = await msgRef.get();
                if (!doc.exists) return;

                const data = doc.data();
                const reactions = data.reactions || {};
                const users = reactions[emoji] || [];

                if (users.includes(currentUserId)) {
                    const idx = users.indexOf(currentUserId);
                    users.splice(idx, 1);
                    if (users.length === 0) delete reactions[emoji];
                    else reactions[emoji] = users;
                } else {
                    users.push(currentUserId);
                    reactions[emoji] = users;
                }

                await msgRef.update({ reactions });
            } catch(e) { console.error('React error:', e); }
        }

        // ═══════════════════════════════════════════════════════════
        // SEND MESSAGE
        // ═══════════════════════════════════════════════════════════
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !selectedImage && !selectedVideo && !selectedFile) return;

            const senderName = userCache[currentUserId]?.display_name || userCache[currentUserId]?.username || 'You';
            
            let mediaUrl = null, mediaType = 'text', fileName = null, fileSize = null;

            try {
                if (selectedImage) {
                    mediaUrl = await uploadFile(selectedImage);
                    mediaType = 'image';
                } else if (selectedVideo) {
                    mediaUrl = await uploadFile(selectedVideo);
                    mediaType = 'video';
                    fileName = selectedVideo.name;
                } else if (selectedFile) {
                    mediaUrl = await uploadFile(selectedFile);
                    mediaType = 'file';
                    fileName = selectedFile.name;
                    fileSize = formatFileSize(selectedFile.size);
                }

                const msgRef = db.collection('chats').doc(chatId).collection('messages').doc();
                await msgRef.set({
                    id: msgRef.id,
                    text: text || null,
                    content: text || null,
                    media_url: mediaUrl,
                    media_type: mediaType,
                    file_name: fileName,
                    file_size: fileSize,
                    sender_id: currentUserId,
                    sender_name: senderName,
                    reply_to: replyingTo || null,
                    reply_to_content: replyingToContent || null,
                    reply_to_sender: replyingToSender || null,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    is_read: false,
                    is_edited: false,
                    deleted_for_everyone: false,
                    reactions: {}
                });

                await db.collection('chats').doc(chatId).update({
                    last_message: text || (mediaType === 'image' ? '📷 Photo' : mediaType === 'video' ? '🎥 Video' : '📎 File'),
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                messageInput.value = '';
                selectedImage = null;
                selectedVideo = null;
                selectedFile = null;
                cancelReply();
                onInputChange();
            } catch(e) {
                console.error('Send error:', e);
                showToast('Failed to send', 'error');
            }
        }

        async function uploadFile(file) {
            const storageRef = storage.ref();
            const path = `aurachat/chats/${chatId}/${Date.now()}_${file.name}`;
            const fileRef = storageRef.child(path);
            await fileRef.put(file);
            return await fileRef.getDownloadURL();
        }

        // ═══════════════════════════════════════════════════════════
        // VOICE RECORDING — FIXED
        // ═══════════════════════════════════════════════════════════
        async function toggleRecording() {
            if (isRecording) stopRecordingAndSend();
            else await startRecording();
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    if (audioChunks.length === 0) return;
                    
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const file = new File([blob], `voice_${Date.now()}.webm`, { type: 'audio/webm' });
                    
                    showToast('Sending voice note...', '');
                    await sendVoiceNote(file, recSeconds);
                };

                mediaRecorder.start();
                isRecording = true;
                recSeconds = 0;
                recTimerEl.textContent = '00:00';
                recordingBar.classList.add('show');
                micBtn.classList.add('recording');

                recWave.innerHTML = '';
                for (let i = 0; i < 20; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    bar.style.animationDelay = (i * 0.05) + 's';
                    recWave.appendChild(bar);
                }

                recTimer = setInterval(() => {
                    recSeconds++;
                    recTimerEl.textContent = formatDuration(recSeconds);
                }, 1000);

                showToast('🎤 Recording...', '');
            } catch(e) {
                console.error('Recording error:', e);
                showToast('Microphone access denied', 'error');
            }
        }

        function stopRecordingAndSend() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (recTimer) clearInterval(recTimer);
            recordingBar.classList.remove('show');
            micBtn.classList.remove('recording');
            isRecording = false;
        }

        function cancelRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.onstop = null;
                mediaRecorder.stop();
                audioChunks = [];
            }
            if (recTimer) clearInterval(recTimer);
            recordingBar.classList.remove('show');
            micBtn.classList.remove('recording');
            isRecording = false;
            recSeconds = 0;
            showToast('Recording cancelled', '');
        }

        async function sendVoiceNote(file, duration) {
            try {
                const senderName = userCache[currentUserId]?.display_name || userCache[currentUserId]?.username || 'You';
                
                const storageRef = storage.ref();
                const path = `aurachat/chats/${chatId}/voice_${Date.now()}.webm`;
                const fileRef = storageRef.child(path);
                await fileRef.put(file);
                const mediaUrl = await fileRef.getDownloadURL();

                const msgRef = db.collection('chats').doc(chatId).collection('messages').doc();
                await msgRef.set({
                    id: msgRef.id,
                    media_url: mediaUrl,
                    media_type: 'audio',
                    duration: duration,
                    sender_id: currentUserId,
                    sender_name: senderName,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    is_read: false,
                    is_edited: false,
                    deleted_for_everyone: false,
                    reactions: {}
                });

                await db.collection('chats').doc(chatId).update({
                    last_message: '🎤 Voice message',
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('Voice note sent ✓', 'success');
            } catch(e) {
                console.error('Send voice error:', e);
                showToast('Failed to send voice: ' + e.message, 'error');
            }
        }

        function playVoiceNote(msgId, url) {
            const icon = document.getElementById('icon-' + msgId);
            const btn = icon.parentElement;

            if (audioPlayers[msgId] && !audioPlayers[msgId].paused) {
                audioPlayers[msgId].pause();
                icon.className = 'fas fa-play';
                btn.classList.remove('playing');
                return;
            }

            Object.values(audioPlayers).forEach(p => p.pause());

            if (!audioPlayers[msgId]) {
                audioPlayers[msgId] = new Audio(url);
                audioPlayers[msgId].addEventListener('ended', () => {
                    icon.className = 'fas fa-play';
                    btn.classList.remove('playing');
                });
            }

            audioPlayers[msgId].play();
            icon.className = 'fas fa-pause';
            btn.classList.add('playing');
        }

        let currentEmojiCategory = 'smileys';

        function toggleEmojiPicker() {
            showEmojiPicker = !showEmojiPicker;
            if (showEmojiPicker) {
                emojiPicker.classList.add('show');
                renderEmojiTabs();
                renderEmojis();
            } else {
                emojiPicker.classList.remove('show');
            }
        }

        function renderEmojiTabs() {
            let html = '';
            for (const [key, cat] of Object.entries(emojiCategories)) {
                const active = key === currentEmojiCategory ? 'active' : '';
                html += `<button class="emoji-tab ${active}" onclick="switchEmojiCategory('${key}')">${cat.icon}</button>`;
            }
            emojiTabs.innerHTML = html;
        }

        function switchEmojiCategory(c) {
            currentEmojiCategory = c;
            renderEmojiTabs();
            renderEmojis();
        }

        function renderEmojis() {
            const emojis = emojiCategories[currentEmojiCategory].emojis;
            emojiGrid.innerHTML = emojis.map(e => `<span class="emoji" onclick="insertEmoji('${e}')">${e}</span>`).join('');
        }

        function insertEmoji(e) {
            messageInput.value += e;
            messageInput.focus();
            onInputChange();
        }

        // ═══════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════
        async function init() {
            if (!checkAuth()) {
                window.location.href = 'email_verification.html';
                return;
            }

            const params = getUrlParams();
            chatId = params.id;
            chatName = params.name || 'Chat';

            if (!chatId) return;

            chatNameEl.textContent = chatName;
            if (params.avatar) {
                chatAvatarEl.innerHTML = `<img src="${params.avatar}" /><div class="online-indicator" id="onlineIndicator"></div>`;
            }

            // Cache current user
            await fetchUserData(currentUserId);

            loadMessages();
            loadChatInfo();

            db.collection('users').doc(currentUserId).update({
                is_online: true,
                last_seen: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});

            window.addEventListener('beforeunload', () => {
                db.collection('users').doc(currentUserId).update({
                    is_online: false,
                    last_seen: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    localStorage.setItem('mock_user_id', currentUserId);
                    init();
                } else {
                    const userId = localStorage.getItem('mock_user_id');
                    if (userId) { currentUserId = userId; init(); }
                    else window.location.href = 'email_verification.html';
                }
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active, .dialog-overlay.active').forEach(el => el.classList.remove('active'));
                if (showEmojiPicker) { showEmojiPicker = false; emojiPicker.classList.remove('show'); }
                if (mediaViewer.classList.contains('active')) closeMediaViewer();
            }
            if (e.key === 'Enter' && document.activeElement === messageInput) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.querySelectorAll('.modal-overlay, .dialog-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) el.classList.remove('active');
            });
        });
    </script>
