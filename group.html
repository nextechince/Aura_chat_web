<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Group</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 10px;
        }

        #app {
            height: 100vh;
            height: 100dvh;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
            min-height: 52px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            padding: 6px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .group-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
            min-width: 0;
        }

        .group-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #8B5CF6;
            overflow: hidden;
            flex-shrink: 0;
        }

        .group-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .group-name {
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .group-type {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
        }

        .header-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }

        .header-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 15px;
            padding: 6px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-actions button:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== DATE DIVIDER ===== */
        .date-divider {
            text-align: center;
            padding: 8px 0 12px 0;
            font-size: 11px;
            color: rgba(255,255,255,0.25);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .date-divider::before,
        .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }

        /* ===== MESSAGES CONTAINER ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px 6px 14px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            scroll-behavior: smooth;
            overflow-x: hidden;
            gap: 4px;
        }

        /* ===== MESSAGE ===== */
        .message {
            margin-bottom: 2px;
            max-width: 92%;
            align-self: flex-start;
            animation: fadeInMsg 0.2s ease;
        }

        .message.own {
            align-self: flex-end;
        }

        .message.own .msg-bubble {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.1);
        }

        .message.own .msg-sender .sender-name {
            color: rgba(255,255,255,0.4);
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message .msg-bubble {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            padding: 8px 10px;
        }

        .message .msg-sender {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .message .msg-sender .sender-avatar {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
        }

        .message .msg-sender .sender-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message .msg-sender .sender-name {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            flex: 1;
        }

        .message .msg-sender .sender-name.owner {
            color: #8B5CF6;
        }

        .message .msg-sender .msg-time {
            font-size: 9px;
            color: rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .message .msg-text {
            font-size: 13px;
            color: #fff;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message .msg-text.deleted {
            color: rgba(255,255,255,0.25);
            font-style: italic;
            font-size: 12px;
        }

        /* System message */
        .message.system {
            max-width: 100%;
            align-self: center;
        }

        .message.system .msg-bubble {
            background: rgba(255,255,255,0.02);
            border-color: rgba(255,255,255,0.03);
            padding: 3px 12px;
        }

        .message.system .msg-text {
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            text-align: center;
            font-style: italic;
        }

        /* Reply indicator */
        .msg-reply {
            padding: 3px 8px;
            margin-bottom: 3px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            border-left: 2px solid #8B5CF6;
        }

        .msg-reply .reply-sender {
            font-size: 9px;
            font-weight: 600;
            color: #8B5CF6;
        }

        .msg-reply .reply-content {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Media */
        .msg-media {
            border-radius: 8px;
            overflow: hidden;
            margin-top: 4px;
            cursor: pointer;
            max-width: 100%;
            max-height: 200px;
        }

        .msg-media img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
        }

        .msg-media .video-placeholder {
            width: 100%;
            height: 140px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
        }

        /* Reactions */
        .msg-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 4px;
        }

        .msg-reactions .reaction {
            padding: 1px 5px;
            background: rgba(26, 16, 60, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
            font-size: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .msg-reactions .reaction:hover {
            background: rgba(139, 92, 246, 0.12);
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 6px 10px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            min-height: 48px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-row .attach-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-row .attach-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .input-row .emoji-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-row .emoji-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .input-row .input-field {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 7px 14px;
            border: none;
            color: #fff;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            min-height: 32px;
        }

        .input-row .input-field::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .input-row .input-field:focus {
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .input-row .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            background: none;
            color: rgba(255,255,255,0.4);
            font-size: 20px;
        }

        .input-row .action-btn:hover {
            transform: scale(1.05);
        }

        .input-row .action-btn:active {
            transform: scale(0.92);
        }

        .input-row .action-btn.send {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            font-size: 16px;
            display: none;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }

        .input-row .action-btn.send.show {
            display: flex;
        }

        .input-row .action-btn.mic {
            display: flex;
            color: rgba(255,255,255,0.4);
            font-size: 20px;
        }

        .input-row .action-btn.mic.hide {
            display: none;
        }

        .input-row .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .input-row .action-btn .spinner-small {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 16, 60, 0.95);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
            z-index: 3000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.15);
            background: rgba(74, 222, 128, 0.06);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.15);
            background: rgba(239, 68, 68, 0.06);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: rgba(26, 16, 60, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 60vh;
            padding: 14px 18px 18px 18px;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .modal-handle {
            width: 32px;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            margin: 0 auto 10px auto;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
        }

        .modal-option {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 2px;
        }

        .modal-option:hover {
            background: rgba(255,255,255,0.04);
        }

        .modal-option .opt-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 14px;
        }

        .modal-option .opt-label {
            color: #fff;
            font-size: 13px;
        }

        .modal-option.danger .opt-label {
            color: #ef4444;
        }

        .modal-option.danger .opt-icon {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .attach-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            padding: 4px 0;
        }

        .attach-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 8px;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .attach-item:hover {
            background: rgba(255,255,255,0.04);
        }

        .attach-item .att-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #8B5CF6;
        }

        .attach-item .att-label {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-top: 3px;
        }

        /* ===== DIALOG ===== */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dialog-overlay.active {
            display: flex;
        }

        .dialog-content {
            background: rgba(26, 16, 60, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            animation: fadeIn 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .dialog-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .dialog-text {
            font-size: 12px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .dialog-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .dialog-btn:hover {
            opacity: 0.8;
        }

        .dialog-btn-cancel {
            background: transparent;
            color: rgba(255,255,255,0.35);
        }

        .dialog-btn-danger {
            background: #ef4444;
            color: #fff;
        }

        .dialog-btn-primary {
            background: #8B5CF6;
            color: #fff;
        }

        .dialog-input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            margin-bottom: 10px;
        }

        .dialog-input:focus {
            border-color: #8B5CF6;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .message {
                max-width: 94%;
            }
            .header {
                padding: 6px 10px;
                min-height: 44px;
            }
            .group-avatar {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }
            .group-name {
                font-size: 13px;
            }
            .input-area {
                padding: 4px 8px;
                min-height: 42px;
            }
            .input-row .input-field {
                font-size: 12px;
                padding: 5px 10px;
                min-height: 28px;
            }
            .input-row .action-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
            .input-row .attach-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
            .input-row .emoji-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
            .messages-container {
                padding: 4px 10px 4px 10px;
            }
            .modal-content {
                padding: 12px 14px 14px 14px;
            }
        }

        /* Hidden file inputs */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="window.location.href='chats.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="group-info" onclick="goToGroupInfo()">
                <div class="group-avatar" id="groupAvatar">
                    <i class="fas fa-users"></i>
                </div>
                <div>
                    <div class="group-name" id="groupName">Group</div>
                    <div class="group-type">Group</div>
                </div>
            </div>
            <div class="header-actions">
                <button onclick="goToGroupInfo()">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages-container" id="messagesContainer">
            <!-- Rendered dynamically -->
        </div>

        <!-- Reply Indicator -->
        <div class="reply-indicator" id="replyIndicator" style="display:none;padding:4px 14px;background:rgba(26,16,60,0.95);align-items:center;gap:8px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.04);min-height:34px;">
            <div style="width:2px;height:22px;background:#8B5CF6;border-radius:2px;flex-shrink:0;"></div>
            <div style="flex:1;min-width:0;">
                <div style="font-size:10px;font-weight:600;color:#8B5CF6;" id="replySender">Replying to</div>
                <div style="font-size:10px;color:rgba(255,255,255,0.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="replyContent">Message</div>
            </div>
            <button class="cancel-reply" onclick="cancelReply()" style="background:none;border:none;color:rgba(255,255,255,0.25);font-size:12px;cursor:pointer;padding:4px;">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Media Preview -->
        <div class="media-preview" id="mediaPreview" style="display:none;padding:4px 14px;background:rgba(26,16,60,0.95);align-items:center;justify-content:space-between;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.04);min-height:36px;">
            <span style="font-size:12px;color:rgba(255,255,255,0.4);" id="previewLabel">File selected</span>
            <button class="remove-media" onclick="removeMedia()" style="background:rgba(239,68,68,0.12);border:none;color:#ef4444;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-family:'Inter',sans-serif;">
                <i class="fas fa-times"></i> Remove
            </button>
        </div>

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {

        // ─── STATE ─────────────────────────────────────────────────────

        // ─── DOM REFS ─────────────────────────────────────────────────

        // ─── TOAST ────────────────────────────────────────────────────
        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;

            toast._timeout = setTimeout(() => {

        // ─── NAVIGATION ──────────────────────────────────────────────
        function goToGroupInfo() {
            window.location.href = 'group_info.html?id=' + groupId + '&name=' + encodeURIComponent(groupName) + '&type=group';
        }

        // ─── GET URL PARAMS ──────────────────────────────────────────
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),
                name: params.get('name'),
                avatar: params.get('avatar') || ''
            };
        }

        // ─── CHECK AUTH ──────────────────────────────────────────────
        function checkAuth() {
            const userId = localStorage.getItem('mock_user_id');
            if (userId) {
                currentUserId = userId;
                return true;
            }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                localStorage.setItem('mock_user_id', currentUserId);
                return true;
            }
            return false;
        }

        // ─── UTILITY ──────────────────────────────────────────────────
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

            if (msgDate.getTime() === today.getTime()) return 'Today';
            if (msgDate.getTime() === yesterday.getTime()) return 'Yesterday';
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // ─── EMOJIS ──────────────────────────────────────────────────
        const emojis = ['😀', '😁', '😂', '🤣', '😃', '😄', '😅', '😆', '😉', '😊', '😋', '😎', '😍', '🥰', '😘', '😗', '😙', '😚', '🙂', '🤗', '🤩', '🤔', '🤨', '😐', '😑', '😶', '🙄', '😏', '😣', '😥', '😮', '🤐', '😯', '😪', '😫', '😴', '😌', '😛', '😜', '😝', '🤤', '😒', '😓', '😔', '😕', '🙃', '🤑', '😲', '☹️', '🙁', '😖', '😞', '😟', '😤', '😢', '😭', '😦', '😧', '😨', '😩', '🤯', '😬', '😰', '😱', '🥵', '🥶', '😳', '🤪', '😵', '😡', '😠', '🤬'];

        // ─── LOAD GROUP INFO ──────────────────────────────────────────
        async function loadGroupInfo() {
            try {
                const doc = await db.collection('chats').doc(groupId).get();
                if (doc.exists) {
                    const data = doc.data();
                    groupAvatarUrl = data.avatar_url || null;
                    groupName = data.name || groupName;
                    
                    if (groupAvatarUrl) {
                        groupAvatarEl.innerHTML = `<img src="${groupAvatarUrl}" alt="Group" />`;
                    } else {
                        groupAvatarEl.innerHTML = `<i class="fas fa-users"></i>`;
                    }
                    
                    groupNameEl.textContent = groupName;
                    
                    const participantsData = data.participants_data || {};
                    const myData = participantsData[currentUserId] || {};
                    myRole = myData.role || 'member';
                }
            } catch (e) {
                console.error('Error loading group info:', e);
            }
        }

        // ─── LOAD USER DATA ──────────────────────────────────────────
        async function loadUserData() {
            try {
                const doc = await db.collection('users').doc(currentUserId).get();
                if (doc.exists) {
                    currentUserData = doc.data();
                }
            } catch (e) {
                console.error('Error loading user data:', e);
            }
        }

        // ─── LOAD MESSAGES ───────────────────────────────────────────
        function loadMessages() {
            if (!groupId) return;

            if (messagesUnsubscribe) {
                messagesUnsubscribe();
            }

            messagesUnsubscribe = db.collection('chats')
                .doc(groupId)
                .collection('messages')
                .orderBy('created_at', 'desc')
                .onSnapshot((snapshot) => {
                    messages = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        data.id = doc.id;
                        messages.push(data);
                    });
                    renderMessages();
                }, (error) => {
                    console.error('Messages error:', error);
                });
        }

        // ─── RENDER MESSAGES ─────────────────────────────────────────
        function renderMessages() {
            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:120px;">
                        <div style="font-size:40px;color:rgba(255,255,255,0.04);"><i class="fas fa-users"></i></div>
                        <div style="color:rgba(255,255,255,0.15);font-size:13px;margin-top:10px;">No messages yet</div>
                    </div>
                `;
                return;
            }

            let html = '';
            let lastDate = null;

            // Sort by created_at (oldest first for display)
            const sortedMessages = [...messages].reverse();

            sortedMessages.forEach((msg) => {
                const isMe = msg.sender_id === currentUserId;
                const isDeleted = msg.deleted_for_everyone === true;
                const mediaType = msg.media_type || '';
                const mediaUrl = msg.media_url || '';
                const reactions = msg.reactions || {};
                const text = msg.text || msg.content || '';
                const isSystem = msg.type === 'system';
                const msgDate = msg.created_at ? (msg.created_at.toDate ? msg.created_at.toDate() : new Date(msg.created_at)) : new Date();

                // Date divider
                const dateKey = formatDate(msg.created_at);
                if (dateKey !== lastDate) {
                    lastDate = dateKey;
                    html += `<div class="date-divider">${dateKey}</div>`;
                }

                const msgClass = isSystem ? 'system' : (isMe ? 'own' : '');
                const isOwner = msg.sender_id === groupId;

                html += `<div class="message ${msgClass}" onclick="${!isSystem ? `showMessageOptions('${msg.id}')` : ''}">`;
                html += `<div class="msg-bubble">`;

                if (!isSystem) {
                    // Sender
                    html += `<div class="msg-sender">`;
                    if (msg.sender_avatar) {
                        html += `<div class="sender-avatar"><img src="${msg.sender_avatar}" alt="${msg.sender_name || 'User'}" /></div>`;
                    } else {
                        const initial = (msg.sender_name || 'U')[0].toUpperCase();
                        html += `<div class="sender-avatar">${initial}</div>`;
                    }
                    html += `<span class="sender-name ${isOwner ? 'owner' : ''}">${escapeHtml(msg.sender_name || 'Admin')}</span>`;
                    html += `<span class="msg-time">${formatTime(msg.created_at)}</span>`;
                    html += `</div>`;
                }

                // Reply
                if (msg.reply_to) {
                    html += `<div class="msg-reply">`;
                    html += `<div class="reply-sender">${escapeHtml(msg.reply_to_sender || 'Unknown')}</div>`;
                    html += `<div class="reply-content">${escapeHtml(msg.reply_to_content || 'Media')}</div>`;
                    html += `</div>`;
                }

                // Content
                if (isDeleted) {
                    html += `<div class="msg-text deleted">This message was deleted</div>`;
                } else if (isSystem) {
                    html += `<div class="msg-text">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'image' && mediaUrl) {
                    html += `<div class="msg-media" onclick="event.stopPropagation();window.open('${mediaUrl}','_blank')"><img src="${mediaUrl}" alt="Image" /></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:4px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'video' && mediaUrl) {
                    html += `<div class="msg-media"><div class="video-placeholder" onclick="event.stopPropagation();window.open('${mediaUrl}','_blank')"><i class="fas fa-play-circle"></i></div></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:4px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'file') {
                    html += `<div style="padding:8px 10px;background:rgba(255,255,255,0.02);border-radius:10px;display:flex;align-items:center;gap:8px;min-width:140px;">`;
                    html += `<div style="color:#8B5CF6;font-size:18px;"><i class="fas fa-file"></i></div>`;
                    html += `<div style="flex:1;min-width:0;">`;
                    html += `<div style="font-weight:500;color:#fff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(msg.file_name || text || 'File')}</div>`;
                    if (msg.file_size) html += `<div style="font-size:10px;color:rgba(255,255,255,0.25);">${msg.file_size}</div>`;
                    html += `</div></div>`;
                } else {
                    html += `<div class="msg-text">${escapeHtml(text)}</div>`;
                }

                // Reactions
                if (Object.keys(reactions).length > 0) {
                    html += `<div class="msg-reactions">`;
                    for (const [emoji, users] of Object.entries(reactions)) {
                        const count = users.length;
                        html += `<span class="reaction" onclick="event.stopPropagation();addReactionToMessage('${msg.id}', '${emoji}')">${emoji} ${count > 1 ? count : ''}</span>`;
                    }
                    html += `</div>`;
                }

                html += `</div></div>`;
            });

            messagesContainer.innerHTML = html;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ─── INPUT CHANGE HANDLER ──────────────────────────────────
        function onInputChange() {
            const input = document.getElementById('messageInput');
            const micBtn = document.getElementById('micBtn');
            const sendBtn = document.getElementById('sendBtn');
            
            if (!input || !micBtn || !sendBtn) return;

            const hasText = input.value.trim().length > 0;
            
            if (hasText) {
                micBtn.classList.add('hide');
                sendBtn.classList.add('show');
            } else {
                micBtn.classList.remove('hide');
                sendBtn.classList.remove('show');
            }
        }

        // ─── SEND MESSAGE ─────────────────────────────────────────────
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            if (!input) return;
            
            const text = input.value.trim();
            if (!text && !selectedImage && !selectedVideo && !selectedFile) return;

            setLoading(true);

            try {
                const senderName = currentUserData.display_name || currentUserData.username || currentUserData.name || 'User';
                const senderAvatar = currentUserData.avatar_url || null;

                let mediaUrl = null;
                let mediaType = 'text';
                let fileName = null;
                let fileSize = null;

                if (selectedImage) {
                    mediaUrl = await uploadFile(selectedImage, 'image');
                    mediaType = 'image';
                }

                if (selectedVideo) {
                    mediaUrl = await uploadFile(selectedVideo, 'video');
                    mediaType = 'video';
                    fileName = selectedVideo.name;
                }

                if (selectedFile) {
                    mediaUrl = await uploadFile(selectedFile, 'file');
                    mediaType = 'file';
                    fileName = selectedFile.name;
                    fileSize = formatFileSize(selectedFile.size);
                }

                const msgRef = db.collection('chats').doc(groupId).collection('messages').doc();
                const msgData = {
                    id: msgRef.id,
                    text: text || null,
                    content: text || null,
                    media_url: mediaUrl,
                    media_type: mediaType,
                    file_name: fileName,
                    file_size: fileSize,
                    sender_id: currentUserId,
                    sender_name: senderName,
                    sender_avatar: senderAvatar,
                    reply_to: replyingTo || null,
                    reply_to_content: replyingToContent || null,
                    reply_to_sender: replyingToSender || null,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    is_edited: false,
                    deleted_for_everyone: false,
                    reactions: {}
                };

                await msgRef.set(msgData);

                const lastMessage = text || (mediaType === 'image' ? '📷 Image' : mediaType === 'video' ? '🎥 Video' : '📎 File');
                await db.collection('chats').doc(groupId).update({
                    last_message: lastMessage,
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message_type: mediaType
                });

                if (input) input.value = '';
                selectedImage = null;
                selectedVideo = null;
                selectedFile = null;
                replyingTo = null;
                replyingToContent = null;
                replyingToSender = null;
                replyIndicator.style.display = 'none';
                mediaPreview.style.display = 'none';
                onInputChange();

            } catch (e) {
                console.error('Send error:', e);
                showToast('Failed to send: ' + e.message, 'error');
            }

            setLoading(false);
        }

        // ─── UPLOAD FILE ─────────────────────────────────────────────
        async function uploadFile(file, type) {
            try {
                const storageRef = storage.ref();
                const path = `aurachat/groups/${groupId}/${Date.now()}_${file.name || 'file'}`;
                const fileRef = storageRef.child(path);
                await fileRef.put(file);
                return await fileRef.getDownloadURL();
            } catch (e) {
                console.error('Upload error:', e);
                throw e;
            }
        }

        // ─── SET LOADING ─────────────────────────────────────────────
        function setLoading(loading) {
            isLoading = loading;
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) {
                if (loading) {
                    sendBtn.innerHTML = '<div class="spinner-small"></div>';
                    sendBtn.disabled = true;
                } else {
                    sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                    sendBtn.disabled = false;
                }
            }
        }

        // ─── START RECORDING ──────────────────────────────────────────
        function startRecording() {
            if (isRecording) {
                stopRecordingAndSend();
                return;
            }
            
            isRecording = true;
            const micBtn = document.getElementById('micBtn');
            if (micBtn) {
                micBtn.style.color = '#ef4444';
                micBtn.style.background = 'rgba(239,68,68,0.15)';
            }
            showToast('🎤 Recording... Tap mic to stop', '');
            
            // Auto-stop after 30 seconds
            setTimeout(() => {
                if (isRecording) {
                    stopRecordingAndSend();
                }
            }, 30000);
        }

        function stopRecordingAndSend() {
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            if (micBtn) {
                micBtn.style.color = '';
                micBtn.style.background = '';
            }
            showToast('🎤 Voice note sent!', 'success');
        }

        // ─── MESSAGE OPTIONS ─────────────────────────────────────────
        function showMessageOptions(msgId) {
            const msg = messages.find(m => m.id === msgId);
            if (!msg || msg.type === 'system') return;
            
            const isMe = msg.sender_id === currentUserId;
            const isDeleted = msg.deleted_for_everyone === true;
            selectedMessageId = msgId;
            
            const modal = document.getElementById('msgOptionsModal');
            const content = document.getElementById('msgOptionsContent');
            
            let html = '';
            
            // Reactions
            html += `<div style="display:flex;gap:6px;padding:4px 0 10px 0;flex-wrap:wrap;justify-content:center;">`;
            ['❤️', '👍', '🔥', '😂', '😮', '🎉'].forEach(emoji => {
                html += `<button onclick="addReactionToMessage('${msgId}', '${emoji}')" style="padding:6px 10px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);font-size:20px;cursor:pointer;">${emoji}</button>`;
            });
            html += `</div>`;
            
            html += `<div style="border-top:1px solid rgba(255,255,255,0.04);margin:4px 0 6px 0;"></div>`;
            
            if (!isDeleted) {
                if (isMe) {
                    html += `<div class="modal-option" onclick="showEditDialog('${msgId}')">
                        <div class="opt-icon" style="background:rgba(139,92,246,0.1);color:#8B5CF6;"><i class="fas fa-edit"></i></div>
                        <span class="opt-label">Edit</span>
                    </div>`;
                }
                html += `<div class="modal-option" onclick="replyToMessage('${msgId}')">
                    <div class="opt-icon" style="background:rgba(6,182,212,0.1);color:#06B6D4;"><i class="fas fa-reply"></i></div>
                    <span class="opt-label">Reply</span>
                </div>`;
            }
            
            if (isMe) {
                html += `<div class="modal-option danger" onclick="deleteMessage('${msgId}')">
                    <div class="opt-icon"><i class="fas fa-trash"></i></div>
                    <span class="opt-label">Delete for Everyone</span>
                </div>`;
            }
            
            html += `<div class="modal-option" onclick="closeModal('msgOptionsModal')">
                <div class="opt-icon" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.3);"><i class="fas fa-times"></i></div>
                <span class="opt-label" style="color:rgba(255,255,255,0.3);">Cancel</span>
            </div>`;
            
            content.innerHTML = html;
            modal.classList.add('active');
        }

        // ─── REACTIONS ───────────────────────────────────────────────
        async function addReactionToMessage(msgId, emoji) {
            try {
                const msgRef = db.collection('chats').doc(groupId).collection('messages').doc(msgId);
                const doc = await msgRef.get();
                if (!doc.exists) return;

                const data = doc.data();
                const reactions = data.reactions || {};
                const users = reactions[emoji] || [];

                if (users.includes(currentUserId)) {
                    const index = users.indexOf(currentUserId);
                    users.splice(index, 1);
                    if (users.length === 0) {
                        delete reactions[emoji];
                    } else {
                        reactions[emoji] = users;
                    }
                } else {
                    users.push(currentUserId);
                    reactions[emoji] = users;
                }

                await msgRef.update({ reactions: reactions });
                closeModal('msgOptionsModal');
            } catch (e) {
                console.error('Reaction error:', e);
            }
        }

        // ─── REPLY ────────────────────────────────────────────────────
        function replyToMessage(msgId) {
            closeModal('msgOptionsModal');
            const msg = messages.find(m => m.id === msgId);
            if (msg) {
                replyingTo = msgId;
                replyingToContent = msg.text || msg.content || 'Media';
                replyingToSender = msg.sender_name || 'Unknown';
                replyIndicator.style.display = 'flex';
                replySender.textContent = 'Replying to ' + replyingToSender;
                replyContent.textContent = replyingToContent;
                document.getElementById('messageInput')?.focus();
            }
        }

        function cancelReply() {
            replyingTo = null;
            replyingToContent = null;
            replyingToSender = null;
            replyIndicator.style.display = 'none';
        }

        // ─── EDIT ─────────────────────────────────────────────────────
        function showEditDialog(msgId) {
            closeModal('msgOptionsModal');
            editingMessageId = msgId;
            const msg = messages.find(m => m.id === msgId);
            if (msg) {
                document.getElementById('editInput').value = msg.text || msg.content || '';
                document.getElementById('editDialog').classList.add('active');
                setTimeout(() => document.getElementById('editInput').focus(), 100);
            }
        }

        async function saveEdit() {
            const newContent = document.getElementById('editInput').value.trim();
            if (!newContent || !editingMessageId) {
                closeDialog('editDialog');
                return;
            }

            try {
                await db.collection('chats')
                    .doc(groupId)
                    .collection('messages')
                    .doc(editingMessageId)
                    .update({
                        text: newContent,
                        content: newContent,
                        is_edited: true,
                        updated_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                closeDialog('editDialog');
                showToast('Message edited', 'success');
            } catch (e) {
                console.error('Edit error:', e);
                showToast('Failed to edit message', 'error');
            }
            editingMessageId = null;
        }

        // ─── DELETE ───────────────────────────────────────────────────
        function deleteMessage(msgId) {
            closeModal('msgOptionsModal');
            deletingMessageId = msgId;
            document.getElementById('deleteDialog').classList.add('active');
        }

        async function confirmDelete() {
            if (!deletingMessageId) {
                closeDialog('deleteDialog');
                return;
            }

            try {
                await db.collection('chats')
                    .doc(groupId)
                    .collection('messages')
                    .doc(deletingMessageId)
                    .update({
                        deleted_for_everyone: true,
                        text: 'This message was deleted',
                        content: 'This message was deleted',
                        media_url: null,
                        updated_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                closeDialog('deleteDialog');
                showToast('Message deleted', '');
            } catch (e) {
                console.error('Delete error:', e);
                showToast('Failed to delete message', 'error');
            }
            deletingMessageId = null;
        }

        // ─── ATTACHMENT FUNCTIONS ────────────────────────────────────
        function showAttachmentMenu() {
            openModal('attachModal');
        }

        function pickImage() { closeModal('attachModal'); document.getElementById('imageInput').click(); }
        function takePhoto() { closeModal('attachModal'); document.getElementById('cameraInput').click(); }
        function pickVideo() { closeModal('attachModal'); document.getElementById('videoInput').click(); }
        function recordVideo() { closeModal('attachModal'); document.getElementById('recordInput').click(); }
        function pickFile() { closeModal('attachModal'); document.getElementById('fileInput').click(); }

        function handleImageSelected(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedImage = file;
            previewLabel.textContent = '📷 Image: ' + file.name;
            mediaPreview.style.display = 'flex';
            event.target.value = '';
        }

        function handleVideoSelected(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedVideo = file;
            previewLabel.textContent = '🎥 Video: ' + file.name;
            mediaPreview.style.display = 'flex';
            event.target.value = '';
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedFile = file;
            previewLabel.textContent = '📎 File: ' + file.name;
            mediaPreview.style.display = 'flex';
            event.target.value = '';
        }

        function removeMedia() {
            selectedImage = null;
            selectedVideo = null;
            selectedFile = null;
            mediaPreview.style.display = 'none';
        }

        // ─── EMOJI PICKER ─────────────────────────────────────────────
        function toggleEmojiPicker() {
            showEmojiPicker = !showEmojiPicker;
            if (showEmojiPicker) {
                emojiPicker.style.display = 'block';
                renderEmojis();
            } else {
                emojiPicker.style.display = 'none';
            }
        }

        function renderEmojis() {
            let html = '';
            emojis.forEach(emoji => {
                html += `<span class="emoji" onclick="insertEmoji('${emoji}')" style="font-size:20px;cursor:pointer;padding:3px;text-align:center;border-radius:5px;transition:background 0.2s;">${emoji}</span>`;
            });
            emojiGrid.innerHTML = html;
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            if (input) {
                input.value += emoji;
                input.focus();
                onInputChange();
            }
        }

        // ─── MODAL HELPERS ───────────────────────────────────────────
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        function closeDialog(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.modal-overlay, .dialog-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });

        // ─── KEYBOARD SHORTCUTS ──────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active, .dialog-overlay.active').forEach(el => {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                });
                if (showEmojiPicker) {
                    showEmojiPicker = false;
                    emojiPicker.style.display = 'none';
                }
            }
            if (e.key === 'Enter' && !e.shiftKey) {
                const input = document.getElementById('messageInput');
                if (document.activeElement === input) {
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        // ─── INIT ─────────────────────────────────────────────────────
        async function init() {
            if (!checkAuth()) {
                showToast('Please login first', 'error');
                setTimeout(() => {
                    window.location.href = 'email_verification.html';
                }, 1500);
                return;
            }

            const params = getUrlParams();
            groupId = params.id;
            groupName = params.name || 'Group';

            if (!groupId) {
                messagesContainer.innerHTML = `
                    <div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">Invalid group</div>
                `;
                return;
            }

            await loadUserData();
            await loadGroupInfo();
            loadMessages();

            console.log('👥 Group Chat loaded');
            console.log('👤 User:', currentUserId);
            console.log('👥 Group:', groupId);
            console.log('👑 Role:', myRole);
        }

        // ─── START ────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    localStorage.setItem('mock_user_id', currentUserId);
                    init();
                } else {
                    const userId = localStorage.getItem('mock_user_id');
                    if (userId) {
                        currentUserId = userId;
                        init();
                    } else {
                        window.location.href = 'email_verification.html';
                    }
                }
            });
        });

        console.log('👥 AURA Chat — Group');
        console.log('🔗 Firebase Project:', firebaseConfig.projectId);
    </script>

</body>
