<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Settings</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 10px;
        }

        #app {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 40px;
        }

        /* ===== APP BAR ===== */
        .app-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .back-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .app-title {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        /* ===== PROFILE HEADER ===== */
        .profile-header {
            padding: 20px 20px 16px 20px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(6, 182, 212, 0.08));
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: background 0.2s;
        }

        .profile-header:hover {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.1));
        }

        .profile-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar .avatar-fallback {
            font-size: 28px;
            color: rgba(255,255,255,0.7);
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .profile-name .verified-badge {
            color: #1DA1F2;
            font-size: 14px;
        }

        .profile-email {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-top: 2px;
        }

        .profile-arrow {
            color: rgba(255,255,255,0.2);
            font-size: 16px;
        }

        /* ===== SETTINGS LIST ===== */
        .settings-list {
            padding: 16px 20px 32px 20px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: rgba(139, 92, 246, 0.8);
            letter-spacing: 1.5px;
            padding: 24px 4px 12px 4px;
            text-transform: uppercase;
        }

        .section-title:first-child {
            padding-top: 0;
        }

        .setting-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .setting-item:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(139, 92, 246, 0.2);
        }

        .setting-item:active {
            transform: scale(0.98);
        }

        .setting-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            margin-right: 14px;
        }

        .setting-info {
            flex: 1;
            min-width: 0;
        }

        .setting-title {
            font-size: 15px;
            font-weight: 500;
            color: #fff;
        }

        .setting-subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-top: 1px;
        }

        .setting-arrow {
            color: rgba(255,255,255,0.15);
            font-size: 14px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        /* ===== LOGOUT BUTTON ===== */
        .logout-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.08);
            border-radius: 16px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-item:hover {
            background: rgba(239, 68, 68, 0.12);
        }

        .logout-item:active {
            transform: scale(0.98);
        }

        .logout-item .logout-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #ef4444;
            flex-shrink: 0;
            margin-right: 14px;
        }

        .logout-item .logout-text {
            font-size: 16px;
            font-weight: 600;
            color: #ef4444;
        }

        .logout-item .logout-arrow {
            color: rgba(239, 68, 68, 0.2);
            font-size: 14px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        /* ===== VERSION ===== */
        .version-text {
            text-align: center;
            color: rgba(255,255,255,0.15);
            font-size: 12px;
            padding: 24px 0 16px 0;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a103c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            z-index: 2000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.5);
            background: rgba(74, 222, 128, 0.1);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== DIALOG ===== */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1100;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .dialog-overlay.active {
            display: flex;
        }

        .dialog-content {
            background: #1a103c;
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 380px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .dialog-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .dialog-text {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 16px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .dialog-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .dialog-btn:hover {
            opacity: 0.8;
        }

        .dialog-btn-cancel {
            background: transparent;
            color: rgba(255,255,255,0.5);
        }

        .dialog-btn-danger {
            background: #ef4444;
            color: #fff;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .settings-list {
                padding: 12px 16px 24px 16px;
            }
            .profile-avatar {
                width: 50px;
                height: 50px;
            }
            .profile-name {
                font-size: 16px;
            }
        }

        /* Hidden file input */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- App Bar -->
        <div class="app-bar">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="app-title">Settings</div>
        </div>

        <!-- Profile Header -->
        <div class="profile-header" onclick="navigateTo('profile')">
            <div class="profile-row">
                <div class="profile-avatar" id="profileAvatar">
                    <span class="avatar-fallback"><i class="fas fa-user"></i></span>
                </div>
                <div class="profile-info">
                    <div class="profile-name" id="profileName">
                        Loading...
                        <span class="verified-badge" id="verifiedBadge" style="display:none;">
                            <i class="fas fa-check-circle"></i>
                        </span>
                    </div>
                    <div class="profile-email" id="profileEmail">Loading...</div>
                </div>
                <div class="profile-arrow"><i class="fas fa-chevron-right"></i></div>
            </div>
        </div>

        <!-- Settings List -->
        <div class="settings-list" id="settingsList">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== LOGOUT DIALOG ===== -->
    <div class="dialog-overlay" id="logoutDialog">
        <div class="dialog-content">
            <div class="dialog-title">Log Out</div>
            <div class="dialog-text">Are you sure you want to log out?</div>
            <div class="dialog-actions">
                <button class="dialog-btn dialog-btn-cancel" onclick="closeDialog('logoutDialog')">Cancel</button>
                <button class="dialog-btn dialog-btn-danger" onclick="logout()">Log Out</button>
            </div>
        </div>
    </div>

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ─── STATE ─────────────────────────────────────────────────────
        let currentUserId = null;
        let userData = {};
        let isLoading = false;
        let currentLanguage = 'en';

        // ─── LOCAL STORAGE HELPERS ──────────────────────────────────
        function saveToLocalStorage(key, value) {
            try {
                if (typeof value === 'string') {
                    localStorage.setItem(key, value);
                } else {
                    localStorage.setItem(key, JSON.stringify(value));
                }
            } catch (e) {
                console.warn('Could not save to localStorage:', e);
            }
        }

        function getFromLocalStorage(key) {
            try {
                const value = localStorage.getItem(key);
                if (!value) return null;
                try {
                    return JSON.parse(value);
                } catch {
                    return value;
                }
            } catch (e) {
                return null;
            }
        }

        function removeFromLocalStorage(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) {}
        }

        // ─── DOM REFS ─────────────────────────────────────────────────
        const profileAvatar = document.getElementById('profileAvatar');
        const profileName = document.getElementById('profileName');
        const profileEmail = document.getElementById('profileEmail');
        const verifiedBadge = document.getElementById('verifiedBadge');
        const settingsList = document.getElementById('settingsList');
        const toast = document.getElementById('toast');

        // ─── TOAST ────────────────────────────────────────────────────
        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ─── NAVIGATION ──────────────────────────────────────────────
        function goBack() {
            window.history.back();
        }

        function navigateTo(page) {
            window.location.href = page + '.html';
        }

        // ─── CHECK AUTH ──────────────────────────────────────────────
        function checkAuth() {
            const userId = getFromLocalStorage('mock_user_id');
            if (userId) {
                currentUserId = userId;
                return true;
            }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                saveToLocalStorage('mock_user_id', currentUserId);
                return true;
            }
            return false;
        }

        // ─── VERIFIED CHECK ──────────────────────────────────────────
        function isVerified(email) {
            if (!email) return false;
            return email.toLowerCase().trim().endsWith('@aurachat.app');
        }

        // ─── LOAD LANGUAGE ───────────────────────────────────────────
        function loadLanguage() {
            const saved = getFromLocalStorage('app_language');
            if (saved) {
                currentLanguage = saved;
            } else {
                currentLanguage = 'en';
            }
        }

        // ─── LOAD USER DATA ──────────────────────────────────────────
        async function loadUserData() {
            if (!currentUserId) return;

            try {
                const doc = await db.collection('users').doc(currentUserId).get();
                if (doc.exists) {
                    const data = doc.data();
                    userData = {
                        id: currentUserId,
                        displayName: data.display_name || data.username || getFromLocalStorage('mock_display_name') || 'Unknown',
                        username: data.username || getFromLocalStorage('mock_username') || '',
                        email: data.email || getFromLocalStorage('mock_email') || '',
                        avatarUrl: data.avatar_url || getFromLocalStorage('mock_avatar') || '',
                        bio: data.bio || getFromLocalStorage('mock_bio') || ''
                    };
                } else {
                    // Use localStorage fallback
                    userData = {
                        id: currentUserId,
                        displayName: getFromLocalStorage('mock_display_name') || 'Unknown',
                        username: getFromLocalStorage('mock_username') || '',
                        email: getFromLocalStorage('mock_email') || '',
                        avatarUrl: getFromLocalStorage('mock_avatar') || '',
                        bio: getFromLocalStorage('mock_bio') || ''
                    };
                }
                updateProfileUI();
            } catch (e) {
                console.error('Error loading user data:', e);
            }
        }

        // ─── UPDATE PROFILE UI ──────────────────────────────────────
        function updateProfileUI() {
            const displayName = userData.displayName || 'Unknown';
            const email = userData.email || 'No email set';
            const avatarUrl = userData.avatarUrl;
            const verified = isVerified(email);

            // Avatar
            if (avatarUrl) {
                profileAvatar.innerHTML = `<img src="${avatarUrl}" alt="${displayName}" onerror="this.parentElement.innerHTML='<span class=\\'avatar-fallback\\'><i class=\\'fas fa-user\\'></i></span>'" />`;
            } else {
                profileAvatar.innerHTML = `<span class="avatar-fallback"><i class="fas fa-user"></i></span>`;
            }

            // Name
            profileName.innerHTML = `
                ${displayName}
                ${verified ? '<span class="verified-badge"><i class="fas fa-check-circle"></i></span>' : ''}
            `;

            // Email
            profileEmail.textContent = email;

            // Show/hide verified badge
            verifiedBadge.style.display = verified ? 'inline' : 'none';
        }

        // ─── RENDER SETTINGS ────────────────────────────────────────
        function renderSettings() {
            const currentLangName = getLanguageName(currentLanguage);

            const settings = [
                // Account Section
                { section: true, title: 'Account' },
                { 
                    icon: 'fa-user',
                    color: '#8B5CF6',
                    title: 'Profile',
                    subtitle: 'Edit your profile and photo',
                    page: 'profile'
                },
                { 
                    icon: 'fa-shield-alt',
                    color: '#8B5CF6',
                    title: 'Security',
                    subtitle: 'Passcode and biometric lock',
                    page: 'security'
                },
                { 
                    icon: 'fa-shield-halved',
                    color: '#06B6D4',
                    title: 'Privacy',
                    subtitle: 'Control who can see your info',
                    page: 'privacy_settings'
                },
                { 
                    icon: 'fa-phone',
                    color: '#06B6D4',
                    title: 'Account Settings',
                    subtitle: 'Change number, email',
                    page: 'account_settings'
                },
                { 
                    icon: 'fa-ban',
                    color: '#ef4444',
                    title: 'Blocked Users',
                    subtitle: 'View and unblock users',
                    page: 'blocked_users'
                },

                // Preferences Section
                { section: true, title: 'Preferences' },
                { 
                    icon: 'fa-comment',
                    color: '#8B5CF6',
                    title: 'Chats',
                    subtitle: 'Theme, wallpapers, chat history',
                    page: 'appearance'
                },
                { 
                    icon: 'fa-palette',
                    color: '#8B5CF6',
                    title: 'Appearance',
                    subtitle: 'Theme, colors, and style',
                    page: 'appearance'
                },
                { 
                    icon: 'fa-bell',
                    color: '#06B6D4',
                    title: 'Notifications',
                    subtitle: 'Message tones and alerts',
                    page: 'notifications_settings'
                },
                { 
                    icon: 'fa-hard-drive',
                    color: '#F59E0B',
                    title: 'Storage and Data',
                    subtitle: 'Network usage, auto-download',
                    page: 'data_storage'
                },
                { 
                    icon: 'fa-language',
                    color: '#10B981',
                    title: 'App Language',
                    subtitle: currentLangName,
                    page: 'language'
                },

                // Help Section
                { section: true, title: 'Help' },
                { 
                    icon: 'fa-circle-question',
                    color: '#8B5CF6',
                    title: 'Help',
                    subtitle: 'Help center, contact us',
                    page: '#',
                    action: 'showToast("Help center coming soon", "")'
                },
                { 
                    icon: 'fa-users',
                    color: '#06B6D4',
                    title: 'Invite Friends',
                    subtitle: 'Share AURA with friends',
                    page: '#',
                    action: 'showToast("Invite feature coming soon", "")'
                },
            ];

            let html = '';
            settings.forEach(item => {
                if (item.section) {
                    html += `<div class="section-title">${item.title}</div>`;
                } else {
                    const onclick = item.page && item.page !== '#' ? `navigateTo('${item.page}')` : (item.action || '');
                    html += `
                        <div class="setting-item" onclick="${onclick}">
                            <div class="setting-icon" style="background: ${item.color}22; color: ${item.color}">
                                <i class="fas ${item.icon}"></i>
                            </div>
                            <div class="setting-info">
                                <div class="setting-title">${item.title}</div>
                                <div class="setting-subtitle">${item.subtitle}</div>
                            </div>
                            <div class="setting-arrow"><i class="fas fa-chevron-right"></i></div>
                        </div>
                    `;
                }
            });

            // Logout
            html += `
                <div class="logout-item" onclick="showLogoutDialog()">
                    <div class="logout-icon">
                        <i class="fas fa-sign-out-alt"></i>
                    </div>
                    <div class="logout-text">Log Out</div>
                    <div class="logout-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="version-text">AURA Chat v1.0.0</div>
            `;

            settingsList.innerHTML = html;
        }

        function getLanguageName(code) {
            const languages = {
                'en': 'English',
                'es': 'Español',
                'fr': 'Français',
                'ha': 'Hausa',
                'yo': 'Yorùbá',
                'ig': 'Igbo',
                'de': 'Deutsch',
                'it': 'Italiano',
                'pt': 'Português',
                'ru': 'Русский',
                'zh': '中文',
                'ja': '日本語',
                'ko': '한국어',
                'ar': 'العربية',
                'hi': 'हिन्दी',
                'tr': 'Türkçe',
                'pl': 'Polski',
                'nl': 'Nederlands',
                'sv': 'Svenska',
                'id': 'Bahasa Indonesia',
                'th': 'ไทย',
                'vi': 'Tiếng Việt',
                'sw': 'Kiswahili'
            };
            return languages[code] || 'English';
        }

        // ─── LOGOUT ───────────────────────────────────────────────────
        function showLogoutDialog() {
            document.getElementById('logoutDialog').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDialog(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        async function logout() {
            closeDialog('logoutDialog');
            try {
                await auth.signOut();
                // Clear all localStorage
                removeFromLocalStorage('mock_user_id');
                removeFromLocalStorage('mock_email');
                removeFromLocalStorage('mock_username');
                removeFromLocalStorage('mock_display_name');
                removeFromLocalStorage('mock_avatar');
                removeFromLocalStorage('mock_phone');
                removeFromLocalStorage('mock_bio');
                removeFromLocalStorage('aura_session');
                window.location.href = 'email_verification.html';
            } catch (e) {
                console.error('Logout error:', e);
                showToast('Error logging out', 'error');
            }
        }

        // ─── CLOSE DIALOG ON OVERLAY CLICK ──────────────────────────
        document.querySelectorAll('.dialog-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });

        // ─── KEYBOARD SHORTCUTS ──────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.dialog-overlay.active').forEach(el => {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                });
            }
        });

        // ─── INIT ─────────────────────────────────────────────────────
        async function init() {
            if (!checkAuth()) {
                showToast('Please login first', 'error');
                setTimeout(() => {
                    window.location.href = 'email_verification.html';
                }, 1500);
                return;
            }

            loadLanguage();
            await loadUserData();
            renderSettings();

            console.log('⚙️ Settings Screen loaded');
            console.log('👤 User:', currentUserId);
            console.log('🌐 Language:', currentLanguage);
        }

        // ─── START ────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    saveToLocalStorage('mock_user_id', user.uid);
                    init();
                } else {
                    const userId = getFromLocalStorage('mock_user_id');
                    if (userId) {
                        currentUserId = userId;
                        init();
                    } else {
                        window.location.href = 'email_verification.html';
                    }
                }
            });
        });

        console.log('⚙️ AURA Chat — Settings');
        console.log('🔗 Firebase Project:', firebaseConfig.projectId);
    </script>

</body>
</html>
