<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>@BotCreator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --accent:#A855F7;--accent-2:#3B82F6;
  --accent-grad:linear-gradient(135deg,#A855F7,#3B82F6);
  --bg:#0A0A0F;--bg-2:#14121A;--bg-3:#1A1822;
  --bubble:#1C1A24;
  --border:rgba(255,255,255,0.06);
  --text:#FFF;--text-2:rgba(255,255,255,0.55);--text-3:rgba(255,255,255,0.35);
  --danger:#EF4444;--success:#4ADE80;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  overflow:hidden;-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(168,85,247,0.3);border-radius:3px;}

#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(168,85,247,0.08), transparent 55%),
    var(--bg);
}

.header{
  padding:10px 8px;display:flex;align-items:center;gap:6px;
  background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);min-height:58px;flex-shrink:0;
}
.icon-btn{
  background:none;border:none;color:var(--text);font-size:17px;
  width:40px;height:40px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s;
}
.icon-btn:hover{background:rgba(255,255,255,0.05);}
.chat-info{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}
.chat-avatar{
  width:42px;height:42px;border-radius:50%;
  background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;overflow:hidden;flex-shrink:0;
  border:1px solid rgba(255,255,255,0.08);
}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}
.chat-meta{flex:1;min-width:0;}
.chat-name-row{display:flex;align-items:center;gap:6px;}
.chat-name{font-weight:600;font-size:15px;letter-spacing:-0.01em;}
.bot-badge{
  font-size:9px;font-weight:800;letter-spacing:0.6px;
  color:#fff;background:var(--accent-grad);
  padding:2px 6px;border-radius:4px;
}
.chat-sub{font-size:11.5px;color:var(--text-3);margin-top:1px;font-weight:500;}

.messages{
  flex:1;overflow-y:auto;padding:16px 12px 12px 12px;
  display:flex;flex-direction:column;gap:4px;
}
.msg{display:flex;width:100%;margin-bottom:2px;}
.msg.out{justify-content:flex-end;}
.bubble{
  max-width:82%;background:var(--bubble);
  border-radius:16px;padding:10px 14px;
  font-size:14.5px;line-height:1.5;
  word-wrap:break-word;white-space:pre-wrap;
  border:1px solid var(--border);
}
.msg.out .bubble{
  background:var(--accent-grad);
  border-color:transparent;color:#fff;
  border-bottom-right-radius:6px;
}
.msg:not(.out) .bubble{border-bottom-left-radius:6px;}
.bubble a{color:#C4B5FD;text-decoration:none;}
.msg.out .bubble a{color:#fff;text-decoration:underline;}
.bubble code{
  font-family:'JetBrains Mono',monospace;
  background:rgba(168,85,247,0.15);color:#C4B5FD;
  padding:2px 7px;border-radius:5px;font-size:13px;
}
.msg.out .bubble code{background:rgba(0,0,0,0.25);color:#fff;}
.bubble pre{
  background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.06);
  padding:12px 14px;border-radius:10px;margin:8px 0;
  overflow-x:auto;font-family:'JetBrains Mono',monospace;
  font-size:12.5px;line-height:1.55;color:#E0D5FF;
}
.msg.out .bubble pre{background:rgba(0,0,0,0.35);color:#fff;}
.bubble strong{color:#fff;font-weight:700;}
.msg:not(.out) .bubble strong{color:#C4B5FD;}
.bubble em{color:var(--text-2);font-style:normal;font-size:13.5px;}
.bubble .sent-image{
  display:block;margin:-6px -10px 6px -10px;
  border-radius:12px;overflow:hidden;max-height:280px;
}
.bubble .sent-image img{width:100%;max-height:280px;object-fit:cover;display:block;}

.btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.inline-btn{
  padding:8px 15px;border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.04);color:#fff;
  border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;
}
.inline-btn:hover{background:rgba(255,255,255,0.08);}
.inline-btn.primary{background:var(--accent-grad);border-color:transparent;}
.inline-btn.danger{
  background:rgba(239,68,68,0.15);
  border-color:rgba(239,68,68,0.25);color:#FCA5A5;
}

.typing-ind{display:none;margin:2px 0 6px 0;}
.typing-ind.show{display:flex;}
.typing-ind .dots{
  display:flex;gap:5px;padding:13px 18px;
  background:var(--bubble);border-radius:16px;
  border-bottom-left-radius:6px;border:1px solid var(--border);
}
.typing-ind .dots span{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  animation:typingB 1.3s infinite ease-in-out both;
}
.typing-ind .dots span:nth-child(1){animation-delay:-0.3s;}
.typing-ind .dots span:nth-child(2){animation-delay:-0.15s;}
@keyframes typingB{
  0%,80%,100%{transform:scale(0.5);opacity:.4;}
  40%{transform:scale(1);opacity:1;}
}

.commands{
  display:flex;gap:6px;padding:8px 12px;overflow-x:auto;
  background:rgba(10,10,15,0.9);border-top:1px solid var(--border);
  flex-shrink:0;
}
.commands::-webkit-scrollbar{height:0;}
.cmd-chip{
  padding:7px 14px;border-radius:18px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  color:var(--text-2);font-size:12.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  font-family:'JetBrains Mono',monospace;transition:all .15s;
}
.cmd-chip:hover{
  background:rgba(168,85,247,0.12);
  border-color:rgba(168,85,247,0.3);color:#C4B5FD;
}

.input-area{
  padding:10px 12px;background:rgba(10,10,15,0.95);
  backdrop-filter:blur(20px);border-top:1px solid var(--border);
  flex-shrink:0;
}
.input-row{display:flex;align-items:center;gap:8px;}
.attach-btn{
  width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.04);color:var(--text-2);
  font-size:16px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.attach-btn:hover{background:rgba(168,85,247,0.15);color:#C4B5FD;}
.input-field{
  flex:1;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:22px;
  padding:11px 18px;color:#fff;font-size:14px;
  font-family:inherit;outline:none;min-height:42px;
}
.input-field::placeholder{color:var(--text-3);}
.input-field:focus{border-color:rgba(168,85,247,0.4);}
.send-btn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:var(--accent-grad);color:#fff;font-size:16px;
  cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.send-btn:hover{transform:scale(1.05);}

.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--bg-3);border:1px solid var(--border);
  color:#fff;padding:10px 20px;border-radius:12px;
  font-size:13px;font-weight:500;z-index:3000;display:none;
  max-width:90%;box-shadow:0 8px 30px rgba(0,0,0,0.5);
}
.toast.show{display:block;}
.toast.success{border-color:rgba(74,222,128,0.3);}
.toast.error{border-color:rgba(239,68,68,0.3);}
.hidden{display:none!important;}

.media-preview{display:none;padding:8px 12px 0 12px;}
.media-preview.show{display:block;}
.media-preview .box{
  display:flex;align-items:center;gap:12px;
  background:rgba(168,85,247,0.08);
  border:1px solid rgba(168,85,247,0.2);
  border-radius:12px;padding:10px;
}
.media-preview .thumb{
  width:44px;height:44px;border-radius:8px;
  background:rgba(0,0,0,0.3);overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.media-preview .thumb img{width:100%;height:100%;object-fit:cover;}
.media-preview .info{flex:1;min-width:0;}
.media-preview .info .name{font-size:13px;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.media-preview .info .size{font-size:11.5px;color:var(--text-3);margin-top:2px;}
.media-preview .cancel{
  background:none;border:none;color:var(--text-3);
  font-size:16px;cursor:pointer;padding:6px;
}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <button class="icon-btn" onclick="window.location.href='chats.html'">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="chat-info">
      <div class="chat-avatar"><i class="fas fa-robot"></i></div>
      <div class="chat-meta">
        <div class="chat-name-row">
          <div class="chat-name">BotCreator</div>
          <span class="bot-badge">BOT</span>
        </div>
        <div class="chat-sub" id="chatSub">Your bot factory</div>
      </div>
    </div>
    <button class="icon-btn" onclick="quickCmd('/help')">
      <i class="fas fa-circle-question"></i>
    </button>
  </div>

  <div class="messages" id="messages">
    <div class="typing-ind" id="typingInd">
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="media-preview" id="mediaPreview">
    <div class="box">
      <div class="thumb" id="mediaThumb"></div>
      <div class="info">
        <div class="name" id="mediaName">image.jpg</div>
        <div class="size" id="mediaSize">0 KB</div>
      </div>
      <button class="cancel" onclick="clearPendingMedia()">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <div class="commands">
    <button class="cmd-chip" onclick="quickCmd('/newbot')">/newbot</button>
    <button class="cmd-chip" onclick="quickCmd('/mybots')">/mybots</button>
    <button class="cmd-chip" onclick="quickCmd('/token')">/token</button>
    <button class="cmd-chip" onclick="quickCmd('/setname')">/setname</button>
    <button class="cmd-chip" onclick="quickCmd('/setdescription')">/setdescription</button>
    <button class="cmd-chip" onclick="quickCmd('/setuserpic')">/setuserpic</button>
    <button class="cmd-chip" onclick="quickCmd('/setusername')">/setusername</button>
    <button class="cmd-chip" onclick="quickCmd('/deletebot')">/deletebot</button>
    <button class="cmd-chip" onclick="quickCmd('/help')">/help</button>
  </div>

  <div class="input-area">
    <div class="input-row">
      <button class="attach-btn" onclick="pickImage()">
        <i class="fas fa-image"></i>
      </button>
      <input class="input-field" id="msgInput" placeholder="Message..."
             onkeydown="if(event.key==='Enter')sendUserMsg()" autocomplete="off" />
      <button class="send-btn" onclick="sendUserMsg()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="imageInput" class="hidden" accept="image/*" />
<input type="file" id="cameraInput" class="hidden" accept="image/*" capture="environment" />

<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:"AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
  authDomain:"aurachat-85f54.firebaseapp.com",
  projectId:"aurachat-85f54",
  storageBucket:"aurachat-85f54.firebasestorage.app",
  messagingSenderId:"539789121540",
  appId:"1:539789121540:web:96ac597e52dd0a80573d51"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const CLOUD_NAME = 'dn2mwp1lc';
const UPLOAD_PRESET = 'aura_chat';

async function uploadToCloudinary(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  fd.append('folder', 'aura_chat/bots');
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
    method:'POST', body: fd
  });
  if (!r.ok) throw new Error('Upload failed');
  const d = await r.json();
  return d.secure_url;
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let currentUserId = null;
let chatState = 'idle';
let tempBot = {};
let pendingMedia = null;

const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('msgInput');
const typingInd = $('typingInd');
const toast = $('toast');
const chatSub = $('chatSub');

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function showToast(m, t='') {
  toast.textContent = m;
  toast.className = 'toast show ' + t;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 2400);
}
function esc(t) {
  if (!t) return '';
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}
function linkify(t) {
  return esc(t)
    .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/(@[a-zA-Z0-9_]+)/g, '<strong>$1</strong>');
}
function genToken() {
  const botId = String(Math.floor(100000000 + Math.random() * 900000000));
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-';
  let secret = '';
  for (let i = 0; i < 35; i++) secret += chars[Math.floor(Math.random() * chars.length)];
  return `${botId}:${secret}`;
}
function scrollBottom() {
  requestAnimationFrame(() => messagesEl.scrollTop = messagesEl.scrollHeight);
}
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}
function addMsg(text, opts = {}) {
  const div = document.createElement('div');
  div.className = 'msg ' + (opts.out ? 'out' : '');
  let html = '<div class="bubble">';
  if (opts.imageUrl) {
    html += `<div class="sent-image"><img src="${opts.imageUrl}" /></div>`;
  }
  if (opts.html) html += opts.html;
  else if (text) html += linkify(text);
  if (opts.buttons) {
    html += '<div class="btn-row">';
    opts.buttons.forEach(b => {
      html += `<button class="inline-btn ${b.cls||''}" onclick="${b.onclick}">${b.label}</button>`;
    });
    html += '</div>';
  }
  html += '</div>';
  div.innerHTML = html;
  messagesEl.insertBefore(div, typingInd);
  scrollBottom();
}
function botSay(text, opts = {}, delay = 420) {
  typingInd.classList.add('show');
  scrollBottom();
  return new Promise(res => {
    setTimeout(() => {
      typingInd.classList.remove('show');
      addMsg(text, opts);
      res();
    }, delay);
  });
}
function quickCmd(c) { inputEl.value = c; sendUserMsg(); }
function setChatSub(text) { chatSub.textContent = text; }

// ═══════════════════════════════════════════════════════════════
// IMAGE PICKER
// ═══════════════════════════════════════════════════════════════
function pickImage() {
  if (chatState === 'awaiting_bot_avatar' || chatState === 'awaiting_edit_avatar') {
    const useCamera = confirm('Use camera? Tap Cancel for gallery.');
    if (useCamera) $('cameraInput').click();
    else $('imageInput').click();
  } else {
    $('imageInput').click();
  }
}
$('imageInput').addEventListener('change', handleImagePicked);
$('cameraInput').addEventListener('change', handleImagePicked);

function handleImagePicked(e) {
  const f = e.target.files[0];
  if (!f) return;
  e.target.value = '';
  pendingMedia = {
    file: f,
    name: f.name,
    size: f.size,
    previewUrl: URL.createObjectURL(f)
  };
  $('mediaThumb').innerHTML = `<img src="${pendingMedia.previewUrl}" />`;
  $('mediaName').textContent = pendingMedia.name;
  $('mediaSize').textContent = formatSize(pendingMedia.size);
  $('mediaPreview').classList.add('show');
}
function clearPendingMedia() {
  if (pendingMedia && pendingMedia.previewUrl) URL.revokeObjectURL(pendingMedia.previewUrl);
  pendingMedia = null;
  $('mediaPreview').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════════
// COMMANDS
// ═══════════════════════════════════════════════════════════════
async function handleCommand(text) {
  const cmd = text.trim().toLowerCase();
  const args = text.trim().split(/\s+/).slice(1);

  if (cmd === '/start') {
    await botSay('', {
      html: `👋 Hello! I'm <strong>BotCreator</strong>.\n\nI can help you create and manage bots for AURA.\n\nType <code>/newbot</code> to get started, or <code>/help</code> for all commands.`
    });
    return;
  }

  if (cmd === '/help') {
    await botSay('', {
      html: `<strong>📖 BotCreator Commands</strong>

<strong>Create & Manage</strong>
<code>/newbot</code> — Create a new bot
<code>/mybots</code> — List your bots
<code>/deletebot</code> — Delete a bot

<strong>Bot Settings</strong>
<code>/token</code> — Get API token
<code>/setname</code> — Change display name
<code>/setdescription</code> — Change about text
<code>/setuserpic</code> — Change profile picture
<code>/setusername</code> — Change @username
<code>/revoke</code> — Regenerate token

<strong>Developer</strong>
<code>/docs</code> — API documentation
<code>/package</code> — npm / pip install`
    }, 300);
    return;
  }

  if (cmd === '/newbot') {
    chatState = 'awaiting_bot_name';
    tempBot = {};
    setChatSub('Creating a bot...');
    await botSay('Alright, a new bot! 🎉\n\nWhat should we call it?\n\n<em>This is the display name (2–40 chars). Emojis allowed.</em>');
    return;
  }

  if (cmd === '/mybots') { await listMyBots(); return; }

  if (cmd === '/token') {
    if (args.length === 0) {
      await botSay('Usage: <code>/token @yourbotusername</code>\nOr use /mybots to pick one.');
      return;
    }
    await sendTokenForUsername(args[0]);
    return;
  }

  if (cmd === '/setname') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'setname';
    await pickBotForEdit('Choose a bot to rename:');
    return;
  }
  if (cmd === '/setdescription') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'setdescription';
    await pickBotForEdit('Choose a bot to change about text:');
    return;
  }
  if (cmd === '/setuserpic') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'setuserpic';
    await pickBotForEdit('Choose a bot to change profile picture:');
    return;
  }
  if (cmd === '/setusername') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'setusername';
    await pickBotForEdit('Choose a bot to rename @username:');
    return;
  }
  if (cmd === '/revoke') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'revoke';
    await pickBotForEdit('Choose a bot to regenerate its token:');
    return;
  }
  if (cmd === '/deletebot') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'deletebot';
    await pickBotForEdit('Choose a bot to delete:');
    return;
  }

  if (cmd === '/docs') {
    await botSay('', {
      html: `<strong>📚 AURA Bot API</strong>

Base URL: <code>https://your-app.vercel.app/api/bot/&lt;TOKEN&gt;</code>

<strong>Endpoints</strong>
<code>GET  /getMe</code>
<code>GET  /getUpdates</code>
<code>POST /sendMessage</code>
<code>POST /sendPhoto</code>
<code>POST /setWebhook</code>

<strong>Packages</strong>
• Node: <code>npm i aura-bot-api</code>
• Python: <code>pip install aura-bot</code>

<a href="bot_docs.html">Open full documentation →</a>`
    }, 400);
    return;
  }

  if (cmd === '/package') {
    await botSay('', {
      html: `<strong>📦 Install the SDK</strong>

<strong>Node.js</strong>
<pre>npm install aura-bot-api

const AuraBot = require('aura-bot-api');
const bot = new AuraBot('YOUR_TOKEN');

bot.on('message', msg => {
  bot.sendMessage(msg.chat.id, 'Hi!');
});

bot.start();</pre>

<strong>Python</strong>
<pre>pip install aura-bot

from aura_bot import Bot
bot = Bot('YOUR_TOKEN')

@bot.message()
def handle(msg):
    bot.send_message(msg['chat']['id'], 'Hi!')

bot.run()</pre>

<a href="bot_docs.html">Full documentation →</a>`
    }, 400);
    return;
  }

  await botSay('Unknown command. Try /help');
}

// ═══════════════════════════════════════════════════════════════
async function sendTokenForUsername(raw) {

<pre>${b.token}</pre>

<em>⚠ Keep this secret.</em>

Host your bot with <code>npm i aura-bot-api</code> or <code>pip install aura-bot</code>.

<a href="bot_docs.html">Read the docs →</a>`,

// ═══════════════════════════════════════════════════════════════
// BOT CREATION
// ═══════════════════════════════════════════════════════════════
async function handleBotName(name) {
  if (name.length < 2 || name.length > 40) {
    await botSay('Name must be 2–40 characters. Try again:');
    return;
  }
  tempBot.name = name;
  chatState = 'awaiting_bot_username';
  await botSay(`Nice! Now choose an <strong>@username</strong>.\n\n<em>Rules: 4–31 chars, starts with letter, letters/numbers/underscore, must end in "bot".</em>\n\n<em>Example: @MyCoolBot</em>`);
}

async function handleBotUsername(raw) {
  const uname = raw.trim().replace(/^@/, '');
  if (!/^[a-zA-Z][a-zA-Z0-9_]{3,30}$/.test(uname)) {
    await botSay('Invalid format. Must be 4–31 chars, start with letter. Try again:');
    return;
  }
  if (!uname.toLowerCase().endsWith('bot')) {
    await botSay('❌ Username must end in "bot". Try again:');
    return;
  }

  const exists = await db.collection('bots').where('username','==',uname).limit(1).get();
  if (!exists.empty) {
    await botSay(`❌ @${uname} is taken. Try another:`);
    return;
  }

  tempBot.username = uname;
  const token = genToken();

  try {
    const botRef = db.collection('bots').doc();

    // ═══ Main bot doc ═══
    await botRef.set({
      id: botRef.id,
      owner_id: currentUserId,
      name: tempBot.name,
      username: uname,
      about: '',
      avatar_url: null,
      token: token,
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
      is_public: true,
      type: 'bot',
      subscribers: 0,
      commands: ['/start','/help']
    });

    // ═══ Auto-register as user → VISIBLE IN GLOBAL SEARCH ═══
    await db.collection('users').doc(botRef.id).set({
      uid: botRef.id,
      username: uname,
      display_name: tempBot.name,
      avatar_url: null,
      about: '',
      email: `${uname}@bot.aurachat.app`,
      is_bot: true,
      bot_owner: currentUserId,
      is_verified: false,
      created_at: firebase.firestore.FieldValue.serverTimestamp()
    });

    // ═══ Chat doc ═══
    await db.collection('chats').doc(botRef.id).set({
      id: botRef.id,
      type: 'bot',
      name: tempBot.name,
      username: uname,
      about: '',
      avatar_url: null,
      owner_id: currentUserId,
      participants: [currentUserId],
      participants_data: { [currentUserId]: { role: 'owner' } },
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
      last_message: 'Bot created',
      last_message_at: firebase.firestore.FieldValue.serverTimestamp()
    });

    chatState = 'awaiting_bot_avatar';
    tempBot.id = botRef.id;
    tempBot.token = token;

    await botSay('', {
      html: `<strong>🎉 Bot created!</strong>

You can find it at <code>@${uname}</code>.

<strong>🔑 API Token:</strong>
<pre>${token}</pre>

<em>⚠ Keep this secret.</em>

📷 Now send me a <strong>profile picture</strong> — attach an image below.

<em>Or tap Skip.</em>`,
      buttons: [{ label: 'Skip', cls: '', onclick: 'skipAvatar()' }]
    }, 500);
  } catch (e) {
    console.error(e);
    await botSay('❌ Failed to create bot: ' + e.message);
    chatState = 'idle';
    setChatSub('Your bot factory');
  }
}

async function skipAvatar() {
  chatState = 'idle';
  setChatSub('Your bot factory');
  await botSay('', {
    html: `<strong>✅ Your bot is ready!</strong>

<strong>@${tempBot.username}</strong>

<strong>Next steps</strong>
1. Copy the token above
2. Install: <code>npm i aura-bot-api</code>
3. Deploy to your server

Try these:
/token @${tempBot.username}
/setdescription
/setuserpic
/mybots`,
    buttons: [
      { label: '📖 Docs', cls: 'primary', onclick: `location.href='bot_docs.html'` },
      { label: '🤖 Open Bot', cls: '', onclick: `location.href='bot_profile.html?id=${tempBot.id}'` }
    ]
  });
  tempBot = {};
}

// ═══════════════════════════════════════════════════════════════
// LIST + EDIT
// ═══════════════════════════════════════════════════════════════
async function listMyBots() {
  const snap = await db.collection('bots')
    .where('owner_id','==',currentUserId)
    .orderBy('created_at','desc').get();

  if (snap.empty) {
    await botSay("You don't have any bots yet. Use /newbot to create one!");
    return;
  }

  let html = `<strong>Your bots (${snap.size}):</strong>\n\n`;
  const buttons = [];
  snap.forEach((doc, i) => {
    const b = doc.data();
    html += `${i+1}. <strong>${esc(b.name)}</strong> — @${b.username}\n`;
    buttons.push({
      label: '@' + b.username,
      cls: 'primary',
      onclick: `location.href='bot_profile.html?id=${doc.id}'`
    });
  });
  await botSay('', { html, buttons });
}

async function pickBotForEdit(prompt) {
  const snap = await db.collection('bots')
    .where('owner_id','==',currentUserId)
    .orderBy('created_at','desc').get();

  if (snap.empty) {
    await botSay('No bots found. Create one with /newbot first.');
    chatState = 'idle';
    setChatSub('Your bot factory');
    return;
  }

  const buttons = snap.docs.map(doc => {
    const b = doc.data();
    return {
      label: '@' + b.username,
      cls: 'primary',
      onclick: `selectBot('${doc.id}','${b.username}')`
    };
  });
  await botSay(prompt, { buttons });
}

async function selectBot(botId, username) {
  const doc = await db.collection('bots').doc(botId).get();
  if (!doc.exists) { await botSay('Bot not found.'); return; }
  tempBot.id = botId;
  tempBot.username = username;

  const action = tempBot.editAction;

  if (action === 'setname') {
    chatState = 'awaiting_edit_name';
    setChatSub(`Editing @${username}`);
    await botSay(`OK. Send the new <strong>name</strong> for @${username}`);
  } else if (action === 'setdescription') {
    chatState = 'awaiting_edit_about';
    setChatSub(`Editing @${username}`);
    await botSay(`OK. Send the new <strong>About</strong> text (max 200 chars) for @${username}`);
  } else if (action === 'setuserpic') {
    chatState = 'awaiting_edit_avatar';
    setChatSub(`Editing @${username}`);
    await botSay(`OK. Send a new <strong>profile picture</strong> for @${username} — attach an image below.`);
  } else if (action === 'setusername') {
    chatState = 'awaiting_edit_username';
    setChatSub(`Editing @${username}`);
    await botSay('OK. Send the new <strong>@username</strong> (must end in "bot").');
  } else if (action === 'revoke') {
    const newToken = genToken();
    await db.collection('bots').doc(botId).update({ token: newToken });
    await botSay('', {
      html: `🔐 <strong>Token revoked</strong> for @${username}\n\n<strong>New token:</strong>\n<pre>${newToken}</pre>\nYour old token is now invalid.`
    });
    chatState = 'idle';
    setChatSub('Your bot factory');
    tempBot = {};
  } else if (action === 'deletebot') {
    chatState = 'awaiting_delete_confirm';
    await botSay('', {
      html: `⚠️ Delete <strong>@${username}</strong>?\n\n<em>This cannot be undone.</em>`,
      buttons: [
        { label: 'Yes, delete', cls: 'danger', onclick: `confirmDeleteBot('${botId}')` },
        { label: 'Cancel', cls: '', onclick: 'cancelDelete()' }
      ]
    });
  }
}

async function confirmDeleteBot(botId) {
  try {
    await db.collection('bots').doc(botId).delete();
    try { await db.collection('chats').doc(botId).delete(); } catch(e){}
    try { await db.collection('users').doc(botId).delete(); } catch(e){}
    await botSay('🗑 Bot deleted.');
  } catch (e) {
    await botSay('Failed to delete.');
  }
  chatState = 'idle';
  setChatSub('Your bot factory');
  tempBot = {};
}

async function cancelDelete() {
  await botSay('Cancelled.');
  chatState = 'idle';
  setChatSub('Your bot factory');
  tempBot = {};
}

async function handleEditName(name) {
  if (name.length < 2 || name.length > 40) { await botSay('2–40 chars. Try again:'); return; }
  await db.collection('bots').doc(tempBot.id).update({ name });
  await db.collection('chats').doc(tempBot.id).update({ name });
  await db.collection('users').doc(tempBot.id).update({ display_name: name });
  await botSay(`✅ Name changed to "${name}".`);
  chatState = 'idle';
  setChatSub('Your bot factory');
  tempBot = {};
}

async function handleEditAbout(text) {
  if (text.length > 200) { await botSay('Max 200 chars. Try again:'); return; }
  await db.collection('bots').doc(tempBot.id).update({ about: text });
  await db.collection('chats').doc(tempBot.id).update({ about: text });
  await db.collection('users').doc(tempBot.id).update({ about: text });
  await botSay('✅ About text updated.');
  chatState = 'idle';
  setChatSub('Your bot factory');
  tempBot = {};
}

async function handleEditUsername(raw) {
  const uname = raw.trim().replace(/^@/, '');
  if (!/^[a-zA-Z][a-zA-Z0-9_]{3,30}$/.test(uname) || !uname.toLowerCase().endsWith('bot')) {
    await botSay('Invalid. Must end in "bot". Try again:');
    return;
  }
  const exists = await db.collection('bots').where('username','==',uname).limit(1).get();
  if (!exists.empty && exists.docs[0].id !== tempBot.id) {
    await botSay(`❌ @${uname} is taken. Try another:`);
    return;
  }
  await db.collection('bots').doc(tempBot.id).update({ username: uname });
  await db.collection('chats').doc(tempBot.id).update({ username: uname });
  await db.collection('users').doc(tempBot.id).update({
    username: uname,
    email: `${uname}@bot.aurachat.app`
  });
  await botSay(`✅ Username changed to @${uname}.`);
  chatState = 'idle';
  setChatSub('Your bot factory');
  tempBot = {};
}

// ═══════════════════════════════════════════════════════════════
// SEND (text or image)
// ═══════════════════════════════════════════════════════════════
async function sendUserMsg() {
  const text = inputEl.value.trim();
  const hasImage = !!pendingMedia;
  if (!text && !hasImage) return;
  inputEl.value = '';

  if (hasImage) {
    const media = pendingMedia;
    clearPendingMedia();
    addMsg('', { out: true, imageUrl: media.previewUrl });

    if (chatState === 'awaiting_bot_avatar' || chatState === 'awaiting_edit_avatar') {
      const botId = tempBot.id;
      if (!botId) { await botSay('❌ No bot selected.'); return; }

      typingInd.classList.add('show');
      showToast('Uploading picture...');
      try {
        const url = await uploadToCloudinary(media.file);
        await db.collection('bots').doc(botId).update({ avatar_url: url });
        await db.collection('chats').doc(botId).update({ avatar_url: url });
        await db.collection('users').doc(botId).update({ avatar_url: url });
        typingInd.classList.remove('show');
        showToast('✅ Picture set!', 'success');

        if (chatState === 'awaiting_bot_avatar') {
          await skipAvatar();
        } else {
          await botSay('✅ Profile picture updated.');
          chatState = 'idle';
          setChatSub('Your bot factory');
          tempBot = {};
        }
      } catch (e) {
        console.error(e);
        typingInd.classList.remove('show');
        await botSay('❌ Upload failed. Try again.');
      }
      return;
    }

    await botSay('📷 Nice picture! I set it as a profile pic only when creating or editing a bot.');
    return;
  }

  addMsg(text, { out: true });

  if (chatState === 'awaiting_bot_name') await handleBotName(text);
  else if (chatState === 'awaiting_bot_username') await handleBotUsername(text);
  else if (chatState === 'awaiting_edit_name') await handleEditName(text);
  else if (chatState === 'awaiting_edit_about') await handleEditAbout(text);
  else if (chatState === 'awaiting_edit_username') await handleEditUsername(text);
  else if (chatState === 'awaiting_bot_avatar' || chatState === 'awaiting_edit_avatar') {
    await botSay('Please send an image file, or tap Skip.');
  }
  else if (text.startsWith('/')) await handleCommand(text);
  else await botSay('I only understand commands. Try /help');
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function checkAuth() {
  const uid = localStorage.getItem('mock_user_id');
  if (uid) { currentUserId = uid; return true; }
  if (auth.currentUser) {
    currentUserId = auth.currentUser.uid;
    localStorage.setItem('mock_user_id', currentUserId);
    return true;
  }
  return false;
}

async function init() {
  if (!checkAuth()) { location.href = 'email_verification.html'; return; }

  const editData = sessionStorage.getItem('edit_bot');
  if (editData) {
    try {
      const { username } = JSON.parse(editData);
      sessionStorage.removeItem('edit_bot');
      await botSay(`👋 Welcome back! Manage <strong>@${username}</strong>:`, {
        buttons: [
          { label: '📝 Name', cls: '', onclick: `quickCmd('/setname')` },
          { label: '📄 About', cls: '', onclick: `quickCmd('/setdescription')` },
          { label: '🖼 Picture', cls: '', onclick: `quickCmd('/setuserpic')` },
          { label: '🔐 Revoke', cls: '', onclick: `quickCmd('/revoke')` },
          { label: '🔑 Token', cls: 'primary', onclick: `quickCmd('/token @${username}')` },
          { label: '🗑 Delete', cls: 'danger', onclick: `quickCmd('/deletebot')` }
        ]
      }, 500);
      return;
    } catch(e) {}
  }

  await botSay('', {
    html: `👋 Welcome to <strong>BotCreator</strong>!

I create and manage bots for AURA.

Type <code>/newbot</code> to get started — or <code>/help</code> for commands.`
  }, 500);
}

document.addEventListener('DOMContentLoaded', () => {
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUserId = user.uid;
      localStorage.setItem('mock_user_id', currentUserId);
      init();
    } else {
      const uid = localStorage.getItem('mock_user_id');
      if (uid) { currentUserId = uid; init(); }
      else location.href = 'email_verification.html';
    }
  });
});
