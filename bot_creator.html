<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>@BotCreator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root {
  --accent:#A855F7; --accent-light:#C084FC; --accent-dark:#7E22CE;
  --accent-glow:rgba(168,85,247,0.4);
  --bg:#0A0A0F; --bg-2:#14121A;
  --bubble:rgba(168,85,247,0.08);
  --bubble-border:rgba(168,85,247,0.15);
  --text:#FFF; --text-2:rgba(255,255,255,0.5); --text-3:rgba(255,255,255,0.3);
  --divider:rgba(255,255,255,0.05);
  --danger:#EF4444; --success:#4ADE80;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  overflow:hidden;-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--accent-glow);border-radius:4px;}

#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(168,85,247,0.10), transparent 55%),
    radial-gradient(ellipse at 80% 80%, rgba(126,34,206,0.08), transparent 55%),
    var(--bg);
}

.header{
  padding:8px 6px;display:flex;align-items:center;gap:4px;
  background:rgba(10,10,15,0.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--divider);min-height:56px;flex-shrink:0;
  position:relative;
}
.header::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-glow),transparent);
}
.icon-btn{
  background:none;border:none;color:var(--text);font-size:17px;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:background .15s;
}
.icon-btn:hover{background:rgba(168,85,247,0.12);}
.chat-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.chat-avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;overflow:hidden;flex-shrink:0;
  box-shadow:0 0 16px var(--accent-glow);
  border:1px solid rgba(255,255,255,0.1);
}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}
.chat-meta{flex:1;min-width:0;}
.chat-name-row{display:flex;align-items:center;gap:5px;}
.chat-name{font-weight:700;font-size:15px;letter-spacing:-0.01em;}
.bot-badge{
  font-size:9.5px;font-weight:800;letter-spacing:0.5px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  padding:2px 6px;border-radius:5px;box-shadow:0 0 8px var(--accent-glow);
}
.chat-sub{font-size:11.5px;color:var(--text-3);margin-top:1px;font-weight:500;}

.messages{
  flex:1;overflow-y:auto;padding:14px 10px 8px 10px;
  display:flex;flex-direction:column;gap:3px;
}
.msg{display:flex;width:100%;margin-bottom:2px;}
.msg.out{justify-content:flex-end;}
.bubble{
  max-width:86%;background:var(--bubble);border:1px solid var(--bubble-border);
  border-radius:14px;padding:10px 13px;font-size:14.5px;line-height:1.5;
  word-wrap:break-word;white-space:pre-wrap;backdrop-filter:blur(8px);
  box-shadow:0 2px 12px rgba(0,0,0,0.3);
}
.msg.out .bubble{
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  border-color:var(--accent-light);
  box-shadow:0 4px 20px var(--accent-glow);color:#fff;
}
.bubble a{color:var(--accent-light);text-decoration:none;}
.msg.out .bubble a{color:#fff;text-decoration:underline;}
.bubble code{
  font-family:'JetBrains Mono',monospace;
  background:rgba(168,85,247,0.15);color:var(--accent-light);
  padding:2px 6px;border-radius:5px;font-size:13px;
  border:1px solid rgba(168,85,247,0.2);
}
.bubble pre{
  background:rgba(0,0,0,0.5);border:1px solid rgba(168,85,247,0.15);
  padding:12px 14px;border-radius:10px;margin:8px 0;overflow-x:auto;
  font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.55;
  color:#E9D5FF;
}
.bubble strong{color:var(--accent-light);font-weight:700;}
.msg.out .bubble strong{color:#fff;}
.btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.inline-btn{
  padding:7px 14px;border:1px solid rgba(168,85,247,0.3);
  background:rgba(168,85,247,0.1);color:#fff;border-radius:9px;
  font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:all .15s;
}
.inline-btn:hover{background:rgba(168,85,247,0.25);border-color:var(--accent);}
.inline-btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  border-color:var(--accent-light);box-shadow:0 4px 14px var(--accent-glow);
}
.inline-btn.danger{
  background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.3);
  color:#FCA5A5;
}
.typing-ind{display:none;margin:2px 0 6px 4px;}
.typing-ind.show{display:flex;}
.typing-ind .dots{
  display:flex;gap:4px;padding:11px 16px;
  background:var(--bubble);border:1px solid var(--bubble-border);
  border-radius:14px;
}
.typing-ind .dots span{
  width:7px;height:7px;border-radius:50%;background:var(--accent-light);
  box-shadow:0 0 8px var(--accent-glow);
  animation:typingB 1.3s infinite ease-in-out both;
}
.typing-ind .dots span:nth-child(1){animation-delay:-0.3s;}
.typing-ind .dots span:nth-child(2){animation-delay:-0.15s;}
@keyframes typingB{
  0%,80%,100%{transform:scale(0.5);opacity:.4;}
  40%{transform:scale(1);opacity:1;}
}

.commands{
  display:flex;gap:6px;padding:8px 10px;overflow-x:auto;
  background:rgba(10,10,15,0.7);border-top:1px solid var(--divider);
  flex-shrink:0;
}
.commands::-webkit-scrollbar{height:0;}
.cmd-chip{
  padding:6px 13px;border-radius:17px;
  background:rgba(168,85,247,0.08);
  border:1px solid rgba(168,85,247,0.2);
  color:var(--accent-light);font-size:12.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  font-family:'JetBrains Mono',monospace;transition:all .15s;
}
.cmd-chip:hover{
  background:rgba(168,85,247,0.2);border-color:var(--accent);
  box-shadow:0 0 12px var(--accent-glow);
}

.input-area{
  padding:8px 10px;background:rgba(10,10,15,0.9);
  backdrop-filter:blur(14px);border-top:1px solid var(--divider);
  flex-shrink:0;
}
.input-row{display:flex;align-items:center;gap:6px;}
.input-field{
  flex:1;background:rgba(168,85,247,0.06);
  border:1px solid rgba(168,85,247,0.15);border-radius:20px;
  padding:10px 16px;color:#fff;font-size:14px;font-family:inherit;
  outline:none;min-height:40px;transition:all .15s;
}
.input-field::placeholder{color:var(--text-3);}
.input-field:focus{
  border-color:var(--accent);background:rgba(168,85,247,0.1);
  box-shadow:0 0 0 3px var(--accent-glow);
}
.send-btn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:0 4px 16px var(--accent-glow);
  transition:all .15s;
}
.send-btn:hover{transform:scale(1.05);}
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(20,18,26,0.98);
  border:1px solid rgba(168,85,247,0.3);
  color:#fff;padding:10px 20px;border-radius:12px;
  font-size:13px;font-weight:500;z-index:3000;display:none;
  max-width:90%;box-shadow:0 8px 30px rgba(168,85,247,0.25);
}
.toast.show{display:block;animation:toastIn .25s ease-out;}
@keyframes toastIn{
  from{transform:translate(-50%,10px);opacity:0;}
  to{transform:translate(-50%,0);opacity:1;}
}
.toast.error{border-color:rgba(239,68,68,0.4);}
.toast.success{border-color:rgba(74,222,128,0.4);}
.hidden-input{display:none;}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <button class="icon-btn" onclick="window.location.href='chats.html'">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="chat-info">
      <div class="chat-avatar"><i class="fas fa-robot"></i></div>
      <div class="chat-meta">
        <div class="chat-name-row">
          <div class="chat-name">BotCreator</div>
          <span class="bot-badge">BOT</span>
        </div>
        <div class="chat-sub">Your personal bot factory</div>
      </div>
    </div>
    <button class="icon-btn" onclick="quickCmd('/help')">
      <i class="fas fa-circle-question"></i>
    </button>
  </div>

  <div class="messages" id="messages">
    <div class="typing-ind" id="typingInd">
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="commands" id="cmdBar">
    <button class="cmd-chip" onclick="quickCmd('/newbot')">/newbot</button>
    <button class="cmd-chip" onclick="quickCmd('/mybots')">/mybots</button>
    <button class="cmd-chip" onclick="quickCmd('/help')">/help</button>
    <button class="cmd-chip" onclick="quickCmd('/token')">/token</button>
    <button class="cmd-chip" onclick="quickCmd('/setname')">/setname</button>
    <button class="cmd-chip" onclick="quickCmd('/setdescription')">/setdescription</button>
    <button class="cmd-chip" onclick="quickCmd('/setuserpic')">/setuserpic</button>

</div>

<div class="toast" id="toast"></div>
<input type="file" id="avatarInput" class="hidden-input" accept="image/*" />

<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:"AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
  authDomain:"aurachat-85f54.firebaseapp.com",
  projectId:"aurachat-85f54",
  storageBucket:"aurachat-85f54.firebasestorage.app",
  messagingSenderId:"539789121540",
  appId:"1:539789121540:web:96ac597e52dd0a80573d51"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const CLOUD_NAME = 'dn2mwp1lc';
const UPLOAD_PRESET = 'aura_chat';

async function uploadToCloudinary(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  fd.append('folder', 'aura_chat/bots');
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
    method:'POST', body: fd
  });
  if (!r.ok) throw new Error('Upload failed');
  const d = await r.json();
  return d.secure_url;
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let currentUserId = null;
let chatState = 'idle';
let tempBot = {};
let pendingAvatarBotId = null;

const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('msgInput');
const typingInd = $('typingInd');
const toast = $('toast');

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function showToast(m, t='') {
  toast.textContent = m;
  toast.className = 'toast show ' + t;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 2600);
}
function esc(t){if(!t)return '';const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function linkify(t) {
  return esc(t)
    .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/(@[a-zA-Z0-9_]+)/g, '<strong>$1</strong>');
}
function genToken() {
  const botId = String(Math.floor(100000000 + Math.random() * 900000000));
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-';
  let secret = '';
  for (let i = 0; i < 35; i++) secret += chars[Math.floor(Math.random() * chars.length)];
  return `${botId}:${secret}`;
}
function scrollBottom() {
  requestAnimationFrame(() => messagesEl.scrollTop = messagesEl.scrollHeight);
}
function addMsg(text, opts = {}) {
  const div = document.createElement('div');
  div.className = 'msg ' + (opts.out ? 'out' : '');
  let html = '<div class="bubble">';
  html += opts.html || linkify(text);
  if (opts.buttons) {
    html += '<div class="btn-row">';
    opts.buttons.forEach(b => {
      html += `<button class="inline-btn ${b.cls||''}" onclick="${b.onclick}">${b.label}</button>`;
    });
    html += '</div>';
  }
  html += '</div>';
  div.innerHTML = html;
  messagesEl.insertBefore(div, typingInd);
  scrollBottom();
}
function botSay(text, opts = {}, delay = 450) {
  typingInd.classList.add('show');
  scrollBottom();
  return new Promise(res => {
    setTimeout(() => {
      typingInd.classList.remove('show');
      addMsg(text, opts);
      res();
    }, delay);
  });
}
function quickCmd(c) { inputEl.value = c; sendUserMsg(); }

// ═══════════════════════════════════════════════════════════════
// COMMAND HANDLER
// ═══════════════════════════════════════════════════════════════
async function handleCommand(text) {
  const cmd = text.trim().toLowerCase();
  const args = text.trim().split(/\s+/).slice(1);

  if (cmd === '/start') {
    await botSay('', {
      html: `👋 Hello! I'm <strong>BotCreator</strong>.\n\nI create and manage bots for AURA.\n\nType <code>/newbot</code> to get started or <code>/help</code> for all commands.`
    });
    return;
  }

  if (cmd === '/help') {
    await botSay('', {
      html: `<strong>📖 BotCreator Commands</strong>

<strong>Create & Manage</strong>
<code>/newbot</code> — Create a new bot
<code>/mybots</code> — List your bots
<code>/deletebot</code> — Delete a bot

<strong>Bot Info</strong>
<code>/token</code> — Get API token
<code>/setname</code> — Change display name
<code>/setdescription</code> — Change about text
<code>/setuserpic</code> — Change profile picture
<code>/setusername</code> — Change @username
<code>/revoke</code> — Regenerate token

<strong>Developer</strong>
<code>/docs</code> — API documentation
<code>/package</code> — npm / pip install info

<em>⚠ Bots must be hosted on your own server. AURA doesn't run bots.</em>`
    }, 300);
    return;
  }

  if (cmd === '/newbot') {
    chatState = 'awaiting_bot_name';
    tempBot = {};
    await botSay(`Alright, a new bot! 🎉\n\nWhat should we call it?\n\n<em>This is the display name (2–40 chars). Emojis allowed.</em>`);
    return;
  }

  if (cmd === '/mybots') { await listMyBots(); return; }

  if (cmd === '/token') {
    if (args.length === 0) {
      await botSay('Usage: <code>/token @yourbotusername</code>\nOr use /mybots to pick one.');
      return;
    }
    await sendTokenForUsername(args[0]);
    return;
  }

  if (cmd === '/setname') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'setname';
    await pickBotForEdit('Choose a bot to rename:');
    return;
  }
  if (cmd === '/setdescription') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'setdescription';
    await pickBotForEdit('Choose a bot to change the about text:');
    return;
  }
  if (cmd === '/setuserpic') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'setuserpic';
    await pickBotForEdit('Choose a bot to change profile picture:');
    return;
  }
  if (cmd === '/setusername') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'setusername';
    await pickBotForEdit('Choose a bot to rename @username:');
    return;
  }
  if (cmd === '/revoke') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'revoke';
    await pickBotForEdit('Choose a bot to revoke token:');
    return;
  }
  if (cmd === '/deletebot') {
    chatState = 'awaiting_bot_to_edit'; tempBot.editAction = 'deletebot';
    await pickBotForEdit('Choose a bot to delete:');
    return;
  }

  if (cmd === '/docs') {
    await botSay('', {
      html: `<strong>📚 AURA Bot API</strong>

Base URL: <code>https://your-app.vercel.app/api/bot/&lt;TOKEN&gt;</code>

<strong>Endpoints</strong>
<code>GET  /getMe</code>
<code>GET  /getUpdates?offset=&lt;ts&gt;</code>
<code>POST /sendMessage</code>
<code>POST /sendPhoto</code>
<code>POST /setWebhook</code>

<strong>Packages</strong>
• Node: <code>npm i aura-bot-api</code>
• Python: <code>pip install aura-bot</code>

<a href="bot_docs.html">Open full docs →</a>`
    }, 400);
    return;
  }

  if (cmd === '/package') {
    await botSay('', {
      html: `<strong>📦 Install the SDK</strong>

<strong>Node.js</strong>
<pre>npm install aura-bot-api

const AuraBot = require('aura-bot-api');
const bot = new AuraBot('YOUR_TOKEN');

bot.on('message', msg => {
  bot.sendMessage(msg.chat.id, 'Hi!');
});

bot.start();</pre>

<strong>Python</strong>
<pre>pip install aura-bot

from aura_bot import Bot
bot = Bot('YOUR_TOKEN')

@bot.message()
def handle(msg):
    bot.send_message(msg['chat']['id'], 'Hi!')

bot.run()</pre>

<a href="bot_docs.html">Full documentation →</a>`
    }, 400);
    return;
  }

  await botSay('Unknown command. Try /help');
}

// ═══════════════════════════════════════════════════════════════
// TOKEN LOOKUP BY USERNAME
// ═══════════════════════════════════════════════════════════════
async function sendTokenForUsername(raw) {
  const uname = raw.replace(/^@/, '');
  const snap = await db.collection('bots')
    .where('username', '==', uname)
    .where('owner_id', '==', currentUserId)
    .limit(1).get();

  if (snap.empty) {
    await botSay(`❌ You don't own a bot with username @${uname}`);
    return;
  }

  const b = snap.docs[0].data();
  await botSay('', {
    html: `<strong>🔑 Token for @${b.username}</strong>

<pre>${b.token}</pre>

<em style="color:#EF4444;">⚠ Keep this secret!</em>

Host your bot using <code>npm i aura-bot-api</code> or <code>pip install aura-bot</code>.

<a href="bot_docs.html">Read the docs →</a>`,
    buttons: [
      { label: '🤖 Open Bot', cls: 'primary', onclick: `location.href='bot_profile.html?id=${snap.docs[0].id}'` }
    ]
  });
}

// ═══════════════════════════════════════════════════════════════
// BOT CREATION FLOW
// ═══════════════════════════════════════════════════════════════
async function handleBotName(name) {
  if (name.length < 2 || name.length > 40) {
    await botSay('Name must be 2–40 characters. Try again:');
    return;
  }
  tempBot.name = name;
  chatState = 'awaiting_bot_username';
  await botSay(`Nice! Now choose an <strong>@username</strong>.\n\n<em>Rules: 4–31 chars, starts with letter, letters/numbers/underscore, must end in "bot".</em>\n\n<em>Example: @MyCoolBot</em>`);
}

async function handleBotUsername(raw) {
  const uname = raw.trim().replace(/^@/, '');
  if (!/^[a-zA-Z][a-zA-Z0-9_]{3,30}$/.test(uname)) {
    await botSay('Invalid format. Must be 4–31 chars, start with letter. Try again:');
    return;
  }
  if (!uname.toLowerCase().endsWith('bot')) {
    await botSay('❌ Username must end in "bot". Try again:');
    return;
  }

  const exists = await db.collection('bots').where('username','==',uname).limit(1).get();
  if (!exists.empty) {
    await botSay(`❌ @${uname} is taken. Try another:`);
    return;
  }

  tempBot.username = uname;
  const token = genToken();

  try {
    const botRef = db.collection('bots').doc();
    const botData = {
      id: botRef.id,
      owner_id: currentUserId,
      name: tempBot.name,
      username: uname,
      about: '',
      avatar_url: null,
      token: token,
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
      is_public: true,
      type: 'bot',
      subscribers: 0,
      commands: ['/start','/help']
    };
    await botRef.set(botData);

    await db.collection('chats').doc(botRef.id).set({
      id: botRef.id,
      type: 'bot',
      name: tempBot.name,
      username: uname,
      about: '',
      avatar_url: null,
      owner_id: currentUserId,
      participants: [currentUserId],
      participants_data: { [currentUserId]: { role: 'owner' } },
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
      last_message: 'Bot created',
      last_message_at: firebase.firestore.FieldValue.serverTimestamp()
    });

    chatState = 'awaiting_bot_about';
    tempBot.id = botRef.id;
    tempBot.token = token;

    await botSay('', {
      html: `<strong>🎉 Bot created!</strong>

You can find it at <code>@${uname}</code>.

<strong>🔑 API Token:</strong>
<pre>${token}</pre>

<em style="color:#EF4444;">⚠ Keep this secret. Anyone with this token controls your bot.</em>

Now send a short <strong>description</strong> — or tap Skip.`,
      buttons: [{ label: 'Skip', cls: '', onclick: 'skipAbout()' }]
    }, 500);
  } catch (e) {
    console.error(e);
    await botSay('❌ Failed to create bot: ' + e.message);
    chatState = 'idle';
  }
}

async function skipAbout() {
  chatState = 'awaiting_bot_avatar';
  await botSay('Now send a <strong>profile picture</strong> — or tap Skip.', {
    buttons: [{ label: 'Skip', cls: '', onclick: 'skipAvatar()' }]
  });
}

async function skipAvatar() {
  chatState = 'idle';
  await botSay('', {
    html: `<strong>✅ Your bot is ready!</strong>

<strong>@${tempBot.username}</strong>
Token: <code>${tempBot.token.slice(0,12)}...</code>

<strong>Next steps</strong>
1. Copy the token
2. Install: <code>npm i aura-bot-api</code>
3. Deploy to your server

<strong>Try</strong>
/token @${tempBot.username}
/setdescription
/setuserpic
/mybots

Happy building! 🚀`,
    buttons: [
      { label: '📖 View Docs', cls: 'primary', onclick: `location.href='bot_docs.html'` },
      { label: '🤖 Open Bot', cls: '', onclick: `location.href='bot_profile.html?id=${tempBot.id}'` }
    ]
  });
  tempBot = {};
}

async function handleBotAbout(text) {
  if (text.length > 200) {
    await botSay('Too long (max 200). Try again or tap Skip:');
    return;
  }
  try {
    await db.collection('bots').doc(tempBot.id).update({ about: text });
    await db.collection('chats').doc(tempBot.id).update({ about: text });
    chatState = 'awaiting_bot_avatar';
    await botSay('✅ Saved!\n\nNow send a <strong>profile picture</strong> — or tap Skip.', {
      buttons: [{ label: 'Skip', cls: '', onclick: 'skipAvatar()' }]
    });
  } catch (e) {
    await botSay('❌ Failed to save.');
    chatState = 'idle';
  }
}

// ═══════════════════════════════════════════════════════════════
// LIST + EDIT
// ═══════════════════════════════════════════════════════════════
async function listMyBots() {
  const snap = await db.collection('bots')
    .where('owner_id','==',currentUserId)
    .orderBy('created_at','desc').get();

  if (snap.empty) {
    await botSay("You don't have any bots yet. Use /newbot to create one!");
    return;
  }

  let html = `<strong>Your bots (${snap.size}):</strong>\n\n`;
  const buttons = [];
  snap.forEach((doc, i) => {
    const b = doc.data();
    html += `${i+1}. <strong>${esc(b.name)}</strong> — @${b.username}\n`;
    buttons.push({
      label: '@' + b.username,
      cls: 'primary',
      onclick: `location.href='bot_profile.html?id=${doc.id}'`
    });
  });
  await botSay('', { html, buttons });
}

async function pickBotForEdit(prompt) {
  const snap = await db.collection('bots')
    .where('owner_id','==',currentUserId)
    .orderBy('created_at','desc').get();

  if (snap.empty) {
    await botSay('No bots found. Create one with /newbot first.');
    chatState = 'idle';
    return;
  }

  const buttons = snap.docs.map(doc => {
    const b = doc.data();
    return {
      label: '@' + b.username,
      cls: 'primary',
      onclick: `selectBot('${doc.id}','${b.username}')`
    };
  });
  await botSay(prompt, { buttons });
}

async function selectBot(botId, username) {
  const doc = await db.collection('bots').doc(botId).get();
  if (!doc.exists) { await botSay('Bot not found.'); return; }
  tempBot.id = botId;
  tempBot.username = username;

  const action = tempBot.editAction;

  if (action === 'setname') {
    chatState = 'awaiting_edit_name';
    await botSay(`OK. Send the new <strong>name</strong> for @${username}`);
  } else if (action === 'setdescription') {
    chatState = 'awaiting_edit_about';
    await botSay(`OK. Send the new <strong>About</strong> text (max 200) for @${username}`);
  } else if (action === 'setuserpic') {
    chatState = 'awaiting_edit_avatar';
    pendingAvatarBotId = botId;
    await botSay(`OK. Send a new <strong>profile picture</strong> for @${username}`);
    setTimeout(() => $('avatarInput').click(), 400);
  } else if (action === 'setusername') {
    chatState = 'awaiting_edit_username';
    await botSay('OK. Send the new <strong>@username</strong> (must end in "bot").');
  } else if (action === 'revoke') {
    const newToken = genToken();
    await db.collection('bots').doc(botId).update({ token: newToken });
    await botSay('', {
      html: `🔐 <strong>Token revoked</strong> for @${username}\n\n<strong>New token:</strong>\n<pre>${newToken}</pre>\nYour old token is now invalid.`
    });
    chatState = 'idle';
    tempBot = {};
  } else if (action === 'deletebot') {
    chatState = 'awaiting_delete_confirm';
    await botSay('', {
      html: `⚠️ Delete <strong>@${username}</strong>?\n\n<em>This cannot be undone.</em>`,
      buttons: [
        { label: 'Yes, delete', cls: 'danger', onclick: `confirmDeleteBot('${botId}')` },
        { label: 'Cancel', cls: '', onclick: 'cancelDelete()' }
      ]
    });
  }
}

async function confirmDeleteBot(botId) {
  try {
    await db.collection('bots').doc(botId).delete();
    try { await db.collection('chats').doc(botId).delete(); } catch(e){}
    await botSay('🗑 Bot deleted.');
  } catch (e) {
    await botSay('Failed to delete.');
  }
  chatState = 'idle';
  tempBot = {};
}

async function cancelDelete() {
  await botSay('Cancelled.');
  chatState = 'idle';
  tempBot = {};
}

async function handleEditName(name) {
  if (name.length < 2 || name.length > 40) { await botSay('2–40 chars. Try again:'); return; }
  await db.collection('bots').doc(tempBot.id).update({ name });
  await db.collection('chats').doc(tempBot.id).update({ name });
  await botSay(`✅ Name changed to "${name}".`);
  chatState = 'idle'; tempBot = {};
}

async function handleEditAbout(text) {
  if (text.length > 200) { await botSay('Max 200 chars. Try again:'); return; }
  await db.collection('bots').doc(tempBot.id).update({ about: text });
  await db.collection('chats').doc(tempBot.id).update({ about: text });
  await botSay('✅ About text updated.');
  chatState = 'idle'; tempBot = {};
}

async function handleEditUsername(raw) {
  const uname = raw.trim().replace(/^@/, '');
  if (!/^[a-zA-Z][a-zA-Z0-9_]{3,30}$/.test(uname) || !uname.toLowerCase().endsWith('bot')) {
    await botSay('Invalid. Must end in "bot". Try again:');
    return;
  }
  const exists = await db.collection('bots').where('username','==',uname).limit(1).get();
  if (!exists.empty && exists.docs[0].id !== tempBot.id) {
    await botSay(`❌ @${uname} is taken. Try another:`);
    return;
  }
  await db.collection('bots').doc(tempBot.id).update({ username: uname });
  await db.collection('chats').doc(tempBot.id).update({ username: uname });
  await botSay(`✅ Username changed to @${uname}.`);
  chatState = 'idle'; tempBot = {};
}

// ═══════════════════════════════════════════════════════════════
// AVATAR UPLOAD
// ═══════════════════════════════════════════════════════════════
$('avatarInput').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  e.target.value = '';
  const botId = pendingAvatarBotId || tempBot.id;
  if (!botId) { showToast('No bot selected', 'error'); return; }

  showToast('Uploading...');
  try {
    const url = await uploadToCloudinary(f);
    await db.collection('bots').doc(botId).update({ avatar_url: url });
    await db.collection('chats').doc(botId).update({ avatar_url: url });
    showToast('✅ Picture set!', 'success');

    if (chatState === 'awaiting_bot_avatar') {
      await skipAvatar();
    } else {
      await botSay('✅ Profile picture updated.');
      chatState = 'idle'; tempBot = {}; pendingAvatarBotId = null;
    }
  } catch (err) {
    console.error(err);
    showToast('Upload failed', 'error');
  }
});

// ═══════════════════════════════════════════════════════════════
// INPUT ROUTER
// ═══════════════════════════════════════════════════════════════
async function sendUserMsg() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addMsg(text, { out: true });

  if (chatState === 'awaiting_bot_name') await handleBotName(text);
  else if (chatState === 'awaiting_bot_username') await handleBotUsername(text);
  else if (chatState === 'awaiting_bot_about') await handleBotAbout(text);
  else if (chatState === 'awaiting_edit_name') await handleEditName(text);
  else if (chatState === 'awaiting_edit_about') await handleEditAbout(text);
  else if (chatState === 'awaiting_edit_username') await handleEditUsername(text);
  else if (chatState === 'awaiting_bot_avatar') await botSay('Please send an image file, or tap Skip.');
  else if (text.startsWith('/')) await handleCommand(text);
  else await botSay('I only understand commands. Try /help');
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function checkAuth() {
  const uid = localStorage.getItem('mock_user_id');
  if (uid) { currentUserId = uid; return true; }
  if (auth.currentUser) {
    currentUserId = auth.currentUser.uid;
    localStorage.setItem('mock_user_id', currentUserId);
    return true;
  }
  return false;
}

async function init() {
  if (!checkAuth()) { location.href = 'email_verification.html'; return; }

  const editData = sessionStorage.getItem('edit_bot');
  if (editData) {
    try {
      const { id, username } = JSON.parse(editData);
      sessionStorage.removeItem('edit_bot');
      await botSay(`👋 Welcome back! Manage <strong>@${username}</strong>:`, {
        buttons: [
          { label: '📝 Name', cls: '', onclick: `quickCmd('/setname')` },
          { label: '📄 About', cls: '', onclick: `quickCmd('/setdescription')` },
          { label: '🖼 Pic', cls: '', onclick: `quickCmd('/setuserpic')` },
          { label: '🔐 Revoke', cls: '', onclick: `quickCmd('/revoke')` },
          { label: '🔑 Token', cls: 'primary', onclick: `quickCmd('/token @${username}')` },
          { label: '🗑 Delete', cls: 'danger', onclick: `quickCmd('/deletebot')` }
        ]
      }, 500);
      return;
    } catch(e) {}
  }

  await botSay('', {
    html: `👋 Welcome to <strong>BotCreator</strong>!

I create and manage bots for AURA.

Type <code>/newbot</code> to get started — or <code>/help</code> for all commands.`
  }, 500);
}

document.addEventListener('DOMContentLoaded', () => {
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUserId = user.uid;
      localStorage.setItem('mock_user_id', currentUserId);
      init();
    } else {
      const uid = localStorage.getItem('mock_user_id');
      if (uid) { currentUserId = uid; init(); }
      else location.href = 'email_verification.html';
    }
  });
});
</script>
