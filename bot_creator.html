<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BotCreator</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0A0A0F;
    color: #fff;
    overflow: hidden;
}
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 10px; }

#app {
    height: 100vh; height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex; flex-direction: column;
    background:
        radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
        #0A0A0F;
    overflow: hidden;
}

.header {
    padding: 8px 12px;
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
    background: rgba(10, 10, 15, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    min-height: 52px;
}
.back-btn {
    background: none; border: none; color: #fff; font-size: 18px;
    padding: 6px; cursor: pointer; border-radius: 50%;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
}
.chat-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.chat-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #fff; overflow: hidden;
    flex-shrink: 0;
}
.chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
.chat-name {
    font-weight: 700; font-size: 15px; color: #fff;
    display: flex; align-items: center; gap: 6px;
}
.bot-badge {
    font-size: 9px; font-weight: 800;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    padding: 2px 6px; border-radius: 4px;
    letter-spacing: 0.5px;
}
.chat-status {
    font-size: 10px; color: rgba(255,255,255,0.4);
    margin-top: 1px;
}
.header-actions button {
    background: none; border: none; color: rgba(255,255,255,0.6);
    font-size: 18px; padding: 6px; cursor: pointer;
    border-radius: 50%; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
}

.messages-container {
    flex: 1; overflow-y: auto;
    padding: 10px 12px 6px 12px;
    display: flex; flex-direction: column;
    gap: 3px;
    min-height: 0;
}
.messages-container::-webkit-scrollbar { width: 3px; }

.msg-wrapper {
    display: flex;
    width: 100%;
    margin-bottom: 2px;
}
.msg-wrapper.out { justify-content: flex-end; }

.msg-bubble {
    max-width: 85%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 14px;
    padding: 10px 13px;
    font-size: 13.5px;
    line-height: 1.5;
    color: #fff;
    word-wrap: break-word;
    white-space: pre-wrap;
}
.msg-wrapper.out .msg-bubble {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(6, 182, 212, 0.2));
    border-color: rgba(139, 92, 246, 0.2);
}
.msg-bubble a { color: #8B5CF6; text-decoration: underline; }
.msg-bubble strong { color: #fff; font-weight: 700; }
.msg-bubble em {
    color: rgba(255,255,255,0.5);
    font-style: normal;
    font-size: 12.5px;
}
.msg-bubble code {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(139, 92, 246, 0.15);
    color: #C4B5FD;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
}
.msg-wrapper.out .msg-bubble code {
    background: rgba(0,0,0,0.25);
    color: #fff;
}
.msg-bubble pre {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(139, 92, 246, 0.15);
    padding: 10px 12px;
    border-radius: 8px;
    margin: 6px 0;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    line-height: 1.5;
    color: #D8B4FE;
    white-space: pre;
}
.msg-bubble .sent-image {
    display: block;
    margin: -4px -8px 6px -8px;
    border-radius: 12px;
    overflow: hidden;
    max-height: 240px;
}
.msg-bubble .sent-image img {
    width: 100%; max-height: 240px;
    object-fit: cover; display: block;
}

.btn-row {
    display: flex; flex-wrap: wrap;
    gap: 6px; margin-top: 8px;
}
.inline-btn {
    padding: 7px 14px;
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: #fff;
    border-radius: 9px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
}
.inline-btn:hover { background: rgba(139, 92, 246, 0.25); }
.inline-btn.primary {
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    border-color: transparent;
}
.inline-btn.danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.3);
    color: #FCA5A5;
}

.typing-wrap {
    display: none;
    margin: 4px 0 6px 0;
}
.typing-wrap.show { display: flex; }
.typing-bubble {
    display: flex; align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
}
.typing-bubble .dots { display: flex; gap: 4px; }
.typing-bubble .dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #8B5CF6;
    animation: typingB 1.3s infinite ease-in-out both;
}
.typing-bubble .dots span:nth-child(1) { animation-delay: -0.3s; }
.typing-bubble .dots span:nth-child(2) { animation-delay: -0.15s; }
@keyframes typingB {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
}

.media-preview {
    display: none;
    padding: 6px 12px 0 12px;
}
.media-preview.show { display: block; }
.media-preview .box {
    display: flex; align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: rgba(139, 92, 246, 0.08);
    border: 1px solid rgba(139, 92, 246, 0.2);
    border-radius: 10px;
}
.media-preview .thumb {
    width: 42px; height: 42px;
    border-radius: 8px;
    overflow: hidden;
    background: rgba(0,0,0,0.3);
    flex-shrink: 0;
}
.media-preview .thumb img { width: 100%; height: 100%; object-fit: cover; }
.media-preview .info { flex: 1; min-width: 0; }
.media-preview .info .name {
    font-size: 12.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.media-preview .info .size {
    font-size: 11px; color: rgba(255,255,255,0.4);
    margin-top: 1px;
}
.media-preview .cancel {
    background: none; border: none;
    color: rgba(255,255,255,0.4);
    font-size: 15px; cursor: pointer;
    padding: 4px;
}

.commands-bar {
    display: flex; gap: 6px;
    padding: 8px 12px;
    overflow-x: auto;
    background: rgba(10, 10, 15, 0.9);
    border-top: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
}
.commands-bar::-webkit-scrollbar { height: 0; }
.cmd-chip {
    padding: 6px 12px;
    background: rgba(139, 92, 246, 0.08);
    border: 1px solid rgba(139, 92, 246, 0.2);
    color: #C4B5FD;
    border-radius: 16px;
    font-size: 11.5px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
}
.cmd-chip:hover {
    background: rgba(139, 92, 246, 0.2);
    border-color: #8B5CF6;
}

.input-area {
    padding: 8px 12px;
    background: rgba(10, 10, 15, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
}
.input-row { display: flex; align-items: center; gap: 6px; }
.attach-btn {
    width: 38px; height: 38px;
    border-radius: 50%; border: none;
    background: rgba(139, 92, 246, 0.1);
    color: #8B5CF6;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
}
.attach-btn:hover { background: rgba(139, 92, 246, 0.2); }
.input-field {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid transparent;
    border-radius: 18px;
    padding: 9px 14px;
    color: #fff;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    min-height: 38px;
}
.input-field::placeholder { color: rgba(255,255,255,0.25); }
.input-field:focus { border-color: rgba(139, 92, 246, 0.5); }
.send-btn {
    width: 38px; height: 38px;
    border-radius: 50%; border: none;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    color: #fff; font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}

.toast {
    position: fixed;
    bottom: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 16, 60, 0.98);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: #fff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 12.5px;
    z-index: 3000;
    display: none;
    max-width: 90%;
    text-align: center;
}
.toast.show { display: block; }
.toast.error { border-color: rgba(239, 68, 68, 0.4); }
.toast.success { border-color: rgba(74, 222, 128, 0.4); }

.hidden { display: none; }

@media (max-width: 480px) {
    .msg-bubble { max-width: 90%; font-size: 13px; }
    .messages-container { padding: 8px 10px; }
}
</style>
</head>
<body>

<div id="app">
    <div class="header">
        <button class="back-btn" onclick="window.location.href='chats.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="chat-info">
            <div class="chat-avatar"><i class="fas fa-robot"></i></div>
            <div style="flex:1;min-width:0;">
                <div class="chat-name">
                    BotCreator
                    <span class="bot-badge">BOT</span>
                </div>
                <div class="chat-status" id="statusText">Your bot factory</div>
            </div>
        </div>
        <div class="header-actions">
            <button onclick="quickCmd('/help')">
                <i class="fas fa-circle-question"></i>
            </button>
        </div>
    </div>

    <div class="messages-container" id="messages">
        <div class="typing-wrap" id="typingWrap">
            <div class="typing-bubble">
                <div class="dots"><span></span><span></span><span></span></div>
            </div>
        </div>
    </div>

    <div class="media-preview" id="mediaPreview">
        <div class="box">
            <div class="thumb" id="mediaThumb"></div>
            <div class="info">
                <div class="name" id="mediaName">image.jpg</div>
                <div class="size" id="mediaSize">0 KB</div>
            </div>
            <button class="cancel" onclick="clearMedia()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <div class="commands-bar">
        <button class="cmd-chip" onclick="quickCmd('/newbot')">/newbot</button>
        <button class="cmd-chip" onclick="quickCmd('/mybots')">/mybots</button>
        <button class="cmd-chip" onclick="quickCmd('/token')">/token</button>
        <button class="cmd-chip" onclick="quickCmd('/setname')">/setname</button>
        <button class="cmd-chip" onclick="quickCmd('/setdescription')">/setdescription</button>
        <button class="cmd-chip" onclick="quickCmd('/setuserpic')">/setuserpic</button>
        <button class="cmd-chip" onclick="quickCmd('/setusername')">/setusername</button>
        <button class="cmd-chip" onclick="quickCmd('/revoke')">/revoke</button>
        <button class="cmd-chip" onclick="quickCmd('/deletebot')">/deletebot</button>
        <button class="cmd-chip" onclick="quickCmd('/docs')">/docs</button>
        <button class="cmd-chip" onclick="quickCmd('/package')">/package</button>
    </div>

    <div class="input-area">
        <div class="input-row">
            <button class="attach-btn" onclick="pickImage()">
                <i class="fas fa-image"></i>
            </button>
            <input class="input-field" id="msgInput" placeholder="Type a command..."
                   onkeydown="if(event.key==='Enter')sendUserMsg()" autocomplete="off" />
            <button class="send-btn" onclick="sendUserMsg()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="imageInput" class="hidden" accept="image/*" />
<input type="file" id="cameraInput" class="hidden" accept="image/*" capture="environment" />

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
    authDomain: "aurachat-85f54.firebaseapp.com",
    projectId: "aurachat-85f54",
    storageBucket: "aurachat-85f54.firebasestorage.app",
    messagingSenderId: "539789121540",
    appId: "1:539789121540:web:96ac597e52dd0a80573d51"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const CLOUD_NAME = 'dn2mwp1lc';
const UPLOAD_PRESET = 'aura_chat';

async function uploadToCloudinary(file) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    fd.append('folder', 'aura_chat/bots');

    const url = 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload';
    const response = await fetch(url, { method: 'POST', body: fd });
    if (!response.ok) {
        const t = await response.text();
        throw new Error('Cloudinary ' + response.status + ': ' + t);
    }
    const data = await response.json();
    if (!data.secure_url) throw new Error('No URL returned');
    return data.secure_url;
}

let currentUserId = null;
let chatState = 'idle';
let tempBot = {};
let pendingMedia = null;
let bcChatId = null;
let bcUnsub = null;
let bcLoaded = false;

const $ = function(id) { return document.getElementById(id); };
const messagesEl = $('messages');
const inputEl = $('msgInput');
const typingWrap = $('typingWrap');
const toast = $('toast');
const statusText = $('statusText');

function showToast(m, t) {
    toast.textContent = m;
    toast.className = 'toast show ' + (t || '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function() { toast.classList.remove('show'); }, 2400);
}

function esc(t) {
    if (!t) return '';
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
}

function linkify(t) {
    if (!t) return '';
    return esc(t)
        .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')
        .replace(/(@[a-zA-Z0-9_]+)/g, '<strong>$1</strong>');
}

function genToken() {
    const botId = String(Math.floor(100000000 + Math.random() * 900000000));
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-';
    let secret = '';
    for (let i = 0; i < 35; i++) secret += chars[Math.floor(Math.random() * chars.length)];
    return botId + ':' + secret;
}

function scrollBottom() {
    requestAnimationFrame(function() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    });
}

function formatSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
}

function addMsg(text, opts) {
    opts = opts || {};
    const div = document.createElement('div');
    div.className = 'msg-wrapper ' + (opts.out ? 'out' : '');
    let html = '<div class="msg-bubble">';
    if (opts.imageUrl) {
        html += '<div class="sent-image"><img src="' + opts.imageUrl + '" /></div>';
    }
    if (opts.html) html += opts.html;
    else if (text) html += linkify(text);
    if (opts.buttons) {
        html += '<div class="btn-row">';
        opts.buttons.forEach(function(b) {
            html += '<button class="inline-btn ' + (b.cls || '') + '" onclick="' + b.onclick + '">' + b.label + '</button>';
        });
        html += '</div>';
    }
    html += '</div>';
    div.innerHTML = html;
    messagesEl.insertBefore(div, typingWrap);
    scrollBottom();
}

async function bcEnsureChat() {
    bcChatId = 'botcreator_' + currentUserId;
    const ref = db.collection('chats').doc(bcChatId);
    const snap = await ref.get();
    if (!snap.exists) {
        await ref.set({
            id: bcChatId,
            type: 'bot',
            subtype: 'botcreator',
            name: 'BotCreator',
            username: 'BotCreator',
            about: 'Your personal bot factory',
            avatar_url: null,
            owner_id: currentUserId,
            participants: [currentUserId],
            participants_data: {},
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
            last_message: 'Bot factory',
            last_message_at: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
}

async function bcSaveMsg(sender, text, html, extra) {
    if (!bcChatId) return;
    extra = extra || {};
    try {
        const ref = db.collection('chats').doc(bcChatId).collection('messages').doc();
        await ref.set({
            id: ref.id,
            sender_id: sender === 'user' ? currentUserId : 'botcreator',
            sender_name: sender === 'user' ? 'You' : 'BotCreator',
            text: text || null,
            content: text || null,
            html: html || null,
            media_url: extra.media_url || null,
            media_type: extra.media_type || null,
            created_at: firebase.firestore.FieldValue.serverTimestamp()
        });

        let preview;
        if (sender === 'user') {
            if (extra.media_type === 'image') preview = '📷 Photo';
            else preview = (text || '').slice(0, 60);
        } else {
            const plain = (text || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
            preview = plain.slice(0, 60) || 'Reply';
        }

        await db.collection('chats').doc(bcChatId).update({
            last_message: preview,
            last_message_at: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch(e) { console.error('bcSaveMsg error:', e); }
}

async function bcLoadHistory() {
    if (!bcChatId) return false;
    const snap = await db.collection('chats').doc(bcChatId)
        .collection('messages')
        .orderBy('created_at', 'asc')
        .limit(300)
        .get();

    messagesEl.querySelectorAll('.msg-wrapper').forEach(function(el) { el.remove(); });

    if (snap.empty) return false;

    snap.forEach(function(doc) {
        const m = doc.data();
        const opts = {};
        if (m.sender_id === currentUserId) opts.out = true;
        if (m.html) opts.html = m.html;
        else if (m.text) opts.html = linkify(m.text);
        if (m.media_url) opts.imageUrl = m.media_url;
        addMsg('', opts);
    });
    scrollBottom();
    return true;
}

function botSay(text, opts, delay) {
    opts = opts || {};
    delay = delay || 420;
    typingWrap.classList.add('show');
    scrollBottom();
    return new Promise(function(res) {
        setTimeout(async function() {
            typingWrap.classList.remove('show');
            addMsg(text, opts);
            await bcSaveMsg('bot', text, opts.html || null);
            res();
        }, delay);
    });
}

function quickCmd(c) {
    inputEl.value = c;
    sendUserMsg();
}

function setStatus(t) {
    statusText.textContent = t;
}

function pickImage() {
    if (chatState === 'awaiting_bot_avatar' || chatState === 'awaiting_edit_avatar') {
        const useCamera = confirm('Use camera? Tap Cancel for gallery.');
        if (useCamera) $('cameraInput').click();
        else $('imageInput').click();
    } else {
        $('imageInput').click();
    }
}

$('imageInput').addEventListener('change', handleImagePicked);
$('cameraInput').addEventListener('change', handleImagePicked);

function handleImagePicked(e) {
    const f = e.target.files[0];
    if (!f) return;
    e.target.value = '';
    pendingMedia = {
        file: f,
        name: f.name,
        size: f.size,
        previewUrl: URL.createObjectURL(f)
    };
    $('mediaThumb').innerHTML = '<img src="' + pendingMedia.previewUrl + '" />';
    $('mediaName').textContent = pendingMedia.name;
    $('mediaSize').textContent = formatSize(pendingMedia.size);
    $('mediaPreview').classList.add('show');
}

function clearMedia() {
    if (pendingMedia && pendingMedia.previewUrl) URL.revokeObjectURL(pendingMedia.previewUrl);
    pendingMedia = null;
    $('mediaPreview').classList.remove('show');
}

async function handleCommand(text) {
    const cmd = text.trim().toLowerCase();
    const args = text.trim().split(/\s+/).slice(1);

    if (cmd === '/start') {
        await botSay('', {
            html: '👋 Hello! I\'m <strong>BotCreator</strong>.\n\nI can help you create and manage bots for AURA.\n\nType <code>/newbot</code> to get started, or <code>/help</code> for all commands.'
        });
        return;
    }

    if (cmd === '/help') {
        await botSay('', {
            html: '<strong>📖 BotCreator Commands</strong>\n\n<strong>Create & Manage</strong>\n<code>/newbot</code> — Create a new bot\n<code>/mybots</code> — List your bots\n<code>/deletebot</code> — Delete a bot\n\n<strong>Bot Settings</strong>\n<code>/token</code> — Get API token\n<code>/setname</code> — Change display name\n<code>/setdescription</code> — Change about text\n<code>/setuserpic</code> — Change profile picture\n<code>/setusername</code> — Change @username\n<code>/revoke</code> — Regenerate token\n\n<strong>Developer</strong>\n<code>/docs</code> — API documentation\n<code>/package</code> — npm / pip install'
        }, 300);
        return;
    }

    if (cmd === '/newbot') {
        chatState = 'awaiting_bot_name';
        tempBot = {};
        setStatus('Creating a bot...');
        await botSay('Alright, a new bot! 🎉\n\nWhat should we call it?\n\n<em>Display name (2–40 chars). Emojis allowed.</em>');
        return;
    }

    if (cmd === '/mybots') { await listMyBots(); return; }

    if (cmd === '/token') {
        if (args.length === 0) {
            await botSay('Usage: <code>/token @yourbotusername</code>\nOr use /mybots to pick one.');
            return;
        }
        await sendTokenForUsername(args[0]);
        return;
    }

    if (cmd === '/setname') {
        chatState = 'awaiting_bot_to_edit';
        tempBot.editAction = 'setname';
        await pickBotForEdit('Choose a bot to rename:');
        return;
    }

    if (cmd === '/setdescription') {
        chatState = 'awaiting_bot_to_edit';
        tempBot.editAction = 'setdescription';
        await pickBotForEdit('Choose a bot to change about text:');
        return;
    }

    if (cmd === '/setuserpic') {
        chatState = 'awaiting_bot_to_edit';
        tempBot.editAction = 'setuserpic';
        await pickBotForEdit('Choose a bot to change profile picture:');
        return;
    }

    if (cmd === '/setusername') {
        chatState = 'awaiting_bot_to_edit';
        tempBot.editAction = 'setusername';
        await pickBotForEdit('Choose a bot to rename @username:');
        return;
    }

    if (cmd === '/revoke') {
        chatState = 'awaiting_bot_to_edit';
        tempBot.editAction = 'revoke';
        await pickBotForEdit('Choose a bot to regenerate its token:');
        return;
    }

    if (cmd === '/deletebot') {
        chatState = 'awaiting_bot_to_edit';
        tempBot.editAction = 'deletebot';
        await pickBotForEdit('Choose a bot to delete:');
        return;
    }

    if (cmd === '/docs') {
        await botSay('', {
            html: '<strong>📚 AURA Bot API</strong>\n\nBase URL: <code>/api/bot/&lt;TOKEN&gt;</code>\n\n<strong>Endpoints</strong>\n<code>GET  /getMe</code>\n<code>GET  /getUpdates</code>\n<code>POST /sendMessage</code>\n<code>POST /sendPhoto</code>\n<code>POST /setWebhook</code>\n\n<strong>Packages</strong>\n• Node: <code>npm i aura-bot-api</code>\n• Python: <code>pip install aura-bot</code>\n\n<a href="bot_docs.html">Open full documentation →</a>'
        }, 400);
        return;
    }

    if (cmd === '/package') {
        await botSay('', {
            html: '<strong>📦 Install the SDK</strong>\n\n<strong>Node.js</strong>\n<pre>npm install aura-bot-api\n\nconst AuraBot = require(\'aura-bot-api\');\nconst bot = new AuraBot(\'YOUR_TOKEN\');\n\nbot.on(\'message\', msg => {\n  bot.sendMessage(msg.chat.id, \'Hi!\');\n});\n\nbot.start();</pre>\n\n<strong>Python</strong>\n<pre>pip install aura-bot\n\nfrom aura_bot import Bot\nbot = Bot(\'YOUR_TOKEN\')\n\n@bot.message()\ndef handle(msg):\n    bot.send_message(msg[\'chat\'][\'id\'], \'Hi!\')\n\nbot.run()</pre>\n\n<a href="bot_docs.html">Full docs →</a>'
        }, 400);
        return;
    }

    await botSay('Unknown command. Try /help');
}

async function sendTokenForUsername(raw) {
    const uname = raw.replace(/^@/, '');
    const snap = await db.collection('bots')
        .where('username', '==', uname)
        .where('owner_id', '==', currentUserId)
        .limit(1).get();

    if (snap.empty) {
        await botSay('❌ You don\'t own a bot with username @' + uname);
        return;
    }

    const b = snap.docs[0].data();
    await botSay('', {
        html: '<strong>🔑 Token for @' + b.username + '</strong>\n\n<pre>' + b.token + '</pre>\n\n<em>⚠ Keep this secret.</em>\n\nHost your bot with <code>npm i aura-bot-api</code> or <code>pip install aura-bot</code>.\n\n<a href="bot_docs.html">Read the docs →</a>',
        buttons: [
            { label: 'Open Bot', cls: 'primary', onclick: 'location.href=\'bot_profile.html?id=' + snap.docs[0].id + '\'' }
        ]
    });
}

async function handleBotName(name) {
    if (name.length < 2 || name.length > 40) {
        await botSay('Name must be 2–40 characters. Try again:');
        return;
    }
    tempBot.name = name;
    chatState = 'awaiting_bot_username';
    await botSay('Nice! Now choose an <strong>@username</strong>.\n\n<em>Rules: 4–31 chars, starts with letter, letters/numbers/underscore, must end in "bot".</em>\n\n<em>Example: @MyCoolBot</em>');
}

async function handleBotUsername(raw) {
    const uname = raw.trim().replace(/^@/, '');
    if (!/^[a-zA-Z][a-zA-Z0-9_]{3,30}$/.test(uname)) {
        await botSay('Invalid format. Must be 4–31 chars, start with letter. Try again:');
        return;
    }
    if (!uname.toLowerCase().endsWith('bot')) {
        await botSay('❌ Username must end in "bot". Try again:');
        return;
    }

    const exists = await db.collection('bots').where('username', '==', uname).limit(1).get();
    if (!exists.empty) {
        await botSay('❌ @' + uname + ' is taken. Try another:');
        return;
    }

    tempBot.username = uname;
    const token = genToken();

    try {
        const botRef = db.collection('bots').doc();
        const botId = botRef.id;
        const now = firebase.firestore.FieldValue.serverTimestamp();

        await botRef.set({
            id: botId,
            owner_id: currentUserId,
            name: tempBot.name,
            username: uname,
            about: '',
            avatar_url: null,
            token: token,
            created_at: now,
            is_public: true,
            type: 'bot',
            subscribers: 0,
            commands: ['/start', '/help']
        });

        await db.collection('users').doc(botId).set({
            uid: botId,
            username: uname,
            display_name: tempBot.name,
            avatar_url: null,
            about: '',
            email: uname + '@bot.aurachat.app',
            is_bot: true,
            bot_owner: currentUserId,
            is_verified: false,
            created_at: now
        });

        await db.collection('chats').doc(botId).set({
            id: botId,
            type: 'bot',
            name: tempBot.name,
            username: uname,
            about: '',
            avatar_url: null,
            owner_id: currentUserId,
            participants: [currentUserId],
            participants_data: {},
            created_at: now,
            last_message: 'Bot created',
            last_message_at: now
        });

        chatState = 'awaiting_bot_avatar';
        tempBot.id = botId;
        tempBot.token = token;

        await botSay('', {
            html: '<strong>🎉 Bot created!</strong>\n\nYou can find it at <code>@' + uname + '</code>.\n\n<strong>🔑 API Token:</strong>\n<pre>' + token + '</pre>\n\n<em>⚠ Keep this secret. Anyone with this token controls your bot.</em>\n\n📷 Now send me a <strong>profile picture</strong> for your bot — attach an image below.\n\n<em>Or tap Skip.</em>',
            buttons: [
                { label: 'Skip', cls: '', onclick: 'skipAvatar()' }
            ]
        }, 500);
    } catch (e) {
        console.error(e);
        await botSay('❌ Failed to create bot: ' + e.message);
        chatState = 'idle';
        setStatus('Your bot factory');
    }
}

async function skipAvatar() {
    chatState = 'idle';
    setStatus('Your bot factory');
    await botSay('', {
        html: '<strong>✅ Your bot is ready!</strong>\n\n<strong>@' + tempBot.username + '</strong>\n\n<strong>Next steps</strong>\n1. Copy the token above\n2. Install: <code>npm i aura-bot-api</code>\n3. Deploy to your server\n\nTry these:\n<code>/token @' + tempBot.username + '</code>\n<code>/setdescription</code>\n<code>/setuserpic</code>\n<code>/mybots</code>',
        buttons: [
            { label: '📖 Docs', cls: 'primary', onclick: 'location.href=\'bot_docs.html\'' },
            { label: '🤖 Open Bot', cls: '', onclick: 'location.href=\'bot_profile.html?id=' + tempBot.id + '\'' }
        ]
    });
    tempBot = {};
}

async function listMyBots() {
    const snap = await db.collection('bots')
        .where('owner_id', '==', currentUserId)
        .orderBy('created_at', 'desc').get();

    if (snap.empty) {
        await botSay('You don\'t have any bots yet. Use /newbot to create one!');
        return;
    }

    let html = '<strong>Your bots (' + snap.size + '):</strong>\n\n';
    const buttons = [];
    snap.forEach(function(doc, i) {
        const b = doc.data();
        html += (i + 1) + '. <strong>' + esc(b.name) + '</strong> — @' + b.username + '\n';
        buttons.push({
            label: '@' + b.username,
            cls: 'primary',
            onclick: 'location.href=\'bot_profile.html?id=' + doc.id + '\''
        });
    });
    await botSay('', { html: html, buttons: buttons });
}

async function pickBotForEdit(prompt) {
    const snap = await db.collection('bots')
        .where('owner_id', '==', currentUserId)
        .orderBy('created_at', 'desc').get();

    if (snap.empty) {
        await botSay('No bots found. Create one with /newbot first.');
        chatState = 'idle';
        setStatus('Your bot factory');
        return;
    }

    const buttons = snap.docs.map(function(doc) {
        const b = doc.data();
        return {
            label: '@' + b.username,
            cls: 'primary',
            onclick: 'selectBot(\'' + doc.id + '\',\'' + b.username + '\')'
        };
    });
    await botSay(prompt, { buttons: buttons });
}

async function selectBot(botId, username) {
    const doc = await db.collection('bots').doc(botId).get();
    if (!doc.exists) { await botSay('Bot not found.'); return; }
    tempBot.id = botId;
    tempBot.username = username;

    const action = tempBot.editAction;

    if (action === 'setname') {
        chatState = 'awaiting_edit_name';
        setStatus('Editing @' + username);
        await botSay('OK. Send the new <strong>name</strong> for @' + username);
    } else if (action === 'setdescription') {
        chatState = 'awaiting_edit_about';
        setStatus('Editing @' + username);
        await botSay('OK. Send the new <strong>About</strong> text (max 200 chars) for @' + username);
    } else if (action === 'setuserpic') {
        chatState = 'awaiting_edit_avatar';
        setStatus('Editing @' + username);
        await botSay('OK. Send a new <strong>profile picture</strong> for @' + username + ' — attach an image below.');
    } else if (action === 'setusername') {
        chatState = 'awaiting_edit_username';
        setStatus('Editing @' + username);
        await botSay('OK. Send the new <strong>@username</strong> (must end in "bot").');
    } else if (action === 'revoke') {
        const newToken = genToken();
        await db.collection('bots').doc(botId).update({ token: newToken });
        await botSay('', {
            html: '🔐 <strong>Token revoked</strong> for @' + username + '\n\n<strong>New token:</strong>\n<pre>' + newToken + '</pre>\nYour old token is now invalid.'
        });
        chatState = 'idle';
        setStatus('Your bot factory');
        tempBot = {};
    } else if (action === 'deletebot') {
        chatState = 'awaiting_delete_confirm';
        await botSay('', {
            html: '⚠️ Delete <strong>@' + username + '</strong>?\n\n<em>This cannot be undone.</em>',
            buttons: [
                { label: 'Yes, delete', cls: 'danger', onclick: 'confirmDeleteBot(\'' + botId + '\')' },
                { label: 'Cancel', cls: '', onclick: 'cancelDelete()' }
            ]
        });
    }
}

async function confirmDeleteBot(botId) {
    try {
        await db.collection('bots').doc(botId).delete();
        try { await db.collection('chats').doc(botId).delete(); } catch (e) {}
        try { await db.collection('users').doc(botId).delete(); } catch (e) {}
        await botSay('🗑 Bot deleted.');
    } catch (e) {
        await botSay('Failed to delete.');
    }
    chatState = 'idle';
    setStatus('Your bot factory');
    tempBot = {};
}

async function cancelDelete() {
    await botSay('Cancelled.');
    chatState = 'idle';
    setStatus('Your bot factory');
    tempBot = {};
}

async function handleEditName(name) {
    if (name.length < 2 || name.length > 40) { await botSay('2–40 chars. Try again:'); return; }
    await db.collection('bots').doc(tempBot.id).update({ name: name });
    await db.collection('chats').doc(tempBot.id).update({ name: name });
    await db.collection('users').doc(tempBot.id).update({ display_name: name });
    await botSay('✅ Name changed to "' + name + '".');
    chatState = 'idle';
    setStatus('Your bot factory');
    tempBot = {};
}

async function handleEditAbout(text) {
    if (text.length > 200) { await botSay('Max 200 chars. Try again:'); return; }
    await db.collection('bots').doc(tempBot.id).update({ about: text });
    await db.collection('chats').doc(tempBot.id).update({ about: text });
    await db.collection('users').doc(tempBot.id).update({ about: text });
    await botSay('✅ About text updated.');
    chatState = 'idle';
    setStatus('Your bot factory');
    tempBot = {};
}

async function handleEditUsername(raw) {
    const uname = raw.trim().replace(/^@/, '');
    if (!/^[a-zA-Z][a-zA-Z0-9_]{3,30}$/.test(uname) || !uname.toLowerCase().endsWith('bot')) {
        await botSay('Invalid. Must end in "bot". Try again:');
        return;
    }
    const exists = await db.collection('bots').where('username', '==', uname).limit(1).get();
    if (!exists.empty && exists.docs[0].id !== tempBot.id) {
        await botSay('❌ @' + uname + ' is taken. Try another:');
        return;
    }
    await db.collection('bots').doc(tempBot.id).update({ username: uname });
    await db.collection('chats').doc(tempBot.id).update({ username: uname });
    await db.collection('users').doc(tempBot.id).update({
        username: uname,
        email: uname + '@bot.aurachat.app'
    });
    await botSay('✅ Username changed to @' + uname + '.');
    chatState = 'idle';
    setStatus('Your bot factory');
    tempBot = {};
}

async function sendUserMsg() {
    const text = inputEl.value.trim();
    const hasImage = !!pendingMedia;
    if (!text && !hasImage) return;
    inputEl.value = '';

    if (hasImage) {
        const media = pendingMedia;
        clearMedia();
        addMsg('', { out: true, imageUrl: media.previewUrl });
        await bcSaveMsg('user', null, null, {
            media_url: media.previewUrl,
            media_type: 'image'
        });

        if (chatState === 'awaiting_bot_avatar' || chatState === 'awaiting_edit_avatar') {
            const botId = tempBot.id;
            if (!botId) { await botSay('❌ No bot selected.'); return; }
            typingWrap.classList.add('show');
            showToast('Uploading picture...');
            try {
                const url = await uploadToCloudinary(media.file);
                await db.collection('bots').doc(botId).update({ avatar_url: url });
                await db.collection('chats').doc(botId).update({ avatar_url: url });
                await db.collection('users').doc(botId).update({ avatar_url: url });
                typingWrap.classList.remove('show');
                showToast('✅ Picture set!', 'success');
                if (chatState === 'awaiting_bot_avatar') {
                    await skipAvatar();
                } else {
                    await botSay('✅ Profile picture updated.');
                    chatState = 'idle';
                    setStatus('Your bot factory');
                    tempBot = {};
                }
            } catch (e) {
                console.error(e);
                typingWrap.classList.remove('show');
                await botSay('❌ Upload failed: ' + e.message);
            }
            return;
        }

        await botSay('📷 I only use images as profile pics when creating or editing a bot.');
        return;
    }

    addMsg(text, { out: true });
    await bcSaveMsg('user', text, null);

    if (chatState === 'awaiting_bot_name') await handleBotName(text);
    else if (chatState === 'awaiting_bot_username') await handleBotUsername(text);
    else if (chatState === 'awaiting_edit_name') await handleEditName(text);
    else if (chatState === 'awaiting_edit_about') await handleEditAbout(text);
    else if (chatState === 'awaiting_edit_username') await handleEditUsername(text);
    else if (chatState === 'awaiting_bot_avatar' || chatState === 'awaiting_edit_avatar') {
        await botSay('Please send an image file, or tap Skip.');
    }
    else if (text.startsWith('/')) await handleCommand(text);
    else await botSay('I only understand commands. Try /help');
}

function checkAuth() {
    const uid = localStorage.getItem('mock_user_id');
    if (uid) { currentUserId = uid; return true; }
    if (auth.currentUser) {
        currentUserId = auth.currentUser.uid;
        localStorage.setItem('mock_user_id', currentUserId);
        return true;
    }
    return false;
}

async function init() {
    if (!checkAuth()) { location.href = 'email_verification.html'; return; }

    await bcEnsureChat();

    const hadHistory = await bcLoadHistory();

    const editData = sessionStorage.getItem('edit_bot');
    if (editData) {
        try {
            const parsed = JSON.parse(editData);
            sessionStorage.removeItem('edit_bot');
            await botSay('👋 Welcome back! Manage <strong>@' + parsed.username + '</strong>:', {
                buttons: [
                    { label: 'Name', cls: '', onclick: 'quickCmd(\'/setname\')' },
                    { label: 'About', cls: '', onclick: 'quickCmd(\'/setdescription\')' },
                    { label: 'Picture', cls: '', onclick: 'quickCmd(\'/setuserpic\')' },
                    { label: 'Revoke', cls: '', onclick: 'quickCmd(\'/revoke\')' },
                    { label: 'Token', cls: 'primary', onclick: 'quickCmd(\'/token @' + parsed.username + '\')' },
                    { label: 'Delete', cls: 'danger', onclick: 'quickCmd(\'/deletebot\')' }
                ]
            }, 500);
            return;
        } catch (e) {}
    }

    if (!hadHistory) {
        await botSay('', {
            html: '👋 Welcome to <strong>BotCreator</strong>!\n\nI create and manage bots for AURA.\n\nType <code>/newbot</code> to get started — or <code>/help</code> for commands.'
        }, 500);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    auth.onAuthStateChanged(function(user) {
        if (user) {
            currentUserId = user.uid;
            localStorage.setItem('mock_user_id', currentUserId);
            init();
        } else {
            const uid = localStorage.getItem('mock_user_id');
            if (uid) { currentUserId = uid; init(); }
            else location.href = 'email_verification.html';
        }
    });
});
</script>
