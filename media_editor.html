<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AURA - Media Editor</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0A0A0F;
    color: #fff;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
}
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 10px; }

#editor {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #050508;
    max-width: 600px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
}

.top-bar {
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(10, 10, 15, 0.95);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
    z-index: 50;
    min-height: 52px;
}
.top-bar .close-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: none;
    color: #fff; font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.top-bar .title {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    color: rgba(255,255,255,0.9);
}
.top-bar .title .sub {
    font-size: 10.5px;
    color: rgba(255,255,255,0.4);
    font-weight: 400;
    margin-top: 2px;
}
.top-bar .send-btn {
    padding: 9px 16px;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    border: none;
    border-radius: 20px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    flex-shrink: 0;
}
.top-bar .send-btn:disabled {
    opacity: 0.5;
    pointer-events: none;
}
.top-bar .send-btn i { font-size: 13px; }

.media-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: #000;
    min-height: 0;
}
.media-stage img,
.media-stage video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
}
.media-stage .cropper-container { max-height: 100%; }

#drawCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    cursor: crosshair;
    display: none;
    touch-action: none;
}
#drawCanvas.active { display: block; }

#textOverlays {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 12;
    pointer-events: none;
    display: none;
}
#textOverlays.active { display: block; }
.text-overlay-item {
    position: absolute;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    text-shadow: 0 2px 6px rgba(0,0,0,0.85);
    padding: 6px 10px;
    cursor: grab;
    pointer-events: auto;
    touch-action: none;
    white-space: nowrap;
    font-family: 'Inter', sans-serif;
    border: 1px dashed transparent;
}
.text-overlay-item:active { cursor: grabbing; border-color: rgba(139,92,246,0.5); }

#stickerLayer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 11;
    pointer-events: none;
    display: none;
}
#stickerLayer.active { display: block; }
.sticker-item {
    position: absolute;
    font-size: 56px;
    cursor: grab;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
}

.page-dots {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 20;
    padding: 6px 12px;
    background: rgba(0,0,0,0.55);
    border-radius: 20px;
    backdrop-filter: blur(8px);
}
.page-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
}
.page-dot.active {
    background: #8B5CF6;
    width: 22px;
    border-radius: 5px;
}
.page-dot.has-edits::after {
    content: '';
    position: absolute;
    width: 4px; height: 4px;
    background: #FBBF24;
    border-radius: 50%;
    top: -1px; right: -1px;
}

.nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    z-index: 15;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
}
.nav-arrow:hover { background: rgba(139, 92, 246, 0.6); }
.nav-arrow.prev { left: 10px; }
.nav-arrow.next { right: 10px; }
.nav-arrow.hidden { display: none; }

.video-trim-bar {
    position: absolute;
    bottom: 12px;
    left: 12px; right: 12px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(14px);
    border-radius: 14px;
    display: none;
    z-index: 20;
    border: 1px solid rgba(255,255,255,0.08);
}
.video-trim-bar.show { display: block; }
.trim-times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 6px;
    font-family: ui-monospace, Menlo, monospace;
}
.trim-track {
    position: relative;
    height: 32px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    overflow: hidden;
}
.trim-selected {
    position: absolute;
    top: 0; bottom: 0;
    background: rgba(139, 92, 246, 0.35);
    border-top: 2px solid #8B5CF6;
    border-bottom: 2px solid #8B5CF6;
}
.trim-handle {
    position: absolute;
    top: 0; bottom: 0;
    width: 12px;
    background: #8B5CF6;
    cursor: ew-resize;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
}
.trim-handle::after {
    content: '';
    width: 2px; height: 14px;
    background: rgba(255,255,255,0.9);
    border-radius: 2px;
}
.trim-handle.left { border-radius: 8px 0 0 8px; }
.trim-handle.right { border-radius: 0 8px 8px 0; }
.mute-toggle {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    cursor: pointer;
}
.mute-toggle input { accent-color: #8B5CF6; }

.toolbar-wrap {
    background: rgba(10, 10, 15, 0.98);
    backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
    z-index: 50;
}

.caption-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.caption-row .caption-input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: none;
    border-radius: 18px;
    padding: 9px 14px;
    color: #fff;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
}
.caption-row .caption-input::placeholder { color: rgba(255,255,255,0.3); }

.tools-row {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px 8px;
    overflow-x: auto;
    scrollbar-width: none;
}
.tools-row::-webkit-scrollbar { display: none; }
.tool-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.65);
    font-size: 18px;
    padding: 10px;
    cursor: pointer;
    border-radius: 10px;
    min-width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
}
.tool-btn:active { background: rgba(139, 92, 246, 0.25); }
.tool-btn.active {
    background: rgba(139, 92, 246, 0.2);
    color: #8B5CF6;
}

.tool-panel {
    padding: 8px 12px 12px 12px;
    display: none;
    border-top: 1px solid rgba(255,255,255,0.05);
    animation: slideUp 0.2s ease;
}
.tool-panel.show { display: block; }
@keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.color-swatches {
    display: flex;
    gap: 8px;
    padding: 4px 0;
    flex-wrap: wrap;
}
.color-swatch {
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.12s;
}
.color-swatch:hover { transform: scale(1.15); }
.color-swatch.active {
    border-color: #fff;
    transform: scale(1.15);
    box-shadow: 0 0 0 2px rgba(139,92,246,0.5);
}

.size-slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
}
.size-slider-row label {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    min-width: 50px;
}
.size-slider-row input[type=range] {
    flex: 1;
    accent-color: #8B5CF6;
}
.size-preview {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #8B5CF6;
    flex-shrink: 0;
    transition: all 0.1s;
}

.filters-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 0;
}
.filters-row::-webkit-scrollbar { display: none; }
.filter-chip {
    flex-shrink: 0;
    width: 68px;
    cursor: pointer;
    text-align: center;
}
.filter-chip .thumb {
    width: 68px; height: 68px;
    border-radius: 10px;
    background-size: cover;
    background-position: center;
    border: 2px solid transparent;
    transition: border 0.15s;
    margin-bottom: 4px;
}
.filter-chip.active .thumb {
    border-color: #8B5CF6;
    box-shadow: 0 0 0 2px rgba(139,92,246,0.4);
}
.filter-chip .fname {
    font-size: 10.5px;
    color: rgba(255,255,255,0.6);
}
.filter-chip.active .fname { color: #8B5CF6; font-weight: 600; }

.emoji-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 0;
}
.emoji-row::-webkit-scrollbar { display: none; }
.emoji-pick {
    font-size: 34px;
    padding: 6px;
    cursor: pointer;
    border-radius: 8px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.04);
    transition: background 0.15s;
}
.emoji-pick:hover { background: rgba(139,92,246,0.2); }

.toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px;
}
.toggle-row .tr-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: rgba(255,255,255,0.85);
}
.toggle-row .tr-label i { color: #8B5CF6; font-size: 15px; width: 18px; }
.toggle-row .tr-sub {
    font-size: 10.5px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
    margin-left: 28px;
}

.switch {
    position: relative;
    width: 44px;
    height: 26px;
    background: rgba(255,255,255,0.12);
    border-radius: 13px;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
}
.switch::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
}
.switch.on { background: #8B5CF6; }
.switch.on::after { transform: translateX(18px); }

.duration-chips {
    display: flex;
    gap: 6px;
    padding: 4px 0;
    flex-wrap: wrap;
}
.duration-chip {
    padding: 6px 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    font-size: 11.5px;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: all 0.15s;
}
.duration-chip.active {
    background: rgba(139, 92, 246, 0.2);
    border-color: #8B5CF6;
    color: #fff;
    font-weight: 600;
}

.rotate-buttons {
    display: flex;
    gap: 10px;
    padding: 6px 0;
}
.rotate-btn {
    flex: 1;
    padding: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: #fff;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.rotate-btn:active { background: rgba(139,92,246,0.2); }

.crop-aspects {
    display: flex;
    gap: 8px;
    padding: 6px 0;
    overflow-x: auto;
    scrollbar-width: none;
}
.crop-aspects::-webkit-scrollbar { display: none; }
.aspect-chip {
    padding: 6px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
}
.aspect-chip.active {
    background: rgba(139, 92, 246, 0.2);
    border-color: #8B5CF6;
    color: #fff;
    font-weight: 600;
}
.crop-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}
.crop-action {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    border: none;
    display: flex; align-items: center; justify-content: center; gap: 6px;
}
.crop-action.cancel {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.7);
}
.crop-action.confirm {
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    color: #fff;
}

.text-tool-input {
    width: 100%;
    padding: 10px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    margin-bottom: 8px;
}
.text-apply-btn {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
}

/* ─────────────────────────────────────────────────────────
   "PICK AGAIN" FALLBACK SCREEN
   ───────────────────────────────────────────────────────── */
.pick-again-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    height: 100%;
}
.pick-again-screen .pa-icon {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(6,182,212,0.08));
    display: flex; align-items: center; justify-content: center;
    color: #8B5CF6;
    font-size: 42px;
    margin-bottom: 22px;
}
.pick-again-screen .pa-title {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
}
.pick-again-screen .pa-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    line-height: 1.5;
    max-width: 280px;
    margin-bottom: 24px;
}
.pick-again-screen .pa-btn-primary {
    width: 100%;
    max-width: 280px;
    padding: 14px 20px;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    box-shadow: 0 6px 22px rgba(139, 92, 246, 0.4);
    margin-bottom: 10px;
}
.pick-again-screen .pa-btn-primary:active {
    transform: scale(0.98);
}
.pick-again-screen .pa-btn-secondary {
    width: 100%;
    max-width: 280px;
    padding: 12px 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
}

.progress-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 9000;
}
.progress-overlay.show { display: flex; }
.progress-ring {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 4px solid rgba(139, 92, 246, 0.15);
    border-top-color: #8B5CF6;
    animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.progress-text {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    text-align: center;
    max-width: 80%;
}
.progress-count {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
}

.toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 16, 60, 0.98);
    color: #fff;
    padding: 10px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 12.5px;
    z-index: 9500;
    display: none;
    max-width: 90%;
    text-align: center;
}
.toast.show { display: block; }
.toast.error { border-color: rgba(239, 68, 68, 0.3); background: rgba(80, 20, 20, 0.95); }
.toast.success { border-color: rgba(74, 222, 128, 0.3); background: rgba(20, 80, 40, 0.95); }

.unsupported-warning {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(251, 191, 36, 0.15);
    border: 1px solid rgba(251, 191, 36, 0.4);
    color: #FBBF24;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 11.5px;
    display: none;
    z-index: 30;
    max-width: 90%;
    text-align: center;
}
.unsupported-warning.show { display: block; }

.cropper-view-box, .cropper-face { border-radius: 0; }
.cropper-line { background-color: rgba(139, 92, 246, 0.9); }
.cropper-point { background-color: #8B5CF6; }

@media (max-width: 480px) {
    .top-bar { padding: 8px 10px; min-height: 48px; }
    .top-bar .send-btn { padding: 8px 14px; font-size: 12px; }
    .tool-btn { min-width: 40px; height: 40px; font-size: 17px; padding: 8px; }
    .caption-row .caption-input { font-size: 12.5px; padding: 8px 12px; }
    .text-overlay-item { font-size: 20px; }
}
</style>
</head>
<body>

<div id="editor">
    <div class="top-bar">
        <button class="close-btn" onclick="closeEditor()">
            <i class="fas fa-times"></i>
        </button>
        <div class="title" id="editorTitle">
            Edit Media
            <div class="sub" id="editorSub">1 of 1</div>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendAll()" disabled>
            <i class="fas fa-paper-plane"></i> Send
        </button>
    </div>

    <div class="media-stage" id="mediaStage">
        <div class="unsupported-warning" id="unsupportedWarning"></div>
        <button class="nav-arrow prev hidden" id="navPrev" onclick="navPrev()">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="nav-arrow next hidden" id="navNext" onclick="navNext()">

function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast show ' + (type || '');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

/* ═══════════════════════════════════════════════════════════
   INIT — reads files from multiple sources with fallback
   ═══════════════════════════════════════════════════════════ */
async function init() {
    const params = new URLSearchParams(window.location.search);
    chatId = params.get('chat_id');
    chatType = params.get('chat_type') || 'chat';
    chatName = params.get('chat_name') || '';

    const userId = localStorage.getItem('mock_user_id');
    if (userId) currentUserId = userId;
    else if (auth.currentUser) {
        currentUserId = auth.currentUser.uid;
        localStorage.setItem('mock_user_id', currentUserId);
    } else {
        window.location.href = 'email_verification.html';
        return;
    }

    // Try memory store first (survives same-tab navigation)
    let meta = window._editorFileStore && window._editorFileStore.data;

    // Fall back to sessionStorage
    if (!meta) {
        try {
            const raw = sessionStorage.getItem('editor_files_meta');
            if (raw) meta = JSON.parse(raw);
        } catch (e) {}
    }

    // Fall back to window.opener memory store
    if (!meta && window.opener && window.opener._editorFileStore) {
        try { meta = window.opener._editorFileStore.data; } catch (e) {}
    }

    if (!meta || !meta.files || meta.files.length === 0) {
        showPickAgainScreen();
        return;
    }

    // Rebuild items
    items = [];
    for (let i = 0; i < meta.files.length; i++) {
        const item = meta.files[i];
        try {
            const res = await fetch(item.dataUrl);
            const blob = await res.blob();
            const file = new File([blob], item.name, { type: item.type });
            const isVideo = item.type.startsWith('video/');
            items.push({
                id: 'item_' + i,
                file: file,
                type: isVideo ? 'video' : 'image',
                url: URL.createObjectURL(blob),
                edits: {
                    rotate: 0, flipH: false, flipV: false,
                    filter: 'none', cropBox: null,
                    drawings: [], textOverlays: [], stickers: [],
                    trimStart: 0, trimEnd: null, muted: false
                },
                hasEdits: false,
                canvasBlob: null
            });
        } catch (e) {
            console.error('Rebuild error', e);
        }
    }

    if (items.length === 0) {
        showPickAgainScreen();
        return;
    }

    // Success path
    initDrawColors();
    initStickerEmojis();
    initFilters();
    updateTitle();
    renderPageDots();
    renderCurrentItem();

    setupDrawHandlers();
    setupTrimHandlers();
    setupSelfDestructChips();
    setupCropAspects();

    sendBtn.disabled = false;
}

function showPickAgainScreen() {
    sendBtn.disabled = true;
    mediaStage.innerHTML = `
        <div class="pick-again-screen">
            <div class="pa-icon"><i class="fas fa-image"></i></div>
            <div class="pa-title">Media not loaded</div>
            <div class="pa-desc">Your browser couldn't transfer the file automatically. Tap below to pick it again.</div>
            <button class="pa-btn-primary" onclick="document.getElementById('fallbackImageInput').click()">
                <i class="fas fa-image"></i> Pick Photo
            </button>
            <button class="pa-btn-secondary" onclick="document.getElementById('fallbackVideoInput').click()">
                <i class="fas fa-video"></i> Pick Video
            </button>
        </div>
    `;
}

function onFallbackPick(event) {
    const files = Array.from(event.target.files || []);
    event.target.value = '';
    if (files.length === 0) return;
    if (files.length > 15) { showToast('Max 15 items', 'error'); return; }

    Promise.all(files.map(readFileAsDataUrl))
        .then(async function(dataUrls) {
            const meta = {
                files: files.map(function(f, i) {
                    return { name: f.name, type: f.type, dataUrl: dataUrls[i] };
                })
            };
            window._editorFileStore = { data: meta };
            try { sessionStorage.setItem('editor_files_meta', JSON.stringify(meta)); } catch (e) {}

            // Rebuild items directly without reload
            items = [];
            for (let i = 0; i < meta.files.length; i++) {
                const item = meta.files[i];
                const res = await fetch(item.dataUrl);
                const blob = await res.blob();
                const file = new File([blob], item.name, { type: item.type });
                const isVideo = item.type.startsWith('video/');
                items.push({
                    id: 'item_' + i,
                    file: file,
                    type: isVideo ? 'video' : 'image',
                    url: URL.createObjectURL(blob),
                    edits: { rotate: 0, flipH: false, flipV: false, filter: 'none', cropBox: null, drawings: [], textOverlays: [], stickers: [], trimStart: 0, trimEnd: null, muted: false },
                    hasEdits: false,
                    canvasBlob: null
                });
            }

            // Restore the original media stage HTML structure
            restoreEditorUI();

            currentIndex = 0;
            updateTitle();
            renderPageDots();
            renderCurrentItem();
            sendBtn.disabled = false;
        })
        .catch(function(err) {
            showToast('Failed: ' + err.message, 'error');
        });
}

function onFallbackVideoPick(event) {
    const files = Array.from(event.target.files || []);
    event.target.value = '';
    if (files.length === 0) return;
    if (files.length > 1) { showToast('One video at a time', 'error'); return; }

    const f = files[0];
    readFileAsDataUrl(f)
        .then(async function(dataUrl) {
            const meta = { files: [{ name: f.name, type: f.type, dataUrl: dataUrl }] };
            window._editorFileStore = { data: meta };
            try { sessionStorage.setItem('editor_files_meta', JSON.stringify(meta)); } catch (e) {}

            const res = await fetch(dataUrl);
            const blob = await res.blob();
            const file = new File([blob], f.name, { type: f.type });
            items = [{
                id: 'item_0',
                file: file,
                type: 'video',
                url: URL.createObjectURL(blob),
                edits: { rotate: 0, flipH: false, flipV: false, filter: 'none', cropBox: null, drawings: [], textOverlays: [], stickers: [], trimStart: 0, trimEnd: null, muted: false },
                hasEdits: false,
                canvasBlob: null
            }];

            restoreEditorUI();

            currentIndex = 0;
            updateTitle();
            renderPageDots();
            renderCurrentItem();
            sendBtn.disabled = false;
        })
        .catch(function(err) {
            showToast('Failed: ' + err.message, 'error');
        });
}

function restoreEditorUI() {
    mediaStage.innerHTML = `
        <div class="unsupported-warning" id="unsupportedWarning"></div>
        <button class="nav-arrow prev hidden" id="navPrev" onclick="navPrev()">
            <i class="fas fa-chevron-left"></i>
        </button>

        </button>

                <div class="trim-selected" id="trimSelected"></div>

            </label>
        </div>

    // Re-acquire references since we replaced innerHTML

    window.stickerLayer = document.getElementById('stickerLayer');
    window.textOverlays = document.getElementById('textOverlays');
    window.pageDots = document.getElementById('pageDots');
    window.navPrev = document.getElementById('navPrev');
    window.navNext = document.getElementById('navNext');
    window.videoTrimBar = document.getElementById('videoTrimBar');
    // Re-run setup
    setupDrawHandlers();
    setupTrimHandlers();
}

function readFileAsDataUrl(file) {
    return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function updateTitle() {
    const total = items.length;
    const idx = currentIndex + 1;
    editorSub.textContent = idx + ' of ' + total;
    const item = items[currentIndex];
    if (item) {
        editorTitle.firstChild.textContent = item.type === 'video' ? 'Edit Video' : 'Edit Photo';
    }
}

/* ═══════════════════════════════════════════════════════════
   RENDER CURRENT ITEM
   ═══════════════════════════════════════════════════════════ */
function renderCurrentItem() {
    // Clean up layers
    const dc = document.getElementById('drawCanvas');
    if (dc) { const ctx = dc.getContext('2d'); ctx.clearRect(0, 0, dc.width, dc.height); }
    const sl = document.getElementById('stickerLayer');
    if (sl) sl.innerHTML = '';
    const to = document.getElementById('textOverlays');
    if (to) to.innerHTML = '';
    destroyCropper();
    if (videoPlayer) { try { videoPlayer.pause(); } catch(e) {} }

    const item = items[currentIndex];
    if (!item) return;

    let mediaEl;
    if (item.type === 'video') {
        mediaEl = document.createElement('video');
        mediaEl.src = item.url;
        mediaEl.controls = false;
        mediaEl.playsInline = true;
        mediaEl.muted = true;
        mediaEl.preload = 'metadata';
        mediaEl.id = 'currentMedia';
        mediaEl.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;';
        videoPlayer = mediaEl;
        mediaEl.addEventListener('loadedmetadata', function() {
            videoDuration = mediaEl.duration || 0;
            trimStart = item.edits.trimStart || 0;
            trimEnd = item.edits.trimEnd == null ? videoDuration : item.edits.trimEnd;
            updateTrimUI();
            const tb = document.getElementById('videoTrimBar');
            if (tb) tb.classList.add('show');
            mediaEl.currentTime = trimStart;
        });
        mediaEl.addEventListener('ended', function() {
            mediaEl.currentTime = trimStart;
            mediaEl.play();
        });
    } else {
        mediaEl = document.createElement('img');
        mediaEl.src = item.url;
        mediaEl.id = 'currentMedia';
        mediaEl.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;';
        const tb = document.getElementById('videoTrimBar');
        if (tb) tb.classList.remove('show');
        videoPlayer = null;
    }

    applyFilterToElement(mediaEl, item.edits.filter);

    // Remove existing, insert new
    const existing = document.getElementById('currentMedia');
    if (existing) existing.remove();
    mediaStage.insertBefore(mediaEl, mediaStage.firstChild);

    renderDrawings(item.edits.drawings);
    renderTextOverlays(item.edits.textOverlays);
    renderStickers(item.edits.stickers);

    captionInput.value = caption;
    updateSwitches();
}

function applyFilterToElement(el, filterName) {
    let css = '';
    switch (filterName) {
        case 'warm': css = 'sepia(0.35) saturate(1.3) hue-rotate(-10deg)'; break;
        case 'cool': css = 'saturate(1.2) hue-rotate(20deg)'; break;
        case 'bw': css = 'grayscale(1) contrast(1.05)'; break;
        case 'sepia': css = 'sepia(0.75)'; break;
        case 'vivid': css = 'saturate(1.6) contrast(1.15)'; break;
        case 'fade': css = 'brightness(1.1) contrast(0.9) saturate(0.85)'; break;
        case 'invert': css = 'invert(1)'; break;
        default: css = '';
    }
    el.style.filter = css;
}

function renderPageDots() {
    const pd = document.getElementById('pageDots');
    if (!pd) return;
    if (items.length <= 1) {
        pd.style.display = 'none';
        const np = document.getElementById('navPrev'); if (np) np.classList.add('hidden');
        const nn = document.getElementById('navNext'); if (nn) nn.classList.add('hidden');
        return;
    }
    pd.style.display = 'flex';
    pd.innerHTML = '';
    items.forEach(function(item, i) {
        const dot = document.createElement('div');
        dot.className = 'page-dot' + (i === currentIndex ? ' active' : '') + (item.hasEdits ? ' has-edits' : '');
        dot.onclick = function() { goToIndex(i); };
        pd.appendChild(dot);
    });
    const np = document.getElementById('navPrev'); if (np) np.classList.toggle('hidden', currentIndex === 0);
    const nn = document.getElementById('navNext'); if (nn) nn.classList.toggle('hidden', currentIndex === items.length - 1);
}

function goToIndex(i) {
    if (i < 0 || i >= items.length) return;
    currentIndex = i;
    updateTitle();
    renderPageDots();
    renderCurrentItem();
}

function navPrev() { goToIndex(currentIndex - 1); }
function navNext() { goToIndex(currentIndex + 1); }

function onCaptionChange() { caption = captionInput.value; }

function toggleViewOnce() {
    viewOnce = !viewOnce;
    const s = document.getElementById('viewOnceSwitch');
    if (s) s.classList.toggle('on', viewOnce);
}

function toggleSendAsFile() {
    sendAsFile = !sendAsFile;
    const s = document.getElementById('sendAsFileSwitch');
    if (s) s.classList.toggle('on', sendAsFile);
}

function updateSwitches() {
    const s1 = document.getElementById('viewOnceSwitch'); if (s1) s1.classList.toggle('on', viewOnce);
    const s2 = document.getElementById('sendAsFileSwitch'); if (s2) s2.classList.toggle('on', sendAsFile);
}

function setupSelfDestructChips() {
    const chips = document.querySelectorAll('#selfDestructChips .duration-chip');
    chips.forEach(function(chip) {
        chip.addEventListener('click', function() {
            chips.forEach(function(c) { c.classList.remove('active'); });
            chip.classList.add('active');
            selfDestruct = parseInt(chip.dataset.secs) || 0;
        });
    });
}

function selectTool(tool) {
    const item = items[currentIndex];
    if (!item) return;
    if (tool === 'crop' && item.type === 'video') {
        showToast('Crop is for images only', 'error');
        return;
    }
    if (activeTool === tool) {
        activeTool = null;
        document.querySelectorAll('.tool-btn').forEach(function(b) { b.classList.remove('active'); });
        document.querySelectorAll('.tool-panel').forEach(function(p) { p.classList.remove('show'); });
        exitDrawMode(); exitCropMode();
        return;
    }
    activeTool = tool;
    document.querySelectorAll('.tool-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.tool === tool); });
    document.querySelectorAll('.tool-panel').forEach(function(p) { p.classList.remove('show'); });
    const panel = document.getElementById('panel-' + tool);
    if (panel) panel.classList.add('show');
    exitDrawMode(); exitCropMode();
    if (tool === 'draw') enterDrawMode();
    if (tool === 'crop') enterCropMode();
    if (tool === 'filter') updateFilterThumbs();
}

function initDrawColors() {
    const container = document.getElementById('drawColors');
    if (!container) return;
    container.innerHTML = '';
    drawColors.forEach(function(c) {
        const sw = document.createElement('div');
        sw.className = 'color-swatch' + (c === drawColor ? ' active' : '');
        sw.style.background = c;
        sw.onclick = function() {
            drawColor = c;
            container.querySelectorAll('.color-swatch').forEach(function(el) { el.classList.remove('active'); });
            sw.classList.add('active');
        };
        container.appendChild(sw);
    });
    const slider = document.getElementById('drawSize');
    if (slider) slider.addEventListener('input', function(e) {
        drawSize = parseInt(e.target.value);
        const preview = document.getElementById('sizePreview');

function enterDrawMode() {
    const dc = document.getElementById('drawCanvas');
    if (!dc) return;
    const item = items[currentIndex];
    if (!item) return;
    dc.classList.add('active');
    const rect = mediaStage.getBoundingClientRect();
    dc.width = rect.width;
    dc.height = rect.height;
    redrawCanvasStrokes(item.edits.drawings);
    dc.style.pointerEvents = 'auto';
}

function exitDrawMode() {
    const dc = document.getElementById('drawCanvas');
    if (!dc) return;
    dc.classList.remove('active');
    dc.style.pointerEvents = 'none';
}

function setupDrawHandlers() {
    const dc = document.getElementById('drawCanvas');
    if (!dc || dc._handlersBound) return;
    dc._handlersBound = true;
    const ctx = dc.getContext('2d');

    function pos(e) {
        const rect = dc.getBoundingClientRect();
        const p = e.touches ? e.touches[0] : e;
        return { x: p.clientX - rect.left, y: p.clientY - rect.top };
    }

    function start(e) {
        if (!dc.classList.contains('active')) return;
        e.preventDefault();
        isDrawing = true;
        const p = pos(e);
        lastX = p.x; lastY = p.y;
        // Start a new stroke record
        const item = items[currentIndex];
        if (item) {
            if (!item.edits.drawings) item.edits.drawings = [];
            item.edits.drawings.push({
                color: drawColor,
                size: drawSize,
                points: [{ x: p.x, y: p.y }]
            });
            item.hasEdits = true;
        }
    }

    function move(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const p = pos(e);
        ctx.strokeStyle = drawColor;
        ctx.lineWidth = drawSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        lastX = p.x; lastY = p.y;
        const item = items[currentIndex];
        if (item) {
            const lastStroke = item.edits.drawings[item.edits.drawings.length - 1];
            if (lastStroke) lastStroke.points.push({ x: p.x, y: p.y });
        }
    }

    function end() {
        if (!isDrawing) return;
        isDrawing = false;
        renderPageDots();
    }

    dc.addEventListener('mousedown', start);
    dc.addEventListener('mousemove', move);
    dc.addEventListener('mouseup', end);
    dc.addEventListener('mouseleave', end);
    dc.addEventListener('touchstart', start, { passive: false });
    dc.addEventListener('touchmove', move, { passive: false });
    dc.addEventListener('touchend', end);
}

function redrawCanvasStrokes(strokes) {
    const dc = document.getElementById('drawCanvas');
    if (!dc || !strokes || strokes.length === 0) return;
    const ctx = dc.getContext('2d');
    ctx.clearRect(0, 0, dc.width, dc.height);
    strokes.forEach(function(stroke) {
        if (!stroke.points || stroke.points.length < 2) return;
        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        ctx.stroke();
    });
}

function renderDrawings(strokes) {
    setTimeout(function() {
        const dc = document.getElementById('drawCanvas');
        if (!dc) return;
        const rect = mediaStage.getBoundingClientRect();
        if (dc.width !== rect.width || dc.height !== rect.height) {
            dc.width = rect.width;
            dc.height = rect.height;
        }
        redrawCanvasStrokes(strokes);
    }, 50);
}

function makeDraggable(el, onChange) {
    let dragging = false;
    let startX = 0, startY = 0;
    let origLeft = 0, origTop = 0;
    function start(e) {
        e.preventDefault();
        dragging = true;
        const p = e.touches ? e.touches[0] : e;
        startX = p.clientX; startY = p.clientY;
        origLeft = parseFloat(el.style.left) || 0;
        origTop = parseFloat(el.style.top) || 0;
    }
    function move(e) {
        if (!dragging) return;
        e.preventDefault();
        const p = e.touches ? e.touches[0] : e;
        const rect = mediaStage.getBoundingClientRect();
        const dx = ((p.clientX - startX) / rect.width) * 100;
        const dy = ((p.clientY - startY) / rect.height) * 100;
        let nx = Math.max(0, Math.min(90, origLeft + dx));
        let ny = Math.max(0, Math.min(90, origTop + dy));
        el.style.left = nx + '%';
        el.style.top = ny + '%';
        if (onChange) onChange(nx, ny);
    }
    function end() { dragging = false; }
    el.addEventListener('mousedown', start);
    el.addEventListener('mousemove', move);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchmove', move, { passive: false });
    el.addEventListener('touchend', end);
}

function setupTrimHandlers() {
    const left = document.getElementById('trimLeft');
    const right = document.getElementById('trimRight');
    const track = document.getElementById('trimTrack');
    if (!left || !right || !track || track._bound) return;
    track._bound = true;

    let dragging = null;
    let startX = 0;
    let startPct = 0;

    function startDrag(which) {
        return function(e) {
            e.preventDefault();
            dragging = which;
            const p = e.touches ? e.touches[0] : e;
            startX = p.clientX;
            const rect = track.getBoundingClientRect();
            startPct = which === 'left' ? trimStart / videoDuration : trimEnd / videoDuration;
        };
    }

    function move(e) {
        if (!dragging) return;
        e.preventDefault();
        const p = e.touches ? e.touches[0] : e;
        const rect = track.getBoundingClientRect();
        const dx = p.clientX - startX;
        const dPct = dx / rect.width;
        let newPct = Math.max(0, Math.min(1, startPct + dPct));
        if (dragging === 'left') trimStart = Math.min(newPct * videoDuration, trimEnd - 0.3);
        else trimEnd = Math.max(newPct * videoDuration, trimStart + 0.3);
        updateTrimUI();
    }

    function end() { dragging = null; }

    left.addEventListener('mousedown', startDrag('left'));
    right.addEventListener('mousedown', startDrag('right'));
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', end);
    left.addEventListener('touchstart', startDrag('left'), { passive: false });
    right.addEventListener('touchstart', startDrag('right'), { passive: false });
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', end);

    const mt = document.getElementById('muteToggle');
    if (mt) mt.addEventListener('change', function(e) {
        const item = items[currentIndex];
        if (item) {
            item.edits.muted = e.target.checked;
            item.hasEdits = true;
            if (videoPlayer) videoPlayer.muted = e.target.checked;
        }
    });
}

function updateTrimUI() {
    const total = videoDuration || 1;
    const leftPct = (trimStart / total) * 100;
    const rightPct = (trimEnd / total) * 100;
    const sel = document.getElementById('trimSelected');
    const l = document.getElementById('trimLeft');
    const r = document.getElementById('trimRight');
    if (sel) { sel.style.left = leftPct + '%'; sel.style.width = (rightPct - leftPct) + '%'; }
    if (l) l.style.left = leftPct + '%';
    if (r) r.style.left = (rightPct - 6) + '%';
    const sl = document.getElementById('trimStartLabel'); if (sl) sl.textContent = formatTimeShort(trimStart);
    const el = document.getElementById('trimEndLabel'); if (el) el.textContent = formatTimeShort(trimEnd);
}

function formatTimeShort(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
}

async function composeImageFromItem(item) {
    return new Promise(function(resolve, reject) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const rot = (item.edits.rotate || 0) % 360;
            const rad = (rot * Math.PI) / 180;
            const w0 = img.naturalWidth;
            const h0 = img.naturalHeight;
            const absCos = Math.abs(Math.cos(rad));
            const absSin = Math.abs(Math.sin(rad));
            const rw = w0 * absCos + h0 * absSin;
            const rh = w0 * absSin + h0 * absCos;
            canvas.width = Math.round(rw);
            canvas.height = Math.round(rh);
            ctx.filter = getFilterCSS(item.edits.filter || 'none');
            ctx.translate(rw / 2, rh / 2);
            ctx.rotate(rad);
            ctx.scale(item.edits.flipH ? -1 : 1, item.edits.flipV ? -1 : 1);
            ctx.drawImage(img, -w0 / 2, -h0 / 2);
            ctx.filter = 'none';

            const stageRect = mediaStage.getBoundingClientRect();
            const displayW = stageRect.width;
            const displayH = stageRect.height;
            const fitRatio = Math.min(displayW / rw, displayH / rh);
            const fitW = rw * fitRatio;
            const fitH = rh * fitRatio;
            const offsetX = (displayW - fitW) / 2;
            const offsetY = (displayH - fitH) / 2;
            const scaleToCanvas = rw / fitW;

            if (item.edits.drawings && item.edits.drawings.length > 0) {
                item.edits.drawings.forEach(function(stroke) {
                    if (!stroke.points || stroke.points.length < 2) return;
                    ctx.strokeStyle = stroke.color;
                    ctx.lineWidth = stroke.size * scaleToCanvas;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    stroke.points.forEach(function(pt, i) {
                        const cx = (pt.x - offsetX) * scaleToCanvas;
                        const cy = (pt.y - offsetY) * scaleToCanvas;
                        if (i === 0) ctx.moveTo(cx, cy);
                        else ctx.lineTo(cx, cy);
                    });
                    ctx.stroke();
                });
            }

            if (item.edits.textOverlays && item.edits.textOverlays.length > 0) {
                item.edits.textOverlays.forEach(function(t) {
                    const x = (t.x / 100) * displayW;
                    const y = (t.y / 100) * displayH;
                    const cx = (x - offsetX) * scaleToCanvas;
                    const cy = (y - offsetY) * scaleToCanvas;
                    const fontSize = Math.max(16, Math.round(22 * scaleToCanvas));
                    ctx.font = '700 ' + fontSize + 'px Inter, sans-serif';
                    ctx.fillStyle = t.color || '#fff';
                    ctx.shadowColor = 'rgba(0,0,0,0.85)';
                    ctx.shadowBlur = Math.round(6 * scaleToCanvas);
                    ctx.shadowOffsetY = Math.round(2 * scaleToCanvas);
                    ctx.fillText(t.text, cx, cy);
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetY = 0;
                });
            }

            if (item.edits.stickers && item.edits.stickers.length > 0) {
                item.edits.stickers.forEach(function(s) {
                    const x = (s.x / 100) * displayW;
                    const y = (s.y / 100) * displayH;
                    const cx = (x - offsetX) * scaleToCanvas;
                    const cy = (y - offsetY) * scaleToCanvas;
                    const fontSize = Math.max(28, Math.round(56 * scaleToCanvas));
                    ctx.font = fontSize + 'px serif';
                    ctx.textBaseline = 'top';
                    ctx.fillText(s.emoji, cx, cy);
                    ctx.textBaseline = 'alphabetic';
                });
            }

            canvas.toBlob(function(blob) {
                if (!blob) reject(new Error('Canvas failed'));
                else resolve(blob);
            }, sendAsFile ? 'image/png' : 'image/jpeg', sendAsFile ? 1.0 : 0.92);
        };
        img.onerror = function() { reject(new Error('Image load failed')); };
        img.src = item.url;
    });
}

function getFilterCSS(name) {
    switch (name) {
        case 'warm': return 'sepia(35%) saturate(130%) hue-rotate(-10deg)';
        case 'cool': return 'saturate(120%) hue-rotate(20deg)';
        case 'bw': return 'grayscale(100%) contrast(105%)';
        case 'sepia': return 'sepia(75%)';
        case 'vivid': return 'saturate(160%) contrast(115%)';
        case 'fade': return 'brightness(110%) contrast(90%) saturate(85%)';
        case 'invert': return 'invert(100%)';
        default: return 'none';
    }
}

async function uploadToCloudinary(blobOrFile, resourceType) {
    const formData = new FormData();
    formData.append('file', blobOrFile);
    formData.append('upload_preset', UPLOAD_PRESET);
    formData.append('folder', 'aura_chat/' + (chatType === 'group' ? 'groups' : 'chats') + '/' + chatId);
    const url = 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/' + resourceType + '/upload';
    const res = await fetch(url, { method: 'POST', body: formData });
    if (!res.ok) throw new Error('Upload failed: ' + res.status);
    const data = await res.json();
    if (!data.secure_url) throw new Error('No URL');
    return data.secure_url;
}

            const item = items[i];
            showProgress('Preparing ' + item.type + '...', (i + 1) + ' / ' + total);

            let uploadable = item.file;
            let mediaType = item.type;

            if (item.type === 'image') {
                showProgress('Applying edits...', (i + 1) + ' / ' + total);
                const composedBlob = await composeImageFromItem(item);
                const ext = sendAsFile ? 'png' : 'jpg';
                uploadable = new File([composedBlob], 'edited_' + Date.now() + '.' + ext, { type: sendAsFile ? 'image/png' : 'image/jpeg' });
            }

            showProgress('Uploading...', (i + 1) + ' / ' + total);
            const url = await uploadToCloudinary(uploadable, item.type === 'video' ? 'video' : 'image');

            const msgPayload = {
                id: null,
                text: caption || null,
                content: caption || null,
                media_url: url,
                media_type: mediaType,
                file_name: item.type === 'video' ? item.file.name : null,
                file_size: item.type === 'video' ? formatBytes(item.file.size) : null,
                sender_id: currentUserId,
                sender_name: senderName,
                view_once: viewOnce || false,
                self_destruct_seconds: selfDestruct || null,
                trim_start: item.edits.trimStart || null,
                trim_end: item.edits.trimEnd || null,
                muted: item.edits.muted || false,
                created_at: firebase.firestore.FieldValue.serverTimestamp(),
                is_read: false,
                is_edited: false,
                deleted_for_everyone: false,
                reactions: {}
            };

            const msgRef = db.collection('chats').doc(chatId).collection('messages').doc();
            msgPayload.id = msgRef.id;
            await msgRef.set(msgPayload);
            sent++;
        }

        const chatUpdate = {
            last_message: caption || (items[0].type === 'video' ? '🎥 Video' : '📷 Photo'),
            last_message_at: firebase.firestore.FieldValue.serverTimestamp()
        };
        try {
            const chatSnap = await db.collection('chats').doc(chatId).get();
            const chatData = chatSnap.data();
            const otherParticipants = (chatData.participants || []).filter(function(id) { return id !== currentUserId; });
            otherParticipants.forEach(function(uid) {
                chatUpdate['unread_counts.' + uid] = firebase.firestore.FieldValue.increment(sent);
            });
        } catch (e) {}
        await db.collection('chats').doc(chatId).update(chatUpdate).catch(function() {});

        showProgress('Done', '');
        setTimeout(function() {
            hideProgress();
            sessionStorage.removeItem('editor_files_meta');
            if (window._editorFileStore) window._editorFileStore.data = null;
            if (chatType === 'group') {
                window.location.href = 'group_chat.html?id=' + chatId;
            } else {
                window.location.href = 'chat.html?id=' + chatId;
            }
        }, 400);
    } catch (e) {
        hideProgress();
        console.error(e);
        showToast('Send failed: ' + e.message, 'error');
        sendBtn.disabled = false;
    }
}

function formatBytes(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

function closeEditor() {
    if (items.some(function(i) { return i.hasEdits; })) {
        if (!confirm('Discard edits?')) return;
    }
    sessionStorage.removeItem('editor_files_meta');
    if (window._editorFileStore) window._editorFileStore.data = null;
    history.back();
}

window.addEventListener('resize', function() {
    if (activeTool === 'draw') {
        const dc = document.getElementById('drawCanvas');
        if (!dc) return;
        const rect = mediaStage.getBoundingClientRect();
        dc.width = rect.width;
        dc.height = rect.height;
        const item = items[currentIndex];
        if (item) redrawCanvasStrokes(item.edits.drawings);
    }
});

document.addEventListener('DOMContentLoaded', function() {
    auth.onAuthStateChanged(function(user) {
        if (user) {
            currentUserId = user.uid;
            localStorage.setItem('mock_user_id', currentUserId);
            init();
        } else {
            const userId = localStorage.getItem('mock_user_id');
            if (userId) { currentUserId = userId; init(); }
            else window.location.href = 'email_verification.html';
        }
    });
});
</script>
