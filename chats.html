<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Chats</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 10px; }

        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        .sliver-app-bar {
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .app-bar-top {
            padding: 20px 16px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-bar-actions { display: flex; gap: 4px; }

        .app-bar-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        .app-bar-actions button:hover { background: rgba(255,255,255,0.05); }
        .app-bar-actions button.active {
            background: rgba(139, 92, 246, 0.2);
            color: #8B5CF6;
        }

        .archive-badge {
            position: absolute;
            top: 2px; right: 2px;
            min-width: 16px; height: 16px;
            padding: 0 4px;
            background: #8B5CF6;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 700;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #0A0A0F;
        }

        .tab-bar {
            display: flex;
            padding: 0 8px 8px 8px;
            gap: 4px;
        }

        .tab-item {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            border: none;
            text-decoration: none;
            display: block;
            font-family: 'Inter', sans-serif;
        }

        .tab-item.active {
            color: #fff;
            font-weight: 600;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .filter-bar {
            display: flex;
            gap: 6px;
            padding: 4px 12px 10px 12px;
            overflow-x: auto;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            color: rgba(255,255,255,0.65);
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
        }
        .filter-chip i { font-size: 11px; }
        .filter-chip.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.5);
            color: #fff;
        }
        .filter-chip .filter-count {
            background: rgba(139, 92, 246, 0.4);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 8px;
            margin-left: 2px;
        }
        .filter-chip.active .filter-count {
            background: rgba(255,255,255,0.25);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0 80px 0;
            scroll-behavior: smooth;
        }

        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 300px;
            padding: 20px;
        }
        .empty-icon { font-size: 80px; color: rgba(255,255,255,0.1); margin-bottom: 16px; }
        .empty-title { color: rgba(255,255,255,0.3); font-size: 16px; margin-bottom: 8px; }
        .empty-subtitle { color: rgba(255,255,255,0.2); font-size: 13px; }

        .section-header {
            font-size: 11px;
            font-weight: 700;
            color: rgba(139, 92, 246, 0.85);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 14px 20px 6px 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-header i { font-size: 10px; }

        .chat-list { list-style: none; }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            border-radius: 8px;
            margin: 0 4px;
            text-decoration: none;
            color: inherit;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            position: relative;
            touch-action: pan-y;
        }

        .chat-item:hover { background: rgba(255,255,255,0.03); }

        .chat-item.long-pressing {
            background: rgba(139, 92, 246, 0.12);
            transform: scale(0.98);
        }

        .chat-item.selected {
            background: rgba(139, 92, 246, 0.15) !important;
            border-radius: 12px;
        }
        .chat-item.selected::before {
            content: '';
            position: absolute;
            left: 4px; top: 4px; bottom: 4px;
            width: 3px;
            background: linear-gradient(180deg, #8B5CF6, #06B6D4);
            border-radius: 3px;
        }

        /* TOP SELECTION ACTION BAR */
        .selection-bar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(-100%);
            max-width: 480px;
            width: 100%;
            background: rgba(20, 14, 45, 0.98);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.25);
            z-index: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 14px 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 68px;
        }
        .selection-bar.show {
            transform: translateX(-50%) translateY(0);
        }
        .selection-bar .sb-close {
            background: none;
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
        }
        .selection-bar .sb-close:hover { background: rgba(255,255,255,0.08); }
        .selection-bar .sb-count {
            flex: 1;
            min-width: 0;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .selection-bar .sb-count .sb-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
        }
        .selection-bar .sb-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .selection-bar .sb-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.85);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 17px;
            transition: background 0.15s, transform 0.15s;
        }
        .selection-bar .sb-btn:hover { background: rgba(255,255,255,0.08); }
        .selection-bar .sb-btn:active { transform: scale(0.9); }
        .selection-bar .sb-btn.danger { color: #ef4444; }
        .selection-bar .sb-btn.active { color: #8B5CF6; }

        .chat-item.saved-messages-item .chat-avatar {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
        }
        .chat-item.saved-messages-item .chat-avatar i {
            color: #fff;
            font-size: 18px;
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #1a103c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-avatar .avatar-icon { color: #8B5CF6; font-size: 18px; }
        .chat-avatar .avatar-initial { color: #fff; font-size: 18px; font-weight: 700; }

        .chat-avatar.bot-avatar {
            background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(6,182,212,0.25));
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        /* ONLINE DOT */
        .chat-avatar .online-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #22c55e;
            border: 2.5px solid #0A0A0F;
            display: none;
            z-index: 2;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }
        .chat-avatar .online-dot.show { display: block; }

        /* STATUS RING */
        .chat-avatar.status-ring {
            padding: 2.5px;
            background: linear-gradient(135deg, #22c55e, #06B6D4, #8B5CF6);
            background-size: 200% 200%;
            animation: statusSpin 4s linear infinite;
            border-radius: 50%;
        }
        .chat-avatar.status-ring.seen {
            background: rgba(255,255,255,0.18);
            animation: none;
        }
        @keyframes statusSpin {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .chat-avatar.status-ring > .avatar-content {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #1a103c;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .chat-avatar.status-ring > .avatar-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-avatar.status-ring .status-new-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ef4444;
            border: 2.5px solid #0A0A0F;
            display: none;
            z-index: 3;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
            animation: newStatusPulse 1.8s ease-in-out infinite;
        }
        .chat-avatar.status-ring.unseen .status-new-dot { display: block; }
        @keyframes newStatusPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(239, 68, 68, 0.7); }
            50% { transform: scale(1.15); box-shadow: 0 0 14px rgba(239, 68, 68, 0.9); }
        }

        .chat-info { flex: 1; margin-left: 14px; min-width: 0; }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .chat-name {
            font-weight: 600;
            font-size: 14.5px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            flex: 1;
        }

        .chat-name .name-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-name .verified-badge {
            color: #1DA1F2;
            font-size: 12px;
            flex-shrink: 0;
        }

        .chat-name .bot-badge {
            font-size: 8.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            padding: 1px 5px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .chat-time {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            flex-shrink: 0;
        }

        .chat-time.unread-time {
            color: #8B5CF6;
            font-weight: 600;
        }

        .chat-subtitle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
            gap: 8px;
        }

        .chat-last-message {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-last-message .prefix-icon {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
        }

        .chat-last-message.has-unread {
            color: rgba(255,255,255,0.75);
            font-weight: 500;
        }

        .chat-last-message.is-draft {
            color: #FBBF24;
            font-weight: 500;
        }
        .chat-last-message.is-draft .draft-label {
            color: #FBBF24;
            font-weight: 700;
            margin-right: 2px;
        }

        .chat-last-message.is-typing {
            color: #06B6D4;
            font-weight: 600;
        }
        .chat-last-message.is-typing .typing-text {
            color: #06B6D4;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-last-message.is-typing .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            margin-left: 4px;
        }
        .chat-last-message.is-typing .typing-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #06B6D4;
            animation: typingDot 1.4s infinite ease-in-out both;
        }
        .chat-last-message.is-typing .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .chat-last-message.is-typing .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingDot {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1.1); opacity: 1; }
        }

        .chat-unread {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(139, 92, 246, 0.4);
        }
        .chat-unread.muted {
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            box-shadow: none;
        }

        .chat-pin-icon {
            color: rgba(255,255,255,0.35);
            font-size: 11px;
            flex-shrink: 0;
        }

        .chat-mute-icon {
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            flex-shrink: 0;
        }

        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            max-width: 480px;
            width: calc(100% - 60px);
            display: flex;
            justify-content: flex-end;
            pointer-events: none;
        }

        .fab {
            pointer-events: auto;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover { transform: scale(1.05); box-shadow: 0 12px 30px rgba(139, 92, 246, 0.5); }
        .fab:active { transform: scale(0.95); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #1a103c;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            padding: 20px;
            animation: slideUp 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 0 auto 20px auto;
        }

        .modal-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
            text-decoration: none;
            color: inherit;
            font-family: 'Inter', sans-serif;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .modal-item:hover { background: rgba(255,255,255,0.05); }

        .modal-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 18px;
            flex-shrink: 0;
        }

        .modal-item-label { color: #fff; font-size: 15px; }
        .modal-item.danger .modal-item-label { color: #ef4444; }
        .modal-item.danger .modal-item-icon {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .context-menu-content {
            background: #1a103c;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 12px 12px 20px 12px;
            animation: slideUp 0.24s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .context-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 8px;
        }

        .context-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            background: #1a103c;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .context-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .context-header-avatar i { color: #8B5CF6; font-size: 16px; }

        .context-header-info { flex: 1; min-width: 0; }

        .context-header-name {
            font-size: 14.5px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .context-header-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 2px;
        }

        .context-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            padding: 4px;
        }

        .context-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 8px;
            border-radius: 14px;
            background: rgba(255,255,255,0.03);
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        .context-option:hover { background: rgba(139, 92, 246, 0.1); }
        .context-option:active { transform: scale(0.96); }

        .context-option-icon {
            font-size: 20px;
            color: #8B5CF6;
        }

        .context-option-label {

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
    authDomain: "aurachat-85f54.firebaseapp.com",
    projectId: "aurachat-85f54",
    storageBucket: "aurachat-85f54.firebasestorage.app",
    messagingSenderId: "539789121540",
    appId: "1:539789121540:web:96ac597e52dd0a80573d51"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let allChats = [];
let isLoading = true;
let currentUserId = null;
let currentUserEmail = '';

let currentFilter = 'all';
let showArchiveOnly = false;
let drafts = {};

const userCache = {};

/* Status + typing + multiselect state */
let statusesByOwner = {};
const SEEN_STATUS_PREFIX = 'aura_status_seen_';
let typingByChat = {};
let typingUnsubscribers = {};
let typingRefreshTimer = null;
let multiSelectMode = false;
const selectedChatIds = new Set();

const chatsContainer = document.getElementById('chatsContainer');
const toast = document.getElementById('toast');
const selectionBar = document.getElementById('selectionBar');

function showToast(message, type = '') {
    toast.textContent = message;
    toast.className = 'toast show ' + type;
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 2800);
}

function checkAuth() {
    const userId = localStorage.getItem('mock_user_id');
    const email = localStorage.getItem('mock_email');
    if (userId && email) { currentUserId = userId; currentUserEmail = email; return true; }
    if (auth.currentUser) {
        currentUserId = auth.currentUser.uid;
        currentUserEmail = auth.currentUser.email || '';
        localStorage.setItem('mock_user_id', currentUserId);
        localStorage.setItem('mock_email', currentUserEmail);
        return true;
    }
    return false;
}

function isVerified(email) {
    if (!email) return false;
    const e = email.toLowerCase().trim();
    if (e.endsWith('@bot.aurachat.app')) return false;
    return e.endsWith('@gmail.com');
}

/* ─── FETCH USER (with online fields) ─── */
async function fetchUserData(userId) {
    if (!userId) return null;
    if (userCache[userId]) return userCache[userId];
    try {
        const doc = await db.collection('users').doc(userId).get();
        if (doc.exists) {
            const data = doc.data();
            const userData = {
                uid: userId,
                username: data.username || 'Unknown',
                display_name: data.display_name || data.username || data.name || 'Unknown',
                avatar_url: data.avatar_url || null,
                email: data.email || null,
                is_bot: data.is_bot === true,
                about: data.about || '',
                is_verified: isVerified(data.email),
                is_online: data.is_online === true,
                last_seen: data.last_seen || null
            };
            userCache[userId] = userData;
            return userData;
        }
    } catch(e) {}
    const fallback = { uid: userId, username: 'Unknown', display_name: 'Unknown', avatar_url: null, email: null, is_bot: false, about: '', is_verified: false, is_online: false, last_seen: null };
    userCache[userId] = fallback;
    return fallback;
}

/* ─── ONLINE STATUS — live subscribe per user ─── */
const onlineStatusSubs = {};
function subscribeToOnlineStatus(userId) {
    if (!userId || onlineStatusSubs[userId]) return;
    onlineStatusSubs[userId] = db.collection('users').doc(userId).onSnapshot(doc => {
        if (!doc.exists) return;
        const d = doc.data();
        const isOnline = d.is_online === true;
        if (userCache[userId]) {
            userCache[userId].is_online = isOnline;
            userCache[userId].last_seen = d.last_seen || null;
        }
        const chat = allChats.find(c => c.otherUserId === userId);
        if (chat) {
            chat.otherUser = userCache[userId];
            const el = document.querySelector('.chat-item[data-chat-id="' + chat.id + '"]');
            if (el) {
                const dot = el.querySelector('.online-dot');
                if (dot) dot.classList.toggle('show', isOnline);
            }
        }
    }, () => {});
}

/* ─── STATUS ─── */
let statusesUnsub = null;
function loadSeenStatuses() {
    try { const raw = localStorage.getItem(SEEN_STATUS_PREFIX + currentUserId); return raw ? JSON.parse(raw) : {}; } catch(e) { return {}; }
}
function saveSeenStatuses(obj) {
    try { localStorage.setItem(SEEN_STATUS_PREFIX + currentUserId, JSON.stringify(obj)); } catch(e) {}
}
function hasUnseenStatus(ownerId) {
    const posts = statusesByOwner[ownerId] || [];
    if (posts.length === 0 || ownerId === currentUserId) return false;
    const seen = loadSeenStatuses();
    const seenIds = seen[ownerId] || [];
    return posts.some(p => !seenIds.includes(p.id));
}
function markStatusSeenForOwner(ownerId) {
    const posts = statusesByOwner[ownerId] || [];
    if (posts.length === 0) return;
    const seen = loadSeenStatuses();
    const seenIds = seen[ownerId] || [];
    posts.forEach(p => { if (!seenIds.includes(p.id)) seenIds.push(p.id); });
    seen[ownerId] = seenIds;
    saveSeenStatuses(seen);
}
function subscribeToStatuses() {
    if (statusesUnsub) return;
    const now = new Date();
    statusesUnsub = db.collection('statuses').where('expires_at', '>', now).onSnapshot(snap => {
        statusesByOwner = {};
        snap.forEach(doc => {
            const d = doc.data(); d.id = doc.id;
            const owner = d.owner_id;
            if (!owner) return;
            if (!statusesByOwner[owner]) statusesByOwner[owner] = [];
            statusesByOwner[owner].push(d);
        });
        Object.keys(statusesByOwner).forEach(k => {
            statusesByOwner[k].sort((a, b) => {
                const at = a.created_at && a.created_at.toDate ? a.created_at.toDate().getTime() : 0;
                const bt = b.created_at && b.created_at.toDate ? b.created_at.toDate().getTime() : 0;
                return at - bt;
            });
        });
        renderChats();
    }, () => {});
}

/* ─── TYPING ─── */
function subscribeToTyping(chatId) {
    if (!chatId || typingUnsubscribers[chatId]) return;
    typingUnsubscribers[chatId] = db.collection('chats').doc(chatId).collection('typing').onSnapshot(snap => {
        const users = {};
        snap.forEach(doc => {
            const uid = doc.id;
            if (uid === currentUserId) return;
            const d = doc.data();
            if (!d.is_typing) return;
            const ts = d.timestamp && d.timestamp.toDate ? d.timestamp.toDate().getTime() : Date.now();
            if (Date.now() - ts < 8000) users[uid] = ts;
        });
        typingByChat[chatId] = users;
        updateChatTypingUI(chatId);
    }, () => {});
}
function updateChatTypingUI(chatId) {
    const el = document.querySelector('.chat-item[data-chat-id="' + chatId + '"]');
    if (!el) return;
    const users = typingByChat[chatId] || {};
    const uids = Object.keys(users);
    if (uids.length === 0) { renderChats(); return; }
    const chat = allChats.find(c => c.id === chatId);
    if (!chat) return;
    const previewEl = el.querySelector('.chat-last-message');
    if (previewEl) {
        previewEl.className = 'chat-last-message is-typing';
        previewEl.innerHTML = buildTypingHTML(chat, uids);
    }
}
function buildTypingHTML(chat, uids) {
    const isGroup = chat.type === 'group' || chat.type === 'channel';
    const names = uids.map(uid => {
        const u = userCache[uid];
        return (u && (u.display_name || u.username)) || 'User';
    });
    let text = '';
    if (!isGroup) text = (names[0] || 'User') + ' is typing';
    else {
        if (names.length === 1) text = names[0] + ' is typing';
        else if (names.length === 2) text = names[0] + ' and ' + names[1] + ' are typing';
        else if (names.length === 3) text = names[0] + ', ' + names[1] + ' and ' + names[2] + ' are typing';
        else text = names[0] + ', ' + names[1] + ' and ' + (names.length - 2) + ' others are typing';
    }
    return '<span class="typing-text">' + escapeHtml(text) + '</span><span class="typing-dots"><span></span><span></span><span></span></span>';
}
function startTypingRefresh() {
    if (typingRefreshTimer) return;
    typingRefreshTimer = setInterval(() => {
        Object.keys(typingByChat).forEach(chatId => {
            const users = typingByChat[chatId] || {};
            let changed = false;
            Object.keys(users).forEach(uid => { if (Date.now() - users[uid] > 8000) { delete users[uid]; changed = true; } });
            if (changed) renderChats();
        });
    }, 3000);
}

function getUnreadCount(chat) {
    const perUser = chat.unread_counts || {};
    return perUser[currentUserId] || 0;
}

function loadDrafts() {
    drafts = {};
    try {
        const prefix = 'aura_draft_';
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.indexOf(prefix) === 0) {
                const chatId = key.substring(prefix.length);
                const val = localStorage.getItem(key);
                if (val && val.trim()) drafts[chatId] = val;
            }
        }
    } catch (e) {}
}

async function loadChats() {
    if (!currentUserId) { showEmptyChats(); return; }
    isLoading = true;
    showLoading();
    try {
        const snapshot = await db.collection('chats')
            .where('participants', 'array-contains', currentUserId)
            .orderBy('last_message_at', 'desc')
            .get();
        allChats = [];
        const fetchPromises = [];
        for (const doc of snapshot.docs) {
            const chat = doc.data();
            chat.id = doc.id;
            if ((chat.deleted_for || []).includes(currentUserId)) continue;
            chat.is_archived = (chat.archived_for || []).includes(currentUserId);
            chat.is_muted = (chat.muted_for || []).includes(currentUserId);
            chat.is_pinned = (chat.pinned_for || []).includes(currentUserId);
            const chatType = chat.type || 'direct';
            if (chatType === 'direct') {
                const otherUserId = (chat.participants || []).find(id => id !== currentUserId);
                if (otherUserId) {
                    chat.otherUserId = otherUserId;
                    if (userCache[otherUserId]) chat.otherUser = userCache[otherUserId];
                    else fetchPromises.push(fetchUserData(otherUserId).then(u => { chat.otherUser = u; }));
                }
            }
            chat.unread_count = getUnreadCount(chat);
            allChats.push(chat);
        }
        await Promise.all(fetchPromises);
        allChats.forEach(c => {
            if (c.type === 'direct' && c.otherUserId) subscribeToOnlineStatus(c.otherUserId);
            subscribeToTyping(c.id);
        });
        updateArchiveBadge();
        renderChats();
    } catch(e) {
        showToast('Error loading chats', 'error');
        showEmptyChats();
    }
    isLoading = false;
}

function subscribeToChats() {
    if (!currentUserId) return;
    db.collection('chats')
        .where('participants', 'array-contains', currentUserId)
        .orderBy('last_message_at', 'desc')
        .onSnapshot(async (snapshot) => {
            const newChats = [];
            const fetchPromises = [];
            for (const doc of snapshot.docs) {
                const chat = doc.data();
                chat.id = doc.id;
                if ((chat.deleted_for || []).includes(currentUserId)) continue;
                chat.is_archived = (chat.archived_for || []).includes(currentUserId);
                chat.is_muted = (chat.muted_for || []).includes(currentUserId);
                chat.is_pinned = (chat.pinned_for || []).includes(currentUserId);
                const chatType = chat.type || 'direct';
                if (chatType === 'direct') {
                    const otherUserId = (chat.participants || []).find(id => id !== currentUserId);
                    if (otherUserId) {
                        chat.otherUserId = otherUserId;
                        if (userCache[otherUserId]) chat.otherUser = userCache[otherUserId];
                        else fetchPromises.push(fetchUserData(otherUserId).then(u => { chat.otherUser = u; }));
                    }
                }
                chat.unread_count = getUnreadCount(chat);
                newChats.push(chat);
            }
            await Promise.all(fetchPromises);
            allChats = newChats;
            allChats.forEach(c => {
                if (c.type === 'direct' && c.otherUserId) subscribeToOnlineStatus(c.otherUserId);
                subscribeToTyping(c.id);
            });
            updateArchiveBadge();
            renderChats();
        }, () => {});
}

function updateArchiveBadge() {
    const archivedCount = allChats.filter(c => c.is_archived).length;
    const badge = document.getElementById('archiveBadge');
    if (archivedCount > 0) {
        badge.textContent = archivedCount > 99 ? '99+' : archivedCount;
        badge.style.display = 'flex';
    } else badge.style.display = 'none';
}

function toggleArchiveView() {
    showArchiveOnly = !showArchiveOnly;
    document.getElementById('archiveBtn').classList.toggle('active', showArchiveOnly);
    if (showArchiveOnly) {
        currentFilter = 'all';
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === 'all'));
    }
    renderChats();
}

function setFilter(filter) {
    currentFilter = filter;
    showArchiveOnly = false;
    document.getElementById('archiveBtn').classList.remove('active');
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === filter));
    renderChats();
}

function applyFilter(chats) {
    let filtered = chats;
    if (showArchiveOnly) filtered = filtered.filter(c => c.is_archived);
    else filtered = filtered.filter(c => !c.is_archived);
    if (currentFilter === 'unread') filtered = filtered.filter(c => c.unread_count > 0);
    else if (currentFilter === 'groups') filtered = filtered.filter(c => c.type === 'group');
    else if (currentFilter === 'personal') filtered = filtered.filter(c => (c.type || 'direct') === 'direct');
    else if (currentFilter === 'channels') filtered = filtered.filter(c => c.type === 'channel');
    else if (currentFilter === 'bots') filtered = filtered.filter(c => c.type === 'bot');
    return filtered;
}

function updateUnreadChip() {
    const unreadTotal = allChats.filter(c => !c.is_archived && c.unread_count > 0).length;
    const chip = document.getElementById('unreadCount');
    if (unreadTotal > 0) { chip.textContent = unreadTotal > 99 ? '99+' : unreadTotal; chip.style.display = 'inline-flex'; }
    else chip.style.display = 'none';
}

function renderChats() {
    if (isLoading) { showLoading(); return; }
    updateUnreadChip();
    const visibleChats = applyFilter(allChats);
    if (visibleChats.length === 0) { showEmptyChats(showArchiveOnly ? 'archive' : currentFilter); return; }
    visibleChats.sort((a, b) => {
        if (a.is_pinned && !b.is_pinned) return -1;
        if (!a.is_pinned && b.is_pinned) return 1;
        const aT = a.last_message_at?.toMillis?.() || 0;
        const bT = b.last_message_at?.toMillis?.() || 0;
        return bT - aT;
    });
    const pinned = visibleChats.filter(c => c.is_pinned);
    const normal = visibleChats.filter(c => !c.is_pinned);
    let html = '';
    if (showArchiveOnly) html += `<div class="section-header"><i class="fas fa-box-archive"></i> Archived Chats</div>`;
    if (!showArchiveOnly && (currentFilter === 'all' || currentFilter === 'personal')) {
        html += '<ul class="chat-list">' + buildSavedMessagesItem() + '</ul>';
    }
    if (pinned.length > 0) {
        html += `<div class="section-header"><i class="fas fa-thumbtack"></i> Pinned</div><ul class="chat-list">`;
        pinned.forEach(c => { html += buildChatItem(c); });
        html += '</ul>';
    }
    if (normal.length > 0) {
        if (pinned.length > 0) html += `<div class="section-header"><i class="fas fa-comment"></i> All Chats</div>`;
        html += '<ul class="chat-list">';
        normal.forEach(c => { html += buildChatItem(c); });
        html += '</ul>';
    }
    chatsContainer.innerHTML = html;
    attachChatListeners();
    attachSavedListeners();
    if (multiSelectMode) updateSelectionBar();
}

function buildSavedMessagesItem() {
    return `
        <a href="saved.html" class="chat-item saved-messages-item" data-saved="true">
            <div class="chat-avatar" style="background: linear-gradient(135deg, #8B5CF6, #06B6D4);">
                <i class="fas fa-bookmark" style="color: #fff; font-size: 18px;"></i>
            </div>
            <div class="chat-info">
                <div class="chat-header">
                    <span class="chat-name"><span class="name-text">Saved Messages</span></span>
                    <span class="chat-time"></span>
                </div>
                <div class="chat-subtitle">
                    <span class="chat-last-message"><span>Your personal cloud storage</span></span>
                </div>
            </div>
        </a>
    `;
}

function attachSavedListeners() {
    const savedItem = document.querySelector('.chat-item[data-saved="true"]');
    if (!savedItem) return;
    savedItem.addEventListener('contextmenu', (e) => { e.preventDefault(); showToast('Saved Messages is system', ''); });
}

function buildChatItem(chat) {
    const chatType = chat.type || 'direct';
    const isGroup = chatType === 'group';
    const isChannel = chatType === 'channel';
    const isBot = chatType === 'bot';

    let name = '';
    let avatar = '';
    let verified = false;
    let isBotUser = isBot;
    let isOtherOnline = false;

    if (chatType === 'direct' && chat.otherUser) {
        name = chat.otherUser.display_name || chat.otherUser.username || 'Unknown';
        avatar = chat.otherUser.avatar_url;
        verified = chat.otherUser.is_verified || false;
        isBotUser = chat.otherUser.is_bot === true;
        isOtherOnline = chat.otherUser.is_online === true;
    } else {
        name = chat.name || 'Unknown';
        avatar = chat.avatar_url || null;
    }

    const lastMessage = chat.last_message || '';
    const time = chat.last_message_at || null;
    const unread = chat.unread_count || 0;
    const chatId = chat.id;
    const hasDraft = drafts[chatId] && drafts[chatId].trim().length > 0;
    const draftText = hasDraft ? drafts[chatId] : '';

    const typingUsers = typingByChat[chatId] || {};
    const typingUids = Object.keys(typingUsers);
    const isTyping = typingUids.length > 0;

    const statusOwnerId = chatType === 'direct' ? chat.otherUserId : null;
    const ownerStatuses = statusOwnerId ? (statusesByOwner[statusOwnerId] || []) : [];
    const hasStatus = ownerStatuses.length > 0;
    const hasUnseen = hasStatus && hasUnseenStatus(statusOwnerId);
    const seenAll = hasStatus && !hasUnseen;

    let avatarClass = 'chat-avatar';
    if (isBotUser) avatarClass += ' bot-avatar';

    let innerAvatarHTML = '';
    if (avatar) innerAvatarHTML = `<img src="${avatar}" alt="" />`;
    else if (chatType === 'direct') innerAvatarHTML = `<div class="avatar-initial">${(name || 'U')[0].toUpperCase()}</div>`;
    else if (isBot) innerAvatarHTML = `<i class="fas fa-robot avatar-icon"></i>`;
    else if (isChannel) innerAvatarHTML = `<i class="fas fa-bullhorn avatar-icon"></i>`;
    else innerAvatarHTML = `<i class="fas fa-users avatar-icon"></i>`;

    const onlineDot = (chatType === 'direct' && !isBotUser)
        ? `<div class="online-dot ${isOtherOnline ? 'show' : ''}"></div>` : '';
    const statusDot = `<div class="status-new-dot"></div>`;

    let avatarHTML = '';
    if (hasStatus && chatType === 'direct' && !isBotUser) {
        const ringClasses = 'chat-avatar status-ring' + (seenAll ? ' seen' : '') + (hasUnseen ? ' unseen' : '');
        avatarHTML = `
            <div class="${ringClasses}" data-status-owner="${statusOwnerId}">
                <div class="avatar-content">${innerAvatarHTML}</div>
                ${statusDot}
                ${onlineDot}
            </div>`;
    } else {
        avatarHTML = `<div class="${avatarClass}">${innerAvatarHTML}${onlineDot}</div>`;
    }

    const timeStr = time ? formatTime(time) : '';
    const unreadHtml = unread > 0 ? `<span class="chat-unread ${chat.is_muted ? 'muted' : ''}">${unread > 99 ? '99+' : unread}</span>` : '';

    let badges = '';
    if (isBot || isBotUser) badges += `<span class="bot-badge">BOT</span>`;
    if (verified) badges += `<span class="verified-badge"><i class="fas fa-check-circle"></i></span>`;
    if (chat.is_muted) badges += `<i class="fas fa-bell-slash chat-mute-icon"></i>`;

    let prefixIcon = '';
    const msg = lastMessage;
    if (msg.startsWith('📷')) prefixIcon = '<i class="fas fa-camera prefix-icon"></i>';
    else if (msg.startsWith('🎥')) prefixIcon = '<i class="fas fa-video prefix-icon"></i>';
    else if (msg.startsWith('🎤')) prefixIcon = '<i class="fas fa-microphone prefix-icon"></i>';
    else if (msg.startsWith('📎')) prefixIcon = '<i class="fas fa-paperclip prefix-icon"></i>';
    else if (msg.startsWith('📍')) prefixIcon = '<i class="fas fa-map-marker-alt prefix-icon"></i>';
    else if (msg.startsWith('👤')) prefixIcon = '<i class="fas fa-address-card prefix-icon"></i>';
    else if (msg.startsWith('📊')) prefixIcon = '<i class="fas fa-poll prefix-icon"></i>';

    let lastMsgClass = 'chat-last-message';
    let lastMsgContent = '';
    if (isTyping) {
        lastMsgClass += ' is-typing';
        lastMsgContent = buildTypingHTML(chat, typingUids);
    } else if (hasDraft) {
        lastMsgClass += ' is-draft';
        lastMsgContent = `<span class="draft-label">Draft:</span><span>${escapeHtml(draftText)}</span>`;
    } else {
        if (unread > 0) lastMsgClass += ' has-unread';
        lastMsgContent = `${prefixIcon}<span>${escapeHtml(msg)}</span>`;
    }

    const timeClass = unread > 0 ? 'chat-time unread-time' : 'chat-time';
    const pinIcon = chat.is_pinned ? `<i class="fas fa-thumbtack chat-pin-icon"></i>` : '';

    let href = '';
    if (isBot) href = `bot.html?id=${chatId}`;
    else if (isChannel) href = `channel.html?id=${chatId}&name=${encodeURIComponent(name)}`;
    else if (isGroup) href = `group.html?id=${chatId}&name=${encodeURIComponent(name)}`;
    else href = `chat.html?id=${chatId}&name=${encodeURIComponent(name)}&avatar=${encodeURIComponent(avatar || '')}`;

    const selectedClass = selectedChatIds.has(chatId) ? ' selected' : '';

    /* <div> instead of <a> — navigation handled in JS */
    return `
        <div class="chat-item${selectedClass}" data-chat-id="${chatId}" data-href="${href}">
            ${avatarHTML}
            <div class="chat-info">
                <div class="chat-header">
                    <span class="chat-name">
                        <span class="name-text">${escapeHtml(name)}</span>
                        ${badges}
                    </span>
                    <span class="${timeClass}">${timeStr}</span>
                </div>
                <div class="chat-subtitle">
                    <span class="${lastMsgClass}">
                        ${pinIcon}
                        ${lastMsgContent}
                    </span>
                    ${unreadHtml}
                </div>
            </div>
        </div>
    `;
}

/* ═══════════════════════════════════════════════════════════
   LONG-PRESS + TAP — since we use <div>, no nav conflict
   ═══════════════════════════════════════════════════════════ */
function attachChatListeners() {
    document.querySelectorAll('.chat-item').forEach(el => {
        const chatId = el.dataset.chatId;
        const href = el.dataset.href;
        if (!chatId) return;

        let pressTimer = null;
        let startX = 0, startY = 0;
        let longPressed = false;
        let moved = false;

        const clearT = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };

        const onDown = (x, y) => {
            moved = false;
            longPressed = false;
            startX = x; startY = y;
            el.classList.add('long-pressing');
            clearT();
            pressTimer = setTimeout(() => {
                pressTimer = null;
                longPressed = true;
                el.classList.remove('long-pressing');
                if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e) {} }
                if (multiSelectMode) toggleChatSelection(chatId);
                else enterMultiSelect(chatId);
                setTimeout(() => { longPressed = false; }, 500);
            }, 450);
        };

        const onMove = (x, y) => {
            if (Math.abs(x - startX) > 15 || Math.abs(y - startY) > 15) {
                moved = true;
                clearT();
                el.classList.remove('long-pressing');
            }
        };

        const onUp = () => {
            clearT();
            el.classList.remove('long-pressing');
        };

        /* Touch */
        el.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            onDown(t.clientX, t.clientY);
        }, { passive: true });

        el.addEventListener('touchmove', (e) => {
            if (!e.touches.length) return;
            const t = e.touches[0];
            onMove(t.clientX, t.clientY);
        }, { passive: true });

        el.addEventListener('touchend', (e) => {
            if (longPressed) { e.preventDefault(); e.stopPropagation(); }
            const wasLong = longPressed;
            onUp();
            if (wasLong) { setTimeout(() => { longPressed = false; }, 400); return; }
            if (moved) return;
            handleChatTap(e, chatId, href, el);
        }, { passive: false });

        el.addEventListener('touchcancel', () => { onUp(); longPressed = false; });

        /* Mouse (desktop) */
        el.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            onDown(e.clientX, e.clientY);
        });
        el.addEventListener('mousemove', (e) => { if (pressTimer) onMove(e.clientX, e.clientY); });
        el.addEventListener('mouseup', (e) => {
            if (longPressed) { e.preventDefault(); e.stopPropagation(); onUp(); return; }
            if (moved) { onUp(); return; }
            onUp();
            handleChatTap(e, chatId, href, el);
        });
        el.addEventListener('mouseleave', () => { onUp(); });

        el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (multiSelectMode) toggleChatSelection(chatId);
            else enterMultiSelect(chatId);
        });
    });
}

function handleChatTap(e, chatId, href, el) {
    if (multiSelectMode) {
        if (e && e.preventDefault) e.preventDefault();
        toggleChatSelection(chatId);
        return;
    }
    /* Status ring tap */
    const ring = e && e.target && e.target.closest ? e.target.closest('.status-ring') : null;
    if (ring && ring.dataset.statusOwner) {
        if (e && e.preventDefault) e.preventDefault();
        const ownerId = ring.dataset.statusOwner;
        markStatusSeenForOwner(ownerId);
        window.location.href = 'status.html?userId=' + encodeURIComponent(ownerId);
        return;
    }
    if (href) window.location.href = href;
}

/* ═══ MULTI-SELECT ═══ */
function enterMultiSelect(initialId) {
    multiSelectMode = true;
    selectedChatIds.clear();
    if (initialId) selectedChatIds.add(initialId);
    selectionBar.classList.add('show');
    renderChats();
}
function exitMultiSelect() {
    multiSelectMode = false;
    selectedChatIds.clear();
    selectionBar.classList.remove('show');
    renderChats();
}
function toggleChatSelection(chatId) {
    if (selectedChatIds.has(chatId)) selectedChatIds.delete(chatId);
    else selectedChatIds.add(chatId);
    if (selectedChatIds.size === 0) { exitMultiSelect(); return; }
    updateSelectionBar();
    const el = document.querySelector('.chat-item[data-chat-id="' + chatId + '"]');
    if (el) el.classList.toggle('selected', selectedChatIds.has(chatId));
}
function updateSelectionBar() {
    const count = selectedChatIds.size;
    document.getElementById('sbCountText').textContent = count + ' selected';
    const chats = Array.from(selectedChatIds).map(id => allChats.find(c => c.id === id)).filter(Boolean);
    const allPinned = chats.length > 0 && chats.every(c => c.is_pinned);
    const allMuted = chats.length > 0 && chats.every(c => c.is_muted);
    const allArchived = chats.length > 0 && chats.every(c => c.is_archived);
    const allUnread = chats.length > 0 && chats.every(c => c.unread_count > 0);
    document.getElementById('sbPin').classList.toggle('active', allPinned);
    document.getElementById('sbMute').classList.toggle('active', allMuted);
    document.getElementById('sbArchive').classList.toggle('active', allArchived);
    document.getElementById('sbRead').classList.toggle('active', allUnread);
}
async function bulkPin() {
    const chats = Array.from(selectedChatIds).map(id => allChats.find(c => c.id === id)).filter(Boolean);
    if (!chats.length) return;
    const allPinned = chats.every(c => c.is_pinned);
    try {
        const b = db.batch();
        chats.forEach(c => b.update(db.collection('chats').doc(c.id), {
            pinned_for: allPinned ? firebase.firestore.FieldValue.arrayRemove(currentUserId) : firebase.firestore.FieldValue.arrayUnion(currentUserId)
        }));
        await b.commit();
        showToast(allPinned ? 'Unpinned' : 'Pinned', 'success');
        exitMultiSelect();
    } catch(e) { showToast('Failed', 'error'); }
}
async function bulkMute() {
    const chats = Array.from(selectedChatIds).map(id => allChats.find(c => c.id === id)).filter(Boolean);
    if (!chats.length) return;
    const allMuted = chats.every(c => c.is_muted);
    try {
        const b = db.batch();
        chats.forEach(c => b.update(db.collection('chats').doc(c.id), {
            muted_for: allMuted ? firebase.firestore.FieldValue.arrayRemove(currentUserId) : firebase.firestore.FieldValue.arrayUnion(currentUserId)
        }));
        await b.commit();
        showToast(allMuted ? 'Unmuted' : 'Muted', 'success');
        exitMultiSelect();
    } catch(e) { showToast('Failed', 'error'); }
}
async function bulkMarkRead() {
    const chats = Array.from(selectedChatIds).map(id => allChats.find(c => c.id === id)).filter(Boolean);
    if (!chats.length) return;
    const allUnread = chats.every(c => c.unread_count > 0);
    try {
        const b = db.batch();
        chats.forEach(c => b.update(db.collection('chats').doc(c.id), { ['unread_counts.' + currentUserId]: allUnread ? 0 : 1 }));
        await b.commit();
        showToast(allUnread ? 'Marked as read' : 'Marked as unread', 'success');
        exitMultiSelect();
    } catch(e) { showToast('Failed', 'error'); }
}
async function bulkArchive() {
    const chats = Array.from(selectedChatIds).map(id => allChats.find(c => c.id === id)).filter(Boolean);
    if (!chats.length) return;
    const allArchived = chats.every(c => c.is_archived);
    try {
        const b = db.batch();
        chats.forEach(c => b.update(db.collection('chats').doc(c.id), {
            archived_for: allArchived ? firebase.firestore.FieldValue.arrayRemove(currentUserId) : firebase.firestore.FieldValue.arrayUnion(currentUserId)
        }));
        await b.commit();
        showToast(allArchived ? 'Unarchived' : 'Archived', 'success');
        exitMultiSelect();
    } catch(e) { showToast('Failed', 'error'); }
}
function bulkDelete() {
    const count = selectedChatIds.size;
    if (!count) return;
    showConfirm('Delete ' + count + ' chat' + (count > 1 ? 's' : '') + '?', 'These chats will be removed from your list.', async () => {
        try {
            const b = db.batch();
            selectedChatIds.forEach(id => b.update(db.collection('chats').doc(id), { deleted_for: firebase.firestore.FieldValue.arrayUnion(currentUserId) }));
            await b.commit();
            showToast(count + ' deleted', 'success');
            exitMultiSelect();
        } catch(e) { showToast('Failed', 'error'); }
    });
}

/* ═══ CONTEXT / CONFIRM / HELPERS (kept from original) ═══ */
let selectedChat = null;
function openContextMenu(chat) {
    selectedChat = chat;
    const chatType = chat.type || 'direct';
    const isBot = chatType === 'bot';
    let name = '', avatar = '', sub = '';
    if (chatType === 'direct' && chat.otherUser) {
        name = chat.otherUser.display_name || chat.otherUser.username || 'Unknown';
        avatar = chat.otherUser.avatar_url;
        sub = '@' + (chat.otherUser.username || 'user');
    } else {
        name = chat.name || 'Chat';
        avatar = chat.avatar_url || null;
        sub = isBot ? 'Bot' : 'Chat';
    }
    const avEl = document.getElementById('contextAvatar');
    if (avatar) avEl.innerHTML = `<img src="${avatar}" />`;
    else if (isBot) avEl.innerHTML = `<i class="fas fa-robot"></i>`;
    else avEl.innerHTML = `<span style="color:#fff;font-weight:700;font-size:16px;">${(name[0] || 'U').toUpperCase()}</span>`;
    document.getElementById('contextName').textContent = name;
    document.getElementById('contextSub').textContent = sub;
    /* original context menu kept — not used for long-press anymore */
    openModal('contextMenu');
}

let pendingConfirm = null;
function showConfirm(title, text, onConfirm) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text;
    pendingConfirm = onConfirm;
    document.getElementById('confirmDialog').classList.add('active');
}
function closeDialog() {
    document.getElementById('confirmDialog').classList.remove('active');
    pendingConfirm = null;
}
async function runConfirm() {
    const fn = pendingConfirm;
    closeDialog();
    if (fn) await fn();
}

function showLoading() {
    chatsContainer.innerHTML = `<div class="loading-container"><div class="spinner"></div></div>`;
}
function showEmptyChats(context) {
    let title = 'No chats yet', subtitle = 'Tap + to start a conversation', icon = 'fa-comment-dots';
    if (context === 'archive') { title = 'No archived chats'; subtitle = 'Long-press a chat and choose Archive'; icon = 'fa-box-archive'; }
    else if (context === 'unread') { title = 'No unread chats'; subtitle = 'You are all caught up'; icon = 'fa-envelope-open'; }
    else if (context === 'groups') { title = 'No groups yet'; subtitle = 'Create or join a group'; icon = 'fa-users'; }
    else if (context === 'channels') { title = 'No channels yet'; subtitle = 'Follow channels to see updates'; icon = 'fa-bullhorn'; }
    chatsContainer.innerHTML = `<div class="empty-state"><div class="empty-icon"><i class="fas ${icon}"></i></div><div class="empty-title">${title}</div><div class="empty-subtitle">${subtitle}</div></div>`;
}
function formatTime(time) {
    if (!time) return '';
    let date;
    if (time.toDate) date = time.toDate();
    else if (time instanceof Date) date = time;
    else if (typeof time === 'string') date = new Date(time);
    else return '';
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    if (msgDate.getTime() === today.getTime()) return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (msgDate.getTime() === yesterday.getTime()) return 'Yesterday';
    if (now.getFullYear() === date.getFullYear()) return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
    return date.toLocaleDateString([], { year: '2-digit', month: 'short', day: 'numeric' });
}
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function handleFabClick() { openModal('newChatModal'); }
function showMenu() { openModal('menuModal'); }
function openModal(id) { document.getElementById(id).classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeModal(id) { document.getElementById(id).classList.remove('active'); document.body.style.overflow = ''; }

document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', (e) => {
        if (e.target === el) { el.classList.remove('active'); document.body.style.overflow = ''; }
    });
});

async function signOut() {
    try {
        await auth.signOut();
        localStorage.removeItem('mock_user_id');
        localStorage.removeItem('mock_email');
        window.location.href = 'email_verification.html';
    } catch (error) { showToast('Error signing out', 'error'); }
}

async function initApp() {
    if (!checkAuth()) {
        showToast('Please login first', 'error');
        setTimeout(() => { window.location.href = 'email_verification.html'; }, 1500);
        return;
    }
    loadDrafts();
    startTypingRefresh();
    subscribeToStatuses();
    await loadChats();
    subscribeToChats();
}

document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { loadDrafts(); renderChats(); }
});

document.addEventListener('DOMContentLoaded', () => {
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUserId = user.uid;
            currentUserEmail = user.email || '';
            localStorage.setItem('mock_user_id', currentUserId);
            localStorage.setItem('mock_email', currentUserEmail);
            initApp();
        } else {
            const userId = localStorage.getItem('mock_user_id');
            if (userId) {
                currentUserId = userId;
                currentUserEmail = localStorage.getItem('mock_email') || '';
                initApp();
            } else {
                window.location.href = 'email_verification.html';
            }
        }
    });
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (multiSelectMode) { exitMultiSelect(); return; }
        document.querySelectorAll('.modal-overlay.active').forEach(el => { el.classList.remove('active'); document.body.style.overflow = ''; });
        closeDialog();
    }
});
</script>
