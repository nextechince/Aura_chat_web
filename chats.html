<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Chats</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 10px; }

        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ═══ APP BAR ═══ */
        .sliver-app-bar {
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .app-bar-top {
            padding: 20px 16px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-bar-actions { display: flex; gap: 4px; }

        .app-bar-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .app-bar-actions button:hover { background: rgba(255,255,255,0.05); }

        /* ═══ TABS ═══ */
        .tab-bar {
            display: flex;
            padding: 0 8px 8px 8px;
            gap: 4px;
        }

        .tab-item {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            border: none;
            text-decoration: none;
            display: block;
            font-family: 'Inter', sans-serif;
        }

        .tab-item.active {
            color: #fff;
            font-weight: 600;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        /* ═══ TAB CONTENT ═══ */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0 80px 0;
            scroll-behavior: smooth;
        }

        /* ═══ LOADING ═══ */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ═══ EMPTY ═══ */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 300px;
            padding: 20px;
        }
        .empty-icon { font-size: 80px; color: rgba(255,255,255,0.1); margin-bottom: 16px; }
        .empty-title { color: rgba(255,255,255,0.3); font-size: 16px; margin-bottom: 8px; }
        .empty-subtitle { color: rgba(255,255,255,0.2); font-size: 13px; }

        /* ═══ SECTION HEADERS ═══ */
        .section-header {
            font-size: 11px;
            font-weight: 700;
            color: rgba(139, 92, 246, 0.85);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 14px 20px 6px 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-header i { font-size: 10px; }

        /* ═══ CHAT LIST ═══ */
        .chat-list { list-style: none; }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 8px;
            margin: 0 4px;
            text-decoration: none;
            color: inherit;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        .chat-item:hover { background: rgba(255,255,255,0.03); }
        .chat-item:active { background: rgba(139, 92, 246, 0.08); }

        /* Long-press visual feedback */
        .chat-item.long-pressing {
            background: rgba(139, 92, 246, 0.12);
            transform: scale(0.98);
        }

        /* ═══ AVATAR ═══ */
        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #1a103c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-avatar .avatar-icon { color: #8B5CF6; font-size: 18px; }
        .chat-avatar .avatar-initial { color: #fff; font-size: 18px; font-weight: 700; }

        /* Bot avatar tint */
        .chat-avatar.bot-avatar {
            background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(6,182,212,0.25));
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        /* Verified mini-badge on avatar */
        .chat-avatar .avatar-verified {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #0A0A0F;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0A0A0F;
        }
        .chat-avatar .avatar-verified i {
            color: #1DA1F2;
            font-size: 12px;
        }

        /* ═══ CHAT INFO ═══ */
        .chat-info { flex: 1; margin-left: 14px; min-width: 0; }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .chat-name {
            font-weight: 600;
            font-size: 14.5px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            flex: 1;
        }

        .chat-name .name-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-name .verified-badge {
            color: #1DA1F2;
            font-size: 12px;
            flex-shrink: 0;
        }

        .chat-name .bot-badge {
            font-size: 8.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            padding: 1px 5px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .chat-time {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            flex-shrink: 0;
        }

        .chat-time.unread-time {
            color: #8B5CF6;
            font-weight: 600;
        }

        .chat-subtitle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
            gap: 8px;
        }

        .chat-last-message {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-last-message .prefix-icon {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
        }

        .chat-last-message.has-unread {
            color: rgba(255,255,255,0.75);
            font-weight: 500;
        }

        /* ═══ UNREAD BADGE ═══ */
        .chat-unread {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(139, 92, 246, 0.4);
        }

        /* Pinned icon */
        .chat-pin-icon {
            color: rgba(255,255,255,0.35);
            font-size: 11px;
            flex-shrink: 0;
        }

        /* Muted icon */
        .chat-mute-icon {
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            flex-shrink: 0;
        }

        /* ═══ FAB ═══ */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            max-width: 480px;
            width: calc(100% - 60px);
            display: flex;
            justify-content: flex-end;
            pointer-events: none;
        }

        .fab {
            pointer-events: auto;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover { transform: scale(1.05); box-shadow: 0 12px 30px rgba(139, 92, 246, 0.5); }
        .fab:active { transform: scale(0.95); }

        /* ═══ MODALS ═══ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #1a103c;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            padding: 20px;
            animation: slideUp 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 0 auto 20px auto;
        }

        .modal-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
            text-decoration: none;
            color: inherit;
            font-family: 'Inter', sans-serif;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .modal-item:hover { background: rgba(255,255,255,0.05); }

        .modal-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 18px;
            flex-shrink: 0;
        }

        .modal-item-label { color: #fff; font-size: 15px; }

        .modal-item.danger .modal-item-label { color: #ef4444; }
        .modal-item.danger .modal-item-icon {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* Context menu — smaller, more compact */
        .context-menu-content {
            background: #1a103c;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 12px 12px 20px 12px;
            animation: slideUp 0.24s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .context-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 8px;
        }

        .context-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            background: #1a103c;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .context-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .context-header-avatar i { color: #8B5CF6; font-size: 16px; }

        .context-header-info { flex: 1; min-width: 0; }

        .context-header-name {
            font-size: 14.5px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .context-header-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 2px;
        }

        .context-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            padding: 4px;
        }

        .context-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 8px;
            border-radius: 14px;
            background: rgba(255,255,255,0.03);
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        .context-option:hover { background: rgba(139, 92, 246, 0.1); }
        .context-option:active { transform: scale(0.96); }

        .context-option-icon {
            font-size: 20px;
            color: #8B5CF6;
        }

        .context-option-label {
            font-size: 12.5px;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
        }

        .context-option.danger .context-option-icon { color: #ef4444; }
        .context-option.danger .context-option-label { color: #ef4444; }

        /* Confirm dialog */
        .dialog-content {
            background: #1a103c;
            border-radius: 20px;
            width: 90%;
            max-width: 340px;
            padding: 22px;
            margin: auto;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .dialog-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .dialog-text {
            font-size: 13.5px;
            color: rgba(255,255,255,0.5);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .dialog-btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            border: none;
        }

        .dialog-btn-cancel {
            background: transparent;
            color: rgba(255,255,255,0.5);
        }

        .dialog-btn-cancel:hover { background: rgba(255,255,255,0.05); }

        .dialog-btn-danger {
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: #fff;
        }

        .dialog-btn-danger:hover { box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }

        .dialog-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .dialog-overlay.active { display: flex; }

        /* ═══ TOAST ═══ */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a103c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            z-index: 3000;
            display: none;
            max-width: 90%;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }

        .toast.show { display: block; animation: slideUp 0.25s ease; }
        .toast.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.15);
        }
        .toast.success { border-color: rgba(34, 197, 94, 0.5); }

        @media (max-width: 480px) {
            .fab-container { right: 20px; bottom: 20px; }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="sliver-app-bar">
        <div class="app-bar-top">
            <div class="app-title">AURA CHAT</div>
            <div class="app-bar-actions">
                <button onclick="window.location.href='global_search.html'">
                    <i class="fas fa-search"></i>
                </button>
                <button onclick="showMenu()">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </div>

        <div class="tab-bar">
            <a href="chats.html" class="tab-item active">Chats</a>
            <a href="status.html" class="tab-item">Status</a>
            <a href="profile.html" class="tab-item">Profile</a>
        </div>
    </div>

    <div class="tab-content" id="tabContent">
        <div id="chatsContainer">
            <div class="loading-container">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <div class="fab-container">
        <button class="fab" onclick="handleFabClick()">
            <i class="fas fa-comment"></i>
        </button>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- ═══ NEW CHAT MODAL ═══ -->
<div class="modal-overlay" id="newChatModal">
    <div class="modal-content">
        <div class="modal-handle"></div>
        <a href="global_search.html" class="modal-item">
            <div class="modal-item-icon" style="background: rgba(139,92,246,0.2); color: #8B5CF6;">
                <i class="fas fa-user-plus"></i>
            </div>
            <div class="modal-item-label">New Chat</div>
        </a>
        <a href="create_group.html" class="modal-item">
            <div class="modal-item-icon" style="background: rgba(6,182,212,0.2); color: #06B6D4;">
                <i class="fas fa-users"></i>
            </div>
            <div class="modal-item-label">New Group</div>
        </a>
        <a href="create_channel.html" class="modal-item">
            <div class="modal-item-icon" style="background: rgba(251,191,36,0.2); color: #FBBF24;">
                <i class="fas fa-bullhorn"></i>
            </div>
            <div class="modal-item-label">New Channel</div>
        </a>
    </div>
</div>

<!-- ═══ MENU MODAL ═══ -->
<div class="modal-overlay" id="menuModal">
    <div class="modal-content">
        <div class="modal-handle"></div>
        <a href="settings.html" class="modal-item">
            <div class="modal-item-icon" style="background: rgba(139,92,246,0.2); color: #8B5CF6;">
                <i class="fas fa-cog"></i>
            </div>
            <div class="modal-item-label">Settings</div>
        </a>
        <a href="profile.html" class="modal-item">
            <div class="modal-item-icon" style="background: rgba(6,182,212,0.2); color: #06B6D4;">
                <i class="fas fa-user"></i>
            </div>
            <div class="modal-item-label">Profile</div>
        </a>
        <a href="bot_creator.html" class="modal-item">
            <div class="modal-item-icon" style="background: rgba(139,92,246,0.2); color: #8B5CF6;">
                <i class="fas fa-robot"></i>
            </div>
            <div class="modal-item-label">BotCreator</div>
        </a>
        <div class="modal-item danger" onclick="signOut()">
            <div class="modal-item-icon">
                <i class="fas fa-sign-out-alt"></i>
            </div>
            <div class="modal-item-label">Log Out</div>
        </div>
    </div>
</div>

<!-- ═══ CONTEXT MENU (LONG PRESS) ═══ -->
<div class="modal-overlay" id="contextMenu">
    <div class="context-menu-content">
        <div class="context-header" id="contextHeader">
            <div class="context-header-avatar" id="contextAvatar"></div>
            <div class="context-header-info">
                <div class="context-header-name" id="contextName"></div>
                <div class="context-header-sub" id="contextSub"></div>
            </div>
        </div>
        <div class="context-options" id="contextOptions"></div>
    </div>
</div>

<!-- ═══ CONFIRM DIALOG ═══ -->
<div class="dialog-overlay" id="confirmDialog">
    <div class="dialog-content">
        <div class="dialog-title" id="confirmTitle">Are you sure?</div>
        <div class="dialog-text" id="confirmText"></div>
        <div class="dialog-actions">
            <button class="dialog-btn dialog-btn-cancel" onclick="closeDialog()">Cancel</button>
            <button class="dialog-btn dialog-btn-danger" id="confirmBtn" onclick="runConfirm()">Confirm</button>
        </div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════════════════════
const firebaseConfig = {
    apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
    authDomain: "aurachat-85f54.firebaseapp.com",
    projectId: "aurachat-85f54",
    storageBucket: "aurachat-85f54.firebasestorage.app",
    messagingSenderId: "539789121540",
    appId: "1:539789121540:web:96ac597e52dd0a80573d51"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let chats = [];
let isLoading = true;
let currentUserId = null;
let currentUserEmail = '';
let selectedChat = null;
let longPressTimer = null;
let longPressTriggered = false;

const userCache = {};

const chatsContainer = document.getElementById('chatsContainer');
const toast = document.getElementById('toast');

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
function showToast(message, type = '') {
    toast.textContent = message;
    toast.className = 'toast show ' + type;
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 2800);
}

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
function checkAuth() {
    const userId = localStorage.getItem('mock_user_id');
    const email = localStorage.getItem('mock_email');
    if (userId && email) {
        currentUserId = userId;
        currentUserEmail = email;
        return true;
    }
    if (auth.currentUser) {
        currentUserId = auth.currentUser.uid;
        currentUserEmail = auth.currentUser.email || '';
        localStorage.setItem('mock_user_id', currentUserId);
        localStorage.setItem('mock_email', currentUserEmail);
        return true;
    }
    return false;
}

// ═══════════════════════════════════════════════════════════
// VERIFIED
// ═══════════════════════════════════════════════════════════
function isVerified(email) {
    if (!email) return false;
    const e = email.toLowerCase().trim();
    if (e.endsWith('@bot.aurachat.app')) return false;   // bots are not verified
    return e.endsWith('@aurachat.app');
}

// ═══════════════════════════════════════════════════════════
// FETCH USER (cached)
// ═══════════════════════════════════════════════════════════
async function fetchUserData(userId) {
    if (!userId) return null;
    if (userCache[userId]) return userCache[userId];

    try {
        const doc = await db.collection('users').doc(userId).get();
        if (doc.exists) {
            const data = doc.data();
            const userData = {
                uid: userId,
                username: data.username || 'Unknown',
                display_name: data.display_name || data.username || data.name || 'Unknown',
                avatar_url: data.avatar_url || null,
                email: data.email || null,
                is_bot: data.is_bot === true,
                about: data.about || '',
                is_verified: isVerified(data.email)
            };
            userCache[userId] = userData;
            return userData;
        }
    } catch(e) {
        console.error('Fetch user error:', userId, e);
    }

    const fallback = {
        uid: userId,
        username: 'Unknown',
        display_name: 'Unknown',
        avatar_url: null,
        email: null,
        is_bot: false,
        about: '',
        is_verified: false
    };
    userCache[userId] = fallback;
    return fallback;
}

// ═══════════════════════════════════════════════════════════
// UNREAD COUNT — read from chat doc (fast, scalable)
// ═══════════════════════════════════════════════════════════
function getUnreadCount(chat) {
    const perUser = chat.unread_counts || {};
    return perUser[currentUserId] || 0;
}

// ═══════════════════════════════════════════════════════════
// LOAD CHATS
// ═══════════════════════════════════════════════════════════
async function loadChats() {
    if (!currentUserId) { showEmptyChats(); return; }
    isLoading = true;
    showLoading();

    try {
        const snapshot = await db.collection('chats')
            .where('participants', 'array-contains', currentUserId)
            .orderBy('last_message_at', 'desc')
            .get();

        chats = [];
        const fetchPromises = [];

        for (const doc of snapshot.docs) {
            const chat = doc.data();
            chat.id = doc.id;

            // Skip deleted-for-me chats
            const deletedFor = chat.deleted_for || [];
            if (deletedFor.includes(currentUserId)) continue;

            // Skip archived if user has them hidden
            const archivedFor = chat.archived_for || [];
            chat.is_archived = archivedFor.includes(currentUserId);

            // Skip muted if user has them hidden
            const mutedFor = chat.muted_for || [];
            chat.is_muted = mutedFor.includes(currentUserId);

            // Pinned
            const pinnedFor = chat.pinned_for || [];
            chat.is_pinned = pinnedFor.includes(currentUserId);

            const chatType = chat.type || 'direct';

            // Resolve other user for direct chats
            if (chatType === 'direct') {
                const participants = chat.participants || [];
                const otherUserId = participants.find(id => id !== currentUserId);
                if (otherUserId) {
                    chat.otherUserId = otherUserId;
                    if (userCache[otherUserId]) {
                        chat.otherUser = userCache[otherUserId];
                    } else {
                        fetchPromises.push(
                            fetchUserData(otherUserId).then(u => { chat.otherUser = u; })
                        );
                    }
                }
            }

            chat.unread_count = getUnreadCount(chat);
            chats.push(chat);
        }

        await Promise.all(fetchPromises);

        // Sort: pinned first, then by last_message_at
        chats.sort((a, b) => {
            if (a.is_pinned && !b.is_pinned) return -1;
            if (!a.is_pinned && b.is_pinned) return 1;
            const aT = a.last_message_at?.toMillis?.() || 0;
            const bT = b.last_message_at?.toMillis?.() || 0;
            return bT - aT;
        });

        renderChats();
    } catch(e) {
        console.error('Error loading chats:', e);
        showToast('Error loading chats', 'error');
        showEmptyChats();
    }
    isLoading = false;
}

// ═══════════════════════════════════════════════════════════
// REAL-TIME LISTENER
// ═══════════════════════════════════════════════════════════
function subscribeToChats() {
    if (!currentUserId) return;

    db.collection('chats')
        .where('participants', 'array-contains', currentUserId)
        .orderBy('last_message_at', 'desc')
        .onSnapshot(async (snapshot) => {
            const newChats = [];
            const fetchPromises = [];

            for (const doc of snapshot.docs) {
                const chat = doc.data();
                chat.id = doc.id;

                const deletedFor = chat.deleted_for || [];
                if (deletedFor.includes(currentUserId)) continue;

                const archivedFor = chat.archived_for || [];
                chat.is_archived = archivedFor.includes(currentUserId);

                const mutedFor = chat.muted_for || [];
                chat.is_muted = mutedFor.includes(currentUserId);

                const pinnedFor = chat.pinned_for || [];
                chat.is_pinned = pinnedFor.includes(currentUserId);

                const chatType = chat.type || 'direct';

                if (chatType === 'direct') {
                    const participants = chat.participants || [];
                    const otherUserId = participants.find(id => id !== currentUserId);
                    if (otherUserId) {
                        chat.otherUserId = otherUserId;
                        if (userCache[otherUserId]) {
                            chat.otherUser = userCache[otherUserId];
                        } else {
                            fetchPromises.push(
                                fetchUserData(otherUserId).then(u => { chat.otherUser = u; })
                            );
                        }
                    }
                }

                chat.unread_count = getUnreadCount(chat);
                newChats.push(chat);
            }

            await Promise.all(fetchPromises);

            newChats.sort((a, b) => {
                if (a.is_pinned && !b.is_pinned) return -1;
                if (!a.is_pinned && b.is_pinned) return 1;
                const aT = a.last_message_at?.toMillis?.() || 0;
                const bT = b.last_message_at?.toMillis?.() || 0;
                return bT - aT;
            });

            chats = newChats;
            renderChats();
        }, (error) => {
            console.error('Chat subscription error:', error);
        });
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function renderChats() {
    if (isLoading) { showLoading(); return; }
    if (chats.length === 0) { showEmptyChats(); return; }

    // Split pinned vs normal
    const pinned = chats.filter(c => c.is_pinned);
    const normal = chats.filter(c => !c.is_pinned);

    let html = '';

    if (pinned.length > 0) {
        html += `<div class="section-header"><i class="fas fa-thumbtack"></i> Pinned</div>`;
        html += '<ul class="chat-list">';
        pinned.forEach(c => { html += buildChatItem(c); });
        html += '</ul>';
    }

    if (normal.length > 0) {
        if (pinned.length > 0) {
            html += `<div class="section-header"><i class="fas fa-comment"></i> All Chats</div>`;
        }
        html += '<ul class="chat-list">';
        normal.forEach(c => { html += buildChatItem(c); });
        html += '</ul>';
    }

    chatsContainer.innerHTML = html;
    attachChatListeners();
}

function buildChatItem(chat) {
    const chatType = chat.type || 'direct';
    const isGroup = chatType === 'group';
    const isChannel = chatType === 'channel';
    const isBot = chatType === 'bot';

    let name = '';
    let avatar = '';
    let verified = false;
    let isBotUser = isBot;

    // ─── DIRECT: use other user's info ───
    if (chatType === 'direct' && chat.otherUser) {
        name = chat.otherUser.display_name || chat.otherUser.username || 'Unknown';
        avatar = chat.otherUser.avatar_url;
        verified = chat.otherUser.is_verified || false;
        isBotUser = chat.otherUser.is_bot === true;
    } else {
        name = chat.name || 'Unknown';
        avatar = chat.avatar_url || null;
    }

    const lastMessage = chat.last_message || '';
    const time = chat.last_message_at || null;
    const unread = chat.unread_count || 0;
    const chatId = chat.id;

    // ─── AVATAR ───
    let avatarHtml = '';
    const avatarClass = isBotUser ? 'chat-avatar bot-avatar' : 'chat-avatar';
    if (avatar) {
        avatarHtml = `<img src="${avatar}" alt="" />`;
    } else if (chatType === 'direct') {
        const initial = (name || 'U')[0].toUpperCase();
        avatarHtml = `<div class="avatar-initial">${initial}</div>`;
    } else if (isBot) {
        avatarHtml = `<i class="fas fa-robot avatar-icon"></i>`;
    } else if (isChannel) {
        avatarHtml = `<i class="fas fa-bullhorn avatar-icon"></i>`;
    } else {
        avatarHtml = `<i class="fas fa-users avatar-icon"></i>`;
    }

    // Verified mini-badge on avatar
    if (verified) {
        avatarHtml += `<div class="avatar-verified"><i class="fas fa-check-circle"></i></div>`;
    }

    const timeStr = time ? formatTime(time) : '';
    const unreadHtml = unread > 0 ? `<span class="chat-unread">${unread > 99 ? '99+' : unread}</span>` : '';

    // ─── NAME BADGES ───
    let badges = '';
    if (isBot || isBotUser) badges += `<span class="bot-badge">BOT</span>`;
    if (verified) badges += `<span class="verified-badge"><i class="fas fa-check-circle"></i></span>`;
    if (chat.is_muted) badges += `<i class="fas fa-bell-slash chat-mute-icon"></i>`;

    // ─── MESSAGE PREFIX ICONS ───
    let prefixIcon = '';
    const msg = lastMessage;
    if (msg.startsWith('📷')) prefixIcon = '<i class="fas fa-camera prefix-icon"></i>';
    else if (msg.startsWith('🎥')) prefixIcon = '<i class="fas fa-video prefix-icon"></i>';
    else if (msg.startsWith('🎤')) prefixIcon = '<i class="fas fa-microphone prefix-icon"></i>';
    else if (msg.startsWith('📎')) prefixIcon = '<i class="fas fa-paperclip prefix-icon"></i>';

    const lastMsgClass = unread > 0 ? 'chat-last-message has-unread' : 'chat-last-message';
    const timeClass = unread > 0 ? 'chat-time unread-time' : 'chat-time';

    // ─── PIN ICON ───
    const pinIcon = chat.is_pinned ? `<i class="fas fa-thumbtack chat-pin-icon"></i>` : '';

    // ─── HREF ROUTING ───
    let href = '';
    if (isBot) {
        href = `bot.html?id=${chatId}`;
    } else if (isChannel) {
        href = `channel.html?id=${chatId}&name=${encodeURIComponent(name)}`;
    } else if (isGroup) {
        href = `group.html?id=${chatId}&name=${encodeURIComponent(name)}`;
    } else {
        href = `chat.html?id=${chatId}&name=${encodeURIComponent(name)}&avatar=${encodeURIComponent(avatar || '')}&group=false`;
    }

    return `
        <a href="${href}" class="chat-item" data-chat-id="${chatId}">
            <div class="${avatarClass}">${avatarHtml}</div>
            <div class="chat-info">
                <div class="chat-header">
                    <span class="chat-name">
                        <span class="name-text">${escapeHtml(name)}</span>
                        ${badges}
                    </span>
                    <span class="${timeClass}">${timeStr}</span>
                </div>
                <div class="chat-subtitle">
                    <span class="${lastMsgClass}">
                        ${pinIcon}
                        ${prefixIcon}
                        <span>${escapeHtml(msg)}</span>
                    </span>
                    ${unreadHtml}
                </div>
            </div>
        </a>
    `;
}

// ═══════════════════════════════════════════════════════════
// LONG PRESS HANDLERS
// ═══════════════════════════════════════════════════════════
function attachChatListeners() {
    document.querySelectorAll('.chat-item').forEach(el => {
        const chatId = el.dataset.chatId;

        // Mouse (desktop) — right click
        el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const chat = chats.find(c => c.id === chatId);
            if (chat) openContextMenu(chat);
        });

        // Touch (mobile) — long press
        el.addEventListener('touchstart', (e) => {
            longPressTriggered = false;
            el.classList.add('long-pressing');
            longPressTimer = setTimeout(() => {
                longPressTriggered = true;
                el.classList.remove('long-pressing');
                const chat = chats.find(c => c.id === chatId);
                if (chat) {
                    if (navigator.vibrate) navigator.vibrate(30);
                    openContextMenu(chat);
                }
            }, 500);
        }, { passive: true });

        el.addEventListener('touchend', (e) => {
            clearTimeout(longPressTimer);
            el.classList.remove('long-pressing');
            if (longPressTriggered) {
                e.preventDefault();
                e.stopPropagation();
            }
        });

        el.addEventListener('touchmove', () => {
            clearTimeout(longPressTimer);
            el.classList.remove('long-pressing');
        }, { passive: true });

        el.addEventListener('touchcancel', () => {
            clearTimeout(longPressTimer);
            el.classList.remove('long-pressing');
        });

        // Prevent click if long press just fired
        el.addEventListener('click', (e) => {
            if (longPressTriggered) {
                e.preventDefault();
                e.stopPropagation();
                longPressTriggered = false;
            }
        });
    });
}

// ═══════════════════════════════════════════════════════════
// CONTEXT MENU
// ═══════════════════════════════════════════════════════════
function openContextMenu(chat) {
    selectedChat = chat;

    const chatType = chat.type || 'direct';
    const isBot = chatType === 'bot';
    const isChannel = chatType === 'channel';
    const isGroup = chatType === 'group';

    let name = '', avatar = '', sub = '';
    if (chatType === 'direct' && chat.otherUser) {
        name = chat.otherUser.display_name || chat.otherUser.username || 'Unknown';
        avatar = chat.otherUser.avatar_url;
        sub = '@' + (chat.otherUser.username || 'user');
    } else {
        name = chat.name || 'Chat';
        avatar = chat.avatar_url || null;
        sub = isChannel ? 'Channel' : isGroup ? 'Group' : isBot ? 'Bot' : 'Chat';
    }

    // Header
    const avatarEl = document.getElementById('contextAvatar');
    if (avatar) avatarEl.innerHTML = `<img src="${avatar}" />`;
    else if (isBot) avatarEl.innerHTML = `<i class="fas fa-robot"></i>`;
    else if (isChannel) avatarEl.innerHTML = `<i class="fas fa-bullhorn"></i>`;
    else if (isGroup) avatarEl.innerHTML = `<i class="fas fa-users"></i>`;
    else avatarEl.innerHTML = `<span style="color:#fff;font-weight:700;font-size:16px;">${(name[0] || 'U').toUpperCase()}</span>`;

    document.getElementById('contextName').textContent = name;
    document.getElementById('contextSub').textContent = sub;

    // Build options
    const options = [];

    // Pin
    options.push({
        icon: 'fa-thumbtack',
        label: chat.is_pinned ? 'Unpin' : 'Pin',
        action: 'togglePin'
    });

    // Archive
    options.push({
        icon: 'fa-box-archive',
        label: chat.is_archived ? 'Unarchive' : 'Archive',
        action: 'toggleArchive'
    });

    // Mute
    options.push({
        icon: chat.is_muted ? 'fa-bell' : 'fa-bell-slash',
        label: chat.is_muted ? 'Unmute' : 'Mute',
        action: 'toggleMute'
    });

    // Mark as read / unread
    if (chat.unread_count > 0) {
        options.push({
            icon: 'fa-envelope-open',
            label: 'Mark as Read',
            action: 'markRead'
        });
    } else {
        options.push({
            icon: 'fa-envelope',
            label: 'Mark as Unread',
            action: 'markUnread'
        });
    }

    // For bots: open bot profile
    if (isBot) {
        options.push({
            icon: 'fa-circle-info',
            label: 'Bot Info',
            action: 'openBotProfile'
        });
    }

    // Clear chat (only in DMs, groups, channels)
    if (!isBot) {
        options.push({
            icon: 'fa-broom',
            label: 'Clear Chat',
            action: 'clearChat'
        });
    }

    // Delete
    options.push({
        icon: 'fa-trash',
        label: 'Delete',
        action: 'deleteChat',
        danger: true
    });

    // Render
    const optionsEl = document.getElementById('contextOptions');
    optionsEl.innerHTML = options.map(opt => `
        <button class="context-option ${opt.danger ? 'danger' : ''}" onclick="handleContextAction('${opt.action}')">
            <i class="fas ${opt.icon} context-option-icon"></i>
            <span class="context-option-label">${opt.label}</span>
        </button>
    `).join('');

    openModal('contextMenu');
}

async function handleContextAction(action) {
    if (!selectedChat) return;
    const chat = selectedChat;
    closeModal('contextMenu');

    try {
        switch (action) {
            case 'togglePin':
                await toggleArrayField(chat, 'pinned_for');
                showToast(chat.is_pinned ? 'Unpinned' : 'Pinned', 'success');
                break;

            case 'toggleArchive':
                await toggleArrayField(chat, 'archived_for');
                showToast(chat.is_archived ? 'Unarchived' : 'Archived', 'success');
                break;

            case 'toggleMute':
                await toggleArrayField(chat, 'muted_for');
                showToast(chat.is_muted ? 'Unmuted' : 'Muted', 'success');
                break;

            case 'markRead':
                await db.collection('chats').doc(chat.id).update({
                    [`unread_counts.${currentUserId}`]: 0
                });
                showToast('Marked as read', 'success');
                break;

            case 'markUnread':
                await db.collection('chats').doc(chat.id).update({
                    [`unread_counts.${currentUserId}`]: 1
                });
                showToast('Marked as unread', 'success');
                break;

            case 'clearChat':
                showConfirm(
                    'Clear all messages?',
                    'This will remove all messages from this chat for you. Other participants will still see them.',
                    async () => {
                        // Clear messages
                        const msgsRef = db.collection('chats').doc(chat.id).collection('messages');
                        const msgs = await msgsRef.limit(500).get();
                        const batch = db.batch();
                        msgs.forEach(m => batch.delete(m.ref));
                        await batch.commit();
                        showToast('Chat cleared', 'success');
                    }
                );
                break;

            case 'deleteChat':
                showConfirm(
                    'Delete this chat?',
                    'This will remove the chat from your list. Other participants will still have it.',
                    async () => {
                        await db.collection('chats').doc(chat.id).update({
                            deleted_for: firebase.firestore.FieldValue.arrayUnion(currentUserId)
                        });
                        showToast('Chat deleted', 'success');
                    }
                );
                break;

            case 'openBotProfile':
                window.location.href = `bot_profile.html?id=${chat.id}`;
                break;
        }
    } catch (e) {
        console.error('Context action error:', e);
        showToast('Action failed', 'error');
    }
}

async function toggleArrayField(chat, field) {
    const current = chat[field] || [];
    const has = current.includes(currentUserId);
    const update = has
        ? { [field]: firebase.firestore.FieldValue.arrayRemove(currentUserId) }
        : { [field]: firebase.firestore.FieldValue.arrayUnion(currentUserId) };
    await db.collection('chats').doc(chat.id).update(update);
}

// ═══════════════════════════════════════════════════════════
// CONFIRM DIALOG
// ═══════════════════════════════════════════════════════════
let pendingConfirm = null;

function showConfirm(title, text, onConfirm) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text;
    pendingConfirm = onConfirm;
    document.getElementById('confirmDialog').classList.add('active');
}

function closeDialog() {
    document.getElementById('confirmDialog').classList.remove('active');
    pendingConfirm = null;
}

async function runConfirm() {
    const fn = pendingConfirm;
    closeDialog();
    if (fn) await fn();
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function showLoading() {
    chatsContainer.innerHTML = `
        <div class="loading-container"><div class="spinner"></div></div>
    `;
}

function showEmptyChats() {
    chatsContainer.innerHTML = `
        <div class="empty-state">
            <div class="empty-icon"><i class="fas fa-comment-dots"></i></div>
            <div class="empty-title">No chats yet</div>
            <div class="empty-subtitle">Tap + to start a conversation</div>
        </div>
    `;
}

function formatTime(time) {
    if (!time) return '';
    let date;
    if (time.toDate) date = time.toDate();
    else if (time instanceof Date) date = time;
    else if (typeof time === 'string') date = new Date(time);
    else return '';

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

    if (msgDate.getTime() === today.getTime()) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } else if (msgDate.getTime() === yesterday.getTime()) {
        return 'Yesterday';
    } else if (now.getFullYear() === date.getFullYear()) {
        return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
    } else {
        return date.toLocaleDateString([], { year: '2-digit', month: 'short', day: 'numeric' });
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ═══════════════════════════════════════════════════════════
// MODALS
// ═══════════════════════════════════════════════════════════
function handleFabClick() { openModal('newChatModal'); }
function showMenu() { openModal('menuModal'); }

function openModal(id) {
    document.getElementById(id).classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
    document.body.style.overflow = '';
}

document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', (e) => {
        if (e.target === el) {
            el.classList.remove('active');
            document.body.style.overflow = '';
        }
    });
});

// ═══════════════════════════════════════════════════════════
// SIGN OUT
// ═══════════════════════════════════════════════════════════
async function signOut() {
    try {
        await auth.signOut();
        localStorage.removeItem('mock_user_id');
        localStorage.removeItem('mock_email');
        localStorage.removeItem('mock_username');
        localStorage.removeItem('mock_display_name');
        localStorage.removeItem('mock_avatar');
        window.location.href = 'email_verification.html';
    } catch (error) {
        console.error('Sign out error:', error);
        showToast('Error signing out', 'error');
    }
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function initApp() {
    if (!checkAuth()) {
        showToast('Please login first', 'error');
        setTimeout(() => { window.location.href = 'email_verification.html'; }, 1500);
        return;
    }
    await loadChats();
    subscribeToChats();
}

document.addEventListener('DOMContentLoaded', () => {
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUserId = user.uid;
            currentUserEmail = user.email || '';
            localStorage.setItem('mock_user_id', currentUserId);
            localStorage.setItem('mock_email', currentUserEmail);
            initApp();
        } else {
            const userId = localStorage.getItem('mock_user_id');
            if (userId) {
                currentUserId = userId;
                currentUserEmail = localStorage.getItem('mock_email') || '';
                initApp();
            } else {
                window.location.href = 'email_verification.html';
            }
        }
    });
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.active').forEach(el => {
            el.classList.remove('active');
            document.body.style.overflow = '';
        });
        closeDialog();
    }
});
</script>
