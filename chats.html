<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Chats</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 10px;
        }

        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== SLIVER APP BAR ===== */
        .sliver-app-bar {
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .app-bar-top {
            padding: 20px 16px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-bar-actions {
            display: flex;
            gap: 4px;
        }

        .app-bar-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .app-bar-actions button:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== TAB BAR ===== */
        .tab-bar {
            display: flex;
            padding: 0 8px 8px 8px;
            gap: 4px;
            position: relative;
        }

        .tab-item {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            border: none;
            text-decoration: none;
            display: block;
            font-family: 'Inter', sans-serif;
        }

        .tab-item.active {
            color: #fff;
            font-weight: 600;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        /* ===== TAB CONTENT ===== */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0 80px 0;
            scroll-behavior: smooth;
        }

        .tab-panel {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== LOADING ===== */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 300px;
            padding: 20px;
        }

        .empty-icon {
            font-size: 80px;
            color: rgba(255,255,255,0.1);
            margin-bottom: 16px;
        }

        .empty-title {
            color: rgba(255,255,255,0.3);
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-subtitle {
            color: rgba(255,255,255,0.2);
            font-size: 13px;
        }

        /* ===== CHAT LIST ===== */
        .chat-list {
            list-style: none;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 8px;
            margin: 0 4px;
            text-decoration: none;
            color: inherit;
        }

        .chat-item:hover {
            background: rgba(255,255,255,0.03);
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #1a103c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-avatar .avatar-icon {
            color: #8B5CF6;
            font-size: 18px;
        }

        .chat-info {
            flex: 1;
            margin-left: 14px;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-name {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .chat-time {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            flex-shrink: 0;
            margin-left: 8px;
        }

        .chat-subtitle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .chat-last-message {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .chat-unread {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 8px;
            min-width: 20px;
            text-align: center;
        }

        /* ===== FLOATING ACTION BUTTON ===== */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            max-width: 480px;
            width: calc(100% - 60px);
            display: flex;
            justify-content: flex-end;
            pointer-events: none;
        }

        .fab {
            pointer-events: auto;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }

        .fab:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.5);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: fadeInOverlay 0.25s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #1a103c;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            padding: 20px;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 0 auto 20px auto;
        }

        .modal-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
            text-decoration: none;
            color: inherit;
            font-family: 'Inter', sans-serif;
        }

        .modal-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .modal-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 18px;
        }

        .modal-item-label {
            color: #fff;
            font-size: 15px;
        }

        .modal-item.danger .modal-item-label {
            color: #ef4444;
        }

        .modal-item.danger .modal-item-icon {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a103c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            z-index: 2000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .toast.show {
            display: block;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.5);
            background: rgba(74, 222, 128, 0.1);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .fab-container {
                right: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- App Bar -->
        <div class="sliver-app-bar">
            <div class="app-bar-top">
                <div class="app-title">AURA</div>
                <div class="app-bar-actions">
                    <button onclick="window.location.href='global_search.html'">
                        <i class="fas fa-search"></i>
                    </button>
                    <button onclick="showMenu()">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tab-bar">
                <a href="chats.html" class="tab-item active">Chats</a>
                <a href="status.html" class="tab-item">Status</a>
                <a href="profile.html" class="tab-item">Profile</a>
            </div>
        </div>

        <!-- Tab Content -->
        <div class="tab-content" id="tabContent">
            <div id="chatsContainer">
                <div class="loading-container">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- FAB -->
        <div class="fab-container">
            <button class="fab" id="fabBtn" onclick="handleFabClick()">
                <i class="fas fa-comment"></i>
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- ===== MODALS ===== -->

    <!-- New Chat Options Modal -->
    <div class="modal-overlay" id="newChatModal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <a href="global_search.html" class="modal-item" onclick="closeModal('newChatModal')">
                <div class="modal-item-icon" style="background: rgba(139,92,246,0.2); color: #8B5CF6;">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div class="modal-item-label">New Chat</div>
            </a>
            <a href="create_group.html" class="modal-item" onclick="closeModal('newChatModal')">
                <div class="modal-item-icon" style="background: rgba(6,182,212,0.2); color: #06B6D4;">
                    <i class="fas fa-users"></i>
                </div>
                <div class="modal-item-label">New Group</div>
            </a>
            <a href="create_channel.html" class="modal-item" onclick="closeModal('newChatModal')">
                <div class="modal-item-icon" style="background: rgba(251,191,36,0.2); color: #FBBF24;">
                    <i class="fas fa-bullhorn"></i>
                </div>
                <div class="modal-item-label">New Channel</div>
            </a>
        </div>
    </div>

    <!-- Menu Modal -->
    <div class="modal-overlay" id="menuModal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <a href="settings.html" class="modal-item" onclick="closeModal('menuModal')">
                <div class="modal-item-icon" style="background: rgba(139,92,246,0.2); color: #8B5CF6;">
                    <i class="fas fa-cog"></i>
                </div>
                <div class="modal-item-label">Settings</div>
            </a>
            <a href="profile.html" class="modal-item" onclick="closeModal('menuModal')">
                <div class="modal-item-icon" style="background: rgba(6,182,212,0.2); color: #06B6D4;">
                    <i class="fas fa-user"></i>
                </div>
                <div class="modal-item-label">Profile</div>
            </a>
            <div class="modal-item danger" onclick="closeModal('menuModal'); signOut()">
                <div class="modal-item-icon">
                    <i class="fas fa-sign-out-alt"></i>
                </div>
                <div class="modal-item-label">Sign Out</div>
            </div>
        </div>
    </div>

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ─── LOCAL STORAGE HELPERS ──────────────────────────────────
        function saveToLocalStorage(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                console.warn('Could not save to localStorage:', e);
            }
        }

        function getFromLocalStorage(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                return null;
            }
        }

        function removeFromLocalStorage(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) {}
        }

        // ─── STATE ─────────────────────────────────────────────────────
        let chats = [];
        let isLoading = true;
        let currentUserId = null;
        let currentUserEmail = '';
        let currentUserData = null;

        // ─── DOM REFS ─────────────────────────────────────────────────
        const chatsContainer = document.getElementById('chatsContainer');
        const fabBtn = document.getElementById('fabBtn');
        const fabIcon = fabBtn.querySelector('i');
        const toast = document.getElementById('toast');

        // ─── TOAST ────────────────────────────────────────────────────
        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ─── CHECK AUTH ──────────────────────────────────────────────
        function checkAuth() {
            const userId = getFromLocalStorage('mock_user_id');
            const email = getFromLocalStorage('mock_email');

            if (userId && email) {
                currentUserId = userId;
                currentUserEmail = email;
                return true;
            }

            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                currentUserEmail = auth.currentUser.email || '';
                saveToLocalStorage('mock_user_id', currentUserId);
                saveToLocalStorage('mock_email', currentUserEmail);
                return true;
            }

            return false;
        }

        // ─── LOAD USER PROFILE ──────────────────────────────────────
        async function loadUserProfile() {
            if (!currentUserId) return;

            try {
                const doc = await db.collection('users').doc(currentUserId).get();
                if (doc.exists) {
                    const data = doc.data();
                    currentUserData = { id: currentUserId, ...data };
                    saveToLocalStorage('mock_username', data.username || '');
                    saveToLocalStorage('mock_display_name', data.display_name || '');
                    saveToLocalStorage('mock_avatar', data.avatar_url || '');
                }
            } catch (e) {
                console.error('Error loading user profile:', e);
            }
        }

        // ─── LOAD CHATS ──────────────────────────────────────────────
        async function loadChats() {
            if (!currentUserId) {
                showEmptyChats();
                return;
            }

            isLoading = true;
            showLoading();

            try {
                const snapshot = await db.collection('chats')
                    .where('participants', 'array-contains', currentUserId)
                    .orderBy('last_message_at', 'desc')
                    .get();

                chats = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    chats.push(data);
                });

                renderChats();
            } catch (e) {
                console.error('Error loading chats:', e);
                showToast('Error loading chats: ' + e.message, 'error');
                showEmptyChats();
            }

            isLoading = false;
        }

        // ─── SETUP REAL-TIME LISTENER ──────────────────────────────
        function subscribeToChats() {
            if (!currentUserId) return;

            db.collection('chats')
                .where('participants', 'array-contains', currentUserId)
                .orderBy('last_message_at', 'desc')
                .onSnapshot((snapshot) => {
                    chats = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        data.id = doc.id;
                        chats.push(data);
                    });
                    renderChats();
                }, (error) => {
                    console.error('Chat subscription error:', error);
                });
        }

        // ─── RENDER CHATS ────────────────────────────────────────────
        function renderChats() {
            if (isLoading) {
                showLoading();
                return;
            }

            if (chats.length === 0) {
                showEmptyChats();
                return;
            }

            let html = '<ul class="chat-list">';
            chats.forEach(chat => {
                html += buildChatItem(chat);
            });
            html += '</ul>';
            chatsContainer.innerHTML = html;
        }

        function buildChatItem(chat) {
            const name = chat.name || 'Unknown';
            const avatar = chat.avatar_url || null;
            const lastMessage = chat.last_message || '';
            const time = chat.last_message_at || null;
            const unread = chat.unread_count || 0;
            const chatType = chat.type || 'direct';
            const isGroup = chatType === 'group';
            const isChannel = chatType === 'channel';
            const chatId = chat.id;

            let avatarHtml = '';
            if (avatar) {
                avatarHtml = `<img src="${avatar}" alt="${name}" />`;
            } else {
                let icon = 'fa-user';
                if (isChannel) icon = 'fa-bullhorn';
                else if (isGroup) icon = 'fa-users';
                avatarHtml = `<i class="fas ${icon} avatar-icon"></i>`;
            }

            const timeStr = time ? formatTime(time) : '';

            let unreadHtml = '';
            if (unread > 0) {
                unreadHtml = `<span class="chat-unread">${unread}</span>`;
            }

            // 🔥 CRITICAL FIX: Correct routing based on chat type
            let href = '';
            if (isChannel) {
                href = `channel.html?id=${chatId}&name=${encodeURIComponent(name)}`;
            } else if (isGroup) {
                href = `group.html?id=${chatId}&name=${encodeURIComponent(name)}`;
            } else {
                href = `chat.html?id=${chatId}&name=${encodeURIComponent(name)}&avatar=${encodeURIComponent(avatar || '')}&group=false`;
            }

            return `
                <a href="${href}" class="chat-item">
                    <div class="chat-avatar">${avatarHtml}</div>
                    <div class="chat-info">
                        <div class="chat-header">
                            <span class="chat-name">${escapeHtml(name)}</span>
                            <span class="chat-time">${timeStr}</span>
                        </div>
                        <div class="chat-subtitle">
                            <span class="chat-last-message">${escapeHtml(lastMessage)}</span>
                            ${unreadHtml}
                        </div>
                    </div>
                </a>
            `;
        }

        function showLoading() {
            chatsContainer.innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                </div>
            `;
        }

        function showEmptyChats() {
            chatsContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-comment-dots"></i></div>
                    <div class="empty-title">No chats yet</div>
                    <div class="empty-subtitle">Tap + to start a conversation</div>
                </div>
            `;
        }

        // ─── FORMAT TIME ─────────────────────────────────────────────
        function formatTime(time) {
            if (!time) return '';

            let date;
            if (time.toDate) {
                date = time.toDate();
            } else if (time instanceof Date) {
                date = time;
            } else if (typeof time === 'string') {
                date = new Date(time);
            } else {
                return '';
            }

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

            if (msgDate.getTime() === today.getTime()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (msgDate.getTime() === yesterday.getTime()) {
                return 'Yesterday';
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ─── FAB HANDLER ─────────────────────────────────────────────
        function handleFabClick() {
            openModal('newChatModal');
        }

        // ─── MODAL HELPERS ───────────────────────────────────────────
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });

        // ─── MENU ─────────────────────────────────────────────────────
        function showMenu() {
            openModal('menuModal');
        }

        // ─── SIGN OUT ────────────────────────────────────────────────
        async function signOut() {
            try {
                await auth.signOut();
                removeFromLocalStorage('mock_user_id');
                removeFromLocalStorage('mock_email');
                removeFromLocalStorage('mock_username');
                removeFromLocalStorage('mock_display_name');
                removeFromLocalStorage('mock_avatar');
                removeFromLocalStorage('mock_phone');
                removeFromLocalStorage('mock_bio');
                window.location.href = 'email_verification.html';
            } catch (error) {
                console.error('Sign out error:', error);
                showToast('Error signing out', 'error');
            }
        }

        // ─── INIT ─────────────────────────────────────────────────────
        async function initApp() {
            const authenticated = checkAuth();

            if (!authenticated) {
                showToast('Please login first', 'error');
                setTimeout(() => {
                    window.location.href = 'email_verification.html';
                }, 1500);
                return;
            }

            await loadUserProfile();
            await loadChats();
            subscribeToChats();

            console.log('🚀 AURA Chat loaded!');
            console.log('👤 User:', currentUserId);
            console.log('📧 Email:', currentUserEmail);
        }

        // ─── START APP ──────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    initApp();
                } else {
                    const userId = getFromLocalStorage('mock_user_id');
                    if (userId) {
                        initApp();
                    } else {
                        window.location.href = 'email_verification.html';
                    }
                }
            });
        });

        // ─── KEYBOARD SHORTCUTS ──────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active').forEach(el => {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                });
            }
        });

        console.log('📱 AURA Chat — Main Screen');
        console.log('🔗 Firebase Project:', firebaseConfig.projectId);
    </script>

</body>
</html>
