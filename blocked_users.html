<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AURA - Blocked Users</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0A0A0F;
    color: #fff;
    overflow: hidden;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 10px; }

#app {
    height: 100vh; height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex; flex-direction: column;
    background:
        radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
        #0A0A0F;
    overflow: hidden;
}

.app-bar {
    padding: 8px 12px;
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
    background: rgba(10, 10, 15, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    min-height: 56px;
}
.back-btn {
    background: none; border: none; color: rgba(255,255,255,0.7);
    font-size: 18px; padding: 6px; cursor: pointer;
    border-radius: 50%; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
}
.back-btn:hover { background: rgba(255,255,255,0.05); }
.app-title {
    flex: 1;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    display: flex; align-items: center; gap: 10px;
}
.app-title .count-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    color: #fff;
    display: none;
}
.app-title .count-badge.show { display: inline-block; }

.content {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 30px 0;
}

.search-bar {
    padding: 8px 16px 12px 16px;
    position: sticky;
    top: 0;
    background: rgba(10, 10, 15, 0.95);
    backdrop-filter: blur(10px);
    z-index: 10;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.search-input {
    width: 100%;
    padding: 10px 14px 10px 40px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.15s;
}
.search-input:focus { border-color: rgba(139, 92, 246, 0.5); }
.search-input::placeholder { color: rgba(255,255,255,0.3); }
.search-wrap { position: relative; }
.search-wrap .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 14px;
    pointer-events: none;
}

.user-list { list-style: none; }

.user-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    margin: 0 4px;
    border-radius: 12px;
    transition: background 0.15s;
    user-select: none;
    -webkit-user-select: none;
}
.user-row:hover { background: rgba(255,255,255,0.03); }
.user-row.unblocking {
    opacity: 0.4;
    pointer-events: none;
}

.user-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
}
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }

.user-info { flex: 1; min-width: 0; }
.user-name {
    font-size: 14.5px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex; align-items: center; gap: 5px;
}
.user-name .verified-badge { color: #1DA1F2; font-size: 12px; }
.user-username {
    font-size: 12.5px;
    color: rgba(255,255,255,0.45);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.user-blocked-time {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    margin-top: 2px;
}

.unblock-btn {
    padding: 8px 16px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #FCA5A5;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
}
.unblock-btn:hover {
    background: rgba(239, 68, 68, 0.2);
    border-color: rgba(239, 68, 68, 0.5);
}
.unblock-btn:active { transform: scale(0.96); }
.unblock-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.loading-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
}
.spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(139, 92, 246, 0.2);
    border-top-color: #8B5CF6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: rgba(255,255,255,0.4); font-size: 13.5px; margin-top: 14px; }

.empty-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 30px;
    text-align: center;
}
.empty-icon {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(139, 92, 246, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: rgba(139, 92, 246, 0.5);
    margin-bottom: 20px;
}
.empty-title {
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
}
.empty-text {
    color: rgba(255,255,255,0.4);
    font-size: 13.5px;
    line-height: 1.5;
    max-width: 280px;
}

.toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: #1a103c;
    color: #fff;
    padding: 12px 22px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 13.5px;
    z-index: 5000;
    display: none;
    max-width: 90%;
    text-align: center;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
.toast.show { display: block; animation: toastIn 0.25s ease-out; }
@keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 12px); }
    to { opacity: 1; transform: translate(-50%, 0); }
}
.toast.success {
    border-color: rgba(74, 222, 128, 0.5);
    background: rgba(74, 222, 128, 0.12);
}
.toast.error {
    border-color: rgba(239, 68, 68, 0.5);
    background: rgba(239, 68, 68, 0.12);
}

.dialog-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 6000; display: none;
    align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(4px);
}
.dialog-overlay.active { display: flex; }
.dialog-content {
    background: rgba(26, 16, 60, 0.98);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    border: 1px solid rgba(255,255,255,0.08);
    animation: dialogIn 0.2s ease-out;
}
@keyframes dialogIn {
    from { opacity: 0; transform: scale(0.94); }
    to { opacity: 1; transform: scale(1); }
}
.dialog-title {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
}
.dialog-title .d-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(16, 185, 129, 0.15);
    color: #10B981;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}
.dialog-text {
    font-size: 13.5px;
    color: rgba(255,255,255,0.55);
    line-height: 1.5;
    margin-bottom: 20px;
}
.dialog-actions {
    display: flex; gap: 10px; justify-content: flex-end;
}
.dialog-btn {
    padding: 10px 20px;
    border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: transform 0.15s;
}
.dialog-btn:active { transform: scale(0.96); }
.dialog-btn-cancel {
    background: transparent;
    color: rgba(255,255,255,0.5);
}
.dialog-btn-primary {
    background: linear-gradient(135deg, #10B981, #06B6D4);
    color: #fff;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
}

@media (max-width: 480px) {
    .user-avatar { width: 44px; height: 44px; font-size: 16px; }
    .unblock-btn { padding: 7px 12px; font-size: 12px; }
}
</style>
</head>
<body>

<div id="app">
    <div class="app-bar">
        <button class="back-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="app-title">
            Blocked Users
            <span class="count-badge" id="countBadge">0</span>
        </div>
    </div>

    <div class="content">
        <div class="search-bar" id="searchBar" style="display:none;">
            <div class="search-wrap">
                <i class="fas fa-search search-icon"></i>
                <input class="search-input" id="searchInput" placeholder="Search blocked users..." autocomplete="off" />
            </div>
        </div>

        <div id="listContainer">
            <div class="loading-wrap">
                <div class="spinner"></div>
                <div class="loading-text">Loading blocked users...</div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<div class="dialog-overlay" id="unblockDialog">
    <div class="dialog-content">
        <div class="dialog-title">
            <div class="d-icon"><i class="fas fa-lock-open"></i></div>
            Unblock User?
        </div>
        <div class="dialog-text" id="unblockDialogText">
            They will be able to message you again.
        </div>
        <div class="dialog-actions">
            <button class="dialog-btn dialog-btn-cancel" onclick="closeUnblockDialog()">Cancel</button>
            <button class="dialog-btn dialog-btn-primary" id="unblockConfirmBtn" onclick="confirmUnblock()">
                <i class="fas fa-lock-open"></i> Unblock
            </button>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
    authDomain: "aurachat-85f54.firebaseapp.com",
    projectId: "aurachat-85f54",
    storageBucket: "aurachat-85f54.firebasestorage.app",
    messagingSenderId: "539789121540",
    appId: "1:539789121540:web:96ac597e52dd0a80573d51"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const LS_PREFIX = 'aura_';

function lsGet(key) {
    try {
        const raw = localStorage.getItem(LS_PREFIX + key);
        return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
}

function lsSet(key, value) {
    try {
        localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    } catch(e) {}
}

function getLocalBlocked() {
    const all = lsGet('blocked_users') || {};
    return all[currentUserId] || [];
}

function setLocalBlocked(list) {
    const all = lsGet('blocked_users') || {};
    all[currentUserId] = list;
    lsSet('blocked_users', all);
}

function getLocalBlockedTimes() {
    const all = lsGet('blocked_times') || {};
    return all[currentUserId] || {};
}

function removeLocalBlockedTime(uid) {
    const all = lsGet('blocked_times') || {};
    if (all[currentUserId] && all[currentUserId][uid]) {
        delete all[currentUserId][uid];
        lsSet('blocked_times', all);
    }
}

let currentUserId = null;
let allUsers = [];
let searchQuery = '';
let pendingUnblockUid = null;
let pendingUnblockName = null;

const $ = function(id) { return document.getElementById(id); };
const toast = $('toast');
const listContainer = $('listContainer');
const searchInput = $('searchInput');
const searchBar = $('searchBar');
const countBadge = $('countBadge');

function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast show ' + (type || '');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2400);
}

function esc(text) {
    if (!text) return '';
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

function goBack() {
    if (window.history.length > 1) window.history.back();
    else window.location.href = 'profile.html';
}

function isVerified(email) {
    if (!email) return false;
    const e = email.toLowerCase().trim();
    if (e.endsWith('@bot.aurachat.app')) return false;
    return e.endsWith('@gmail.com') || e.endsWith('@aurachat.app');
}

function checkAuth() {
    const userId = localStorage.getItem('mock_user_id');
    if (userId) { currentUserId = userId; return true; }
    if (auth.currentUser) {
        currentUserId = auth.currentUser.uid;
        localStorage.setItem('mock_user_id', currentUserId);
        return true;
    }
    return false;
}

function timeAgo(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

async function loadBlockedUsers() {
    try {
        let fsBlocked = [];
        let fsBlockedTimes = {};
        try {
            const userDoc = await db.collection('users').doc(currentUserId).get();
            if (userDoc.exists) {
                const data = userDoc.data() || {};
                fsBlocked = data.blocked_users || [];
                fsBlockedTimes = data.blocked_at_times || {};
            }
        } catch(e) { console.warn('Read blocked failed:', e); }

        const lsBlocked = getLocalBlocked();
        const lsBlockedTimes = getLocalBlockedTimes();
        const allIds = Array.from(new Set(fsBlocked.concat(lsBlocked)));

        if (allIds.length === 0) {
            allUsers = [];
            searchBar.style.display = 'none';
            updateCountBadge();
            renderList();
            return;
        }

        searchBar.style.display = 'block';

        const users = [];
        for (const uid of allIds) {
            let profile = null;
            try {
                const doc = await db.collection('users').doc(uid).get();
                if (doc.exists) {
                    profile = Object.assign({ uid: uid }, doc.data());
                }
            } catch(e) { console.warn('Read blocked user failed:', uid, e); }

            if (!profile) {
                profile = {
                    uid: uid,
                    username: 'user_' + uid.substring(0, 6),
                    display_name: 'Blocked User',
                    avatar_url: null,
                    email: null
                };
            }

            profile.blocked_at = fsBlockedTimes[uid] || lsBlockedTimes[uid] || null;
            users.push(profile);
        }

        users.sort(function(a, b) {
            const ta = a.blocked_at && a.blocked_at.toMillis ? a.blocked_at.toMillis() : 0;
            const tb = b.blocked_at && b.blocked_at.toMillis ? b.blocked_at.toMillis() : 0;
            return tb - ta;
        });

        allUsers = users;
        updateCountBadge();
        renderList();
    } catch(e) {
        console.error('Load failed:', e);
        listContainer.innerHTML = '<div class="empty-wrap"><div class="empty-icon"><i class="fas fa-triangle-exclamation"></i></div><div class="empty-title">Could not load</div><div class="empty-text">' + esc(e.message) + '</div></div>';
    }
}

function updateCountBadge() {
    if (allUsers.length > 0) {
        countBadge.textContent = allUsers.length;
        countBadge.classList.add('show');
    } else {
        countBadge.classList.remove('show');
    }
}

function renderList() {
    const q = searchQuery.trim().toLowerCase();

    const filtered = allUsers.filter(function(u) {
        if (!q) return true;
        const name = (u.display_name || '').toLowerCase();
        const uname = (u.username || '').toLowerCase();
        return name.indexOf(q) >= 0 || uname.indexOf(q) >= 0;
    });

    if (allUsers.length === 0) {
        listContainer.innerHTML =
            '<div class="empty-wrap">' +
                '<div class="empty-icon"><i class="fas fa-shield-halved"></i></div>' +
                '<div class="empty-title">No blocked users</div>' +
                '<div class="empty-text">When you block someone, they will appear here. You can unblock them anytime.</div>' +
            '</div>';
        return;
    }

    if (filtered.length === 0) {
        listContainer.innerHTML =
            '<div class="empty-wrap">' +
                '<div class="empty-icon"><i class="fas fa-search"></i></div>' +
                '<div class="empty-title">No matches</div>' +
                '<div class="empty-text">No blocked users match "' + esc(searchQuery) + '"</div>' +
            '</div>';
        return;
    }

    let html = '<ul class="user-list">';
    filtered.forEach(function(u) {
        const name = u.display_name || u.username || 'User';
        const uname = u.username || 'user';
        const avatar = u.avatar_url;
        const verified = isVerified(u.email);

        let avatarHtml;
        if (avatar) {
            avatarHtml = '<img src="' + avatar + '" onerror="this.parentElement.innerHTML=\'' + name[0].toUpperCase() + '\'" />';
        } else {
            avatarHtml = name[0].toUpperCase();
        }

        const verifiedHtml = verified ? '<span class="verified-badge"><i class="fas fa-check-circle"></i></span>' : '';
        const blockedTime = u.blocked_at ? timeAgo(u.blocked_at) : '';
        const timeHtml = blockedTime ? '<div class="user-blocked-time">Blocked ' + blockedTime + '</div>' : '';

        html += '<li class="user-row" data-uid="' + u.uid + '">' +
            '<div class="user-avatar">' + avatarHtml + '</div>' +
            '<div class="user-info">' +
                '<div class="user-name">' + esc(name) + verifiedHtml + '</div>' +
                '<div class="user-username">@' + esc(uname) + '</div>' +
                timeHtml +
            '</div>' +
            '<button class="unblock-btn" onclick="askUnblock(\'' + u.uid + '\', \'' + esc(name).replace(/'/g, "\\'") + '\')">' +
                '<i class="fas fa-lock-open"></i> Unblock' +
            '</button>' +
        '</li>';
    });
    html += '</ul>';

    listContainer.innerHTML = html;
}

function askUnblock(uid, name) {
    pendingUnblockUid = uid;
    pendingUnblockName = name;
    $('unblockDialogText').textContent = name + ' will be able to message you again.';
    $('unblockDialog').classList.add('active');
}

function closeUnblockDialog() {
    pendingUnblockUid = null;
    pendingUnblockName = null;
    $('unblockDialog').classList.remove('active');
}

async function confirmUnblock() {
    const uid = pendingUnblockUid;
    const name = pendingUnblockName;
    closeUnblockDialog();

    if (!uid) return;

    const row = document.querySelector('.user-row[data-uid="' + uid + '"]');
    if (row) row.classList.add('unblocking');

    let lsBlocked = getLocalBlocked();
    lsBlocked = lsBlocked.filter(function(id) { return id !== uid; });
    setLocalBlocked(lsBlocked);
    removeLocalBlockedTime(uid);

    try {
        const userRef = db.collection('users').doc(currentUserId);
        const doc = await userRef.get();
        if (doc.exists) {
            const data = doc.data() || {};
            const currentBlocked = data.blocked_users || [];
            const newBlocked = currentBlocked.filter(function(id) { return id !== uid; });

            const updatePayload = {
                blocked_users: newBlocked,
                updated_at: firebase.firestore.FieldValue.serverTimestamp()
            };

            const times = data.blocked_at_times || {};
            if (times[uid]) {
                delete times[uid];
                updatePayload.blocked_at_times = times;
            }

            await userRef.update(updatePayload);
        }
    } catch(e) {
        console.warn('Firestore unblock failed (unblocked locally):', e.code || e.message);
    }

    allUsers = allUsers.filter(function(u) { return u.uid !== uid; });
    updateCountBadge();
    renderList();

    showToast(name + ' unblocked', 'success');
}

searchInput.addEventListener('input', function(e) {
    searchQuery = e.target.value || '';
    renderList();
});

$('unblockDialog').addEventListener('click', function(e) {
    if (e.target === $('unblockDialog')) closeUnblockDialog();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeUnblockDialog();
    }
});

document.addEventListener('DOMContentLoaded', function() {
    auth.onAuthStateChanged(function(user) {
        if (user) {
            currentUserId = user.uid;
            localStorage.setItem('mock_user_id', currentUserId);
            loadBlockedUsers();
        } else {
            const userId = localStorage.getItem('mock_user_id');
            if (userId) {
                currentUserId = userId;
                loadBlockedUsers();
            } else {
                window.location.href = 'email_verification.html';
            }
        }
    });
});
</script>

</body>
</html>
