<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Bot Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --accent:#A855F7;--accent-2:#3B82F6;
  --accent-grad:linear-gradient(135deg,#A855F7,#3B82F6);
  --bg:#0A0A0F;--bg-2:#14121A;
  --bubble:#1C1A24;
  --border:rgba(255,255,255,0.06);
  --text:#FFF;--text-2:rgba(255,255,255,0.55);--text-3:rgba(255,255,255,0.35);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  overflow:hidden;-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(168,85,247,0.3);border-radius:3px;}

#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(168,85,247,0.08), transparent 55%),
    var(--bg);
}

.header{
  padding:10px 8px;display:flex;align-items:center;gap:6px;
  background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);min-height:58px;flex-shrink:0;
}
.icon-btn{
  background:none;border:none;color:var(--text);font-size:17px;
  width:40px;height:40px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s;
}
.icon-btn:hover{background:rgba(255,255,255,0.05);}
.chat-info{display:flex;align-items:center;gap:11px;flex:1;min-width:0;cursor:pointer;}
.chat-avatar{
  width:42px;height:42px;border-radius:50%;
  background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;overflow:hidden;flex-shrink:0;
  border:1px solid rgba(255,255,255,0.08);
}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}
.chat-meta{flex:1;min-width:0;}
.chat-name-row{display:flex;align-items:center;gap:6px;}
.chat-name{font-weight:600;font-size:15px;letter-spacing:-0.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bot-badge{
  font-size:9px;font-weight:800;letter-spacing:0.6px;
  color:#fff;background:var(--accent-grad);
  padding:2px 6px;border-radius:4px;flex-shrink:0;
}
.chat-sub{font-size:11.5px;color:var(--text-3);margin-top:1px;font-weight:500;}
.chat-sub.typing{color:var(--accent);}

.messages{
  flex:1;overflow-y:auto;padding:16px 12px 12px 12px;
  display:flex;flex-direction:column;gap:4px;
}
.msg{display:flex;width:100%;margin-bottom:2px;}
.msg.out{justify-content:flex-end;}
.bubble{
  max-width:82%;background:var(--bubble);
  border-radius:16px;padding:10px 14px;
  font-size:14.5px;line-height:1.5;
  word-wrap:break-word;white-space:pre-wrap;
  border:1px solid var(--border);
}
.msg.out .bubble{
  background:var(--accent-grad);
  border-color:transparent;color:#fff;
  border-bottom-right-radius:6px;
}
.msg:not(.out) .bubble{border-bottom-left-radius:6px;}
.bubble a{color:#C4B5FD;text-decoration:none;}
.msg.out .bubble a{color:#fff;text-decoration:underline;}
.bubble code{
  font-family:'JetBrains Mono',monospace;
  background:rgba(168,85,247,0.15);color:#C4B5FD;
  padding:2px 7px;border-radius:5px;font-size:13px;
}
.msg.out .bubble code{background:rgba(0,0,0,0.25);color:#fff;}
.bubble strong{color:#fff;font-weight:700;}
.msg:not(.out) .bubble strong{color:#C4B5FD;}
.bubble em{color:var(--text-2);font-style:normal;}

.bubble .sent-image{
  display:block;margin:-6px -10px 6px -10px;
  border-radius:12px;overflow:hidden;max-height:280px;
}
.bubble .sent-image img{width:100%;max-height:280px;object-fit:cover;display:block;}

.msg-time{
  font-size:10.5px;color:rgba(255,255,255,0.4);
  text-align:right;margin-top:3px;
}
.msg.out .msg-time{color:rgba(255,255,255,0.7);}

/* Date divider */
.date-div{
  text-align:center;margin:12px 0 8px 0;
}
.date-div span{
  display:inline-block;padding:4px 12px;
  background:rgba(255,255,255,0.04);
  color:var(--text-3);font-size:11.5px;
  font-weight:600;border-radius:10px;
}

/* Empty state */
.empty-state{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 30px;text-align:center;
}
.empty-state .bot-avatar-lg{
  width:88px;height:88px;border-radius:50%;
  background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center;
  font-size:38px;color:#fff;overflow:hidden;
  margin-bottom:20px;
  border:2px solid rgba(255,255,255,0.08);
}
.empty-state .bot-avatar-lg img{width:100%;height:100%;object-fit:cover;}
.empty-state h2{
  font-size:20px;font-weight:700;margin-bottom:8px;
  letter-spacing:-0.02em;
}
.empty-state p{
  font-size:13.5px;color:var(--text-2);
  line-height:1.55;margin-bottom:24px;max-width:280px;
}
.start-btn{
  padding:12px 28px;border:none;border-radius:24px;
  background:var(--accent-grad);color:#fff;
  font-size:14px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:transform .15s;
  display:inline-flex;align-items:center;gap:8px;
}
.start-btn:hover{transform:scale(1.03);}

.typing-ind{display:none;margin:2px 0 6px 0;}
.typing-ind.show{display:flex;}
.typing-ind .dots{
  display:flex;gap:5px;padding:13px 18px;
  background:var(--bubble);border-radius:16px;
  border-bottom-left-radius:6px;border:1px solid var(--border);
}
.typing-ind .dots span{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  animation:typingB 1.3s infinite ease-in-out both;
}
.typing-ind .dots span:nth-child(1){animation-delay:-0.3s;}
.typing-ind .dots span:nth-child(2){animation-delay:-0.15s;}
@keyframes typingB{
  0%,80%,100%{transform:scale(0.5);opacity:.4;}
  40%{transform:scale(1);opacity:1;}
}

.input-area{
  padding:10px 12px;background:rgba(10,10,15,0.95);
  backdrop-filter:blur(20px);border-top:1px solid var(--border);
  flex-shrink:0;
}
.input-row{display:flex;align-items:center;gap:8px;}
.attach-btn{
  width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.04);color:var(--text-2);
  font-size:16px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.attach-btn:hover{background:rgba(168,85,247,0.15);color:#C4B5FD;}
.input-field{
  flex:1;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:22px;
  padding:11px 18px;color:#fff;font-size:14px;
  font-family:inherit;outline:none;min-height:42px;
}
.input-field::placeholder{color:var(--text-3);}
.input-field:focus{border-color:rgba(168,85,247,0.4);}
.send-btn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:var(--accent-grad);color:#fff;font-size:16px;
  cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.send-btn:hover{transform:scale(1.05);}

.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:#1A1822;border:1px solid var(--border);
  color:#fff;padding:10px 20px;border-radius:12px;
  font-size:13px;font-weight:500;z-index:3000;display:none;
  max-width:90%;
}
.toast.show{display:block;}
.toast.error{border-color:rgba(239,68,68,0.3);}
.hidden{display:none!important;}

.media-preview{display:none;padding:8px 12px 0 12px;}
.media-preview.show{display:block;}
.media-preview .box{
  display:flex;align-items:center;gap:12px;
  background:rgba(168,85,247,0.08);
  border:1px solid rgba(168,85,247,0.2);
  border-radius:12px;padding:10px;
}
.media-preview .thumb{
  width:44px;height:44px;border-radius:8px;
  background:rgba(0,0,0,0.3);overflow:hidden;flex-shrink:0;
}
.media-preview .thumb img{width:100%;height:100%;object-fit:cover;}
.media-preview .info{flex:1;min-width:0;}
.media-preview .info .name{font-size:13px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.media-preview .info .size{font-size:11.5px;color:var(--text-3);margin-top:2px;}
.media-preview .cancel{
  background:none;border:none;color:var(--text-3);
  font-size:16px;cursor:pointer;padding:6px;
}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <button class="icon-btn" onclick="window.location.href='chats.html'">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="chat-info" onclick="openBotProfile()">
      <div class="chat-avatar" id="botAvatar"><i class="fas fa-robot"></i></div>
      <div class="chat-meta">
        <div class="chat-name-row">
          <div class="chat-name" id="botName">Bot</div>
          <span class="bot-badge">BOT</span>
        </div>
        <div class="chat-sub" id="botSub">@bot</div>
      </div>
    </div>
    <button class="icon-btn" onclick="openBotProfile()">
      <i class="fas fa-ellipsis-v"></i>
    </button>
  </div>

  <div class="messages" id="messages">
    <div id="emptyState" class="empty-state">
      <div class="bot-avatar-lg" id="emptyAvatar"><i class="fas fa-robot"></i></div>
      <h2 id="emptyName">Bot</h2>
      <p id="emptyAbout">Start a conversation with this bot.</p>
      <button class="start-btn" onclick="sendStart()">
        <i class="fas fa-play"></i> Start
      </button>
    </div>

    <div class="typing-ind" id="typingInd">
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="media-preview" id="mediaPreview">
    <div class="box">
      <div class="thumb" id="mediaThumb"></div>
      <div class="info">
        <div class="name" id="mediaName">image.jpg</div>
        <div class="size" id="mediaSize">0 KB</div>
      </div>
      <button class="cancel" onclick="clearPendingMedia()">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <div class="input-area" id="inputArea" style="display:none;">
    <div class="input-row">
      <button class="attach-btn" onclick="pickImage()">
        <i class="fas fa-image"></i>
      </button>
      <input class="input-field" id="msgInput" placeholder="Message..."
             onkeydown="if(event.key==='Enter')sendUserMsg()" autocomplete="off" />
      <button class="send-btn" onclick="sendUserMsg()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="imageInput" class="hidden" accept="image/*" />
<input type="file" id="cameraInput" class="hidden" accept="image/*" capture="environment" />

<script>
// ═══════════════════════════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:"AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
  authDomain:"aurachat-85f54.firebaseapp.com",
  projectId:"aurachat-85f54",
  storageBucket:"aurachat-85f54.firebasestorage.app",
  messagingSenderId:"539789121540",
  appId:"1:539789121540:web:96ac597e52dd0a80573d51"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const CLOUD_NAME = 'dn2mwp1lc';
const UPLOAD_PRESET = 'aura_chat';

async function uploadToCloudinary(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  fd.append('folder', 'aura_chat/bots');
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
    method:'POST', body: fd
  });
  if (!r.ok) throw new Error('Upload failed');
  const d = await r.json();
  return d.secure_url;
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let currentUserId = null;
let botId = null;
let botData = null;
let messagesUnsub = null;
let pendingMedia = null;
let hasStarted = false;

const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('msgInput');
const typingInd = $('typingInd');
const toast = $('toast');
const botName = $('botName');
const botAvatar = $('botAvatar');
const botSub = $('botSub');
const emptyState = $('emptyState');
const inputArea = $('inputArea');

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function showToast(m, t='') {
  toast.textContent = m;
  toast.className = 'toast show ' + t;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 2400);
}
function esc(t){if(!t)return '';const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function linkify(t){
  return esc(t)
    .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/\*([^*]+)\*/g, '<strong>$1</strong>')
    .replace(/_([^_]+)_/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}
function formatTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function formatDate(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const msgD = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.floor((today - msgD) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function formatSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
function scrollBottom() {
  requestAnimationFrame(() => messagesEl.scrollTop = messagesEl.scrollHeight);
}

// ═══════════════════════════════════════════════════════════════
// LOAD BOT INFO
// ═══════════════════════════════════════════════════════════════
async function loadBot() {
  const p = new URLSearchParams(location.search);
  botId = p.get('id');
  if (!botId) { location.href = 'chats.html'; return; }

  const doc = await db.collection('bots').doc(botId).get();
  if (!doc.exists) {
    showToast('Bot not found', 'error');
    setTimeout(() => location.href = 'chats.html', 1500);
    return;
  }
  botData = doc.data();

  // Header
  botName.textContent = botData.name;
  botSub.textContent = '@' + botData.username;
  const avatarHtml = botData.avatar_url
    ? `<img src="${botData.avatar_url}" />`
    : `<i class="fas fa-robot"></i>`;
  botAvatar.innerHTML = avatarHtml;

  // Empty state
  $('emptyAvatar').innerHTML = botData.avatar_url
    ? `<img src="${botData.avatar_url}" />`
    : `<i class="fas fa-robot"></i>`;
  $('emptyName').textContent = botData.name;
  $('emptyAbout').textContent = botData.about || 'Start a conversation with this bot.';

  // Ensure chat doc exists
  const chatDoc = await db.collection('chats').doc(botId).get();
  if (!chatDoc.exists) {
    await db.collection('chats').doc(botId).set({
      id: botId,
      type: 'bot',
      name: botData.name,
      username: botData.username,
      about: botData.about || '',
      avatar_url: botData.avatar_url || null,
      owner_id: botData.owner_id,
      participants: [currentUserId],
      participants_data: { [currentUserId]: { role: 'subscriber' } },
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
      last_message: '',
      last_message_at: firebase.firestore.FieldValue.serverTimestamp()
    });
  } else {
    // Add self as participant
    await db.collection('chats').doc(botId).update({
      participants: firebase.firestore.FieldValue.arrayUnion(currentUserId),
      [`participants_data.${currentUserId}`]: { role: 'subscriber' }
    }).catch(() => {});
  }

  loadMessages();
}

// ═══════════════════════════════════════════════════════════════
// LOAD MESSAGES (real-time)
// ═══════════════════════════════════════════════════════════════
function loadMessages() {
  if (messagesUnsub) messagesUnsub();

  messagesUnsub = db.collection('chats').doc(botId)
    .collection('messages')
    .orderBy('created_at', 'asc')
    .limit(200)
    .onSnapshot(snap => {
      const msgs = [];
      snap.forEach(doc => {
        const d = doc.data();
        if (d.deleted_for_everyone === true) return;
        const df = d.deleted_for || [];
        if (df.includes(currentUserId)) return;
        d.id = doc.id;
        msgs.push(d);
      });
      renderMessages(msgs);
    }, err => {
      console.error('Messages error:', err);
    });
}

function renderMessages(msgs) {
  // Save typing element
  const typingEl = typingInd;
  typingEl.remove();

  if (msgs.length === 0) {
    emptyState.style.display = 'flex';
    inputArea.style.display = 'none';
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    messagesEl.appendChild(typingEl);
    hasStarted = false;
    return;
  }

  emptyState.style.display = 'none';
  inputArea.style.display = 'block';
  hasStarted = true;

  let html = '';
  let lastDate = null;

  msgs.forEach(msg => {
    const isMe = msg.sender_id === currentUserId;
    const text = msg.text || msg.content || '';
    const mediaUrl = msg.media_url || '';
    const mediaType = msg.media_type || '';

    const dateKey = formatDate(msg.created_at);
    if (dateKey !== lastDate) {
      lastDate = dateKey;
      html += `<div class="date-div"><span>${dateKey}</span></div>`;
    }

    html += `<div class="msg ${isMe ? 'out' : ''}">`;
    html += `<div class="bubble">`;

    if (mediaType === 'image' && mediaUrl) {
      html += `<div class="sent-image"><img src="${mediaUrl}" /></div>`;
    }

    if (text) {
      html += linkify(text);
    }

    html += `<div class="msg-time">${formatTime(msg.created_at)}</div>`;
    html += `</div></div>`;
  });

  messagesEl.innerHTML = html;
  messagesEl.appendChild(typingEl);
  scrollBottom();
}

// ═══════════════════════════════════════════════════════════════
// START BUTTON
// ═══════════════════════════════════════════════════════════════
async function sendStart() {
  await sendMessage('/start');
}

// ═══════════════════════════════════════════════════════════════
// SEND MESSAGE
// ═══════════════════════════════════════════════════════════════
async function sendMessage(text, mediaUrl = null, mediaType = null) {
  if (!currentUserId || !botId) return;

  try {
    const ref = db.collection('chats').doc(botId).collection('messages').doc();
    await ref.set({
      id: ref.id,
      text: text || null,
      content: text || null,
      media_url: mediaUrl,
      media_type: mediaType,
      sender_id: currentUserId,
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
      reactions: {},
      views: 0,
      deleted_for_everyone: false,
      is_edited: false
    });

    await db.collection('chats').doc(botId).update({
      last_message: text ? text.slice(0, 80) : (mediaType === 'image' ? '📷 Photo' : ''),
      last_message_at: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(() => {});
  } catch (e) {
    console.error('Send error:', e);
    showToast('Failed to send', 'error');
  }
}

async function sendUserMsg() {
  const text = inputEl.value.trim();
  const hasImage = !!pendingMedia;
  if (!text && !hasImage) return;

  inputEl.value = '';

  if (hasImage) {
    const media = pendingMedia;
    clearPendingMedia();
    showToast('Uploading...');
    try {
      const url = await uploadToCloudinary(media.file);
      await sendMessage(text || null, url, 'image');
    } catch (e) {
      showToast('Upload failed', 'error');
    }
    return;
  }

  await sendMessage(text);
}

// ═══════════════════════════════════════════════════════════════
// IMAGE PICKER
// ═══════════════════════════════════════════════════════════════
function pickImage() {
  const useCamera = confirm('Use camera? Tap Cancel for gallery.');
  if (useCamera) $('cameraInput').click();
  else $('imageInput').click();
}
$('imageInput').addEventListener('change', handleImagePicked);
$('cameraInput').addEventListener('change', handleImagePicked);

function handleImagePicked(e) {
  const f = e.target.files[0];
  if (!f) return;
  e.target.value = '';
  pendingMedia = {
    file: f,
    previewUrl: URL.createObjectURL(f),
    name: f.name,
    size: f.size
  };
  $('mediaThumb').innerHTML = `<img src="${pendingMedia.previewUrl}" />`;
  $('mediaName').textContent = pendingMedia.name;
  $('mediaSize').textContent = formatSize(pendingMedia.size);
  $('mediaPreview').classList.add('show');
}
function clearPendingMedia() {
  if (pendingMedia && pendingMedia.previewUrl) URL.revokeObjectURL(pendingMedia.previewUrl);
  pendingMedia = null;
  $('mediaPreview').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════════
// OPEN PROFILE
// ═══════════════════════════════════════════════════════════════
function openBotProfile() {
  location.href = `bot_profile.html?id=${botId}`;
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function checkAuth() {
  const uid = localStorage.getItem('mock_user_id');
  if (uid) { currentUserId = uid; return true; }
  if (auth.currentUser) {
    currentUserId = auth.currentUser.uid;
    localStorage.setItem('mock_user_id', currentUserId);
    return true;
  }
  return false;
}

document.addEventListener('DOMContentLoaded', () => {
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUserId = user.uid;
      localStorage.setItem('mock_user_id', currentUserId);
      loadBot();
    } else {
      const uid = localStorage.getItem('mock_user_id');
      if (uid) { currentUserId = uid; loadBot(); }
      else location.href = 'email_verification.html';
    }
  });
});
</script>
