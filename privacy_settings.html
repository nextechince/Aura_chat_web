<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Privacy Settings</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 10px;
        }

        #app {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        .header {
            padding: 16px 20px 8px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .back-btn:hover { background: rgba(255,255,255,0.1); }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .content { padding: 16px 20px 20px 20px; }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: rgba(139, 92, 246, 0.8);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-left: 4px;
            margin-top: 16px;
        }

        .section-title:first-of-type { margin-top: 0; }

        .glass-card {
            padding: 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s;
        }

        .glass-card.active {
            border-color: rgba(139, 92, 246, 0.2);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.08);
        }

        .glass-card.saving {
            opacity: 0.7;
            pointer-events: none;
        }

        .glass-card .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #8B5CF6;
            flex-shrink: 0;
        }

        .glass-card .card-info { flex: 1; min-width: 0; }

        .glass-card .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        .glass-card .card-subtitle {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 2px;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 28px;
            flex-shrink: 0;
            cursor: pointer;
            display: inline-block;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .switch .slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.15);
            border-radius: 14px;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .switch .slider::before {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            left: 4px; bottom: 4px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .switch input:checked + .slider { background: #8B5CF6; }
        .switch input:checked + .slider::before { transform: translateX(20px); }

        .info-card {
            padding: 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-top: 16px;
        }

        .info-card .info-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(139, 92, 246, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8B5CF6;
            font-size: 18px;
            flex-shrink: 0;
        }

        .info-card .info-text {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            line-height: 1.5;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a103c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            z-index: 3000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .toast.show { display: block; }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.5);
            background: rgba(22, 60, 40, 0.95);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(60, 22, 22, 0.95);
        }

        .toast.info {
            border-color: rgba(139, 92, 246, 0.5);
            background: rgba(40, 22, 60, 0.95);
        }

        .sync-status {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            text-align: center;
            padding: 8px;
            margin-top: 4px;
        }

        .sync-status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .sync-status .dot.online { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
        .sync-status .dot.offline { background: #f87171; }
        .sync-status .dot.syncing { background: #fbbf24; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 16px;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
        }

        .loading-screen i {
            font-size: 32px;
            color: #8B5CF6;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .header-title { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="header-title">Privacy</div>
        </div>

        <div class="content" id="content">
            <div class="loading-screen">
                <i class="fas fa-circle-notch"></i>
                <div>Loading your privacy settings…</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ─── FIREBASE CONFIG ─────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ─── STATE ────────────────────────────────────────────────────
        let currentUserId = null;
        let settingsLoaded = false;
        let isSyncing = false;

        // Defaults — matches the Firestore schema exactly
        const DEFAULT_SETTINGS = {
            phoneNumberVisible: true,
            lastSeenVisible: true,
            profilePhotoVisible: true,
            forwardedMessages: true,
            addToGroups: true,
            findByPhone: true,
            findByUsername: true,
        };

        let settings = { ...DEFAULT_SETTINGS };

        // Map camelCase (UI) → snake_case (Firestore)
        const FIELD_MAP = {
            phoneNumberVisible:   'phone_number_visible',
            lastSeenVisible:      'last_seen_visible',
            profilePhotoVisible:  'profile_photo_visible',
            forwardedMessages:    'forwarded_messages',
            addToGroups:          'add_to_groups',
            findByPhone:          'find_by_phone',
            findByUsername:       'find_by_username',
        };

        // Reverse map
        const REVERSE_MAP = Object.fromEntries(
            Object.entries(FIELD_MAP).map(([k, v]) => [v, k])
        );

        // ─── TOAST ───────────────────────────────────────────────────
        const toast = document.getElementById('toast');
        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ─── NAVIGATION ──────────────────────────────────────────────
        function goBack() {
            if (history.length > 1) history.back();
            else window.location.href = 'index.html';
        }

        // ─── DOM REFS ────────────────────────────────────────────────
        const content = document.getElementById('content');

        // ─── AUTH ────────────────────────────────────────────────────
        function getUserId() {
            // Prefer Firebase Auth
            if (auth.currentUser && auth.currentUser.uid) {
                return auth.currentUser.uid;
            }
            // Fallback: mocked user id (same key other screens use)
            try {
                const id = localStorage.getItem('mock_user_id');
                if (id) {
                    try { return JSON.parse(id); }
                    catch { return id; }
                }
            } catch (e) {}
            return null;
        }

        // ─── FIRESTORE: LOAD ─────────────────────────────────────────
        async function loadFromFirestore() {
            if (!currentUserId) {
                throw new Error('No authenticated user');
            }

            const docRef = db.collection('users').doc(currentUserId);
            const doc = await docRef.get();

            if (doc.exists) {
                const data = doc.data() || {};
                const privacy = data.privacy_settings || {};

                // Apply each known field if present
                Object.entries(FIELD_MAP).forEach(([uiKey, dbKey]) => {
                    if (typeof privacy[dbKey] === 'boolean') {
                        settings[uiKey] = privacy[dbKey];
                    }
                });

                // If privacy_settings doesn't exist yet, initialize it
                if (!data.privacy_settings) {
                    await docRef.set({
                        privacy_settings: buildDbPayload(),
                        privacy_updated_at: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                }
            } else {
                // Brand new user doc — create with defaults
                await docRef.set({
                    privacy_settings: buildDbPayload(),
                    privacy_updated_at: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            }

            settingsLoaded = true;
        }

        // ─── FIRESTORE: SAVE ─────────────────────────────────────────
        function buildDbPayload() {
            const out = {};
            Object.entries(FIELD_MAP).forEach(([uiKey, dbKey]) => {
                out[dbKey] = settings[uiKey] === true;
            });
            return out;
        }

        async function saveToFirestore() {
            if (!currentUserId) {
                showToast('Not signed in — cannot save', 'error');
                return false;
            }

            isSyncing = true;
            updateSyncStatus();

            try {
                await db.collection('users').doc(currentUserId).set({
                    privacy_settings: buildDbPayload(),
                    privacy_updated_at: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                isSyncing = false;
                updateSyncStatus('online');
                return true;
            } catch (e) {
                console.error('❌ Firestore save failed:', e);
                isSyncing = false;
                updateSyncStatus('offline');
                showToast('Save failed: ' + (e.code || e.message), 'error');
                return false;
            }
        }

        // ─── SYNC STATUS UI ──────────────────────────────────────────
        let lastSyncState = 'idle'; // idle | online | offline
        function updateSyncStatus(force) {
            if (force) lastSyncState = force;
            const el = document.getElementById('syncStatus');
            if (!el) return;

            let dotClass = 'offline';
            let text = 'Not synced';

            if (isSyncing) {
                dotClass = 'syncing';
                text = 'Saving to Firebase…';
            } else if (lastSyncState === 'online') {
                dotClass = 'online';
                text = 'Synced with Firebase';
            } else if (lastSyncState === 'offline') {
                dotClass = 'offline';
                text = 'Firebase sync failed — check rules';
            }

            el.innerHTML = `<span class="dot ${dotClass}"></span>${text}`;
        }

        // ─── RENDER ──────────────────────────────────────────────────
        function render() {
            content.innerHTML = `
                <div class="section-title">Who Can See My Info</div>
                ${renderToggle('phoneNumberVisible', 'fa-phone', 'Phone Number', 'Show my phone number to others')}
                ${renderToggle('lastSeenVisible', 'fa-clock', 'Last Seen', 'Show when I was last online')}
                ${renderToggle('profilePhotoVisible', 'fa-image', 'Profile Photo', 'Show my profile photo to others')}

                <div class="section-title">Messaging</div>
                ${renderToggle('forwardedMessages', 'fa-share', 'Forwarded Messages', 'Allow others to forward my messages')}
                ${renderToggle('addToGroups', 'fa-user-plus', 'Add to Groups', 'Allow others to add me to groups')}

                <div class="section-title">Find Me</div>
                ${renderToggle('findByPhone', 'fa-mobile-screen-button', 'Find by Phone Number', 'People can find me using my phone')}
                ${renderToggle('findByUsername', 'fa-at', 'Find by Username', 'People can find me using my username')}

                <div class="info-card">
                    <div class="info-icon"><i class="fas fa-cloud"></i></div>
                    <div class="info-text">
                        These settings are stored in Firebase and are used by your chat, profile,
                        and search screens. Changes save instantly.
                    </div>
                </div>

                <div class="sync-status" id="syncStatus"></div>
            `;

            attachListeners();
            updateSyncStatus();
        }

        function renderToggle(key, icon, title, subtitle) {
            const value = settings[key] === true;
            return `
                <div class="glass-card ${value ? 'active' : ''}" data-card="${key}">
                    <div class="card-icon"><i class="fas ${icon}"></i></div>
                    <div class="card-info">
                        <div class="card-title">${title}</div>
                        <div class="card-subtitle">${subtitle}</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" data-toggle-key="${key}" ${value ? 'checked' : ''} />
                        <span class="slider"></span>
                    </label>
                </div>
            `;
        }

        // ─── LISTENERS ───────────────────────────────────────────────
        function attachListeners() {
            content.querySelectorAll('input[data-toggle-key]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const key = e.target.getAttribute('data-toggle-key');
                    handleToggle(key, e.target.checked, e.target);
                });
            });
        }

        // ─── TOGGLE HANDLER (Firestore write) ────────────────────────
        async function handleToggle(key, value, inputEl) {
            const previous = settings[key];
            settings[key] = value;

            // Optimistic UI
            const card = content.querySelector(`.glass-card[data-card="${key}"]`);
            if (card) {
                card.classList.toggle('active', value);
                card.classList.add('saving');
            }

            const ok = await saveToFirestore();

            if (card) card.classList.remove('saving');

            if (!ok) {
                // Rollback on failure
                settings[key] = previous;
                if (inputEl) inputEl.checked = previous;
                if (card) card.classList.toggle('active', previous);
                return;
            }

            // Success toast with friendly name
            const labels = {
                phoneNumberVisible: 'Phone number',
                lastSeenVisible: 'Last seen',
                profilePhotoVisible: 'Profile photo',
                forwardedMessages: 'Message forwarding',
                addToGroups: 'Group invites',
                findByPhone: 'Phone discovery',
                findByUsername: 'Username discovery',
            };
            showToast(
                `${labels[key] || key} ${value ? 'enabled' : 'disabled'} · saved`,
                'success'
            );
        }

        // ─── INIT ────────────────────────────────────────────────────
        async function init() {
            currentUserId = getUserId();

            if (!currentUserId) {
                content.innerHTML = `
                    <div class="loading-screen">
                        <i class="fas fa-lock" style="animation:none;"></i>
                        <div>Please sign in to manage privacy settings</div>
                    </div>
                `;
                return;
            }

            try {
                await loadFromFirestore();
                render();
                lastSyncState = 'online';
                updateSyncStatus('online');
                console.log('✅ Privacy settings loaded from Firebase for:', currentUserId);
            } catch (e) {
                console.error('Load failed:', e);
                showToast('Could not load settings: ' + (e.code || e.message), 'error');
                // Still render with defaults so toggles are usable
                render();
                lastSyncState = 'offline';
                updateSyncStatus('offline');
            }
        }

        // ─── STARTUP ─────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user && user.uid) {
                    currentUserId = user.uid;
                    try { localStorage.setItem('mock_user_id', user.uid); } catch (e) {}
                } else {
                    // Fall back to mocked id (already verified in init)
                }
                if (!settingsLoaded) init();
            });
        });

        console.log('🔐 AURA Chat — Privacy Settings (Firestore only)');
    </script>

</body>
</html>
