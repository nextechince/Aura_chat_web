<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AURA - Privacy Settings</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; overflow-x: hidden; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.4); border-radius: 10px; }
#app {
    min-height: 100vh;
    background: radial-gradient(ellipse at 20% 50%, rgba(139,92,246,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6,182,212,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236,72,153,0.04) 0%, transparent 50%), #0A0A0F;
    max-width: 480px; margin: 0 auto; padding-bottom: 40px;
}
.header { padding: 16px 20px 8px 20px; display: flex; align-items: center; gap: 16px; }
.back-btn {

}

.header-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
.content { padding: 16px 20px 20px 20px; }
.section-title {
    font-size: 13px; font-weight: 700; color: rgba(139,92,246,0.8);
    letter-spacing: 0.5px; margin-bottom: 12px; padding-left: 4px; margin-top: 16px;
}
.section-title:first-of-type { margin-top: 0; }
.glass-card, .action-card {
    padding: 16px; border-radius: 20px; background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);

    display: flex; align-items: center; gap: 14px; transition: all 0.3s;
}
.glass-card.active { border-color: rgba(139,92,246,0.2); box-shadow: 0 4px 20px rgba(139,92,246,0.08); }
.action-card { cursor: pointer; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); width: 100%; color: inherit; font-family: inherit; text-align: left; }
.action-card:hover { background: rgba(255,255,255,0.07); }
.action-card:active { transform: scale(0.98); }
.card-icon {
    width: 42px; height: 42px; border-radius: 12px; background: rgba(139,92,246,0.15);
    border: 1px solid rgba(139,92,246,0.2); display: flex; align-items: center;

}
.card-info { flex: 1; min-width: 0; }

.card-subtitle { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }

.arrow { color: rgba(255,255,255,0.2); font-size: 16px; }
.switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; cursor: pointer; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; inset: 0; background: rgba(255,255,255,0.15); border-radius: 14px; transition: all 0.3s; }
.switch .slider::before { content: ''; position: absolute; width: 20px; height: 20px; left: 4px; bottom: 4px; background: #fff; border-radius: 50%; transition: all 0.3s; }
.switch input:checked + .slider { background: #8B5CF6; }
.switch input:checked + .slider::before { transform: translateX(20px); }
.info-card {
    padding: 16px; border-radius: 20px; background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 12px; align-items: flex-start; margin-top: 16px;
}
.info-card .info-icon {
    width: 36px; height: 36px; border-radius: 10px; background: rgba(139,92,246,0.15);
    display: flex; align-items: center; justify-content: center;

}

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal-content {
    background: #1C1C1E; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px;
    max-height: 80vh; padding: 20px; animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
    overflow-y: auto; border: 1px solid rgba(255,255,255,0.08);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 0 auto 16px auto; }
.modal-title { font-size: 18px; font-weight: 700; color: #fff; text-align: center; margin-bottom: 16px; }
.modal-option {
    display: flex; align-items: center; padding: 12px 16px; border-radius: 12px;
    cursor: pointer; transition: background 0.15s; background: transparent;
    border: none; width: 100%; color: inherit; font-family: inherit;
}
.modal-option:hover { background: rgba(255,255,255,0.05); }
.modal-option .option-icon { width: 28px; color: rgba(255,255,255,0.4); font-size: 18px; margin-right: 16px; text-align: center; }
.modal-option .option-icon.selected { color: #8B5CF6; }
.modal-option .option-label { font-size: 15px; color: #fff; }
.modal-option .option-label.selected { color: #8B5CF6; font-weight: 600; }
.modal-option .option-check { margin-left: auto; color: #8B5CF6; font-size: 18px; }
.dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; }
.dialog-overlay.active { display: flex; }
.dialog-content {
    background: rgba(26,16,60,0.95); backdrop-filter: blur(20px); border-radius: 24px;
    padding: 24px; width: 90%; max-width: 380px;

}
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.dialog-icon { font-size: 32px; color: #8B5CF6; text-align: center; margin-bottom: 12px; }
.dialog-title { font-size: 18px; font-weight: 700; color: #fff; text-align: center; }
.dialog-subtitle { font-size: 13px; color: rgba(255,255,255,0.5); text-align: center; margin-top: 4px; }
.dots { display: flex; justify-content: center; gap: 12px; margin: 24px 0; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: all 0.3s; }

.num-btn { padding: 16px; border: none; border-radius: 40px; background: transparent; color: #fff; font-size: 28px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s; }

.dialog-cancel:hover { background: rgba(255,255,255,0.05); }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a103c; color: #fff; padding: 12px 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; z-index: 5000; display: none; max-width: 90%; text-align: center; font-family: 'Inter', sans-serif; }
.toast.show { display: block; }
.toast.success { border-color: rgba(74,222,128,0.5); background: rgba(74,222,128,0.1); }
.toast.error { border-color: rgba(239,68,68,0.5); background: rgba(239,68,68,0.1); }

.lock-overlay.active { display: flex; }
.lock-icon-wrap { width: 80px; height: 80px; border-radius: 24px; background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.3); display: flex; align-items: center; justify-content: center; font-size: 32px; color: #8B5CF6; margin-bottom: 20px; box-shadow: 0 0 40px rgba(139,92,246,0.3); }
.lock-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.lock-subtitle { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 32px; text-align: center; }
.lock-dots { display: flex; gap: 14px; margin-bottom: 32px; min-height: 16px; }
.lock-dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: all 0.3s; }
.lock-dot.filled { background: #8B5CF6; box-shadow: 0 0 14px rgba(139,92,246,0.6); }
.lock-dot.error { background: #ef4444; box-shadow: 0 0 14px rgba(239,68,68,0.6); }
.lock-numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 300px; width: 100%; }
.lock-num { padding: 18px; border: none; border-radius: 50%; background: rgba(255,255,255,0.05); color: #fff; font-size: 26px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
.lock-num:hover { background: rgba(255,255,255,0.1); }
.lock-num.empty { visibility: hidden; }
.lock-num.backspace { font-size: 20px; }
.lock-biometric-btn { margin-top: 24px; padding: 14px 28px; border-radius: 40px; background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.3); color: #8B5CF6; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 10px; }
.lock-error { margin-top: 20px; color: #ef4444; font-size: 14px; text-align: center; min-height: 20px; }
.usage-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin: 10px 0; display: flex; }
.usage-seg { height: 100%; transition: width 0.3s; }
.usage-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.5); }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.list-item:last-child { border-bottom: none; }
.list-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(139,92,246,0.2); display: flex; align-items: center; justify-content: center; color: #8B5CF6; font-weight: 700; font-size: 16px; flex-shrink: 0; }
.list-name { font-size: 14px; font-weight: 600; color: #fff; }
.list-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
.list-action { margin-left: auto; padding: 6px 12px; border-radius: 8px; background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
.list-action:hover { background: rgba(239,68,68,0.25); }
.empty-state { text-align: center; padding: 30px 20px; color: rgba(255,255,255,0.3); font-size: 14px; }
.empty-state i { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.4; }
.backup-codes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
.backup-code { background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.2); padding: 10px; border-radius: 8px; font-family: monospace; font-size: 13px; text-align: center; color: #8B5CF6; font-weight: 600; }
.input-field { width: 100%; padding: 14px 16px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 15px; font-family: inherit; margin-bottom: 12px; outline: none; }
.input-field:focus { border-color: #8B5CF6; }
.btn-primary { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #8B5CF6; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-primary:hover { background: #7C3AED; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div id="app">
    <div class="header">
        <button class="back-btn" onclick="goBack()" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
        <div class="header-title">Privacy</div>
    </div>
    <div class="content" id="content"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Generic choice modal -->
<div class="modal-overlay" id="choiceModal">
    <div class="modal-content">
        <div class="modal-handle"></div>
        <div class="modal-title" id="choiceModalTitle">Choose</div>
        <div id="choiceModalOptions"></div>
    </div>
</div>

<!-- List modal (blocked, muted, etc.) -->
<div class="modal-overlay" id="listModal">
    <div class="modal-content">
        <div class="modal-handle"></div>
        <div class="modal-title" id="listModalTitle">List</div>
        <div id="listModalBody"></div>
    </div>
</div>

<!-- 2FA dialog -->
<div class="dialog-overlay" id="twofaDialog">
    <div class="dialog-content">
        <div class="dialog-icon"><i class="fas fa-shield-halved"></i></div>
        <div class="dialog-title" id="twofaTitle">Two-Step Verification</div>
        <div class="dialog-subtitle" id="twofaSubtitle">Protect your account with email OTP</div>
        <div id="twofaBody" style="margin-top:20px;"></div>
        <button class="dialog-cancel" onclick="closeTwoFA()">Cancel</button>
    </div>
</div>

<!-- Passcode setup dialog -->
<div class="dialog-overlay" id="passcodeDialog">
    <div class="dialog-content">
        <div class="dialog-icon"><i class="fas fa-lock"></i></div>
        <div class="dialog-title" id="passcodeTitle">Enter Current Passcode</div>
        <div class="dialog-subtitle" id="passcodeSubtitle">Verify your identity first</div>
        <div class="dots" id="dotsContainer">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="numpad">
            <button class="num-btn" onclick="passcodeDigit('1')">1</button>
            <button class="num-btn" onclick="passcodeDigit('2')">2</button>
            <button class="num-btn" onclick="passcodeDigit('3')">3</button>
            <button class="num-btn" onclick="passcodeDigit('4')">4</button>
            <button class="num-btn" onclick="passcodeDigit('5')">5</button>
            <button class="num-btn" onclick="passcodeDigit('6')">6</button>
            <button class="num-btn" onclick="passcodeDigit('7')">7</button>
            <button class="num-btn" onclick="passcodeDigit('8')">8</button>
            <button class="num-btn" onclick="passcodeDigit('9')">9</button>
            <div></div>
            <button class="num-btn" onclick="passcodeDigit('0')">0</button>
            <button class="num-btn backspace" onclick="passcodeBackspace()"><i class="fas fa-delete-left"></i></button>
        </div>
        <button class="dialog-cancel" onclick="closePasscodeDialog()">Cancel</button>

<!-- Lock overlay -->
<div class="lock-overlay" id="lockOverlay">
    <div class="lock-icon-wrap"><i class="fas fa-lock"></i></div>
    <div class="lock-title">AURA is Locked</div>
    <div class="lock-subtitle" id="lockSubtitle">Enter your passcode to continue</div>
    <div class="lock-dots" id="lockDots">
        <div class="lock-dot"></div><div class="lock-dot"></div><div class="lock-dot"></div>
        <div class="lock-dot"></div><div class="lock-dot"></div><div class="lock-dot"></div>
    </div>
    <div class="lock-numpad" id="lockNumpad">
        <button class="lock-num" onclick="lockDigit('1')">1</button>
        <button class="lock-num" onclick="lockDigit('2')">2</button>
        <button class="lock-num" onclick="lockDigit('3')">3</button>
        <button class="lock-num" onclick="lockDigit('4')">4</button>
        <button class="lock-num" onclick="lockDigit('5')">5</button>
        <button class="lock-num" onclick="lockDigit('6')">6</button>
        <button class="lock-num" onclick="lockDigit('7')">7</button>
        <button class="lock-num" onclick="lockDigit('8')">8</button>
        <button class="lock-num" onclick="lockDigit('9')">9</button>
        <button class="lock-num empty"></button>
        <button class="lock-num" onclick="lockDigit('0')">0</button>
        <button class="lock-num backspace" onclick="lockBackspace()"><i class="fas fa-delete-left"></i></button>
    </div>
    <button class="lock-biometric-btn" id="lockBiometricBtn" onclick="tryBiometricUnlock()" style="display:none;">
        <i class="fas fa-fingerprint"></i><span>Use Biometric</span>
    </button>
    <div class="lock-error" id="lockError"></div>
</div>

<script>
// ═══════════ FIREBASE ═══════════
const firebaseConfig = {
    apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
    authDomain: "aurachat-85f54.firebaseapp.com",
    projectId: "aurachat-85f54",
    storageBucket: "aurachat-85f54.firebasestorage.app",
    messagingSenderId: "539789121540",
    appId: "1:539789121540:web:96ac597e52dd0a80573d51"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ═══════════ CONSTANTS ═══════════
const K = { PRIVACY: 'privacy_settings', USER_ID: 'mock_user_id', UNLOCKED: 'aura_unlocked', UNLOCK_TIME: 'aura_unlock_time', CRED: 'aura_biometric_cred_id' };

// ═══════════ STATE ═══════════
let currentUserId = null;
let initRan = false;
let syncTimer = null;
let autoLockTimer = null;
let activityBound = false;
let lockEntered = '';
let lockAttempts = 0;
let currentEmail = '';

let settings = {
    // Visibility (with audience pickers)
    phoneNumberVisible: true, phoneAudience: 'everyone',
    lastSeenVisible: true, lastSeenAudience: 'everyone',
    profilePhotoVisible: true, photoAudience: 'everyone',
    aboutVisible: true, aboutAudience: 'everyone',
    onlineStatusVisible: true,
    readReceipts: true,
    typingIndicator: true,
    storyViewersVisible: true,
    // Messaging
    forwardedMessages: true,
    addToGroups: true,
    voiceVideoCallsVisible: true,
    disappearingDefault: 'off',
    autoDownloadMedia: 'wifi',
    saveToGallery: true,
    richLinkPreviews: true,
    enterToSend: true,
    // Find me
    findByPhone: true,
    findByUsername: true,
    // Security
    biometricLock: false,
    appPasscode: false,
    passcodeHash: '',
    autoLockTimeout: 5,
    twofaEnabled: false,
    twofaEmail: '',
    screenshotPrevention: false,
    encryptionBadgeVisible: true,
    // Storage
    mediaQuality: 'auto',
    backupFrequency: 'daily',
    // Accessibility
    fontSize: 'medium',
    highContrast: false,
    reduceMotion: false,
    boldText: false,
    // Language
    appLanguage: 'en',
    timeFormat: '12h',
    dateFormat: 'mdy',
    firstDayOfWeek: 'sun'
};

let passcodeStep = 0;
let oldEntered = '', newEntered = '', confirmEntered = '';

const content = document.getElementById('content');
const toastEl = document.getElementById('toast');

// ═══════════ STORAGE ═══════════
const getLS = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } };
const setLS = (k, v) => { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch {} };
const getSS = k => { try { return sessionStorage.getItem(k); } catch { return null; } };
const setSS = (k, v) => { try { sessionStorage.setItem(k, v); } catch {} };
const removeSS = k => { try { sessionStorage.removeItem(k); } catch {} };

// ═══════════ CRYPTO ═══════════
async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ═══════════ TOAST ═══════════
function showToast(msg, type = '') {
    toastEl.textContent = msg;
    toastEl.className = 'toast show ' + type;
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

function goBack() { window.history.back(); }

// ═══════════ AUTH ═══════════
function checkAuth() {
    const uid = getLS(K.USER_ID);
    if (uid) { currentUserId = uid; return true; }
    if (auth.currentUser) { currentUserId = auth.currentUser.uid; setLS(K.USER_ID, currentUserId); return true; }
    return false;
}

// ═══════════ SETTINGS LOAD/SAVE ═══════════
function loadLocal() {
    const saved = getLS(K.PRIVACY);
    if (saved && typeof saved === 'object') {
        settings = { ...settings, ...saved };
        delete settings.passcode;
    }
}
function saveSettings() {
    setLS(K.PRIVACY, settings);
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncToFirestore, 600);
}
async function syncToFirestore() {
    if (!currentUserId) return;
    try {
        const payload = {};
        Object.keys(settings).forEach(k => {
            const sk = k.replace(/([A-Z])/g, '_$1').toLowerCase();
            payload[sk] = settings[k];
        });
        await db.collection('users').doc(currentUserId).set({
            privacy_settings: payload,
            updated_at: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
    } catch (e) { console.error(e); }
}
async function loadFromFirestore() {
    if (!currentUserId) return;
    try {
        const doc = await db.collection('users').doc(currentUserId).get();
        if (!doc.exists) return;
        const p = doc.data()?.privacy_settings || {};
        Object.keys(p).forEach(sk => {
            const camel = sk.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
            if (camel in settings) settings[camel] = p[sk];
        });
        setLS(K.PRIVACY, settings);
    } catch (e) { console.error(e); }
}

// ═══════════ WEBAUTHN ═══════════
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; const r = atob(s); return Uint8Array.from(r, c => c.charCodeAt(0)); };

async function registerBiometric() {
    if (!window.PublicKeyCredential) throw new Error('Not supported');
    const ok = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if (!ok) throw new Error('No biometric available');
    const cred = await navigator.credentials.create({
        publicKey: {
            challenge: crypto.getRandomValues(new Uint8Array(32)),
            rp: { name: 'AURA Chat', id: location.hostname },
            user: { id: crypto.getRandomValues(new Uint8Array(16)), name: currentUserId || 'aura', displayName: 'AURA User' },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
            timeout: 60000, attestation: 'none'
        }
    });
    const id = b64(cred.rawId);
    setLS(K.CRED, id);
    return id;
}
async function verifyBiometric() {
    const id = getLS(K.CRED);
    if (!id) throw new Error('No biometric registered');
    const a = await navigator.credentials.get({
        publicKey: {
            challenge: crypto.getRandomValues(new Uint8Array(32)),
            allowCredentials: [{ type: 'public-key', id: b64d(id), transports: ['internal'] }],
            userVerification: 'required', timeout: 60000
        }
    });
    return !!a;
}

// ═══════════ LOCK SYSTEM ═══════════
const shouldLock = () => settings.appPasscode || settings.biometricLock;
const isUnlocked = () => getSS(K.UNLOCKED) === 'true';
const markUnlocked = () => { setSS(K.UNLOCKED, 'true'); setSS(K.UNLOCK_TIME, Date.now().toString()); };
const lockSession = () => { removeSS(K.UNLOCKED); removeSS(K.UNLOCK_TIME); };

function showLockScreen() {
    lockEntered = '';
    lockAttempts = 0;
    document.getElementById('lockError').textContent = '';
    updateLockDots();
    const hasCred = !!getLS(K.CRED);
    document.getElementById('lockBiometricBtn').style.display = (settings.biometricLock && hasCred) ? 'flex' : 'none';
    const numpad = document.getElementById('lockNumpad');
    const dots = document.getElementById('lockDots');
    if (!settings.appPasscode && settings.biometricLock) {
        numpad.style.display = 'none'; dots.style.display = 'none';
        document.getElementById('lockSubtitle').textContent = 'Verify your identity to continue';
        setTimeout(tryBiometricUnlock, 300);
    } else {
        numpad.style.display = 'grid'; dots.style.display = 'flex';
        document.getElementById('lockSubtitle').textContent = 'Enter your passcode to continue';
    }
    document.getElementById('lockOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function hideLockScreen() {
    document.getElementById('lockOverlay').classList.remove('active');
    document.body.style.overflow = '';
}
function updateLockDots() {
    document.querySelectorAll('#lockDots .lock-dot').forEach((d, i) => {
        d.classList.toggle('filled', i < lockEntered.length);
        d.classList.remove('error');
    });
}
function lockDigit(d) {
    if (lockEntered.length >= 6) return;
    lockEntered += d;
    updateLockDots();
    if (lockEntered.length === 6) setTimeout(verifyLockPasscode, 150);
}
function lockBackspace() {
    if (lockEntered.length) { lockEntered = lockEntered.slice(0, -1); updateLockDots(); }
}
async function verifyLockPasscode() {
    const h = await sha256(lockEntered);
    if (h === settings.passcodeHash) {
        lockEntered = ''; updateLockDots(); markUnlocked(); hideLockScreen();
        showToast('Unlocked', 'success'); startAutoLockTimer();
    } else {
        lockAttempts++;
        document.querySelectorAll('#lockDots .lock-dot').forEach(d => d.classList.add('error'));
        document.getElementById('lockError').textContent = `Incorrect (${lockAttempts} attempt${lockAttempts > 1 ? 's' : ''})`;
        setTimeout(() => { lockEntered = ''; updateLockDots(); }, 600);
        if (lockAttempts >= 5) {
            document.getElementById('lockError').textContent = 'Too many attempts. Wait 30s.';
            document.querySelectorAll('#lockNumpad .lock-num').forEach(b => b.disabled = true);
            setTimeout(() => {
                document.querySelectorAll('#lockNumpad .lock-num').forEach(b => b.disabled = false);
                lockAttempts = 0; document.getElementById('lockError').textContent = '';
            }, 30000);
        }
    }
}
async function tryBiometricUnlock() {
    try {
        const ok = await verifyBiometric();
        if (ok) { markUnlocked(); hideLockScreen(); showToast('Unlocked', 'success'); startAutoLockTimer(); }
    } catch (e) { document.getElementById('lockError').textContent = e.message || 'Biometric failed'; }
}
function startAutoLockTimer() {
    clearTimeout(autoLockTimer);
    if (!shouldLock()) return;
    autoLockTimer = setTimeout(() => { lockSession(); showLockScreen(); }, (settings.autoLockTimeout || 5) * 60 * 1000);
}
function resetAutoLock() { if (isUnlocked()) startAutoLockTimer(); }
function bindActivity() {
    if (activityBound) return;
    activityBound = true;
    ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, resetAutoLock, { passive: true }));
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && shouldLock()) {
            const t = parseInt(getSS(K.UNLOCK_TIME) || '0', 10);
            const limit = (settings.autoLockTimeout || 5) * 60 * 1000;
            if (!isUnlocked() || (Date.now() - t) > limit) { lockSession(); showLockScreen(); }
        }
    });
    document.addEventListener('keydown', e => {
        if (!document.getElementById('lockOverlay').classList.contains('active')) return;
        if (e.key >= '0' && e.key <= '9' && settings.appPasscode) lockDigit(e.key);
        if (e.key === 'Backspace' && settings.appPasscode) lockBackspace();
    });
}
function lockNow() { lockSession(); showLockScreen(); }

// ═══════════ 2FA ═══════════
async function enable2FA(email) {
    const code = String(Math.floor(100000 + Math.random() * 900000));
    const hash = await sha256(code);
    await db.collection('users').doc(currentUserId).collection('twofa_config').doc('main').set({
        method: 'email', email, enabled: false,
        pending_code_hash: hash, pending_expires: Date.now() + 10 * 60 * 1000,
        created_at: firebase.firestore.FieldValue.serverTimestamp()
    });
    console.log('📧 2FA code (would be emailed to ' + email + '):', code);
    return code;
}
async function verify2FA(code) {
    const ref = db.collection('users').doc(currentUserId).collection('twofa_config').doc('main');
    const doc = await ref.get();
    if (!doc.exists) throw new Error('Not set up');
    const d = doc.data();
    if (Date.now() > d.pending_expires) throw new Error('Code expired');
    const h = await sha256(code);
    if (h !== d.pending_code_hash) throw new Error('Invalid code');
    const backupCodes = Array.from({ length: 8 }, () =>
        Math.random().toString(36).slice(2, 6).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase());
    const hashedBackup = await Promise.all(backupCodes.map(sha256));
    await ref.update({
        enabled: true,
        pending_code_hash: firebase.firestore.FieldValue.delete(),
        pending_expires: firebase.firestore.FieldValue.delete(),
        backup_code_hashes: hashedBackup,
        verified_at: firebase.firestore.FieldValue.serverTimestamp()
    });
    settings.twofaEnabled = true;
    settings.twofaEmail = d.email;
    saveSettings();
    await logSecurityEvent('2fa_enabled', 'Email 2FA enabled for ' + d.email);
    return backupCodes;
}
async function disable2FA() {
    await db.collection('users').doc(currentUserId).collection('twofa_config').doc('main').delete();
    settings.twofaEnabled = false;
    settings.twofaEmail = '';
    saveSettings();
    await logSecurityEvent('2fa_disabled', 'Email 2FA disabled');
}

// ═══════════ TOGGLE ═══════════
async function toggleSetting(key, value) {
    if (key === 'biometricLock' && value) {
        try { await registerBiometric(); settings.biometricLock = true; showToast('Biometric registered', 'success'); }
        catch (e) { settings.biometricLock = false; render(); showToast(e.message || 'Failed', 'error'); return; }
        saveSettings(); render(); return;
    }
    if (key === 'appPasscode' && value && !settings.passcodeHash) {
        settings.appPasscode = false; render(); showPasscodeDialog(); return;
    }
    if (key === 'twofaEnabled' && value) {
        settings.twofaEnabled = false; render(); showTwoFA(); return;
    }
    if (key === 'twofaEnabled' && !value) {
        if (!confirm('Disable two-step verification?')) { render(); return; }
        await disable2FA(); render(); showToast('2FA disabled', 'success'); return;
    }
    if (key === 'appPasscode' && !value) { settings.passcodeHash = ''; removeSS(K.UNLOCKED); }
    if (key === 'biometricLock' && !value) {
        localStorage.removeItem(K.CRED);
        if (!settings.appPasscode) removeSS(K.UNLOCKED);
    }
    settings[key] = value;
    saveSettings(); render();
    showToast(value ? 'Enabled' : 'Disabled', 'success');
}

// ═══════════ STORAGE ═══════════
async function showStorageUsage() {
    showListModal('Storage Usage', '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div>');
    let bytes = 0, quota = 0;
    try {
        if (navigator.storage && navigator.storage.estimate) {
            const e = await navigator.storage.estimate();
            bytes = e.usage || 0;
            quota = e.quota || 0;
        }
    } catch {}
    const lsSize = Object.keys(localStorage).reduce((a, k) => a + (k.length + (localStorage[k] || '').length) * 2, 0);
    const fmt = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB';
    updateListModalBody(`
        <div style="padding:10px 0;">
            <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:6px;">Total used: ${fmt(bytes)}</div>
            <div class="usage-bar">
                <div class="usage-seg" style="width:40%;background:#8B5CF6;"></div>
                <div class="usage-seg" style="width:25%;background:#06B6D4;"></div>
                <div class="usage-seg" style="width:15%;background:#EC4899;"></div>
                <div class="usage-seg" style="width:20%;background:#F59E0B;"></div>
            </div>
            <div class="usage-legend">
                <span><span class="legend-dot" style="background:#8B5CF6;"></span>Media</span>
                <span><span class="legend-dot" style="background:#06B6D4;"></span>Messages</span>
                <span><span class="legend-dot" style="background:#EC4899;"></span>Cache</span>
                <span><span class="legend-dot" style="background:#F59E0B;"></span>Other</span>
            </div>
            <div style="margin-top:16px;font-size:13px;color:rgba(255,255,255,0.4);">
                localStorage: ${fmt(lsSize)}<br>
                Browser quota: ${quota ? fmt(quota) : 'unknown'}
            </div>
        </div>
    `);
}

async function clearCache() {
    if (!confirm('Clear cache? This will not delete your messages.')) return;
    try { sessionStorage.clear(); } catch {}
    if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names.map(n => caches.delete(n)));
    }
    showToast('Cache cleared', 'success');
}

async function exportData() {
    showLoading('Preparing export...');
    try {
        const data = { settings, exportedAt: new Date().toISOString(), userId: currentUserId };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'aura-data-' + Date.now() + '.json';
        a.click();
        URL.revokeObjectURL(url);
        hideLoading();
        showToast('Export downloaded', 'success');
    } catch (e) {
        hideLoading();
        showToast('Export failed', 'error');
    }
}

function showTwoFA() {

async function submitTwoFAEmail() {
    const email = document.getElementById('twofaEmailInput').value.trim();
    if (!email || !email.includes('@')) return showToast('Invalid email', 'error');
    currentEmail = email;
    try {
        await enable2FA(email);
        showToast('Code sent to ' + email, 'success');
        document.getElementById('twofaSubtitle').textContent = 'Enter the 6-digit code sent to ' + email;
        document.getElementById('twofaBody').innerHTML = `
            <input type="text" class="input-field" id="twofaCodeInput" placeholder="6-digit code" maxlength="6" inputmode="numeric" />
            <button class="btn-primary" onclick="submitTwoFACode()">Verify</button>
        `;
    } catch (e) { showToast('Failed: ' + e.message, 'error'); }
}
async function submitTwoFACode() {
    const code = document.getElementById('twofaCodeInput').value.trim();
    if (code.length !== 6) return showToast('Enter 6 digits', 'error');
    try {
        const backupCodes = await verify2FA(code);
        document.getElementById('twofaTitle').textContent = 'Save Backup Codes';
        document.getElementById('twofaSubtitle').textContent = 'Store these somewhere safe';
        document.getElementById('twofaBody').innerHTML = `
            <div class="backup-codes">
                ${backupCodes.map(c => `<div class="backup-code">${c}</div>`).join('')}
            </div>
            <p style="font-size:12px;color:rgba(255,255,255,0.4);text-align:center;margin-bottom:12px;">
                Each code can be used once if you lose access to your email.
            </p>
            <button class="btn-primary" onclick="finishTwoFA()">I've Saved Them</button>
        `;
    } catch (e) { showToast(e.message || 'Invalid code', 'error'); }
}
function finishTwoFA() {
    closeTwoFA();
    render();
    showToast('2FA enabled', 'success');
}

// ═══════════ PASSCODE DIALOG ═══════════
function showPasscodeDialog() {
    passcodeStep = settings.passcodeHash ? 0 : 1;
    oldEntered = newEntered = confirmEntered = '';
    updateDialog();
    document.getElementById('passcodeDialog').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closePasscodeDialog() {
    oldEntered = newEntered = confirmEntered = '';
    passcodeStep = 0;
    document.getElementById('passcodeDialog').classList.remove('active');
    document.body.style.overflow = '';
}
function updateDialog() {
    const t = ['Enter Current Passcode', 'Enter New Passcode', 'Confirm New Passcode'];
    const s = ['Verify your identity first', 'Choose a 6-digit PIN', 'Enter it again to confirm'];
    document.getElementById('passcodeTitle').textContent = t[passcodeStep] || '';
    document.getElementById('passcodeSubtitle').textContent = s[passcodeStep] || '';
    const cur = passcodeStep === 0 ? oldEntered : passcodeStep === 1 ? newEntered : confirmEntered;
    document.querySelectorAll('#dotsContainer .dot').forEach((d, i) => d.classList.toggle('filled', i < cur.length));
}
async function passcodeDigit(d) {
    if (passcodeStep === 0 && oldEntered.length < 6) {
        oldEntered += d; updateDialog();
        if (oldEntered.length === 6) {
            const h = await sha256(oldEntered);
            if (h === settings.passcodeHash) { passcodeStep = 1; oldEntered = ''; updateDialog(); }
            else { oldEntered = ''; updateDialog(); showToast('Incorrect passcode', 'error'); }
        }
    } else if (passcodeStep === 1 && newEntered.length < 6) {
        newEntered += d; updateDialog();
        if (newEntered.length === 6) { passcodeStep = 2; updateDialog(); }
    } else if (passcodeStep === 2 && confirmEntered.length < 6) {
        confirmEntered += d; updateDialog();
        if (confirmEntered.length === 6) {
            if (confirmEntered === newEntered) {
                settings.passcodeHash = await sha256(confirmEntered);
                settings.appPasscode = true;
                saveSettings(); closePasscodeDialog(); render();
                showToast('Passcode set', 'success');
            } else {
                confirmEntered = ''; updateDialog();
                showToast('Passcodes do not match', 'error');
            }
        }
    }
}
function passcodeBackspace() {
    if (passcodeStep === 0 && oldEntered.length) oldEntered = oldEntered.slice(0, -1);
    else if (passcodeStep === 1 && newEntered.length) newEntered = newEntered.slice(0, -1);
    else if (passcodeStep === 2 && confirmEntered.length) confirmEntered = confirmEntered.slice(0, -1);
    updateDialog();
}

// ═══════════ ACCESSIBILITY APPLY ═══════════
function applyAccessibility() {
    document.documentElement.style.fontSize = { small: '14px', medium: '16px', large: '18px' }[settings.fontSize] || '16px';
    document.body.style.filter = settings.highContrast ? 'contrast(1.3)' : '';
    document.body.style.fontWeight = settings.boldText ? '600' : '';
    if (settings.reduceMotion) document.body.style.transition = 'none';
}

// ═══════════ KEYBOARD ═══════════
document.addEventListener('keydown', e => {
    const passActive = document.getElementById('passcodeDialog').classList.contains('active');
    if (e.key === 'Escape') {
        if (passActive) return closePasscodeDialog();
        document.querySelectorAll('.modal-overlay.active, .dialog-overlay.active').forEach(el => {
            el.classList.remove('active');
            document.body.style.overflow = '';
        });
    }
    if (passActive) {
        if (e.key >= '0' && e.key <= '9') passcodeDigit(e.key);
        if (e.key === 'Backspace') passcodeBackspace();
    }
});

// ═══════════ OVERLAY CLICK CLOSE ═══════════
document.querySelectorAll('.modal-overlay, .dialog-overlay').forEach(el => {
    el.addEventListener('click', e => {
        if (e.target === el) {
            if (el.id === 'passcodeDialog') closePasscodeDialog();
            else if (el.id === 'twofaDialog') closeTwoFA();
            else { el.classList.remove('active'); document.body.style.overflow = ''; }
        }
    });
});

// ═══════════ CROSS-TAB ═══════════
window.addEventListener('storage', e => {
    if (e.key === K.PRIVACY) {
        const next = JSON.parse(e.newValue || '{}');
        settings = { ...settings, ...next };
        render();
        if (shouldLock() && !isUnlocked()) showLockScreen();
        else if (!shouldLock()) hideLockScreen();
    }
    if (e.key === K.UNLOCKED) {
        if (e.newValue === 'true') { hideLockScreen(); startAutoLockTimer(); }
        else if (shouldLock()) showLockScreen();
    }
});

// ═══════════ LOADING HELPERS ═══════════
function showLoading(msg) {
    let el = document.getElementById('aura-loading');
    if (!el) {
        el = document.createElement('div');
        el.id = 'aura-loading';
        el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:8000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;';
        el.innerHTML = '<div style="width:40px;height:40px;border:3px solid rgba(139,92,246,0.3);border-top-color:#8B5CF6;border-radius:50%;animation:spin 0.8s linear infinite;"></div><div id="aura-loading-msg" style="font-size:14px;color:rgba(255,255,255,0.6);"></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
        document.body.appendChild(el);
    }
    document.getElementById('aura-loading-msg').textContent = msg || '';
    el.style.display = 'flex';
}
function hideLoading() {
    const el = document.getElementById('aura-loading');
    if (el) el.style.display = 'none';
}

// ═══════════ INIT ═══════════
async function init() {
    if (initRan) return;
    initRan = true;
    if (!checkAuth()) {
        showToast('Please login first', 'error');
        setTimeout(() => { window.location.href = 'email_verification.html'; }, 1500);
        return;
    }
    loadLocal();
    await loadFromFirestore();
    applyAccessibility();
    render();
    if (shouldLock() && !isUnlocked()) showLockScreen();
    else startAutoLockTimer();
    bindActivity();
    console.log('🔐 Privacy ready — user:', currentUserId);
}

document.addEventListener('DOMContentLoaded', () => {
    auth.onAuthStateChanged(user => {
        if (user) { currentUserId = user.uid; setLS(K.USER_ID, user.uid); currentEmail = user.email || ''; init(); }
        else {
            const uid = getLS(K.USER_ID);
            if (uid) { currentUserId = uid; init(); }
            else window.location.href = 'email_verification.html';
        }
    });
});
</script>
