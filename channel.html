<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Channel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.4); border-radius: 10px; }

        #app {
            height: 100vh; height: 100dvh;
            background: radial-gradient(ellipse at 20% 50%, rgba(249, 115, 22, 0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(239, 68, 68, 0.04) 0%, transparent 50%),
                        #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            padding: 8px 12px;
            display: flex; align-items: center; gap: 8px;
            flex-shrink: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            min-height: 52px;
        }
        .back-btn {
            background: none; border: none; color: #fff; font-size: 18px;
            padding: 6px; cursor: pointer; border-radius: 50%;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-info { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; min-width: 0; }
        .chat-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(249, 115, 22, 0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #F97316; overflow: hidden;
            flex-shrink: 0; position: relative;
        }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-name {
            font-weight: 600; font-size: 15px; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center; gap: 4px;
        }
        .chat-name .verified-badge { color: #1DA1F2; font-size: 13px; }
        .chat-status { font-size: 10px; color: rgba(255,255,255,0.35); }
        .chat-status.online { color: #F97316; font-weight: 500; }
        .chat-status.typing { color: #06B6D4; font-style: italic; font-weight: 500; }
        .header-actions button {
            background: none; border: none; color: rgba(255,255,255,0.6);
            font-size: 18px; padding: 6px; cursor: pointer;
            border-radius: 50%; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
        }

        /* MESSAGES */
        .messages-container {
            flex: 1; overflow-y: auto;
            padding: 8px 14px 6px 14px;
            display: flex; flex-direction: column;
            min-height: 0; overflow-x: hidden; gap: 6px;
        }

        /* Messages are old→new (newest at bottom) */
        .date-divider {
            text-align: center; padding: 8px 0 12px 0;
            font-size: 11px; color: rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            gap: 12px; font-weight: 500;
        }
        .date-divider::before, .date-divider::after {
            content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06);
        }

        .message-wrapper {
            position: relative;
            margin-bottom: 2px;
            max-width: 92%;
            align-self: flex-start;
        }
        .message-wrapper.own { align-self: flex-end; }

        .message { display: flex; flex-direction: column; }
        .message .msg-bubble {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            padding: 10px 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .message .msg-bubble:hover { background: rgba(255,255,255,0.06); }
        .message.own .msg-bubble {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(239, 68, 68, 0.15));
            border-color: rgba(249, 115, 22, 0.15);
        }

        .msg-footer {
            display: flex; align-items: center; justify-content: flex-end;
            gap: 4px; margin-top: 4px;
        }
        .msg-footer .msg-time-footer { font-size: 10px; color: rgba(255,255,255,0.35); }

        .message .msg-text {
            font-size: 14px; color: #fff;
            line-height: 1.45; word-wrap: break-word;
        }
        .message .msg-text a { color: #F97316; text-decoration: underline; }

        /* MEDIA */
        .msg-media {
            border-radius: 10px; overflow: hidden;
            margin-top: 4px; cursor: pointer;
            max-width: 100%; max-height: 280px;
            position: relative;
        }
        .msg-media img {
            width: 100%; max-height: 280px;
            object-fit: cover; display: block;
        }
        .msg-media .video-placeholder {
            width: 100%; height: 200px; background: #000;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 48px;
        }

        /* FILE */
        .msg-file {
            padding: 12px 14px; background: rgba(255,255,255,0.04);
            border-radius: 10px; display: flex; align-items: center;
            gap: 12px; min-width: 200px; cursor: pointer;
        }
        .msg-file .file-icon {
            width: 42px; height: 42px; border-radius: 10px;
            background: rgba(249, 115, 22, 0.15);
            display: flex; align-items: center; justify-content: center;
            color: #F97316; font-size: 20px; flex-shrink: 0;
        }
        .msg-file .file-name {
            font-weight: 600; color: #fff; font-size: 13px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .msg-file .file-size {
            font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 2px;
        }

        /* VOICE NOTE */
        .voice-note { display: flex; align-items: center; gap: 10px; padding: 4px 0; min-width: 220px; }
        .voice-note .play-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(249, 115, 22, 0.2);
            border: none; color: #F97316; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; flex-shrink: 0;
            transition: all 0.2s;
        }
        .voice-note .play-btn:hover { background: rgba(249, 115, 22, 0.35); }
        .voice-note .play-btn.playing { background: #F97316; color: #fff; }
        .voice-note .waveform {
            flex: 1; height: 24px; display: flex;
            align-items: center; gap: 2px; overflow: hidden;
        }
        .voice-note .waveform .bar {
            width: 3px; background: rgba(255,255,255,0.2);
            border-radius: 2px; flex-shrink: 0;
        }
        .voice-note .duration {
            font-size: 11px; color: rgba(255,255,255,0.4);
            flex-shrink: 0; min-width: 40px;
        }

        /* REACTIONS */
        .msg-reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .msg-reactions .reaction {
            padding: 3px 8px; background: rgba(26, 16, 60, 0.6);
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
            font-size: 12px; cursor: pointer;
            transition: all 0.15s;
        }
        .msg-reactions .reaction:hover {
            background: rgba(249, 115, 22, 0.15);
        }

        /* TYPING INDICATOR */
        .typing-indicator-wrapper {
            display: none;
            margin-bottom: 8px;
            align-self: flex-start;
            max-width: 92%;
        }
        .typing-indicator-wrapper.show { display: flex; }
        .typing-bubble {
            display: flex; align-items: center;
            gap: 8px; padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; border-bottom-left-radius: 4px;
        }
        .typing-bubble .typing-dots {
            display: flex; align-items: center; gap: 4px;
        }
        .typing-bubble .typing-dots .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #F97316;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-bubble .typing-dots .dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-bubble .typing-dots .dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-bubble .typing-dots .dot:nth-child(3) { animation-delay: 0s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1.1); opacity: 1; background: #EF4444; }
        }

        /* REPLY BAR */
        .reply-bar {
            padding: 6px 14px;
            background: rgba(26, 16, 60, 0.98);
            display: none; align-items: center; gap: 10px;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .reply-bar.show { display: flex; }
        .reply-bar .reply-line {
            width: 3px; height: 36px;
            background: #F97316; border-radius: 2px; flex-shrink: 0;
        }
        .reply-bar .reply-info { flex: 1; min-width: 0; }
        .reply-bar .reply-sender {
            font-size: 11px; font-weight: 600; color: #F97316;
        }
        .reply-bar .reply-content {
            font-size: 12px; color: rgba(255,255,255,0.5);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .reply-bar .cancel-reply {
            background: none; border: none;
            color: rgba(255,255,255,0.4); font-size: 16px;
            cursor: pointer; padding: 4px;
        }

        /* RECORDING BAR */
        .recording-bar {
            padding: 10px 16px;
            background: rgba(239, 68, 68, 0.08);
            border-top: 1px solid rgba(239, 68, 68, 0.15);
            display: none; align-items: center; gap: 12px; flex-shrink: 0;
        }
        .recording-bar.show { display: flex; }
        .recording-bar .rec-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ef4444; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .recording-bar .rec-timer {
            color: #ef4444; font-weight: 700;
            font-size: 14px; min-width: 45px;
        }
        .recording-bar .rec-wave {
            flex: 1; height: 24px;
            display: flex; align-items: center; gap: 2px;
        }
        .recording-bar .rec-wave .bar {
            width: 3px; background: rgba(239, 68, 68, 0.6);
            border-radius: 2px;
            animation: recWave 0.8s infinite ease-in-out;
        }
        @keyframes recWave { 0%, 100% { height: 4px; } 50% { height: 20px; } }
        .recording-bar .rec-actions {
            display: flex; gap: 8px; margin-left: auto;
        }
        .recording-bar .rec-actions button {
            width: 40px; height: 40px; border: none; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .recording-bar .rec-actions .cancel-rec {
            background: rgba(239, 68, 68, 0.15); color: #ef4444;
        }
        .recording-bar .rec-actions .send-rec {
            background: linear-gradient(135deg, #F97316, #EF4444); color: #fff;
        }

        /* INPUT */
        .input-area {
            padding: 6px 10px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0; min-height: 52px;
        }
        .input-row { display: flex; align-items: center; gap: 4px; }
        .input-row button {
            background: none; border: none;
            color: rgba(255,255,255,0.4);
            font-size: 18px; cursor: pointer;
            padding: 5px; border-radius: 50%;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .input-row .input-field {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 8px 14px;
            border: none; color: #fff;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none; min-height: 36px;
        }
        .input-row .input-field::placeholder { color: rgba(255,255,255,0.25); }
        .input-row .action-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 18px;
        }
        .input-row .action-btn.send {
            background: linear-gradient(135deg, #F97316, #EF4444);
            color: #fff; font-size: 16px; display: none;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.35);
        }
        .input-row .action-btn.send.show { display: flex; }
        .input-row .action-btn.mic {
            background: linear-gradient(135deg, #F97316, #EF4444);
            color: #fff; display: flex;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.35);
        }
        .input-row .action-btn.mic.hide { display: none; }
        .input-row .action-btn.mic.recording {
            background: #ef4444; animation: pulse 1s infinite;
        }

        /* SUBSCRIBER-ONLY MESSAGE */
        .subscriber-notice {
            padding: 10px 16px;
            background: rgba(249, 115, 22, 0.08);
            border-top: 1px solid rgba(249, 115, 22, 0.15);
            text-align: center;
            color: #FB923C;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
        }

        /* EMOJI PICKER */
        .emoji-picker {
            background: rgba(26, 16, 60, 0.98);
            border-top: 1px solid rgba(255,255,255,0.04);
            display: none; flex-shrink: 0;
            max-height: 280px; flex-direction: column;
        }
        .emoji-picker.show { display: flex; }
        .emoji-tabs {
            display: flex; padding: 8px 12px 0 12px;
            gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.04);
            overflow-x: auto;
        }
        .emoji-tab {
            padding: 8px 12px; background: none; border: none;
            color: rgba(255,255,255,0.4); font-size: 18px;
            cursor: pointer; border-radius: 8px 8px 0 0;
            border-bottom: 2px solid transparent;
            white-space: nowrap; flex-shrink: 0;
        }
        .emoji-tab.active {
            color: #fff; border-bottom-color: #F97316;
            background: rgba(249, 115, 22, 0.1);
        }
        .emoji-content {
            flex: 1; overflow-y: auto;
            padding: 10px 12px; max-height: 220px;
        }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }
        .emoji {
            font-size: 22px; cursor: pointer;
            padding: 4px; text-align: center;
            border-radius: 6px;
        }
        .emoji:hover { background: rgba(249, 115, 22, 0.15); }

        /* TOAST */
        .toast {
            position: fixed; bottom: 70px; left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 16, 60, 0.95);
            color: #fff; padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            font-size: 12px; z-index: 3000;
            display: none; max-width: 90%; text-align: center;
        }
        .toast.show { display: block; }
        .toast.error { border-color: rgba(239, 68, 68, 0.15); background: rgba(239, 68, 68, 0.08); }
        .toast.success { border-color: rgba(74, 222, 128, 0.15); background: rgba(74, 222, 128, 0.08); }

        /* MODALS */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000; display: none;
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: rgba(26, 16, 60, 0.98);
            border-radius: 18px 18px 0 0;
            width: 100%; max-width: 480px;
            max-height: 70vh; padding: 14px 18px 18px 18px;
            overflow-y: auto;
        }
        .modal-handle {
            width: 32px; height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px; margin: 0 auto 10px auto;
        }
        .modal-option {
            display: flex; align-items: center;
            padding: 10px 12px; border-radius: 10px;
            cursor: pointer; margin-bottom: 2px;
        }
        .modal-option:hover { background: rgba(255,255,255,0.04); }
        .modal-option .opt-icon {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px; font-size: 15px; flex-shrink: 0;
        }
        .modal-option .opt-label {
            color: #fff; font-size: 14px; font-weight: 500;
        }
        .modal-option.danger .opt-label { color: #ef4444; }
        .modal-option.danger .opt-icon { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        .quick-reactions {
            display: flex; gap: 8px; padding: 10px 0;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 8px;
        }
        .quick-reactions .quick-emoji {
            font-size: 26px; cursor: pointer;
            padding: 6px; border-radius: 50%;
            transition: transform 0.15s;
        }
        .quick-reactions .quick-emoji:hover {
            transform: scale(1.3);
            background: rgba(249, 115, 22, 0.15);
        }

        .attach-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px; padding: 4px 0;
        }
        .attach-item {
            display: flex; flex-direction: column;
            align-items: center; background: none; border: none;
            cursor: pointer; padding: 12px 4px; border-radius: 12px;
        }
        .attach-item .att-icon {
            width: 52px; height: 52px; border-radius: 50%;
            background: rgba(249, 115, 22, 0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: #F97316;
        }
        .attach-item .att-label {
            font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 6px;
        }

        /* DIALOG */
        .dialog-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2500; display: none;
            align-items: center; justify-content: center; padding: 20px;
        }
        .dialog-overlay.active { display: flex; }
        .dialog-content {
            background: rgba(26, 16, 60, 0.98);
            border-radius: 14px; padding: 20px;
            width: 100%; max-width: 340px;
        }
        .dialog-title {
            font-size: 16px; font-weight: 600;
            color: #fff; margin-bottom: 12px;
        }
        .dialog-input {
            width: 100%; padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; color: #fff;
            font-size: 14px; font-family: 'Inter', sans-serif;
            outline: none; margin-bottom: 12px;
        }
        .dialog-actions {
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .dialog-btn {
            padding: 8px 18px; border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .dialog-btn-cancel {
            background: transparent; color: rgba(255,255,255,0.4);
        }
        .dialog-btn-primary {
            background: linear-gradient(135deg, #F97316, #EF4444); color: #fff;
        }
        .dialog-btn-danger { background: #ef4444; color: #fff; }

        /* MEDIA VIEWER */
        .media-viewer {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.98);
            z-index: 5000; display: none;
            flex-direction: column;
            align-items: center; justify-content: center;
        }
        .media-viewer.active { display: flex; }
        .media-viewer .viewer-content {
            flex: 1; width: 100%;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .media-viewer img, .media-viewer video {
            max-width: 100%; max-height: 100%;
            object-fit: contain; border-radius: 8px;
        }
        .media-viewer .viewer-close {
            position: absolute; top: 16px; right: 16px;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0,0,0,0.5); border: none;
            color: #fff; font-size: 20px; cursor: pointer;
        }

        @media (max-width: 480px) {
            .message-wrapper { max-width: 94%; }
            .header { padding: 6px 10px; min-height: 44px; }
            .chat-avatar { width: 32px; height: 32px; font-size: 12px; }
            .chat-name { font-size: 13px; }
            .input-area { padding: 4px 8px; min-height: 46px; }
            .input-row .input-field {
                font-size: 12px; padding: 6px 10px; min-height: 32px;
            }
            .input-row .action-btn { width: 32px; height: 32px; font-size: 14px; }
            .messages-container { padding: 4px 10px 4px 10px; }
            .emoji-grid { grid-template-columns: repeat(7, 1fr); }
            .emoji { font-size: 20px; }
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="app">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="window.location.href='chats.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="chat-info" onclick="goToChannelInfo()">
                <div class="chat-avatar" id="chatAvatar">
                    <i class="fas fa-bullhorn"></i>
                </div>
                <div>
                    <div class="chat-name" id="chatName">Channel</div>
                    <div class="chat-status" id="chatStatus">Loading...</div>
                </div>
            </div>
            <div class="header-actions">
                <button onclick="goToChannelInfo()">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // FIREBASE
        // ═══════════════════════════════════════════════════════════
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",

        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ═══════════════════════════════════════════════════════════
        // CLOUDINARY
        // ═══════════════════════════════════════════════════════════
        const CLOUD_NAME = 'dn2mwp1lc';
        const UPLOAD_PRESET = 'aura_chat';

        async function uploadToCloudinary(file, resourceType = 'auto') {
            console.log('📤 Uploading:', file.name, file.size, 'as', resourceType);

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('folder', `aura_chat/channels/${channelId}`);

            const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;
            console.log('📤 POST:', url);

            const response = await fetch(url, { method: 'POST', body: formData });

            if (!response.ok) {
                const errText = await response.text();
                console.error('❌ Cloudinary error:', response.status, errText);
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            console.log('✅ Uploaded:', data.secure_url);
            return data.secure_url;
        }

        // ═══════════════════════════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════════════════════════
        let currentUserId = null;
        let channelId = null;
        let channelName = '';
        let messages = [];
        let selectedImage = null;
        let selectedVideo = null;
        let selectedFile = null;
        let messagesUnsubscribe = null;
        let channelInfoUnsubscribe = null;
        let typingUnsubscribe = null;
        let showEmojiPicker = false;
        let isRecording = false;
        let recSeconds = 0;
        let recTimer = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let recMimeType = 'audio/webm';
        let replyingTo = null;
        let replyingToContent = null;
        let replyingToSender = null;
        let selectedMessageId = null;
        let editingMessageId = null;
        let deletingMessageId = null;
        let myTypingTimeout = null;
        let canPost = true;
        let myRole = 'subscriber';
        const userCache = {};
        const audioPlayers = {};

        // DOM
        const messagesContainer = document.getElementById('messagesContainer');
        const chatNameEl = document.getElementById('chatName');
        const chatAvatarEl = document.getElementById('chatAvatar');
        const chatStatusEl = document.getElementById('chatStatus');

        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const emojiPicker = document.getElementById('emojiPicker');
        const emojiGrid = document.getElementById('emojiGrid');
        const emojiTabs = document.getElementById('emojiTabs');
        const recordingBar = document.getElementById('recordingBar');
        const recTimerEl = document.getElementById('recTimer');
        const recWave = document.getElementById('recWave');
        const mediaViewer = document.getElementById('mediaViewer');
        const viewerContent = document.getElementById('viewerContent');
        const replyBar = document.getElementById('replyBar');
        const replySender = document.getElementById('replySender');
        const replyContent = document.getElementById('replyContent');

        const subscriberNotice = document.getElementById('subscriberNotice');

        // ═══════════════════════════════════════════════════════════
        // HELPERS
        // ═══════════════════════════════════════════════════════════
        function showToast(msg, type = '') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function goToChannelInfo() {
            window.location.href = `channel_info.html?id=${channelId}&name=${encodeURIComponent(channelName)}&type=channel`;
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        function closeDialog(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),
                name: params.get('name'),
                avatar: params.get('avatar') || ''
            };
        }

        function checkAuth() {
            const userId = localStorage.getItem('mock_user_id');
            if (userId) { currentUserId = userId; return true; }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                localStorage.setItem('mock_user_id', currentUserId);
                return true;
            }
            return false;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            if (msgDate.getTime() === today.getTime()) return 'Today';
            if (msgDate.getTime() === yesterday.getTime()) return 'Yesterday';
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function formatDuration(s) {
            return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }

        function formatFileSize(b) {
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function isVerified(email) {
            if (!email) return false;
            return email.toLowerCase().trim().endsWith('@aurachat.app');
        }

        async function fetchUserData(userId) {
            if (!userId) return null;
            if (userCache[userId]) return userCache[userId];
            try {
                const doc = await db.collection('users').doc(userId).get();
                if (doc.exists) {
                    const data = doc.data();
                    const userData = {
                        uid: userId,
                        username: data.username || 'Unknown',
                        display_name: data.display_name || data.username || 'Unknown',
                        avatar_url: data.avatar_url || null,
                        email: data.email || null,
                        is_verified: isVerified(data.email)
                    };
                    userCache[userId] = userData;
                    return userData;
                }
            } catch(e) { console.error('Fetch user error:', e); }
            const fallback = { uid: userId, username: 'Unknown', display_name: 'Unknown', avatar_url: null, email: null, is_verified: false };
            userCache[userId] = fallback;
            return fallback;
        }

        // ═══════════════════════════════════════════════════════════
        // LOAD CHANNEL INFO + ROLE
        // ═══════════════════════════════════════════════════════════
        function subscribeToChannelInfo() {
            if (!channelId) return;
            if (channelInfoUnsubscribe) channelInfoUnsubscribe();

            channelInfoUnsubscribe = db.collection('chats').doc(channelId)
                .onSnapshot((doc) => {
                    if (!doc.exists) return;
                    const data = doc.data();
                    channelName = data.name || channelName;

                    if (data.avatar_url) {
                        chatAvatarEl.innerHTML = `<img src="${data.avatar_url}" alt="${channelName}" />`;
                    } else {
                        chatAvatarEl.innerHTML = `<i class="fas fa-bullhorn"></i>`;
                    }

                    chatNameEl.textContent = channelName;

                    // Get my role
                    const participantsData = data.participants_data || {};
                    const myData = participantsData[currentUserId] || {};
                    myRole = myData.role || 'subscriber';

                    const isAdmin = myRole === 'owner' || myRole === 'admin';
                    const settings = data.settings || {};

                    canPost = isAdmin && !(settings.chat_disabled && !isAdmin);

                    // Update UI based on permission
                    if (canPost) {
                        subscriberNotice.style.display = 'none';
                        inputArea.style.display = 'block';
                    } else {
                        subscriberNotice.style.display = 'block';
                        inputArea.style.display = 'none';
                    }

                    const memberCount = (data.participants || []).length;
                    const roleText = isAdmin ? 'Admin' : 'Subscriber';
                    chatStatusEl.textContent = `${memberCount} member${memberCount !== 1 ? 's' : ''} • ${roleText}`;
                });
        }

        // ═══════════════════════════════════════════════════════════
        // LOAD MESSAGES (newest at bottom)
        // ═══════════════════════════════════════════════════════════
        function loadMessages() {
            if (!channelId) return;
            if (messagesUnsubscribe) messagesUnsubscribe();

            messagesUnsubscribe = db.collection('chats').doc(channelId)
                .collection('messages')
                .orderBy('created_at', 'desc')
                .limit(100)
                .onSnapshot((snapshot) => {
                    messages = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.deleted_for_everyone === true) return;
                        const deletedFor = data.deleted_for || [];
                        if (deletedFor.includes(currentUserId)) return;
                        data.id = doc.id;
                        messages.push(data);
                    });

                    renderMessages();
                }, (error) => {
                    console.error('Messages error:', error);
                });
        }

        // ═══════════════════════════════════════════════════════════
        // RENDER MESSAGES (old → new, newest at BOTTOM)
        // ═══════════════════════════════════════════════════════════
        function renderMessages() {
            // Save typing indicator element
            const typingEl = document.getElementById('typingIndicatorWrapper');
            if (typingEl) typingEl.remove();

            if (messages.length === 0) {
                messagesContainer.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">No messages yet</div>';
                messagesContainer.appendChild(typingEl || createTypingEl());
                return;
            }

            let html = '';
            let lastDate = null;

            // ⚡ Reverse so oldest first → newest at BOTTOM
            const sorted = [...messages].reverse();

            sorted.forEach((msg) => {
                const isMe = msg.sender_id === currentUserId;
                const text = msg.text || msg.content || '';
                const mediaType = msg.media_type || '';
                const mediaUrl = msg.media_url || '';
                const isSystem = msg.type === 'system';
                const reactions = msg.reactions || {};

                const dateKey = formatDate(msg.created_at);
                if (dateKey !== lastDate) {
                    lastDate = dateKey;
                    html += `<div class="date-divider">${dateKey}</div>`;
                }

                const wrapperClass = isMe ? 'own' : '';

                // ⚡ CHANNEL STYLE: no sender names shown in bubbles
                html += `<div class="message-wrapper ${wrapperClass}" data-msg-id="${msg.id}">`;
                html += `<div class="message ${isSystem ? '' : (isMe ? 'own' : '')}"><div class="msg-bubble">`;

                // Reply preview
                if (msg.reply_to) {
                    html += `<div style="padding: 4px 8px; margin-bottom: 6px; background: rgba(0,0,0,0.2); border-radius: 6px; border-left: 3px solid #F97316;">
                        <div style="font-size: 10px; font-weight: 600; color: #F97316;">${escapeHtml(msg.reply_to_sender || 'Unknown')}</div>
                        <div style="font-size: 11px; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(msg.reply_to_content || 'Media')}</div>
                    </div>`;
                }

                // Content
                if (isSystem) {
                    html += `<div class="msg-text" style="font-style:italic;color:rgba(255,255,255,0.4);text-align:center;font-size:12px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'image' && mediaUrl) {
                    html += `<div class="msg-media" onclick="event.stopPropagation();openMediaViewer('image', '${mediaUrl}')"><img src="${mediaUrl}" loading="lazy" /></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:6px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'video' && mediaUrl) {
                    html += `<div class="msg-media" onclick="event.stopPropagation();openMediaViewer('video', '${mediaUrl}')"><div class="video-placeholder"><i class="fas fa-play-circle"></i></div></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:6px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'audio' && mediaUrl) {
                    html += `<div class="voice-note">
                        <button class="play-btn" onclick="event.stopPropagation();playVoiceNote('${msg.id}', '${mediaUrl}')">
                            <i class="fas fa-play" id="icon-${msg.id}"></i>
                        </button>
                        <div class="waveform">${generateWaveform()}</div>
                        <span class="duration">${formatDuration(msg.duration || 0)}</span>
                    </div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:6px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'file' && mediaUrl) {
                    html += `<div class="msg-file" onclick="event.stopPropagation();window.open('${mediaUrl}','_blank')">
                        <div class="file-icon"><i class="fas fa-file"></i></div>
                        <div style="flex:1;min-width:0;">
                            <div class="file-name">${escapeHtml(msg.file_name || text || 'File')}</div>
                            ${msg.file_size ? `<div class="file-size">${msg.file_size}</div>` : ''}
                        </div>
                    </div>`;
                } else if (text) {
                    const linked = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" onclick="event.stopPropagation()">$1</a>');
                    html += `<div class="msg-text">${linked}</div>`;
                }

                // Footer: time
                if (!isSystem) {
                    html += `<div class="msg-footer">
                        <span class="msg-time-footer">${formatTime(msg.created_at)}</span>
                    </div>`;
                }

                // Reactions
                if (Object.keys(reactions).length > 0) {
                    html += `<div class="msg-reactions">`;
                    for (const [emoji, users] of Object.entries(reactions)) {
                        const count = users.length;
                        html += `<span class="reaction" onclick="event.stopPropagation();quickReact('${msg.id}', '${emoji}')">${emoji} ${count > 1 ? count : ''}</span>`;
                    }
                    html += `</div>`;
                }

                html += `</div></div></div>`;
            });

            messagesContainer.innerHTML = html;
            messagesContainer.appendChild(typingEl || createTypingEl());
            attachMessageListeners();

            // ⚡ ALWAYS scroll to bottom (newest messages)
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 30);
        }

        function createTypingEl() {
            const el = document.createElement('div');
            el.className = 'typing-indicator-wrapper';
            el.id = 'typingIndicatorWrapper';
            el.innerHTML = `
                <div class="typing-bubble">
                    <div class="typing-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            return el;
        }

        function generateWaveform() {
            let html = '';
            for (let i = 0; i < 30; i++) {
                const h = 4 + Math.random() * 16;
                html += `<div class="bar" style="height:${h}px;"></div>`;
            }
            return html;
        }

        function attachMessageListeners() {
            document.querySelectorAll('.message-wrapper').forEach(wrapper => {
                const msgId = wrapper.dataset.msgId;
                const bubble = wrapper.querySelector('.msg-bubble');

                bubble.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showMessageOptions(msgId);
                });
            });
        }

        function cancelReply() {
            replyingTo = null;
            replyingToContent = null;
            replyingToSender = null;
            replyBar.classList.remove('show');

        // ═══════════════════════════════════════════════════════════
        // TYPING INDICATOR
        // ═══════════════════════════════════════════════════════════
        function subscribeToTyping() {
            if (!channelId) return;
            if (typingUnsubscribe) typingUnsubscribe();

            typingUnsubscribe = db.collection('chats').doc(channelId)
                .collection('typing')
                .onSnapshot((snapshot) => {
                    const now = new Date();
                    let anyTyping = false;

                    snapshot.forEach(doc => {
                        const uid = doc.id;
                        if (uid === currentUserId) return;
                        const data = doc.data();
                        const timestamp = data.timestamp;
                        const isTyping = data.is_typing !== false;

                        if (!isTyping || !timestamp) return;
                        const typedAt = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                        if ((now - typedAt) / 1000 < 5) anyTyping = true;
                    });

                    if (anyTyping) {
                        chatStatusEl.textContent = 'typing...';
                        chatStatusEl.className = 'chat-status typing';
                        typingWrapper.classList.add('show');
                        setTimeout(() => {
                            messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        }, 30);
                    } else {
                        typingWrapper.classList.remove('show');
                        // Restore member count
                        db.collection('chats').doc(channelId).get().then(doc => {
                            if (doc.exists) {
                                const pCount = (doc.data().participants || []).length;
                                const isAdmin = myRole === 'owner' || myRole === 'admin';
                                const roleText = isAdmin ? 'Admin' : 'Subscriber';
                                chatStatusEl.textContent = `${pCount} member${pCount !== 1 ? 's' : ''} • ${roleText}`;
                                chatStatusEl.className = 'chat-status';
                            }
                        }).catch(() => {});
                    }
                });
        }

        function startTypingPing() {

        async function addReaction(emoji) {
            if (!selectedMessageId) return;

        async function quickReact(msgId, emoji) {
            try {
                const msgRef = db.collection('chats').doc(channelId).collection('messages').doc(msgId);
                const doc = await msgRef.get();
                if (!doc.exists) return;
                const data = doc.data();
                const reactions = data.reactions || {};
                const users = reactions[emoji] || [];

                if (users.includes(currentUserId)) {
                    const idx = users.indexOf(currentUserId);
                    users.splice(idx, 1);
                    if (users.length === 0) delete reactions[emoji];
                    else reactions[emoji] = users;
                } else {
                    users.push(currentUserId);
                    reactions[emoji] = users;
                }
                await msgRef.update({ reactions });
            } catch(e) { console.error('React error:', e); }
        }

        // SEND MESSAGE
        // ═══════════════════════════════════════════════════════════
        async function sendMessage() {
            if (!canPost) {
                showToast('Only admins can post', 'error');
                return;
            }

            const text = messageInput.value.trim();
            if (!text && !selectedImage && !selectedVideo && !selectedFile) return;

            const senderName = userCache[currentUserId]?.display_name || userCache[currentUserId]?.username || 'Admin';
            let mediaUrl = null, mediaType = 'text', fileName = null, fileSize = null;

            try {
                if (selectedImage) {
                    showToast('Uploading image...', '');
                    mediaUrl = await uploadToCloudinary(selectedImage, 'image');
                    mediaType = 'image';
                } else if (selectedVideo) {
                    showToast('Uploading video...', '');
                    mediaUrl = await uploadToCloudinary(selectedVideo, 'video');
                    mediaType = 'video';
                    fileName = selectedVideo.name;
                } else if (selectedFile) {
                    showToast('Uploading file...', '');
                    mediaUrl = await uploadToCloudinary(selectedFile, 'raw');
                    mediaType = 'file';
                    fileName = selectedFile.name;
                    fileSize = formatFileSize(selectedFile.size);
                }

                const msgRef = db.collection('chats').doc(channelId).collection('messages').doc();
                await msgRef.set({
                    id: msgRef.id,
                    text: text || null,
                    content: text || null,
                    media_url: mediaUrl,
                    media_type: mediaType,
                    file_name: fileName,
                    file_size: fileSize,
                    sender_id: currentUserId,
                    sender_name: senderName,
                    reply_to: replyingTo || null,
                    reply_to_content: replyingToContent || null,
                    reply_to_sender: replyingToSender || null,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    is_edited: false,
                    deleted_for_everyone: false,
                    reactions: {}
                });

                await db.collection('chats').doc(channelId).update({
                    last_message: text || (mediaType === 'image' ? '📷 Photo' : mediaType === 'video' ? '🎥 Video' : '📎 File'),
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                messageInput.value = '';
                selectedImage = null;
                selectedVideo = null;
                selectedFile = null;
                cancelReply();
                onInputChange();
                stopTypingPing();

                if (mediaType !== 'text') showToast('Sent ✓', 'success');
            } catch(e) {
                console.error('❌ Send error:', e);
                showToast('Failed: ' + e.message, 'error');
            }
        }

        async function toggleRecording() {
            if (!canPost) {
                showToast('Only admins can record', 'error');
                return;
            }
            if (isRecording) stopRecordingAndSend();
            else await startRecording();
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
                let mimeType = '';
                for (const mt of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(mt)) { mimeType = mt; break; }
                }
                recMimeType = mimeType || 'audio/webm';
                audioChunks = [];

                mediaRecorder = new MediaRecorder(stream, { mimeType: recMimeType });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    if (audioChunks.length === 0) {
                        showToast('No audio recorded', 'error');
                        return;
                    }
                    const blob = new Blob(audioChunks, { type: recMimeType });
                    const ext = recMimeType.includes('webm') ? 'webm' : recMimeType.includes('ogg') ? 'ogg' : 'mp4';
                    const file = new File([blob], `voice_${Date.now()}.${ext}`, { type: recMimeType });
                    showToast('Sending voice note...', '');
                    await sendVoiceNote(file, recSeconds);
                };

                mediaRecorder.start(100);
                isRecording = true;
                recSeconds = 0;
                recTimerEl.textContent = '00:00';
                recordingBar.classList.add('show');
                micBtn.classList.add('recording');

                recWave.innerHTML = '';
                for (let i = 0; i < 20; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    bar.style.animationDelay = (i * 0.05) + 's';
                    recWave.appendChild(bar);
                }

                recTimer = setInterval(() => {
                    recSeconds++;
                    recTimerEl.textContent = formatDuration(recSeconds);
                }, 1000);

                showToast('🎤 Recording...', '');
            } catch(e) {
                console.error('Recording error:', e);
                showToast('Microphone denied', 'error');
            }
        }

        function stopRecordingAndSend() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (recTimer) clearInterval(recTimer);
            recordingBar.classList.remove('show');
            micBtn.classList.remove('recording');
            isRecording = false;
        }

        function cancelRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.onstop = null;
                mediaRecorder.stop();
                audioChunks = [];
            }
            if (recTimer) clearInterval(recTimer);
            recordingBar.classList.remove('show');
            micBtn.classList.remove('recording');
            isRecording = false;
            recSeconds = 0;
            showToast('Recording cancelled', '');
        }

            try {
                const senderName = userCache[currentUserId]?.display_name || userCache[currentUserId]?.username || 'Admin';
                const mediaUrl = await uploadToCloudinary(file, 'video');
                if (!mediaUrl) throw new Error('No URL returned');

                const msgRef = db.collection('chats').doc(channelId).collection('messages').doc();
                await msgRef.set({
                    id: msgRef.id,
                    media_url: mediaUrl,
                    media_type: 'audio',
                    duration: duration,

                    sender_name: senderName,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    is_edited: false,

                await db.collection('chats').doc(channelId).update({
                    last_message: '🎤 Voice message',
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('Voice note sent ✓', 'success');
            } catch(e) {
                console.error('Voice send error:', e);
                showToast('Voice failed: ' + e.message, 'error');
            }
        }

        function playVoiceNote(msgId, url) {
            const icon = document.getElementById('icon-' + msgId);
            const btn = icon.parentElement;

            if (audioPlayers[msgId] && !audioPlayers[msgId].paused) {
                audioPlayers[msgId].pause();
                icon.className = 'fas fa-play';
                btn.classList.remove('playing');
                return;
            }
            Object.values(audioPlayers).forEach(p => p.pause());

            if (!audioPlayers[msgId]) {
                audioPlayers[msgId] = new Audio(url);
                audioPlayers[msgId].addEventListener('ended', () => {
                    icon.className = 'fas fa-play';
                    btn.classList.remove('playing');
                });
            }
            audioPlayers[msgId].play();
            icon.className = 'fas fa-pause';
            btn.classList.add('playing');
        }

        async function init() {
            if (!checkAuth()) {
                window.location.href = 'email_verification.html';
                return;
            }

            const params = getUrlParams();
            channelId = params.id;
            channelName = params.name || 'Channel';

            if (!channelId) return;

            chatNameEl.textContent = channelName;
            if (params.avatar) {
                chatAvatarEl.innerHTML = `<img src="${params.avatar}" />`;
            }

            await fetchUserData(currentUserId);
            loadMessages();
            subscribeToChannelInfo();
            subscribeToTyping();

            window.addEventListener('beforeunload', () => {
                stopTypingPing();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    localStorage.setItem('mock_user_id', currentUserId);
                    init();
                } else {
                    const userId = localStorage.getItem('mock_user_id');
                    if (userId) { currentUserId = userId; init(); }
                    else window.location.href = 'email_verification.html';
                }
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active, .dialog-overlay.active').forEach(el => el.classList.remove('active'));
                if (showEmojiPicker) { showEmojiPicker = false; emojiPicker.classList.remove('show'); }
                if (mediaViewer.classList.contains('active')) closeMediaViewer();
            }
            if (e.key === 'Enter' && document.activeElement === messageInput) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.querySelectorAll('.modal-overlay, .dialog-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) el.classList.remove('active');
            });
        });
    </script>

</body>
</html>
