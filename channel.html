<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Channel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 10px;
        }

        #app {
            height: 100vh;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        .channel-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #8B5CF6;
            overflow: hidden;
            flex-shrink: 0;
        }

        .channel-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .channel-name {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .channel-type {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }

        .header-actions {
            display: flex;
            gap: 4px;
        }

        .header-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-actions button:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== PINNED MESSAGE ===== */
        .pinned-banner {
            padding: 8px 16px;
            background: rgba(26, 16, 60, 0.9);
            border-bottom: 1px solid rgba(255, 165, 0, 0.3);
            display: none;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .pinned-banner.show {
            display: flex;
        }

        .pinned-banner .pin-icon {
            color: rgba(255, 165, 0, 0.8);
            font-size: 14px;
        }

        .pinned-banner .pinned-info {
            flex: 1;
            min-width: 0;
        }

        .pinned-banner .pinned-by {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 165, 0, 0.8);
        }

        .pinned-banner .pinned-text {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pinned-banner .unpin-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            cursor: pointer;
            padding: 4px;
        }

        /* ===== MESSAGES ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column-reverse;
        }

        /* ===== MESSAGE ===== */
        .message {
            margin-bottom: 12px;
            max-width: 85%;
            align-self: flex-start;
        }

        .message .msg-bubble {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 12px;
        }

        .message .msg-sender {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .message .msg-sender .sender-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
        }

        .message .msg-sender .sender-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message .msg-sender .sender-name {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            flex: 1;
        }

        .message .msg-sender .msg-time {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
        }

        .message .msg-text {
            font-size: 15px;
            color: #fff;
            line-height: 1.4;
        }

        .message .msg-text.deleted {
            color: rgba(255,255,255,0.4);
            font-style: italic;
        }

        /* Reply indicator */
        .msg-reply {
            padding: 8px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border-left: 3px solid #8B5CF6;
        }

        .msg-reply .reply-sender {
            font-size: 11px;
            font-weight: 600;
            color: #8B5CF6;
        }

        .msg-reply .reply-content {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Media */
        .msg-media {
            border-radius: 12px;
            overflow: hidden;
            margin-top: 6px;
            cursor: pointer;
            max-width: 100%;
        }

        .msg-media img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
        }

        .msg-media .video-placeholder {
            width: 100%;
            height: 200px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 50px;
        }

        /* Audio */
        .msg-audio {
            width: 240px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .msg-audio .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            border: none;
            color: #8B5CF6;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .msg-audio .audio-progress {
            flex: 1;
        }

        .msg-audio .audio-progress .track {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .msg-audio .audio-progress .track .fill {
            height: 100%;
            background: #8B5CF6;
            width: 0%;
            border-radius: 2px;
        }

        .msg-audio .audio-time {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
        }

        /* File */
        .msg-file {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 200px;
        }

        .msg-file .file-icon {
            color: #8B5CF6;
            font-size: 24px;
        }

        .msg-file .file-info {
            flex: 1;
            min-width: 0;
        }

        .msg-file .file-name {
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .msg-file .file-size {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }

        /* Reactions */
        .msg-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .msg-reactions .reaction {
            padding: 2px 6px;
            background: #1a103c;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .msg-reactions .reaction:hover {
            background: rgba(139, 92, 246, 0.2);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 200px;
        }

        .empty-state .empty-icon {
            font-size: 64px;
            color: rgba(255,255,255,0.1);
        }

        .empty-state .empty-title {
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            margin-top: 16px;
        }

        /* ===== REPLY INDICATOR ===== */
        .reply-indicator {
            padding: 8px 16px;
            background: #1a103c;
            display: none;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .reply-indicator.show {
            display: flex;
        }

        .reply-indicator .reply-line {
            width: 3px;
            height: 36px;
            background: #8B5CF6;
            border-radius: 2px;
        }

        .reply-indicator .reply-info {
            flex: 1;
            min-width: 0;
        }

        .reply-indicator .reply-sender {
            font-size: 12px;
            font-weight: 600;
            color: #8B5CF6;
        }

        .reply-indicator .reply-content {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reply-indicator .cancel-reply {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }

        /* ===== MEDIA PREVIEW ===== */
        .media-preview {
            height: 100px;
            padding: 8px;
            position: relative;
            flex-shrink: 0;
        }

        .media-preview .preview-content {
            height: 100%;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.5);
        }

        .media-preview .remove-media {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ef4444;
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== RECORDING INDICATOR ===== */
        .recording-indicator {
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.15);
            display: none;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .recording-indicator.show {
            display: flex;
        }

        .recording-indicator .rec-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .recording-indicator .rec-time {
            color: #ef4444;
            font-weight: 600;
        }

        .recording-indicator .rec-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .recording-indicator .rec-actions button {
            border: none;
            border-radius: 50%;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .recording-indicator .rec-actions .cancel-rec {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .recording-indicator .rec-actions .send-rec {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            gap: 4px;
            font-family: 'Inter', sans-serif;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .input-area .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-area .input-row .attach-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .input-area .input-row .attach-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .input-area .input-row .emoji-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .input-area .input-row .emoji-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .input-area .input-row .input-field {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 10px 16px;
            border: none;
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .input-area .input-row .input-field::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .input-area .input-row .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .input-area .input-row .send-btn:hover {
            transform: scale(1.05);
        }

        .input-area .input-row .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .input-area .input-row .send-btn .spinner-small {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== EMOJI PICKER ===== */
        .emoji-picker {
            background: #1a103c;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 12px;
            display: none;
            flex-shrink: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .emoji-picker.show {
            display: block;
        }

        .emoji-picker .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }

        .emoji-picker .emoji-grid .emoji {
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            text-align: center;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .emoji-picker .emoji-grid .emoji:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a103c;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            padding: 20px;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }

        .modal-option {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
        }

        .modal-option:hover {
            background: rgba(255,255,255,0.05);
        }

        .modal-option .option-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 18px;
            background: rgba(139, 92, 246, 0.15);
            color: #8B5CF6;
        }

        .modal-option .option-label {
            color: #fff;
            font-size: 15px;
        }

        /* ===== REACTION ROW ===== */
        .reaction-row {
            display: flex;
            gap: 8px;
            padding: 8px 0;
            overflow-x: auto;
        }

        .reaction-row .reaction-btn {
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .reaction-row .reaction-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        /* ===== DIALOG ===== */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dialog-overlay.active {
            display: flex;
        }

        .dialog-content {
            background: #1a103c;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .dialog-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .dialog-text {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 16px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .dialog-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .dialog-btn:hover {
            opacity: 0.8;
        }

        .dialog-btn-cancel {
            background: transparent;
            color: rgba(255,255,255,0.5);
        }

        .dialog-btn-danger {
            background: #ef4444;
            color: #fff;
        }

        .dialog-btn-primary {
            background: #8B5CF6;
            color: #fff;
        }

        .dialog-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            margin-bottom: 12px;
        }

        .dialog-input:focus {
            border-color: #8B5CF6;
        }

        .dialog-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a103c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            z-index: 3000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.5);
            background: rgba(74, 222, 128, 0.1);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
        }

        /* ===== ATTACHMENT MODAL ===== */
        .attach-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            padding: 8px 0;
        }

        .attach-item {
            display: flex;
            flex-direction: column;

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────

        // ─── LOCAL STORAGE HELPERS ──────────────────────────────────
        function getFromLocalStorage(key) {
            try {
                const value = localStorage.getItem(key);
                if (!value) return null;
                try {
                    return JSON.parse(value);
                } catch {
                    return value;
                }
            } catch (e) {
                return null;
            }
        }

        function saveToLocalStorage(key, value) {
            try {
                if (typeof value === 'string') {
                    localStorage.setItem(key, value);
                } else {
                    localStorage.setItem(key, JSON.stringify(value));
                }
            } catch (e) {
                console.warn('Could not save to localStorage:', e);
            }
        }

        // ─── DOM REFS ─────────────────────────────────────────────────
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        const channelAvatarEl = document.getElementById('channelAvatar');
        const pinnedBanner = document.getElementById('pinnedBanner');
        const pinnedText = document.getElementById('pinnedText');

        const replyContent = document.getElementById('replyContent');
        const mediaPreview = document.getElementById('mediaPreview');
        const previewContent = document.getElementById('previewContent');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const recTime = document.getElementById('recTime');
        const emojiPicker = document.getElementById('emojiPicker');
        const emojiGrid = document.getElementById('emojiGrid');
        const toast = document.getElementById('toast');

        // ─── TOAST ────────────────────────────────────────────────────
        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ─── NAVIGATION ──────────────────────────────────────────────
        function goBack() {
            window.history.back();
        }

        function navigateTo(page, params = {}) {
            const queryString = new URLSearchParams(params).toString();
            window.location.href = page + '.html?' + queryString;
        }

        // ─── GET URL PARAMS ──────────────────────────────────────────
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),
                name: params.get('name')
            };
        }

        // ─── CHECK AUTH ──────────────────────────────────────────────
        function checkAuth() {
            const userId = getFromLocalStorage('mock_user_id');
            if (userId) {
                currentUserId = userId;
                return true;
            }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                saveToLocalStorage('mock_user_id', currentUserId);
                return true;
            }
            return false;
        }

        // ─── GENERATE UUID ────────────────────────────────────────────
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // ─── FORMAT TIME ─────────────────────────────────────────────
        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDuration(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return m + ':' + s;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function getTimeAgo(date) {
            if (!date) return 'Just now';
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return diffMins + 'm ago';
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return diffHours + 'h ago';
            return Math.floor(diffHours / 24) + 'd ago';
        }

        // ─── EMOJIS ──────────────────────────────────────────────────
        const emojis = ['😀', '😁', '😂', '🤣', '😃', '😄', '😅', '😆', '😉', '😊', '😋', '😎', '😍', '🥰', '😘', '😗', '😙', '😚', '🙂', '🤗', '🤩', '🤔', '🤨', '😐', '😑', '😶', '🙄', '😏', '😣', '😥', '😮', '🤐', '😯', '😪', '😫', '😴', '😌', '😛', '😜', '😝', '🤤', '😒', '😓', '😔', '😕', '🙃', '🤑', '😲', '☹️', '🙁', '😖', '😞', '😟', '😤', '😢', '😭', '😦', '😧', '😨', '😩', '🤯', '😬', '😰', '😱', '🥵', '🥶', '😳', '🤪', '😵', '😡', '😠', '🤬'];

        // ─── CHANNEL INFO ────────────────────────────────────────────
        async function loadChannelInfo() {
            const params = getUrlParams();
            channelId = params.id;
            channelName = params.name || 'Channel';

            channelNameEl.textContent = channelName;

            try {
                const doc = await db.collection('chats').doc(channelId).get();
                if (doc.exists) {
                    const data = doc.data();
                    channelAvatarUrl = data.avatar_url || null;
                    if (channelAvatarUrl) {
                        channelAvatarEl.innerHTML = `<img src="${channelAvatarUrl}" alt="Channel" />`;
                    } else {
                        channelAvatarEl.innerHTML = `<i class="fas fa-bullhorn"></i>`;
                    }

                    // Check if user can post
                    const participantsData = data.participants_data || {};
                    const myData = participantsData[currentUserId] || {};
                    const role = myData.role || 'member';
                    isAdmin = role === 'owner' || role === 'admin';

                    // Update input area
                    if (!isAdmin) {
                        const inputArea = document.getElementById('inputArea');
                        inputArea.innerHTML = `
                            <div style="padding:12px;text-align:center;color:rgba(255,255,255,0.3);font-size:13px;">
                                Only admins can post in this channel
                            </div>
                        `;
                    }
                }
            } catch (e) {
                console.error('Error loading channel info:', e);
            }
        }

        function goToChannelInfo() {
            navigateTo('channel_info', { id: channelId, name: channelName });
        }

        // ─── LOAD MESSAGES ───────────────────────────────────────────
        function loadMessages() {
            if (!channelId) return;

            db.collection('chats')
                .doc(channelId)
                .collection('messages')
                .orderBy('created_at', 'desc')
                .onSnapshot((snapshot) => {
                    messages = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        data.id = doc.id;
                        messages.push(data);
                    });
                    renderMessages();
                }, (error) => {
                    console.error('Messages error:', error);
                });
        }

        // ─── LOAD PINNED MESSAGE ────────────────────────────────────
        function loadPinnedMessage() {
            if (!channelId) return;

            db.collection('chats')
                .doc(channelId)
                .collection('pinned_messages')
                .orderBy('pinned_at', 'desc')
                .limit(1)
                .onSnapshot(async (snapshot) => {
                    if (snapshot.empty) {
                        pinnedMessage = null;
                        pinnedBanner.classList.remove('show');
                        return;
                    }

                    const pinnedDoc = snapshot.docs[0];
                    const messageId = pinnedDoc.data().message_id;

                    if (!messageId) {
                        pinnedMessage = null;
                        pinnedBanner.classList.remove('show');
                        return;
                    }

                    try {
                        const msgDoc = await db.collection('chats')
                            .doc(channelId)
                            .collection('messages')
                            .doc(messageId)
                            .get();

                        if (msgDoc.exists) {
                            const data = msgDoc.data();
                            data.id = msgDoc.id;
                            pinnedMessage = data;
                            pinnedBanner.classList.add('show');
                            pinnedText.textContent = data.text || data.content || 'Pinned message';
                            pinnedBy.textContent = 'Pinned by ' + (data.sender_name || 'Admin');
                        }
                    } catch (e) {
                        console.error('Pinned message error:', e);
                    }
                });
        }

        // ─── RENDER MESSAGES ─────────────────────────────────────────
        function renderMessages() {
            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-bullhorn"></i></div>
                        <div class="empty-title">No messages yet</div>
                    </div>
                `;
                return;
            }

            let html = '';
            messages.forEach(msg => {
                const isMe = msg.sender_id === currentUserId;
                const isDeleted = msg.deleted_for_everyone === true;
                const mediaType = msg.media_type || '';
                const mediaUrl = msg.media_url || '';
                const reactions = msg.reactions || {};
                const text = msg.text || msg.content || '';

                // Message bubble
                html += `<div class="message">`;
                html += `<div class="msg-bubble">`;

                // Sender info
                html += `<div class="msg-sender">`;
                if (msg.sender_avatar) {
                    html += `<div class="sender-avatar"><img src="${msg.sender_avatar}" alt="${msg.sender_name || 'User'}" /></div>`;
                } else {
                    const initial = (msg.sender_name || 'U')[0].toUpperCase();
                    html += `<div class="sender-avatar">${initial}</div>`;
                }
                html += `<span class="sender-name">${msg.sender_name || 'Admin'}</span>`;
                html += `<span class="msg-time">${formatTime(msg.created_at)}</span>`;
                html += `</div>`;

                // Reply indicator
                if (msg.reply_to) {
                    html += `<div class="msg-reply">`;
                    html += `<div class="reply-sender">${msg.reply_to_sender || 'Unknown'}</div>`;
                    html += `<div class="reply-content">${msg.reply_to_content || 'Media'}</div>`;
                    html += `</div>`;
                }

                // Message content
                if (isDeleted) {
                    html += `<div class="msg-text deleted">This message was deleted</div>`;
                } else if (mediaType === 'image' && mediaUrl) {
                    html += `<div class="msg-media" onclick="viewImage('${mediaUrl}')"><img src="${mediaUrl}" alt="Image" /></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:6px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'video' && mediaUrl) {
                    html += `<div class="msg-media"><div class="video-placeholder" onclick="viewVideo('${mediaUrl}')"><i class="fas fa-play-circle"></i></div></div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:6px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'audio' && mediaUrl) {
                    const isCurrent = currentlyPlayingAudioId === msg.id;
                    const duration = msg.duration || 0;
                    html += `<div class="msg-audio">`;
                    html += `<button class="play-btn" onclick="playAudio('${msg.id}', '${mediaUrl}')">`;
                    html += `<i class="fas ${isCurrent && isPlayingAudio ? 'fa-pause' : 'fa-play'}"></i>`;
                    html += `</button>`;
                    html += `<div class="audio-progress">`;
                    html += `<div class="track"><div class="fill" style="width:${isCurrent ? 50 : 0}%"></div></div>`;
                    html += `</div>`;
                    html += `<span class="audio-time">${formatDuration(duration)}</span>`;
                    html += `</div>`;
                    if (text) html += `<div class="msg-text" style="margin-top:6px;">${escapeHtml(text)}</div>`;
                } else if (mediaType === 'file') {
                    html += `<div class="msg-file">`;
                    html += `<div class="file-icon"><i class="fas fa-file"></i></div>`;
                    html += `<div class="file-info">`;
                    html += `<div class="file-name">${escapeHtml(msg.file_name || text || 'File')}</div>`;
                    if (msg.file_size) html += `<div class="file-size">${msg.file_size}</div>`;
                    html += `</div>`;
                    html += `</div>`;
                } else {
                    html += `<div class="msg-text">${escapeHtml(text)}</div>`;
                }

                // Reactions
                if (Object.keys(reactions).length > 0) {
                    html += `<div class="msg-reactions">`;
                    for (const [emoji, users] of Object.entries(reactions)) {
                        const count = users.length;
                        html += `<span class="reaction" onclick="addReactionToMessage('${msg.id}', '${emoji}')">${emoji} ${count > 1 ? count : ''}</span>`;
                    }
                    html += `</div>`;
                }

                html += `</div>`;

                // Long press for options
                html += `<div style="display:none;" data-msg-id="${msg.id}" data-is-me="${isMe}" data-is-deleted="${isDeleted}"></div>`;

                html += `</div>`;
            });

            messagesContainer.innerHTML = html;

            // Add click/long press handlers
            document.querySelectorAll('.message').forEach((el, index) => {
                const dataEl = el.querySelector('[data-msg-id]');
                if (!dataEl) return;

                const msgId = dataEl.dataset.msgId;
                const isMe = dataEl.dataset.isMe === 'true';
                const isDeleted = dataEl.dataset.isDeleted === 'true';

                el.addEventListener('click', () => {
                    // On click, show options
                    showMessageOptions(msgId, isMe, isDeleted);
                });
            });

            // Auto-scroll to bottom
            messagesContainer.scrollTop = 0;
        }

        // ─── SHOW MESSAGE OPTIONS ────────────────────────────────────
        function showMessageOptions(msgId, isMe, isDeleted) {

            if (isMe) {
                html += `
                    <div class="modal-option" onclick="deleteMessage('${msgId}')" style="border-top:1px solid rgba(255,255,255,0.05);margin-top:8px;padding-top:12px;">
                        <div class="option-icon" style="background:rgba(239,68,68,0.15);color:#ef4444;"><i class="fas fa-trash"></i></div>
                        <span class="option-label" style="color:#ef4444;">Delete for Everyone</span>
                    </div>
                `;
            }

            list.innerHTML = html;
            modal.classList.add('active');
        }

        // ─── ADD REACTION ────────────────────────────────────────────
        function addReaction(emoji) {
            if (!selectedMessageId) return;
            closeModal('msgOptionsModal');
            addReactionToMessage(selectedMessageId, emoji);
        }

        async function addReactionToMessage(msgId, emoji) {
            try {
                const msgRef = db.collection('chats').doc(channelId).collection('messages').doc(msgId);
                const doc = await msgRef.get();
                if (!doc.exists) return;

                const data = doc.data();
                const reactions = data.reactions || {};
                const users = reactions[emoji] || [];

                if (users.includes(currentUserId)) {
                    const index = users.indexOf(currentUserId);
                    users.splice(index, 1);
                    if (users.length === 0) {
                        delete reactions[emoji];
                    } else {
                        reactions[emoji] = users;
                    }
                } else {
                    users.push(currentUserId);
                    reactions[emoji] = users;
                }

                await msgRef.update({ reactions: reactions });
            } catch (e) {
                console.error('Reaction error:', e);
            }
        }

        // ─── REPLY TO MESSAGE ────────────────────────────────────────
        function replyToMessage(msgId) {
            closeModal('msgOptionsModal');
            const msg = messages.find(m => m.id === msgId);
            if (msg) {
                replyingTo = msgId;
                replyingToContent = msg.text || msg.content || 'Media';
                replyingToSender = msg.sender_name || 'Unknown';
                replyIndicator.classList.add('show');
                replySender.textContent = 'Replying to ' + replyingToSender;
                replyContent.textContent = replyingToContent;
                messageInput.focus();
            }
        }

        function cancelReply() {
            replyingTo = null;
            replyingToContent = null;
            replyingToSender = null;
            replyIndicator.classList.remove('show');
        }

        // ─── PIN / UNPIN MESSAGE ────────────────────────────────────
        async function pinMessage(msgId) {
            closeModal('msgOptionsModal');

            if (pinnedMessage && pinnedMessage.id === msgId) {
                await unpinMessage();
                return;
            }

            try {
                await db.collection('chats')
                    .doc(channelId)
                    .collection('pinned_messages')
                    .doc(msgId)
                    .set({
                        message_id: msgId,
                        pinned_at: firebase.firestore.FieldValue.serverTimestamp(),
                        pinned_by: currentUserId
                    });
                showToast('Message pinned', 'success');
            } catch (e) {
                console.error('Pin error:', e);
                showToast('Failed to pin message', 'error');
            }
        }

        async function unpinMessage() {
            if (!pinnedMessage) return;

            try {
                await db.collection('chats')
                    .doc(channelId)
                    .collection('pinned_messages')
                    .doc(pinnedMessage.id)
                    .delete();
                showToast('Message unpinned', '');
            } catch (e) {
                console.error('Unpin error:', e);
                showToast('Failed to unpin message', 'error');
            }
        }

        // ─── EDIT MESSAGE ────────────────────────────────────────────
        function showEditDialog(msgId) {
            closeModal('msgOptionsModal');
            editingMessageId = msgId;
            const msg = messages.find(m => m.id === msgId);
            if (msg) {
                document.getElementById('editInput').value = msg.text || msg.content || '';
                document.getElementById('editDialog').classList.add('active');
                setTimeout(() => document.getElementById('editInput').focus(), 100);
            }
        }

        async function saveEdit() {
            const newContent = document.getElementById('editInput').value.trim();
            if (!newContent || !editingMessageId) {
                closeDialog('editDialog');
                return;
            }

            try {
                await db.collection('chats')
                    .doc(channelId)
                    .collection('messages')
                    .doc(editingMessageId)
                    .update({
                        text: newContent,
                        content: newContent,
                        is_edited: true,
                        updated_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                closeDialog('editDialog');
                showToast('Message edited', 'success');
            } catch (e) {
                console.error('Edit error:', e);
                showToast('Failed to edit message', 'error');
            }

            editingMessageId = null;
        }

        // ─── DELETE MESSAGE ──────────────────────────────────────────
        function deleteMessage(msgId) {
            closeModal('msgOptionsModal');
            deletingMessageId = msgId;
            document.getElementById('deleteDialog').classList.add('active');
        }

        async function confirmDelete() {
            if (!deletingMessageId) {
                closeDialog('deleteDialog');
                return;
            }

            try {
                await db.collection('chats')
                    .doc(channelId)
                    .collection('messages')
                    .doc(deletingMessageId)
                    .update({
                        deleted_for_everyone: true,
                        text: 'This message was deleted',
                        content: 'This message was deleted',
                        media_url: null,
                        updated_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                closeDialog('deleteDialog');
                showToast('Message deleted', '');
            } catch (e) {
                console.error('Delete error:', e);
                showToast('Failed to delete message', 'error');
            }

            deletingMessageId = null;
        }

        // ─── SEND MESSAGE ────────────────────────────────────────────
        async function sendMessage() {
            const text = messageInput.value.trim();

            if (!text && !selectedImage && !selectedVideo && !selectedFile) {
                return;
            }

            if (!isAdmin) {
                showToast('Only admins can post in this channel', 'error');
                return;
            }

            setLoading(true);

            try {
                // Get user data
                const userDoc = await db.collection('users').doc(currentUserId).get();
                const userData = userDoc.exists ? userDoc.data() : {};
                const senderName = userData.display_name || userData.username || userData.name || 'Admin';
                const senderAvatar = userData.avatar_url || null;

                let mediaUrl = null;
                let mediaType = 'text';
                let fileName = null;
                let fileSize = null;
                let duration = null;

                // Upload image
                if (selectedImage) {
                    mediaUrl = await uploadFile(selectedImage, 'image');
                    mediaType = 'image';
                }

                // Upload video
                if (selectedVideo) {
                    mediaUrl = await uploadFile(selectedVideo, 'video');
                    mediaType = 'video';
                    fileName = selectedVideo.name;
                }

                // Upload file
                if (selectedFile) {
                    mediaUrl = await uploadFile(selectedFile, 'file');
                    mediaType = 'file';
                    fileName = selectedFile.name;
                    fileSize = formatFileSize(selectedFile.size);
                }

                const msgRef = db.collection('chats').doc(channelId).collection('messages').doc();
                const msgData = {
                    id: msgRef.id,
                    text: text || null,
                    content: text || null,
                    media_url: mediaUrl,
                    media_type: mediaType,
                    file_name: fileName,
                    file_size: fileSize,
                    duration: duration,
                    sender_id: currentUserId,
                    sender_name: senderName,
                    sender_avatar: senderAvatar,
                    reply_to: replyingTo || null,
                    reply_to_content: replyingToContent || null,
                    reply_to_sender: replyingToSender || null,
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    is_edited: false,
                    deleted_for_everyone: false,
                    reactions: {}
                };

                await msgRef.set(msgData);

                // Update chat last message
                const lastMessage = text || (mediaType === 'image' ? '📷 Image' : mediaType === 'video' ? '🎥 Video' : '📎 File');
                await db.collection('chats').doc(channelId).update({
                    last_message: lastMessage,
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message_type: mediaType
                });

                // Clear input
                messageInput.value = '';
                selectedImage = null;
                selectedVideo = null;
                selectedFile = null;
                replyingTo = null;
                replyingToContent = null;
                replyingToSender = null;
                replyIndicator.classList.remove('show');
                mediaPreview.style.display = 'none';

            } catch (e) {
                console.error('Send error:', e);
                showToast('Failed to send: ' + e.message, 'error');
            }

            setLoading(false);
        }

        // ─── UPLOAD FILE ─────────────────────────────────────────────
        async function uploadFile(file, type) {
            try {
                const storageRef = storage.ref();
                const path = `aurachat/channels/${channelId}/${Date.now()}_${file.name || 'file'}`;
                const fileRef = storageRef.child(path);
                await fileRef.put(file);
                return await fileRef.getDownloadURL();
            } catch (e) {
                console.error('Upload error:', e);
                throw e;
            }
        }

        function setLoading(loading) {
            isLoading = loading;
            if (loading) {
                sendBtn.innerHTML = '<div class="spinner-small"></div>';
                sendBtn.disabled = true;
            } else {

                sendBtn.disabled = false;
            }
        }

                emojiPicker.classList.add('show');

            });
            emojiGrid.innerHTML = html;

        // ─── RECORDING ───────────────────────────────────────────────
        function startRecording() {
            if (isRecording) return;
            isRecording = true;
            recSeconds = 0;
            recTime.textContent = '00:00';
            recordingIndicator.classList.add('show');

            if (recTimer) clearInterval(recTimer);
            recTimer = setInterval(() => {
                recSeconds++;
                recTime.textContent = formatDuration(recSeconds);
            }, 1000);

            // Simulate recording (in production, use MediaRecorder API)
            showToast('Recording...', '');
        }

        function stopRecordingAndSend() {
            if (recTimer) {
                clearInterval(recTimer);
                recTimer = null;
            }
            recordingIndicator.classList.remove('show');
            isRecording = false;

            if (recSeconds > 0) {
                // Create a dummy audio file for demo
                const audioBlob = new Blob(['dummy audio'], { type: 'audio/m4a' });
                const audioFile = new File([audioBlob], `voice_${Date.now()}.m4a`, { type: 'audio/m4a' });
                selectedFile = audioFile;
                showMediaPreview('Voice note: ' + formatDuration(recSeconds));
                showToast('Recording sent!', 'success');
            }
            recSeconds = 0;
        }

        function cancelRecording() {
            if (recTimer) {
                clearInterval(recTimer);
                recTimer = null;
            }
            recordingIndicator.classList.remove('show');
            isRecording = false;
            recSeconds = 0;
            showToast('Recording cancelled', '');
        }

        // ─── AUDIO PLAYBACK ──────────────────────────────────────────
        function playAudio(msgId, audioUrl) {
            // Simple audio playback simulation
            if (currentlyPlayingAudioId === msgId && isPlayingAudio) {
                isPlayingAudio = false;
                currentlyPlayingAudioId = null;
                renderMessages();
                return;
            }

            currentlyPlayingAudioId = msgId;
            isPlayingAudio = true;
            renderMessages();

            // Simulate audio playing for 5 seconds
            setTimeout(() => {
                isPlayingAudio = false;
                currentlyPlayingAudioId = null;
                renderMessages();
            }, 5000);
        }

        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');

            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';

        document.querySelectorAll('.modal-overlay, .dialog-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });

        // ─── KEYBOARD SHORTCUTS ──────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active, .dialog-overlay.active').forEach(el => {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                });
                if (showEmojiPicker) {
                    showEmojiPicker = false;
                    emojiPicker.classList.remove('show');
                }
            }
            if (e.key === 'Enter' && !e.shiftKey) {
                if (document.activeElement === messageInput) {
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;

                    saveToLocalStorage('mock_user_id', user.uid);
                    init();

                    const userId = getFromLocalStorage('mock_user_id');

                        init();

            });
