<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AURA Channel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --tg-blue:#3390EC;
  --tg-blue-light:#64B5EF;
  --bg:#0E1621;
  --bg-2:#17212B;
  --bubble:#182533;
  --bubble-hover:#1E2C3A;
  --text:#FFFFFF;
  --text-2:#708499;
  --text-3:#5E7085;
  --divider:rgba(255,255,255,0.06);
  --danger:#E53935;
  --success:#4CAF50;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px;}

#app{
  height:100vh;height:100dvh;
  max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:var(--bg);
  position:relative;
}

/* ═══════ HEADER (Telegram channel style) ═══════ */
.header{
  padding:8px 6px 8px 6px;
  display:flex;align-items:center;gap:4px;
  flex-shrink:0;
  background:var(--bg-2);
  border-bottom:1px solid var(--divider);
  min-height:54px;
  z-index:10;
}
.icon-btn{
  background:none;border:none;color:#fff;
  font-size:18px;padding:0;cursor:pointer;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s;
}
.icon-btn:hover{background:rgba(255,255,255,0.06);}
.chat-info{
  display:flex;align-items:center;gap:10px;flex:1;
  cursor:pointer;min-width:0;padding:2px 4px;border-radius:8px;
}
.chat-info:hover{background:rgba(255,255,255,0.04);}
.chat-avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#3390EC,#64B5EF);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;overflow:hidden;
  flex-shrink:0;font-weight:700;
}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}
.chat-meta{flex:1;min-width:0;}
.chat-name-row{display:flex;align-items:center;gap:5px;}
.chat-name{
  font-weight:600;font-size:15px;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.channel-badge{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10px;font-weight:600;
  color:#8FB8E8;
  background:rgba(51,144,236,0.15);
  padding:1px 6px;border-radius:8px;
  flex-shrink:0;
}
.chat-sub{
  font-size:11.5px;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px;
}
.chat-sub.typing{color:var(--tg-blue-light);}
.header-actions{display:flex;gap:0;flex-shrink:0;}

/* ═══════ PINNED BAR ═══════ */
.pinned-bar{
  padding:6px 14px;
  background:var(--bg-2);
  border-bottom:1px solid var(--divider);
  display:none;align-items:center;gap:10px;
  flex-shrink:0;
}
.pinned-bar.show{display:flex;}
.pinned-bar .pin-line{
  width:3px;height:32px;
  background:var(--tg-blue);border-radius:2px;flex-shrink:0;
}
.pinned-bar .pin-info{flex:1;min-width:0;}
.pinned-bar .pin-label{font-size:11px;color:var(--tg-blue-light);font-weight:600;}
.pinned-bar .pin-text{
  font-size:12px;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ═══════ MESSAGES CONTAINER ═══════ */
.messages-container{
  flex:1;overflow-y:auto;
  padding:10px 8px 8px 8px;
  display:flex;flex-direction:column;
  gap:2px;
  min-height:0;
  scroll-behavior:smooth;
}
.messages-container::-webkit-scrollbar{width:4px;}

/* Date divider */
.date-divider{
  text-align:center;
  padding:10px 0 8px 0;
  font-size:11.5px;font-weight:600;
  color:var(--text-3);
}
.date-divider span{
  background:rgba(255,255,255,0.06);
  padding:3px 10px;border-radius:10px;
  display:inline-block;
}

/* ═══════ CHANNEL MESSAGE (left-aligned, wide) ═══════ */
.msg-wrap{
  display:flex;
  width:100%;
  margin-bottom:2px;
}
.msg-wrap.media-only{margin-bottom:4px;}

.msg-bubble{
  max-width:88%;
  background:var(--bubble);
  border-radius:12px;
  padding:6px 10px 6px 10px;
  position:relative;
  cursor:pointer;
  transition:background .15s;
  box-shadow:0 1px 2px rgba(0,0,0,0.2);
  min-width:80px;
  word-wrap:break-word;
}
.msg-bubble:hover{background:var(--bubble-hover);}
.msg-bubble.no-pad{padding:3px 3px 3px 3px;}
.msg-bubble.sending{opacity:0.55;}

/* Forwarded label */
.forwarded-label{
  font-size:11.5px;font-weight:600;
  color:var(--tg-blue-light);
  display:flex;align-items:center;gap:4px;
  margin-bottom:3px;
}
.forwarded-label i{font-size:10px;}

/* Message text */
.msg-text{
  font-size:14.5px;color:#fff;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-word;
  padding:2px 0 0 0;
}
.msg-text a{color:var(--tg-blue-light);text-decoration:none;}
.msg-text a:hover{text-decoration:underline;}

/* Media inside bubble */
.msg-media{
  border-radius:9px;
  overflow:hidden;
  margin:1px -7px 3px -7px;
  cursor:pointer;
  position:relative;
  background:#000;
  max-height:340px;
}
.msg-media img{
  width:100%;max-height:340px;
  display:block;object-fit:cover;
}
.msg-media video{
  width:100%;max-height:340px;
  display:block;background:#000;
}
.msg-media .play-overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.15);
  pointer-events:none;
}
.msg-media .play-overlay i{
  font-size:52px;color:rgba(255,255,255,0.85);
  text-shadow:0 2px 12px rgba(0,0,0,0.5);
}

/* File card */
.msg-file{
  display:flex;align-items:center;gap:10px;
  padding:6px 4px 6px 0;
  margin:2px 0;
  cursor:pointer;
  min-width:220px;
}
.msg-file .file-icon-circle{
  width:44px;height:44px;border-radius:50%;
  background:rgba(51,144,236,0.2);
  color:var(--tg-blue-light);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.msg-file .file-icon-circle.img{background:rgba(76,175,80,0.2);color:#66BB6A;}
.msg-file .file-icon-circle.vid{background:rgba(229,57,53,0.2);color:#EF5350;}
.msg-file .file-icon-circle.doc{background:rgba(255,152,0,0.2);color:#FFA726;}
.msg-file .file-meta{flex:1;min-width:0;}
.msg-file .file-name{
  font-size:13.5px;font-weight:500;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.msg-file .file-size{
  font-size:11.5px;color:var(--text-2);margin-top:1px;
}

/* Voice note */
.voice-note{
  display:flex;align-items:center;gap:10px;
  padding:2px 0;min-width:200px;
}
.voice-note .play-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--tg-blue);border:none;
  color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
  transition:all .15s;
}
.voice-note .play-btn:hover{background:var(--tg-blue-light);}
.voice-note .play-btn.playing{background:var(--tg-blue-light);}
.voice-note .waveform{
  flex:1;height:22px;display:flex;
  align-items:center;gap:2px;overflow:hidden;
}
.voice-note .waveform .bar{
  width:3px;background:rgba(255,255,255,0.25);
  border-radius:2px;flex-shrink:0;
}
.voice-note .waveform .bar.active{background:var(--tg-blue-light);}
.voice-note .duration{
  font-size:11px;color:var(--text-2);
  flex-shrink:0;min-width:36px;text-align:right;
}

/* Message footer: time + views */
.msg-footer{
  display:flex;align-items:center;justify-content:flex-end;
  gap:6px;margin-top:2px;
  font-size:11px;color:var(--text-2);
  float:right;
  padding-left:8px;
  position:relative;
  top:2px;
}
.msg-footer .views{
  display:inline-flex;align-items:center;gap:3px;
  color:var(--text-2);
}
.msg-footer .views i{font-size:10px;}
.msg-footer .edited{color:var(--text-3);font-style:italic;}

/* Clear float after bubble content */
.msg-bubble::after{content:'';display:table;clear:both;}

/* Reactions */
.msg-reactions{
  display:flex;flex-wrap:wrap;gap:4px;
  margin-top:6px;
  clear:both;
}
.reaction-pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;
  background:rgba(51,144,236,0.15);
  border:1px solid rgba(51,144,236,0.25);
  border-radius:10px;
  font-size:12px;
  cursor:pointer;
  color:var(--tg-blue-light);
  transition:all .15s;
}
.reaction-pill.mine{
  background:rgba(51,144,236,0.3);
  border-color:var(--tg-blue);
  color:#fff;
}
.reaction-pill:hover{background:rgba(51,144,236,0.35);}
.reaction-pill .count{font-weight:600;font-size:11px;}

/* Deleted message */
.msg-deleted{
  font-style:italic;
  color:var(--text-3);
  font-size:13.5px;
}

/* ═══════ TYPING INDICATOR ═══════ */
.typing-wrap{
  display:none;margin:2px 0 6px 4px;
  align-self:flex-start;
}
.typing-wrap.show{display:flex;}
.typing-bubble{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;
  background:var(--bubble);
  border-radius:12px;
}
.typing-bubble .dots{display:flex;gap:4px;}
.typing-bubble .dots span{
  width:7px;height:7px;border-radius:50%;
  background:var(--tg-blue-light);
  animation:typingB 1.3s infinite ease-in-out both;
}
.typing-bubble .dots span:nth-child(1){animation-delay:-0.3s;}
.typing-bubble .dots span:nth-child(2){animation-delay:-0.15s;}
@keyframes typingB{
  0%,80%,100%{transform:scale(0.5);opacity:.4;}
  40%{transform:scale(1);opacity:1;}
}

/* ═══════ REPLY BAR ═══════ */
.reply-bar{
  padding:8px 12px;
  background:var(--bg-2);
  display:none;align-items:center;gap:10px;
  flex-shrink:0;
  border-top:1px solid var(--divider);
}
.reply-bar.show{display:flex;}
.reply-bar .reply-accent{
  width:3px;height:34px;
  background:var(--tg-blue);border-radius:2px;flex-shrink:0;
}
.reply-bar .reply-info{flex:1;min-width:0;}
.reply-bar .reply-sender{
  font-size:12px;font-weight:600;color:var(--tg-blue-light);
}
.reply-bar .reply-content{
  font-size:12.5px;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px;
}
.reply-bar .cancel-reply{
  background:none;border:none;
  color:var(--text-2);font-size:16px;
  cursor:pointer;padding:6px;border-radius:50%;
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
}

/* ═══════ RECORDING BAR ═══════ */
.recording-bar{
  padding:10px 14px;
  background:rgba(229,57,53,0.08);
  border-top:1px solid rgba(229,57,53,0.2);
  display:none;align-items:center;gap:12px;flex-shrink:0;
}
.recording-bar.show{display:flex;}
.recording-bar .rec-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--danger);animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.recording-bar .rec-timer{
  color:var(--danger);font-weight:700;
  font-size:14px;min-width:44px;
}
.recording-bar .rec-wave{
  flex:1;height:24px;
  display:flex;align-items:center;gap:2px;
}
.recording-bar .rec-wave .bar{
  width:3px;background:rgba(229,57,53,0.6);
  border-radius:2px;animation:recW .8s infinite ease-in-out;
}
@keyframes recW{0%,100%{height:4px;}50%{height:20px;}}
.recording-bar .rec-actions{display:flex;gap:8px;margin-left:auto;}
.recording-bar .rec-actions button{
  width:40px;height:40px;border:none;border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.recording-bar .cancel-rec{background:rgba(229,57,53,0.15);color:var(--danger);}
.recording-bar .send-rec{background:var(--tg-blue);color:#fff;}

/* ═══════ CHANNEL BOTTOM BAR (for subscribers) ═══════ */
.channel-action-bar{
  padding:10px 14px;
  background:var(--bg-2);
  border-top:1px solid var(--divider);
  display:none;align-items:center;gap:8px;flex-shrink:0;
}
.channel-action-bar.show{display:flex;}
.channel-action-bar .btn{
  flex:1;
  padding:11px 14px;
  border:none;border-radius:9px;
  font-size:14px;font-weight:600;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .15s;
}
.channel-action-bar .btn-mute{
  background:rgba(255,255,255,0.06);color:#fff;
}
.channel-action-bar .btn-mute:hover{background:rgba(255,255,255,0.1);}
.channel-action-bar .btn-mute.muted{color:var(--danger);}
.channel-action-bar .btn-mute.muted i{color:var(--danger);}

/* ═══════ INPUT (admins) ═══════ */
.input-area{
  padding:8px 10px 8px 10px;
  background:var(--bg-2);
  border-top:1px solid var(--divider);
  flex-shrink:0;
  min-height:56px;
}
.input-row{display:flex;align-items:center;gap:4px;}
.input-row .side-btn{
  background:none;border:none;
  color:var(--text-2);font-size:19px;
  cursor:pointer;padding:0;border-radius:50%;
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s;
}
.input-row .side-btn:hover{background:rgba(255,255,255,0.06);}
.input-field{
  flex:1;
  background:rgba(255,255,255,0.05);
  border-radius:19px;
  padding:9px 14px;
  border:none;color:#fff;
  font-size:14px;
  font-family:'Inter',sans-serif;
  outline:none;min-height:38px;
}
.input-field::placeholder{color:var(--text-3);}
.input-field:focus{background:rgba(255,255,255,0.08);}
.action-btn{
  width:40px;height:40px;border-radius:50%;border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:17px;
  transition:all .15s;
}
.action-btn.send{
  background:var(--tg-blue);color:#fff;display:none;
}
.action-btn.send.show{display:flex;}
.action-btn.send:hover{background:var(--tg-blue-light);}
.action-btn.mic{
  background:var(--tg-blue);color:#fff;display:flex;
}
.action-btn.mic.hide{display:none;}
.action-btn.mic.recording{background:var(--danger);}

/* ═══════ EMOJI PICKER ═══════ */
.emoji-picker{
  background:var(--bg-2);
  border-top:1px solid var(--divider);
  display:none;flex-shrink:0;
  max-height:280px;flex-direction:column;
}
.emoji-picker.show{display:flex;}
.emoji-tabs{
  display:flex;padding:8px 12px 0 12px;gap:2px;
  border-bottom:1px solid var(--divider);overflow-x:auto;
}
.emoji-tab{
  padding:8px 10px;background:none;border:none;
  color:var(--text-2);font-size:18px;
  cursor:pointer;border-radius:8px 8px 0 0;
  border-bottom:2px solid transparent;
  white-space:nowrap;flex-shrink:0;
}
.emoji-tab.active{
  color:#fff;border-bottom-color:var(--tg-blue);
}
.emoji-content{flex:1;overflow-y:auto;padding:10px 12px;max-height:220px;}
.emoji-grid{
  display:grid;grid-template-columns:repeat(8,1fr);gap:4px;
}
.emoji{
  font-size:22px;cursor:pointer;padding:4px;
  text-align:center;border-radius:6px;
}
.emoji:hover{background:rgba(255,255,255,0.08);}

/* ═══════ TOAST ═══════ */
.toast{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%);
  background:rgba(23,33,43,0.98);
  color:#fff;padding:9px 18px;
  border-radius:10px;
  font-size:13px;z-index:3000;
  display:none;max-width:90%;
  box-shadow:0 8px 30px rgba(0,0,0,0.5);
}
.toast.show{display:block;}
.toast.error{color:#EF5350;}
.toast.success{color:#66BB6A;}

/* ═══════ MODALS ═══════ */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.55);
  z-index:2000;display:none;
  align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px);
}
.modal-overlay.active{display:flex;}
.modal-content{
  background:var(--bg-2);
  border-radius:16px 16px 0 0;
  width:100%;max-width:480px;
  max-height:75vh;padding:14px 16px 20px 16px;
  overflow-y:auto;
  animation:slideUp .2s ease-out;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{
  width:36px;height:4px;
  background:rgba(255,255,255,0.15);
  border-radius:2px;margin:0 auto 12px auto;
}
.modal-title{
  font-size:15px;font-weight:600;color:#fff;
  text-align:center;margin-bottom:12px;
}
.modal-option{
  display:flex;align-items:center;
  padding:11px 12px;border-radius:10px;
  cursor:pointer;margin-bottom:2px;
  transition:background .12s;
}
.modal-option:hover{background:rgba(255,255,255,0.05);}
.modal-option .opt-icon{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin-right:14px;font-size:15px;flex-shrink:0;
}
.modal-option .opt-label{color:#fff;font-size:14.5px;font-weight:500;}
.modal-option.danger .opt-label{color:var(--danger);}
.modal-option.danger .opt-icon{background:rgba(229,57,53,0.15);color:var(--danger);}

.quick-reactions{
  display:flex;gap:6px;padding:10px 0 14px 0;
  justify-content:center;
  border-bottom:1px solid var(--divider);
  margin-bottom:6px;
}
.quick-emoji{
  font-size:26px;cursor:pointer;
  padding:8px;border-radius:50%;
  transition:transform .15s,background .15s;
  line-height:1;
}
.quick-emoji:hover{
  transform:scale(1.2);
  background:rgba(51,144,236,0.15);
}

.attach-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;padding:4px 0;
}
.attach-item{
  display:flex;flex-direction:column;
  align-items:center;background:none;border:none;
  cursor:pointer;padding:12px 4px;border-radius:12px;
  transition:background .15s;
}
.attach-item:hover{background:rgba(255,255,255,0.05);}
.attach-item .att-icon{
  width:52px;height:52px;border-radius:50%;
  background:rgba(51,144,236,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--tg-blue-light);
}
.attach-item .att-label{
  font-size:11.5px;color:var(--text-2);margin-top:8px;font-weight:500;
}

/* ═══════ DIALOG ═══════ */
.dialog-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.6);
  z-index:2500;display:none;
  align-items:center;justify-content:center;padding:24px;
}
.dialog-overlay.active{display:flex;}
.dialog-content{
  background:var(--bg-2);
  border-radius:14px;padding:22px;
  width:100%;max-width:340px;
  animation:popIn .18s ease-out;
}

// ═══════════════════════════════════════════════════════════

const CLOUD_NAME = 'dn2mwp1lc';
const UPLOAD_PRESET = 'aura_chat';

/**
 * Upload to Cloudinary. resourceType: 'image' | 'video' | 'raw'
 * Voice notes use 'video' (Cloudinary stores audio under video endpoint).
 */
async function uploadToCloudinary(file, resourceType = 'auto') {
  if (!file) throw new Error('No file');
  console.log('📤 Upload:', file.name, file.type, file.size, 'as', resourceType);

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', UPLOAD_PRESET);
  formData.append('folder', `aura_chat/channels/${channelId}`);

  const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;
  const response = await fetch(url, { method: 'POST', body: formData });

  if (!response.ok) {
    const errText = await response.text();
    console.error('❌ Cloudinary error:', response.status, errText);
    throw new Error(`Upload failed (${response.status})`);
  }
  const data = await response.json();
  console.log('✅ Uploaded:', data.secure_url);
  return data.secure_url;
}

// ═══════════════════════════════════════════════════════════
// STATE

let deletingMessageId = null;

let audioPlayers = {};

// DOM
const $ = id => document.getElementById(id);

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function showToast(msg, type = '') {
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 2600);
}

function showUpload(text) {
  uploadLabel.textContent = text || 'Uploading...';
  uploadOverlay.classList.add('active');
}
function hideUpload() {
  uploadOverlay.classList.remove('active');
}

function goToChannelInfo() {

}

function closeModal(id) { $(id).classList.remove('active'); }
function closeDialog(id) { $(id).classList.remove('active'); }

function getUrlParams() {
  const p = new URLSearchParams(window.location.search);
  return { id: p.get('id'), name: p.get('name'), avatar: p.get('avatar') || '' };
}

function checkAuth() {
  const uid = localStorage.getItem('mock_user_id');
  if (uid) { currentUserId = uid; return true; }
  if (auth.currentUser) {
    currentUserId = auth.currentUser.uid;
    localStorage.setItem('mock_user_id', currentUserId);
    return true;
  }
  return false;
}

function escapeHtml(t) {
  if (!t) return '';
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function formatTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatDate(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const msgD = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.floor((today - msgD) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function formatDuration(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

function formatFileSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/(1024*1024)).toFixed(1) + ' MB';
}

function formatViews(n) {
  if (!n || n < 1) return '';
  if (n < 1000) return n.toString();
  if (n < 1000000) return (n/1000).toFixed(1).replace('.0','') + 'K';
  return (n/1000000).toFixed(1).replace('.0','') + 'M';
}

function isVerified(email) {
  if (!email) return false;
  return email.toLowerCase().trim().endsWith('@aurachat.app');
}

async function fetchUserData(uid) {
  if (!uid) return null;
  if (userCache[uid]) return userCache[uid];
  try {
    const doc = await db.collection('users').doc(uid).get();
    if (doc.exists) {
      const d = doc.data();
      const u = {
        uid, username: d.username || 'Unknown',
        display_name: d.display_name || d.username || 'Unknown',
        avatar_url: d.avatar_url || null,
        email: d.email || null,
        is_verified: isVerified(d.email)
      };
      userCache[uid] = u;
      return u;
    }
  } catch(e) {}
  const f = { uid, username:'Unknown', display_name:'Unknown', avatar_url:null, email:null, is_verified:false };
  userCache[uid] = f;
  return f;
}

function fileIconClass(type, name) {
  if (type === 'image') return 'img';
  if (type === 'video') return 'vid';
  if (name) {
    const ext = name.split('.').pop().toLowerCase();
    if (['pdf'].includes(ext)) return 'doc';
    if (['doc','docx','txt','rtf'].includes(ext)) return 'doc';
    if (['zip','rar','7z'].includes(ext)) return 'doc';
  }
  return '';
}
function fileIconFa(type, name) {
  if (type === 'image') return 'fa-image';
  if (type === 'video') return 'fa-video';
  if (name) {
    const ext = name.split('.').pop().toLowerCase();
    if (ext === 'pdf') return 'fa-file-pdf';
    if (['doc','docx'].includes(ext)) return 'fa-file-word';
    if (['xls','xlsx'].includes(ext)) return 'fa-file-excel';
    if (['ppt','pptx'].includes(ext)) return 'fa-file-powerpoint';
    if (['zip','rar','7z'].includes(ext)) return 'fa-file-archive';
    if (['mp3','wav','ogg'].includes(ext)) return 'fa-file-audio';
  }
  return 'fa-file';
}

// ═══════════════════════════════════════════════════════════
// CHANNEL INFO + ROLE
// ═══════════════════════════════════════════════════════════
function subscribeToChannelInfo() {
  if (!channelId) return;
  if (channelUnsub) channelUnsub();

  channelUnsub = db.collection('chats').doc(channelId).onSnapshot((doc) => {
    if (!doc.exists) return;
    const data = doc.data();
    channelName = data.name || channelName;

    if (data.avatar_url) {
      chatAvatarEl.innerHTML = `<img src="${data.avatar_url}" alt="" />`;
    } else {
      chatAvatarEl.innerHTML = `<i class="fas fa-bullhorn"></i>`;
    }
    chatNameEl.textContent = channelName;

    // Pinned message
    if (data.pinned_message) {
      pinnedText.textContent = data.pinned_message.text || 'Media';
      pinnedBar.classList.add('show');
    } else {
      pinnedBar.classList.remove('show');
    }

    // Role
    const participantsData = data.participants_data || {};
    const myData = participantsData[currentUserId] || {};
    myRole = myData.role || 'subscriber';
    const isAdmin = myRole === 'owner' || myRole === 'admin';
    canPost = isAdmin;

    // Mute state
    isMuted = myData.muted || false;
    updateMuteButton();

    // Toggle UI: admins see input, subscribers see mute bar
    if (canPost) {
      inputArea.style.display = 'block';
      subscriberBar.classList.remove('show');
    } else {
      inputArea.style.display = 'none';
      subscriberBar.classList.add('show');
    }

    const memberCount = (data.participants || []).length;
    const subText = `${memberCount} subscriber${memberCount !== 1 ? 's' : ''}`;
    if (chatSubEl.textContent !== 'typing...') {
      chatSubEl.textContent = subText;
      chatSubEl.className = 'chat-sub';
    }
  });
}

function updateMuteButton() {
  if (isMuted) {
    muteBtn.classList.add('muted');
    muteBtn.innerHTML = '<i class="fas fa-bell-slash"></i> <span id="muteLabel">Unmute</span>';
  } else {
    muteBtn.classList.remove('muted');
    muteBtn.innerHTML = '<i class="fas fa-bell"></i> <span id="muteLabel">Mute</span>';
  }
}

async function toggleMute() {
  if (!channelId || !currentUserId) return;
  isMuted = !isMuted;
  updateMuteButton();
  try {
    await db.collection('chats').doc(channelId).update({
      [`participants_data.${currentUserId}.muted`]: isMuted
    });
    showToast(isMuted ? 'Channel muted' : 'Channel unmuted', 'success');
  } catch(e) {
    showToast('Failed to update', 'error');
  }
}

// ═══════════════════════════════════════════════════════════
// LOAD MESSAGES
// ═══════════════════════════════════════════════════════════
function loadMessages() {
  if (!channelId) return;
  if (messagesUnsub) messagesUnsub();

  messagesUnsub = db.collection('chats').doc(channelId)
    .collection('messages')
    .orderBy('created_at', 'desc')
    .limit(150)
    .onSnapshot((snap) => {
      messages = [];
      snap.forEach(doc => {
        const data = doc.data();
        if (data.deleted_for_everyone === true && !data.text) return;
        const df = data.deleted_for || [];
        if (df.includes(currentUserId)) return;
        data.id = doc.id;
        messages.push(data);
      });
      renderMessages();
    }, (err) => {
      console.error('Messages error:', err);
    });
}

// ═══════════════════════════════════════════════════════════
// RENDER MESSAGES (Telegram channel style)
// ═══════════════════════════════════════════════════════════
function renderMessages() {
  const typingEl = typingWrap;
  if (typingEl && typingEl.parentNode) typingEl.remove();

  if (messages.length === 0) {
    messagesContainer.innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--text-3);font-size:13px;">
        <i class="fas fa-bullhorn" style="font-size:36px;opacity:.3;display:block;margin-bottom:14px;"></i>
        No messages yet
      </div>`;
    messagesContainer.appendChild(typingEl || createTypingEl());
    return;
  }

  let html = '';
  let lastDate = null;

  // Reverse so oldest first (newest at bottom)
  const sorted = [...messages].reverse();

  sorted.forEach((msg) => {
    const text = msg.text || msg.content || '';
    const mediaType = msg.media_type || '';
    const mediaUrl = msg.media_url || '';
    const isDeleted = msg.deleted_for_everyone === true;
    const reactions = msg.reactions || {};
    const views = msg.views || 0;
    const isEdited = msg.is_edited === true;

    // Date divider
    const dateKey = formatDate(msg.created_at);
    if (dateKey !== lastDate) {
      lastDate = dateKey;
      html += `<div class="date-divider"><span>${dateKey}</span></div>`;
    }

    // Bubble classes
    const isMediaOnly = (mediaType === 'image' || mediaType === 'video') && !text;
    const bubbleClass = 'msg-bubble' + (isMediaOnly ? ' no-pad' : '');

    html += `<div class="msg-wrap" data-msg-id="${msg.id}">`;
    html += `<div class="${bubbleClass}">`;

    // Forwarded label
    if (msg.forwarded_from) {
      html += `<div class="forwarded-label"><i class="fas fa-share"></i> Forwarded from ${escapeHtml(msg.forwarded_from)}</div>`;
    }

    // Reply preview
    if (msg.reply_to) {
      html += `<div style="padding:5px 10px;margin:2px -4px 6px -4px;background:rgba(51,144,236,0.1);border-left:3px solid var(--tg-blue);border-radius:6px;">
        <div style="font-size:11.5px;font-weight:600;color:var(--tg-blue-light);">${escapeHtml(msg.reply_to_sender || 'Channel')}</div>
        <div style="font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(msg.reply_to_content || 'Media')}</div>
      </div>`;
    }

    // ─── CONTENT ───
    if (isDeleted) {
      html += `<div class="msg-deleted"><i class="fas fa-ban" style="font-size:11px;margin-right:5px;"></i>This message was deleted</div>`;
    } else if (mediaType === 'image' && mediaUrl) {
      html += `<div class="msg-media" onclick="event.stopPropagation();openMediaViewer('image','${mediaUrl}')">
        <img src="${mediaUrl}" loading="lazy" alt="" />
      </div>`;
      if (text) html += `<div class="msg-text" style="padding:0 4px;">${linkify(text)}</div>`;
    } else if (mediaType === 'video' && mediaUrl) {
      html += `<div class="msg-media" onclick="event.stopPropagation();openMediaViewer('video','${mediaUrl}')">
        <video src="${mediaUrl}" preload="metadata" muted playsinline></video>
        <div class="play-overlay"><i class="fas fa-play-circle"></i></div>
      </div>`;
      if (text) html += `<div class="msg-text" style="padding:0 4px;">${linkify(text)}</div>`;
    } else if (mediaType === 'audio' && mediaUrl) {
      html += `<div class="voice-note">
        <button class="play-btn" onclick="event.stopPropagation();playVoiceNote('${msg.id}','${mediaUrl}')">
          <i class="fas fa-play" id="icon-${msg.id}"></i>
        </button>
        <div class="waveform" id="wave-${msg.id}">${generateWaveform(msg.id)}</div>
        <span class="duration">${formatDuration(msg.duration || 0)}</span>
      </div>`;
      if (text) html += `<div class="msg-text" style="padding:2px 0 0 0;">${linkify(text)}</div>`;
    } else if (mediaType === 'file' && mediaUrl) {
      const iconCls = fileIconClass('file', msg.file_name);
      const iconFa = fileIconFa('file', msg.file_name);
      html += `<div class="msg-file" onclick="event.stopPropagation();window.open('${mediaUrl}','_blank')">
        <div class="file-icon-circle ${iconCls}"><i class="fas ${iconFa}"></i></div>
        <div class="file-meta">
          <div class="file-name">${escapeHtml(msg.file_name || 'File')}</div>
          <div class="file-size">${escapeHtml(msg.file_size || '')}</div>
        </div>
      </div>`;
      if (text) html += `<div class="msg-text" style="padding:2px 0 0 0;">${linkify(text)}</div>`;
    } else if (text) {
      html += `<div class="msg-text">${linkify(text)}</div>`;
    }

    // ─── FOOTER (time + views + edited) ───
    if (!isDeleted) {
      html += `<div class="msg-footer">`;
      if (isEdited) html += `<span class="edited">edited</span>`;
      html += `<span>${formatTime(msg.created_at)}</span>`;
      if (views > 0) {
        html += `<span class="views"><i class="fas fa-eye"></i>${formatViews(views)}</span>`;
      }
      html += `</div>`;
    }

    // Reactions
    if (!isDeleted && Object.keys(reactions).length > 0) {
      html += `<div class="msg-reactions">`;
      for (const [emoji, users] of Object.entries(reactions)) {
        if (!users || users.length === 0) continue;
        const mine = users.includes(currentUserId);
        html += `<span class="reaction-pill ${mine ? 'mine' : ''}" 
                       onclick="event.stopPropagation();quickReact('${msg.id}','${emoji}')">
                   ${emoji}<span class="count">${users.length}</span>
                 </span>`;
      }
      html += `</div>`;
    }

    html += `</div></div>`;
  });

  messagesContainer.innerHTML = html;
  messagesContainer.appendChild(typingEl || createTypingEl());
  attachListeners();

  // Scroll to bottom (newest)
  setTimeout(() => {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }, 40);

  // Increment view counts (only for messages not yet viewed)
  incrementViews();
}

function linkify(text) {
  if (!text) return '';
  const esc = escapeHtml(text);
  return esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" onclick="event.stopPropagation()">$1</a>');
}

function createTypingEl() {
  const el = document.createElement('div');
  el.className = 'typing-wrap';
  el.id = 'typingWrap';
  el.innerHTML = `<div class="typing-bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
  return el;
}

function generateWaveform(msgId) {
  let html = '';
  const seed = (msgId || '').split('').reduce((a,c) => a + c.charCodeAt(0), 0);
  for (let i = 0; i < 28; i++) {
    const h = 4 + ((seed * (i+1) * 7) % 16);
    html += `<div class="bar" style="height:${h}px;"></div>`;
  }
  return html;
}

function attachListeners() {
  document.querySelectorAll('.msg-wrap').forEach(w => {
    const bubble = w.querySelector('.msg-bubble');
    if (!bubble) return;
    bubble.addEventListener('click', (e) => {
      e.stopPropagation();
      showMessageOptions(w.dataset.msgId);
    });
  });
}

// Increment view count per message (once per session per message)
async function incrementViews() {
  for (const msg of messages) {
    if (viewedMessages.has(msg.id)) continue;
    viewedMessages.add(msg.id);
    try {
      await db.collection('chats').doc(channelId)
        .collection('messages').doc(msg.id)
        .update({ views: firebase.firestore.FieldValue.increment(1) });
    } catch(e) { /* silent */ }
  }
}

function cancelReply() {
  replyingTo = null;
  replyingToContent = null;
  replyingToSender = null;
  replyBar.classList.remove('show');
}

// ═══════════════════════════════════════════════════════════
// TYPING
// ═══════════════════════════════════════════════════════════
function subscribeToTyping() {
  if (!channelId) return;
  if (typingUnsub) typingUnsub();

  typingUnsub = db.collection('chats').doc(channelId)
    .collection('typing').onSnapshot((snap) => {
      const now = new Date();
      let any = false;
      snap.forEach(doc => {
        if (doc.id === currentUserId) return;
        const d = doc.data();
        if (!d.timestamp || d.is_typing === false) return;
        const t = d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp);
        if ((now - t) / 1000 < 5) any = true;
      });
      if (any) {
        chatSubEl.textContent = 'typing...';
        chatSubEl.className = 'chat-sub typing';
        typingWrap.classList.add('show');
        setTimeout(() => messagesContainer.scrollTop = messagesContainer.scrollHeight, 30);
      } else {
        typingWrap.classList.remove('show');
        if (channelId) {
          db.collection('chats').doc(channelId).get().then(doc => {
            if (doc.exists) {
              const c = (doc.data().participants || []).length;
              chatSubEl.textContent = `${c} subscriber${c !== 1 ? 's' : ''}`;
              chatSubEl.className = 'chat-sub';
            }
          }).catch(() => {});
        }
      }
    });
}

function startTypingPing() {
  if (!channelId || !currentUserId || !canPost) return;
  db.collection('chats').doc(channelId)
    .collection('typing').doc(currentUserId)
    .set({ timestamp: firebase.firestore.FieldValue.serverTimestamp(), is_typing: true })
    .catch(() => {});
  clearTimeout(myTypingTimeout);
  myTypingTimeout = setTimeout(stopTypingPing, 3000);
}

function stopTypingPing() {
  if (!channelId || !currentUserId) return;
  clearTimeout(myTypingTimeout);
  db.collection('chats').doc(channelId)
    .collection('typing').doc(currentUserId)
    .delete().catch(() => {});
}

  const isDeleted = msg.deleted_for_everyone === true;

  }

      <span class="opt-label">Reply</span></div>`;
    html += `<div class="modal-option" onclick="forwardMessage()">

      <span class="opt-label">Pin</span></div>`;

    html += `<div class="modal-option" onclick="openEditDialog()">
      <div class="opt-icon" style="background:rgba(51,144,236,0.15);color:var(--tg-blue-light);"><i class="fas fa-edit"></i></div>

      <div class="opt-icon"><i class="fas fa-trash"></i></div>

async function addReaction(emoji) {
  if (!selectedMessageId) return;
  closeModal('msgOptionsModal');
  await quickReact(selectedMessageId, emoji);
}

async function quickReact(msgId, emoji) {
  try {
    const ref = db.collection('chats').doc(channelId).collection('messages').doc(msgId);
    const doc = await ref.get();
    if (!doc.exists) return;
    const data = doc.data();
    const reactions = data.reactions || {};
    const users = reactions[emoji] || [];

    if (users.includes(currentUserId)) {
      const idx = users.indexOf(currentUserId);
      users.splice(idx, 1);
      if (users.length === 0) delete reactions[emoji];
      else reactions[emoji] = users;
    } else {
      users.push(currentUserId);
      reactions[emoji] = users;
    }
    await ref.update({ reactions });
  } catch(e) { console.error('React error:', e); }
}

// ═══════════════════════════════════════════════════════════
// SEND MESSAGE — FIXED (image / video / file)
// ═══════════════════════════════════════════════════════════
async function sendMessage() {
  if (!canPost) { showToast('Only admins can post', 'error'); return; }
  const text = messageInput.value.trim();
  if (!text && !selectedImage && !selectedVideo && !selectedFile) return;

  const senderName = userCache[currentUserId]?.display_name || 'Channel';
  let mediaUrl = null, mediaType = 'text', fileName = null, fileSize = null;

  try {
    // ── IMAGE ──
    if (selectedImage) {
      showUpload('Uploading image...');
      mediaUrl = await uploadToCloudinary(selectedImage, 'image');
      mediaType = 'image';
      hideUpload();
    }
    // ── VIDEO ──
    else if (selectedVideo) {
      showUpload('Uploading video...');
      mediaUrl = await uploadToCloudinary(selectedVideo, 'video');
      mediaType = 'video';
      fileName = selectedVideo.name;
      hideUpload();
    }
    // ── FILE ──
    else if (selectedFile) {
      showUpload('Uploading file...');
      // Cloudinary raw endpoint for non-image, non-video
      mediaUrl = await uploadToCloudinary(selectedFile, 'raw');
      mediaType = 'file';
      fileName = selectedFile.name;
      fileSize = formatFileSize(selectedFile.size);
      hideUpload();
    }

    const ref = db.collection('chats').doc(channelId).collection('messages').doc();
    await ref.set({
      id: ref.id,
      text: text || null,
      content: text || null,
      media_url: mediaUrl,
      media_type: mediaType,
      file_name: fileName,
      file_size: fileSize,
      sender_id: currentUserId,
      sender_name: senderName,
      reply_to: replyingTo || null,
      reply_to_content: replyingToContent || null,
      reply_to_sender: replyingToSender || null,
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
      is_edited: false,
      deleted_for_everyone: false,
      reactions: {},
      views: 0
    });

    await db.collection('chats').doc(channelId).update({
      last_message: text || (mediaType === 'image' ? '📷 Photo' : mediaType === 'video' ? '🎥 Video' : mediaType === 'file' ? '📎 File' : ''),
      last_message_at: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Reset
    messageInput.value = '';
    selectedImage = null;
    selectedVideo = null;
    selectedFile = null;
    cancelReply();
    onInputChange();
    stopTypingPing();

    if (mediaType !== 'text') showToast('Sent ✓', 'success');
  } catch(e) {
    hideUpload();
    console.error('❌ Send error:', e);
    showToast('Failed: ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════════════════
// VOICE RECORDING
// ═══════════════════════════════════════════════════════════
async function toggleRecording() {
  if (!canPost) { showToast('Only admins can record', 'error'); return; }
  if (isRecording) stopRecordingAndSend();
  else await startRecording();
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
    let mt = '';
    for (const m of mimes) if (MediaRecorder.isTypeSupported(m)) { mt = m; break; }
    recMimeType = mt || 'audio/webm';
    audioChunks = [];

    mediaRecorder = new MediaRecorder(stream, { mimeType: recMimeType });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      if (audioChunks.length === 0) { showToast('No audio', 'error'); return; }
      const blob = new Blob(audioChunks, { type: recMimeType });
      const ext = recMimeType.includes('webm') ? 'webm' : recMimeType.includes('ogg') ? 'ogg' : 'mp4';
      const file = new File([blob], `voice_${Date.now()}.${ext}`, { type: recMimeType });
      await sendVoiceNote(file, recSeconds);
    };

    mediaRecorder.start(100);
    isRecording = true;
    recSeconds = 0;
    recTimerEl.textContent = '00:00';
    recordingBar.classList.add('show');
    micBtn.classList.add('recording');

    recWave.innerHTML = '';
    for (let i = 0; i < 20; i++) {
      const b = document.createElement('div');
      b.className = 'bar';
      b.style.animationDelay = (i * 0.05) + 's';
      recWave.appendChild(b);
    }
    recTimer = setInterval(() => {
      recSeconds++;
      recTimerEl.textContent = formatDuration(recSeconds);
    }, 1000);
  } catch(e) {
    console.error(e);
    showToast('Microphone access denied', 'error');
  }
}

function stopRecordingAndSend() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (recTimer) clearInterval(recTimer);
  recordingBar.classList.remove('show');
  micBtn.classList.remove('recording');
  isRecording = false;
}

function cancelRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.onstop = null;
    mediaRecorder.stop();
    audioChunks = [];
  }
  if (recTimer) clearInterval(recTimer);
  recordingBar.classList.remove('show');
  micBtn.classList.remove('recording');
  isRecording = false;
  recSeconds = 0;
  showToast('Recording cancelled', '');
}

async function sendVoiceNote(file, duration) {
  try {
    showUpload('Sending voice note...');
    const senderName = userCache[currentUserId]?.display_name || 'Channel';
    const url = await uploadToCloudinary(file, 'video'); // Cloudinary stores audio in 'video' endpoint
    hideUpload();

    const ref = db.collection('chats').doc(channelId).collection('messages').doc();
    await ref.set({
      id: ref.id,
      media_url: url,
      media_type: 'audio',
      duration: duration,
      sender_id: currentUserId,
      sender_name: senderName,
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
      is_edited: false,
      deleted_for_everyone: false,
      reactions: {},
      views: 0
    });
    await db.collection('chats').doc(channelId).update({
      last_message: '🎤 Voice message',
      last_message_at: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast('Voice note sent ✓', 'success');
  } catch(e) {
    hideUpload();
    console.error(e);
    showToast('Voice failed: ' + e.message, 'error');
  }
}

function playVoiceNote(msgId, url) {
  const icon = document.getElementById('icon-' + msgId);
  const btn = icon.parentElement;
  const wave = document.getElementById('wave-' + msgId);

  if (audioPlayers[msgId] && !audioPlayers[msgId].paused) {
    audioPlayers[msgId].pause();
    icon.className = 'fas fa-play';
    btn.classList.remove('playing');
    return;
  }
  Object.values(audioPlayers).forEach(p => p.pause());

  if (!audioPlayers[msgId]) {
    audioPlayers[msgId] = new Audio(url);
    audioPlayers[msgId].addEventListener('ended', () => {
      icon.className = 'fas fa-play';
      btn.classList.remove('playing');
      if (wave) wave.querySelectorAll('.bar').forEach(b => b.classList.remove('active'));
    });
    audioPlayers[msgId].addEventListener('timeupdate', () => {
      if (!wave) return;
      const bars = wave.querySelectorAll('.bar');
      const prog = audioPlayers[msgId].currentTime / audioPlayers[msgId].duration;
      const active = Math.floor(prog * bars.length);
      bars.forEach((b, i) => b.classList.toggle('active', i < active));
    });
  }
  audioPlayers[msgId].play();
  icon.className = 'fas fa-pause';
  btn.classList.add('playing');
}

function openMediaViewer(type, url) {
  let content = '';
  if (type === 'image') content = `<img src="${url}" />`;
  else if (type === 'video') content = `<video src="${url}" controls autoplay playsinline></video>`;
  viewerContent.innerHTML = content;
  mediaViewer.classList.add('active');
}

function closeMediaViewer() {
  mediaViewer.classList.remove('active');
  viewerContent.innerHTML = '';
}

function onInputChange() {
  const t = messageInput.value.trim();
  if (t.length > 0) {
    micBtn.classList.add('hide');
    sendBtn.classList.add('show');
  } else {
    micBtn.classList.remove('hide');
    sendBtn.classList.remove('show');
  }
}

function showAttachmentMenu() { $('attachModal').classList.add('active'); }

  }
  emojiTabs.innerHTML = html;
}

function switchEmojiCat(c) { currentEmojiCat = c; renderEmojiTabs(); renderEmojis(); }

function renderEmojis() {
  emojiGrid.innerHTML = emojiCategories[currentEmojiCat].emojis
    .map(e => `<span class="emoji" onclick="insertEmoji('${e}')">${e}</span>`).join('');
}

function insertEmoji(e) {
  messageInput.value += e;
  messageInput.focus();
  onInputChange();
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init() {
  if (!checkAuth()) { window.location.href = 'email_verification.html'; return; }

  const p = getUrlParams();
  channelId = p.id;
  channelName = p.name || 'Channel';
  if (!channelId) return;

  chatNameEl.textContent = channelName;
  if (p.avatar) chatAvatarEl.innerHTML = `<img src="${p.avatar}" />`;

  await fetchUserData(currentUserId);
  loadMessages();
  subscribeToChannelInfo();
  subscribeToTyping();

  window.addEventListener('beforeunload', () => { stopTypingPing(); });
}

document.addEventListener('DOMContentLoaded', () => {
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUserId = user.uid;
      localStorage.setItem('mock_user_id', currentUserId);
      init();
    } else {
      const uid = localStorage.getItem('mock_user_id');
      if (uid) { currentUserId = uid; init(); }
      else window.location.href = 'email_verification.html';
    }
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active, .dialog-overlay.active').forEach(el => el.classList.remove('active'));
    if (showEmojiPicker) { showEmojiPicker = false; emojiPicker.classList.remove('show'); }
    if (mediaViewer.classList.contains('active')) closeMediaViewer();
  }
  if (e.key === 'Enter' && document.activeElement === messageInput) {
    e.preventDefault();
    sendMessage();
  }
});

document.querySelectorAll('.modal-overlay, .dialog-overlay').forEach(el => {
  el.addEventListener('click', (e) => { if (e.target === el) el.classList.remove('active'); });
});
