<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Profile</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 10px;
        }

        #app {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        /* ===== APP BAR ===== */
        .app-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .back-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .app-title {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .edit-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        .edit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .edit-btn .spinner-small {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== PROFILE HEADER ===== */
        .profile-header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.05), transparent);
        }

        .profile-avatar {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto;
        }

        .profile-avatar .avatar-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .profile-avatar .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar .avatar-circle .avatar-fallback {
            font-size: 50px;
            color: rgba(255,255,255,0.5);
        }

        .profile-avatar .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            font-family: 'Inter', sans-serif;
        }

        .profile-avatar .avatar-upload-btn .spinner-small {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .profile-name {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-top: 16px;
        }

        .profile-name .verified-badge {
            color: #1DA1F2;
            font-size: 18px;
        }

        .profile-email {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
        }

        .profile-verified-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(29, 161, 242, 0.15);
            border: 1px solid rgba(29, 161, 242, 0.3);
            border-radius: 20px;
            margin-top: 8px;
            font-size: 12px;
            color: rgba(29, 161, 242, 0.9);
            font-weight: 500;
        }

        .profile-verified-tag i {
            font-size: 12px;
        }

        /* ===== CONTENT ===== */
        .content {
            padding: 16px;
        }

        /* ===== GLASS CARD ===== */
        .glass-card {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 4px 0;
            margin-bottom: 12px;
        }

        .glass-card .card-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
        }

        .glass-card .card-item .item-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: rgba(255,255,255,0.3);
            flex-shrink: 0;
        }

        .glass-card .card-item .item-info {
            flex: 1;
            min-width: 0;
        }

        .glass-card .card-item .item-label {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        .glass-card .card-item .item-value {
            font-size: 16px;
            color: #fff;
            margin-top: 1px;
        }

        .glass-card .card-item .item-value.editing {
            margin: 0;
        }

        .glass-card .card-item .item-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .glass-card .card-item .item-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .glass-card .card-item .item-input.textarea {
            resize: vertical;
            min-height: 60px;
            font-family: 'Inter', sans-serif;
        }

        /* ===== SETTINGS SECTION ===== */
        .section-label {
            font-size: 14px;
            font-weight: 600;
            color: rgba(139, 92, 246, 0.8);
            letter-spacing: 1px;
            padding: 16px 4px 8px 4px;
        }

        .settings-tile {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .settings-tile:hover {
            background: rgba(255,255,255,0.05);
        }

        .settings-tile:active {
            transform: scale(0.98);
        }

        .settings-tile .tile-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #8B5CF6;
            flex-shrink: 0;
            margin-right: 14px;
        }

        .settings-tile .tile-info {
            flex: 1;
            min-width: 0;
        }

        .settings-tile .tile-title {
            font-size: 15px;
            font-weight: 500;
            color: #fff;
        }

        .settings-tile .tile-subtitle {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 1px;
        }

        .settings-tile .tile-arrow {
            color: rgba(255,255,255,0.2);
            font-size: 16px;
        }

        /* ===== DANGER TILE ===== */
        .danger-tile {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(239, 68, 68, 0.1);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .danger-tile:hover {
            background: rgba(239, 68, 68, 0.05);
        }

        .danger-tile:active {
            transform: scale(0.98);
        }

        .danger-tile .tile-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #ef4444;
            flex-shrink: 0;
            margin-right: 14px;
        }

        .danger-tile .tile-info {
            flex: 1;
            min-width: 0;
        }

        .danger-tile .tile-title {
            font-size: 15px;
            font-weight: 500;
            color: #ef4444;
        }

        .danger-tile .tile-subtitle {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 1px;
        }

        .danger-tile .tile-arrow {
            color: rgba(239, 68, 68, 0.2);
            font-size: 16px;
        }

        /* ===== SECTION LABEL DANGER ===== */
        .section-label.danger {
            color: rgba(239, 68, 68, 0.8);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a103c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            z-index: 2000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.5);
            background: rgba(74, 222, 128, 0.1);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a103c;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .modal-title.danger {
            color: #ef4444;
        }

        .modal-text {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .modal-actions button:hover {
            opacity: 0.8;
        }

        .modal-actions .btn-cancel {
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
        }

        .modal-actions .btn-danger {
            background: #ef4444;
            color: #fff;
        }

        .modal-actions .btn-primary {
            background: #8B5CF6;
            color: #fff;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .content {
                padding: 12px;
            }
            .profile-avatar .avatar-circle {
                width: 80px;
                height: 80px;
            }
            .profile-avatar .avatar-upload-btn {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
            .profile-name {
                font-size: 20px;
            }
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- App Bar -->
        <div class="app-bar">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="app-title">Profile</div>
            <button class="edit-btn" id="editBtn" onclick="toggleEdit()">
                <i class="fas fa-edit"></i>
            </button>
        </div>

        <!-- Profile Header -->
        <div class="profile-header" id="profileHeader">
            <div class="profile-avatar">
                <div class="avatar-circle" onclick="pickImage()">
                    <span class="avatar-fallback"><i class="fas fa-user"></i></span>
                </div>
                <button class="avatar-upload-btn" onclick="pickImage()">
                    <i class="fas fa-camera"></i>
                </button>
            </div>
            <div class="profile-name" id="profileName">
                Loading...
                <span class="verified-badge" id="verifiedBadge" style="display:none;">
                    <i class="fas fa-check-circle"></i>
                </span>
            </div>
            <div class="profile-email" id="profileEmail">Loading...</div>
            <div class="profile-verified-tag" id="verifiedTag" style="display:none;">
                <i class="fas fa-check-circle"></i> Verified Account
            </div>
        </div>

        <!-- Content -->
        <div class="content" id="content">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== LOADING OVERLAY ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- ===== MODALS ===== -->

    <!-- Sign Out Modal -->
    <div class="modal-overlay" id="signOutModal">
        <div class="modal-content">
            <div class="modal-title">Sign Out?</div>
            <div class="modal-text">You will need to sign in again.</div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('signOutModal')">Cancel</button>
                <button class="btn-danger" onclick="signOut()">Sign Out</button>
            </div>
        </div>
    </div>

    <!-- Delete Account Modal -->
    <div class="modal-overlay" id="deleteAccountModal">
        <div class="modal-content">
            <div class="modal-title danger">Delete Account?</div>
            <div class="modal-text">This will permanently delete your account and all your data. This action cannot be undone.</div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('deleteAccountModal')">Cancel</button>
                <button class="btn-danger" onclick="deleteAccount()">Delete</button>
            </div>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)" />

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // ─── STATE ─────────────────────────────────────────────────────
        let currentUserId = null;
        let userData = {};
        let isEditing = false;
        let isLoading = false;

        // ─── LOCAL STORAGE HELPERS ──────────────────────────────────
        function getFromLocalStorage(key) {
            try {
                const value = localStorage.getItem(key);
                if (!value) return null;
                try {
                    return JSON.parse(value);
                } catch {
                    return value;
                }
            } catch (e) {
                return null;
            }
        }

        function saveToLocalStorage(key, value) {
            try {
                if (typeof value === 'string') {
                    localStorage.setItem(key, value);
                } else {
                    localStorage.setItem(key, JSON.stringify(value));
                }
            } catch (e) {
                console.warn('Could not save to localStorage:', e);
            }
        }

        function removeFromLocalStorage(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) {}
        }

        // ─── DOM REFS ─────────────────────────────────────────────────
        const profileAvatar = document.querySelector('.avatar-circle');
        const profileName = document.getElementById('profileName');
        const profileEmail = document.getElementById('profileEmail');
        const verifiedBadge = document.getElementById('verifiedBadge');
        const verifiedTag = document.getElementById('verifiedTag');
        const content = document.getElementById('content');
        const toast = document.getElementById('toast');
        const editBtn = document.getElementById('editBtn');

        // ─── TOAST ────────────────────────────────────────────────────
        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ─── NAVIGATION ──────────────────────────────────────────────
        function goBack() {
            window.history.back();
        }

        function navigateTo(page) {
            window.location.href = page + '.html';
        }

        // ─── CHECK AUTH ──────────────────────────────────────────────
        function checkAuth() {
            const userId = getFromLocalStorage('mock_user_id');
            if (userId) {
                currentUserId = userId;
                return true;
            }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                saveToLocalStorage('mock_user_id', currentUserId);
                return true;
            }
            return false;
        }

        // ─── VERIFIED CHECK ──────────────────────────────────────────
        function isVerified(email) {
            if (!email) return false;
            return email.toLowerCase().trim().endsWith('@aurachat.app');
        }

        // ─── LOAD USER DATA ──────────────────────────────────────────
        async function loadUserData() {
            if (!currentUserId) return;

            try {
                const doc = await db.collection('users').doc(currentUserId).get();
                if (doc.exists) {
                    const data = doc.data();
                    userData = {
                        id: currentUserId,
                        displayName: data.display_name || data.username || getFromLocalStorage('mock_display_name') || '',
                        username: data.username || getFromLocalStorage('mock_username') || '',
                        email: data.email || getFromLocalStorage('mock_email') || '',
                        bio: data.bio || getFromLocalStorage('mock_bio') || '',
                        avatarUrl: data.avatar_url || getFromLocalStorage('mock_avatar') || ''
                    };
                } else {
                    userData = {
                        id: currentUserId,
                        displayName: getFromLocalStorage('mock_display_name') || '',
                        username: getFromLocalStorage('mock_username') || '',
                        email: getFromLocalStorage('mock_email') || '',
                        bio: getFromLocalStorage('mock_bio') || '',
                        avatarUrl: getFromLocalStorage('mock_avatar') || ''
                    };
                }
                updateProfileUI();
                render();
            } catch (e) {
                console.error('Error loading user data:', e);
                showToast('Error loading profile', 'error');
            }
        }

        // ─── UPDATE PROFILE UI ──────────────────────────────────────
        function updateProfileUI() {
            const displayName = userData.displayName || userData.username || 'Your Name';
            const email = userData.email || 'No email set';
            const avatarUrl = userData.avatarUrl;
            const verified = isVerified(email);

            // Avatar
            if (avatarUrl) {
                profileAvatar.innerHTML = `<img src="${avatarUrl}" alt="${displayName}" onerror="this.parentElement.innerHTML='<span class=\\'avatar-fallback\\'><i class=\\'fas fa-user\\'></i></span>'" />`;
            } else {
                profileAvatar.innerHTML = `<span class="avatar-fallback"><i class="fas fa-user"></i></span>`;
            }

            // Name
            profileName.innerHTML = `
                ${displayName}
                ${verified ? '<span class="verified-badge"><i class="fas fa-check-circle"></i></span>' : ''}
            `;

            // Email
            profileEmail.textContent = email;

            // Verified tag
            verifiedTag.style.display = verified ? 'inline-flex' : 'none';
            verifiedBadge.style.display = verified ? 'inline' : 'none';
        }

        // ─── RENDER ───────────────────────────────────────────────────
        function render() {
            const displayName = userData.displayName || userData.username || 'Your Name';

            content.innerHTML = `
                <!-- Info Cards -->
                <div class="glass-card">
                    <div class="card-item">
                        <div class="item-icon" style="color: #8B5CF6;">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-label">Name</div>
                            ${isEditing ? `
                                <input class="item-input" id="nameInput" value="${escapeHtml(userData.displayName || userData.username || '')}" placeholder="Your name" />
                            ` : `
                                <div class="item-value">${escapeHtml(displayName)}</div>
                            `}
                        </div>
                    </div>
                </div>

                <div class="glass-card">
                    <div class="card-item">
                        <div class="item-icon" style="color: #06B6D4;">
                            <i class="fas fa-info-circle"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-label">Bio</div>
                            ${isEditing ? `
                                <textarea class="item-input textarea" id="bioInput" placeholder="Tell us about yourself">${escapeHtml(userData.bio || '')}</textarea>
                            ` : `
                                <div class="item-value">${escapeHtml(userData.bio || 'No bio yet')}</div>
                            `}
                        </div>
                    </div>
                </div>

                <div class="glass-card">
                    <div class="card-item">
                        <div class="item-icon" style="color: rgba(139,92,246,0.8);">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-label">Email</div>
                            <div class="item-value">${escapeHtml(userData.email || 'Not set')}</div>
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <div class="section-label">Settings</div>

                <a href="privacy_settings.html" class="settings-tile">
                    <div class="tile-icon"><i class="fas fa-shield-alt"></i></div>
                    <div class="tile-info">
                        <div class="tile-title">Privacy</div>
                        <div class="tile-subtitle">Control who can see your info</div>
                    </div>
                    <div class="tile-arrow"><i class="fas fa-chevron-right"></i></div>
                </a>

                <a href="security.html" class="settings-tile">
                    <div class="tile-icon"><i class="fas fa-lock"></i></div>
                    <div class="tile-info">
                        <div class="tile-title">Security</div>
                        <div class="tile-subtitle">Passcode and biometric lock</div>
                    </div>
                    <div class="tile-arrow"><i class="fas fa-chevron-right"></i></div>
                </a>

                <a href="notifications_settings.html" class="settings-tile">
                    <div class="tile-icon"><i class="fas fa-bell"></i></div>
                    <div class="tile-info">
                        <div class="tile-title">Notifications</div>
                        <div class="tile-subtitle">Message tones and alerts</div>
                    </div>
                    <div class="tile-arrow"><i class="fas fa-chevron-right"></i></div>
                </a>

                <!-- Danger Zone -->
                <div class="section-label danger">Danger Zone</div>

                <div class="danger-tile" onclick="showDeleteAccountModal()">
                    <div class="tile-icon"><i class="fas fa-trash-alt"></i></div>
                    <div class="tile-info">
                        <div class="tile-title">Delete Account</div>
                        <div class="tile-subtitle">Permanently delete your account and all your data</div>
                    </div>
                    <div class="tile-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>

                <div class="danger-tile" onclick="showSignOutModal()">
                    <div class="tile-icon"><i class="fas fa-sign-out-alt"></i></div>
                    <div class="tile-info">
                        <div class="tile-title">Sign Out</div>
                    </div>
                    <div class="tile-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>
            `;

            // Update edit button
            if (isEditing) {
                editBtn.innerHTML = `<i class="fas fa-check"></i>`;
                editBtn.onclick = saveProfile;
            } else {
                editBtn.innerHTML = `<i class="fas fa-edit"></i>`;
                editBtn.onclick = toggleEdit;
            }
        }

        // ─── TOGGLE EDIT ─────────────────────────────────────────────
        function toggleEdit() {
            isEditing = !isEditing;
            render();
            if (isEditing) {
                setTimeout(() => {
                    const nameInput = document.getElementById('nameInput');
                    if (nameInput) nameInput.focus();
                }, 300);
            }
        }

        // ─── SAVE PROFILE ────────────────────────────────────────────
        async function saveProfile() {
            const nameInput = document.getElementById('nameInput');
            const bioInput = document.getElementById('bioInput');

            const name = nameInput ? nameInput.value.trim() : userData.displayName;
            const bio = bioInput ? bioInput.value.trim() : userData.bio;

            if (!name) {
                showToast('Please enter a name', 'error');
                return;
            }

            setLoading(true);

            try {
                await db.collection('users').doc(currentUserId).set({
                    display_name: name,
                    username: name.toLowerCase().replace(/\s/g, '_'),
                    bio: bio || '',
                    updated_at: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                userData.displayName = name;
                userData.username = name.toLowerCase().replace(/\s/g, '_');
                userData.bio = bio || '';
                saveToLocalStorage('mock_display_name', name);
                saveToLocalStorage('mock_username', name.toLowerCase().replace(/\s/g, '_'));
                saveToLocalStorage('mock_bio', bio || '');

                isEditing = false;
                setLoading(false);
                updateProfileUI();
                render();
                showToast('Profile updated', 'success');

            } catch (e) {
                console.error('Save profile error:', e);
                setLoading(false);
                showToast('Failed to update profile: ' + e.message, 'error');
            }
        }

        // ─── PICK IMAGE ──────────────────────────────────────────────
        function pickImage() {
            document.getElementById('imageInput').click();
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            setLoading(true);

            try {
                const storageRef = storage.ref();
                const path = `aurachat/profiles/${currentUserId}/${Date.now()}_${file.name}`;
                const fileRef = storageRef.child(path);
                await fileRef.put(file);
                const downloadUrl = await fileRef.getDownloadURL();

                await db.collection('users').doc(currentUserId).set({
                    avatar_url: downloadUrl,
                    updated_at: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                userData.avatarUrl = downloadUrl;
                saveToLocalStorage('mock_avatar', downloadUrl);

                setLoading(false);
                updateProfileUI();
                render();
                showToast('Profile photo updated', 'success');

            } catch (e) {
                console.error('Upload error:', e);
                setLoading(false);
                showToast('Failed to upload photo: ' + e.message, 'error');
            }

            event.target.value = '';
        }

        // ─── SET LOADING ─────────────────────────────────────────────
        function setLoading(loading) {
            isLoading = loading;
            const overlay = document.getElementById('loadingOverlay');
            if (loading) {
                overlay.classList.add('active');
                editBtn.disabled = true;
            } else {
                overlay.classList.remove('active');
                editBtn.disabled = false;
            }
        }

        // ─── SIGN OUT ─────────────────────────────────────────────────
        function showSignOutModal() {
            openModal('signOutModal');
        }

        async function signOut() {
            closeModal('signOutModal');
            setLoading(true);

            try {
                await auth.signOut();
                localStorage.clear();
                setLoading(false);
                window.location.href = 'email_verification.html';
            } catch (e) {
                console.error('Sign out error:', e);
                setLoading(false);
                showToast('Error signing out', 'error');
            }
        }

        // ─── DELETE ACCOUNT ──────────────────────────────────────────
        function showDeleteAccountModal() {
            openModal('deleteAccountModal');
        }

        async function deleteAccount() {
            closeModal('deleteAccountModal');
            setLoading(true);

            try {
                await db.collection('users').doc(currentUserId).delete();
                const user = auth.currentUser;
                if (user) {
                    await user.delete();
                }
                localStorage.clear();
                setLoading(false);
                window.location.href = 'email_verification.html';
            } catch (e) {
                console.error('Delete account error:', e);
                setLoading(false);
                showToast('Failed to delete account: ' + e.message, 'error');
            }
        }

        // ─── MODAL HELPERS ───────────────────────────────────────────
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });

        // ─── UTILITY ──────────────────────────────────────────────────
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ─── KEYBOARD SHORTCUTS ──────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active').forEach(el => {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                });
                if (isEditing) {
                    isEditing = false;
                    render();
                }
            }
            if (e.key === 'Enter' && isEditing) {
                const nameInput = document.getElementById('nameInput');
                if (nameInput && document.activeElement === nameInput) {
                    saveProfile();
                }
            }
        });

        // ─── INIT ─────────────────────────────────────────────────────
        async function init() {
            if (!checkAuth()) {
                showToast('Please login first', 'error');
                setTimeout(() => {
                    window.location.href = 'email_verification.html';
                }, 1500);
                return;
            }

            await loadUserData();

            console.log('👤 Profile Screen loaded');
            console.log('👤 User:', currentUserId);
            console.log('📧 Email:', userData.email);
            console.log('📝 Name:', userData.displayName);
        }

        // ─── START ────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    saveToLocalStorage('mock_user_id', user.uid);
                    init();
                } else {
                    const userId = getFromLocalStorage('mock_user_id');
                    if (userId) {
                        currentUserId = userId;
                        init();
                    } else {
                        window.location.href = 'email_verification.html';
                    }
                }
            });
        });

        console.log('👤 AURA Chat — Profile');
        console.log('🔗 Firebase Project:', firebaseConfig.projectId);
    </script>

</body>
</html>
