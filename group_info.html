<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AURA - Group Info</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0A0A0F; color: #fff; min-height: 100vh; overflow-x: hidden; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.4); border-radius: 10px; }
#app { min-height: 100vh; background: radial-gradient(ellipse at 20% 50%, rgba(139,92,246,0.08) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(6,182,212,0.06) 0%, transparent 50%), #0A0A0F; max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
.app-bar { position: sticky; top: 0; z-index: 100; background: rgba(10,10,15,0.85); backdrop-filter: blur(10px); padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.back-btn { background: none; border: none; color: rgba(255,255,255,0.7); font-size: 18px; padding: 6px; cursor: pointer; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
.app-title { flex: 1; font-size: 16px; font-weight: 600; color: #fff; }
.app-actions { display: flex; gap: 2px; }
.app-actions button { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 15px; padding: 6px; cursor: pointer; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
.content { padding: 16px; overflow-y: auto; }

.profile-header { text-align: center; padding: 8px 0 16px 0; }
.profile-avatar { position: relative; width: 80px; height: 80px; margin: 0 auto; }
.profile-avatar .avatar-circle { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg,#8B5CF6,#06B6D4); display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff; }
.profile-avatar .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.profile-avatar .avatar-upload-btn { position: absolute; bottom: 0; right: 0; width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#8B5CF6,#06B6D4); border: none; color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.profile-name { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 20px; font-weight: 700; color: #fff; margin-top: 12px; }
.profile-name .verified-badge { color: #1DA1F2; font-size: 16px; }
.profile-name .edit-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 20px; font-weight: 700; text-align: center; padding: 8px 16px; outline: none; width: 80%; font-family: 'Inter', sans-serif; }
.profile-desc { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 4px; }
.profile-desc .edit-textarea { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: rgba(255,255,255,0.8); font-size: 14px; text-align: center; padding: 8px 16px; outline: none; width: 80%; resize: vertical; min-height: 60px; font-family: 'Inter', sans-serif; margin-top: 4px; }
.profile-meta { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }

.action-row { display: flex; gap: 8px; margin: 16px 0 24px 0; }
.action-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid rgba(139,92,246,0.3); background: rgba(139,92,246,0.1); cursor: pointer; text-align: center; }
.action-btn .btn-icon { font-size: 18px; color: #8B5CF6; }
.action-btn .btn-label { font-size: 11px; font-weight: 500; color: #8B5CF6; margin-top: 3px; }
.action-btn.danger { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.08); }
.action-btn.danger .btn-icon, .action-btn.danger .btn-label { color: #ef4444; }
.action-btn.danger-dark { border-color: rgba(185,28,28,0.3); background: rgba(185,28,28,0.08); }
.action-btn.danger-dark .btn-icon, .action-btn.danger-dark .btn-label { color: #b91c1c; }

.shortlink-card { padding: 14px; border-radius: 16px; background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(6,182,212,0.06)); border: 1px solid rgba(139,92,246,0.25); margin-bottom: 16px; }
.shortlink-card .sl-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.shortlink-card .sl-header .sl-title { flex: 1; font-size: 12px; font-weight: 700; color: #8B5CF6; text-transform: uppercase; letter-spacing: 0.6px; display: flex; align-items: center; gap: 6px; }
.shortlink-card .sl-header .sl-action { padding: 4px 10px; border-radius: 6px; border: none; background: rgba(139,92,246,0.15); color: #8B5CF6; font-size: 10.5px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 4px; }
.shortlink-card .slug-display { padding: 12px 14px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 8px; }
.shortlink-card .slug-display .slug-prefix { font-size: 11px; color: rgba(255,255,255,0.4); font-family: ui-monospace, Menlo, monospace; }
.shortlink-card .slug-display .slug-value { flex: 1; font-size: 14px; font-weight: 700; color: #8B5CF6; font-family: ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shortlink-card .slug-display .slug-copy { color: rgba(255,255,255,0.4); font-size: 13px; }
.shortlink-card .slug-actions { display: flex; gap: 6px; }
.shortlink-card .slug-actions button { flex: 1; padding: 8px; border-radius: 8px; font-size: 11.5px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; border: none; }
.shortlink-card .slug-actions .primary { background: linear-gradient(135deg,#8B5CF6,#06B6D4); color: #fff; }
.shortlink-card .slug-actions .secondary { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.08); }

.section-title { font-size: 13px; font-weight: 600; color: rgba(139,92,246,0.8); letter-spacing: 1px; margin: 16px 0 10px 0; text-transform: uppercase; }
.setting-group { padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 16px; }
.setting-item { display: flex; align-items: center; padding: 10px 0; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
.setting-item:last-child { border-bottom: none; }
.setting-item .si-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(139,92,246,0.1); color: #8B5CF6; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.setting-item .si-info { flex: 1; min-width: 0; }
.setting-item .si-label { font-size: 13.5px; color: #fff; font-weight: 500; }
.setting-item .si-sub { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }
.setting-item .si-value { font-size: 13px; color: rgba(255,255,255,0.6); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.setting-item .si-value .chevron { color: rgba(255,255,255,0.3); font-size: 12px; }
.setting-item .si-badge { padding: 3px 9px; border-radius: 8px; background: rgba(239,68,68,0.15); color: #ef4444; font-size: 11px; font-weight: 700; }

.member-item { display: flex; align-items: center; padding: 8px 0; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; }
.member-item:last-child { border-bottom: none; }
.member-item .member-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg,#8B5CF6,#06B6D4); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; flex-shrink: 0; }
.member-item .member-avatar img { width: 100%; height: 100%; object-fit: cover; }
.member-item .member-info { flex: 1; min-width: 0; }
.member-item .member-name { font-size: 14px; color: #fff; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.member-item .member-name .you-tag { font-size: 11px; color: rgba(255,255,255,0.3); font-weight: 400; }
.member-item .member-role { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
.member-item .member-role.owner { color: #f59e0b; }
.member-item .member-role.admin { color: #8B5CF6; }
.member-item .member-more { color: rgba(255,255,255,0.2); padding: 4px 6px; cursor: pointer; background: none; border: none; font-size: 14px; }
.member-tag { font-size: 9px; padding: 1px 6px; border-radius: 8px; background: rgba(139,92,246,0.2); color: #8B5CF6; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
.member-tag.owner { background: rgba(251,191,36,0.2); color: #FBBF24; }
.member-tag.admin { background: rgba(139,92,246,0.2); color: #8B5CF6; }
.member-tag.mod { background: rgba(6,182,212,0.2); color: #06B6D4; }
.member-tag.vip { background: rgba(236,72,153,0.2); color: #EC4899; }
.member-tag.restricted { background: rgba(239,68,68,0.2); color: #ef4444; }
.member-tag.member { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }
</style>
</head>
<body>

<div id="app">
    <div class="app-bar">
        <button class="back-btn" onclick="window.location.href='group.html?id=' + chatId"><i class="fas fa-arrow-left"></i></button>
        <div class="app-title" id="appTitle">Group Info</div>
        <div class="app-actions" id="appActions"></div>
    </div>
    <div class="content" id="content">
        <div style="display:flex;align-items:center;justify-content:center;min-height:200px;padding:40px;"><div style="width:36px;height:36px;border:3px solid rgba(139,92,246,0.15);border-top-color:#8B5CF6;border-radius:50%;animation:spin 0.8s linear infinite;"></div></div>
    </div>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<div class="toast" id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(26,16,60,0.95);color:#fff;padding:8px 18px;border-radius:10px;border:1px solid rgba(255,255,255,0.05);font-size:12px;z-index:2000;display:none;max-width:90%;text-align:center;"></div>

<div id="memberModal" class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:rgba(26,16,60,0.98);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;padding:16px 18px 18px 18px;overflow-y:auto;">
        <div style="width:32px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin:0 auto 10px;"></div>
        <div id="memberModalTitle" style="font-size:16px;font-weight:600;color:#fff;text-align:center;margin-bottom:12px;">Member</div>
        <div id="memberOptions"></div>
    </div>
</div>

<div id="adminPermsModal" class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:rgba(26,16,60,0.98);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;padding:16px 18px 18px 18px;overflow-y:auto;">
        <div style="width:32px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin:0 auto 10px;"></div>
        <div id="adminPermsTitle" style="font-size:16px;font-weight:600;color:#fff;text-align:center;margin-bottom:12px;">Admin Permissions</div>
        <div id="adminPermsList"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,0.4);font-family:Inter,sans-serif;" onclick="closeModal('adminPermsModal')">Cancel</button>
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#8B5CF6;color:#fff;font-family:Inter,sans-serif;" onclick="saveAdminPerms()">Save</button>
        </div>
    </div>
</div>

<div id="tagModal" class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:rgba(26,16,60,0.98);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;padding:16px 18px 18px 18px;overflow-y:auto;">
        <div style="width:32px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin:0 auto 10px;"></div>
        <div id="tagModalTitle" style="font-size:16px;font-weight:600;color:#fff;text-align:center;margin-bottom:12px;">Set Tag</div>
        <div id="tagPicker" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;"></div>
        <input id="customTagInput" placeholder="Custom tag (optional)" maxlength="20" style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#fff;font-size:14px;font-family:Inter,sans-serif;outline:none;margin-bottom:12px;" />
        <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,0.4);font-family:Inter,sans-serif;" onclick="closeModal('tagModal')">Cancel</button>
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#ef4444;color:#fff;font-family:Inter,sans-serif;" onclick="removeTag()">Remove</button>
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#8B5CF6;color:#fff;font-family:Inter,sans-serif;" onclick="saveTag()">Save</button>
        </div>
    </div>
</div>

<div id="restrictModal" class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:rgba(26,16,60,0.98);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;padding:16px 18px 18px 18px;overflow-y:auto;">
        <div style="width:32px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin:0 auto 10px;"></div>
        <div id="restrictTitle" style="font-size:16px;font-weight:600;color:#fff;text-align:center;margin-bottom:12px;">Restrict Member</div>
        <div id="restrictOptions"></div>
        <div style="font-size:11px;font-weight:700;color:#8B5CF6;text-transform:uppercase;letter-spacing:0.6px;margin:14px 0 8px;">Duration</div>
        <div id="restrictDuration" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,0.4);font-family:Inter,sans-serif;" onclick="closeModal('restrictModal')">Cancel</button>
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#ef4444;color:#fff;font-family:Inter,sans-serif;" onclick="saveRestriction()">Apply</button>
        </div>
    </div>
</div>

<div id="joinsModal" class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:rgba(26,16,60,0.98);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;padding:16px 18px 18px 18px;overflow-y:auto;">
        <div style="width:32px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin:0 auto 10px;"></div>
        <div style="font-size:16px;font-weight:600;color:#fff;text-align:center;margin-bottom:12px;">Join Requests</div>
        <div id="joinsList"></div>
    </div>
</div>

<div id="slowModeModal" class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:rgba(26,16,60,0.98);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:16px 18px 18px 18px;">
        <div style="width:32px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin:0 auto 10px;"></div>
        <div style="font-size:16px;font-weight:600;color:#fff;text-align:center;margin-bottom:12px;">Slow Mode</div>
        <div id="slowModeChips" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,0.4);font-family:Inter,sans-serif;" onclick="closeModal('slowModeModal')">Cancel</button>
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#8B5CF6;color:#fff;font-family:Inter,sans-serif;" onclick="saveSlowMode()">Save</button>
        </div>
    </div>
</div>

<div id="selfDestructModal" class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:rgba(26,16,60,0.98);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:16px 18px 18px 18px;">
        <div style="width:32px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin:0 auto 10px;"></div>
        <div style="font-size:16px;font-weight:600;color:#fff;text-align:center;margin-bottom:12px;">Self-Destruct Timer</div>
        <div id="selfDestructChips" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,0.4);font-family:Inter,sans-serif;" onclick="closeModal('selfDestructModal')">Cancel</button>
            <button style="padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#8B5CF6;color:#fff;font-family:Inter,sans-serif;" onclick="saveSelfDestruct()">Save</button>
        </div>
    </div>
</div>

<div id="slugModal" class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:rgba(26,16,60,0.98);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:16px 18px 18px 18px;">
        <div style="width:32px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin:0 auto 10px;"></div>
        <div style="font-size:16px;font-weight:600;color:#fff;text-align:center;margin-bottom:12px;">Edit Short Link</div>
        <div style="display:flex;margin-bottom:12px;">
            <div style="padding:10px 12px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);border-right:none;border-radius:10px 0 0 10px;color:rgba(255,255,255,0.4);font-size:12px;font-family:ui-monospace,Menlo,monospace;display:flex;align-items:center;white-space:nowrap;">aurachat.vercel.app/</div>
            <input id="slugInput" placeholder="my-group" maxlength="30" autocomplete="off" oninput="onSlugInput()" style="flex:1;padding:10px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:0 10px 10px 0;color:#fff;font-size:14px;font-family:ui-monospace,Menlo,monospace;outline:none;" />
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4);line-height:1.5;margin-bottom:12px;">Lowercase letters, numbers, hyphens. 3–30 chars.</div>
        <div style="display:flex;gap:8px;">
            <button style="flex:1;padding:10px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,0.4);font-family:Inter,sans-serif;" onclick="closeModal('slugModal')">Cancel</button>
            <button style="flex:2;padding:10px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#8B5CF6;color:#fff;font-family:Inter,sans-serif;" onclick="saveSlug()">Save</button>
        </div>
    </div>
</div>

<div id="logModal" class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;">
    <div style="background:rgba(26,16,60,0.98);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;padding:16px 18px 18px 18px;overflow-y:auto;">

async function fetchUser(uid) {

    userCache[uid] = fb;
    return fb;
}
async function loadMyNicknames() {

async function renderMembers() {
    if (!channelData) return;
    const members = channelData.participants || [];
    const participantsData = channelData.participants_data || {};
    const memberTags = channelData.member_tags || {};
    const restrictions = channelData.restrictions || {};

    await Promise.all(members.map(function(uid) { return fetchUser(uid); }));

    const users = members.map(function(uid) { return userCache[uid] || { uid: uid, display_name: 'Unknown' }; });
    const roleOrder = { owner: 0, admin: 1, member: 2 };
    users.sort(function(a, b) {
        const ra = (participantsData[a.uid] && participantsData[a.uid].role) || (a.uid === channelData.created_by ? 'owner' : admins.indexOf(a.uid) >= 0 ? 'admin' : 'member');
        const rb = (participantsData[b.uid] && participantsData[b.uid].role) || (b.uid === channelData.created_by ? 'owner' : admins.indexOf(b.uid) >= 0 ? 'admin' : 'member');
        return (roleOrder[ra] || 3) - (roleOrder[rb] || 3);
    });

    let html = '';
    users.forEach(function(u) {
        const uid = u.uid;
        const isMe = uid === currentUserId;
        const name = getDisplayName(uid);
        const avatarUrl = u.avatar_url;
        const role = (participantsData[uid] && participantsData[uid].role) || (uid === channelData.created_by ? 'owner' : admins.indexOf(uid) >= 0 ? 'admin' : 'member');
        const roleLabels = { owner:'Owner', admin:'Admin', member:'Member' };
        const roleClass = role === 'owner' ? 'owner' : role === 'admin' ? 'admin' : '';
        const tag = memberTags[uid];
        const tagKey = tag ? tag.toLowerCase() : '';
        const tagClass = tagKey === 'owner' ? 'owner' : tagKey === 'admin' ? 'admin' : (tagKey === 'mod' || tagKey === 'moderator') ? 'mod' : tagKey === 'vip' ? 'vip' : 'member';
        const isRestricted = restrictions[uid] && (!restrictions[uid].until || !restrictions[uid].until.toDate || restrictions[uid].until.toDate() > new Date());
        const avatarHtml = avatarUrl ? '<img src="' + avatarUrl + '" />' : (name || 'U')[0].toUpperCase();

        html += '<div class="member-item" onclick="' + (!isMe ? 'viewProfile(\'' + uid + '\')' : '') + '">';
        html += '<div class="member-avatar">' + avatarHtml + '</div>';
        html += '<div class="member-info"><div class="member-name">' + escapeHtml(name);

        html += '</div>';

function viewProfile(uid) { window.location.href = 'public_profile.html?userId=' + uid; }

function showMemberOptions(uid) {
    const modal = document.getElementById('memberModal');

    document.getElementById('memberModalTitle').textContent = isMe ? 'My Options' : getDisplayName(uid);

    const role = (participantsData[uid] && participantsData[uid].role) || 'member';
    const tags = channelData.member_tags || {};
    const restrictions = channelData.restrictions || {};
    const isRestricted = restrictions[uid] && (!restrictions[uid].until || !restrictions[uid].until.toDate || restrictions[uid].until.toDate() > new Date());
    const canManageAdmins = myRole === 'owner' || hasPerm('manage_admins');
    const canBan = myRole === 'owner' || hasPerm('ban_users');
    const canTag = isMe || myRole === 'owner' || hasPerm('manage_info');

    let html = '';

        html += '<div onclick="openTagModal(\'' + uid + '\')" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;"><div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:10px;font-size:14px;background:rgba(6,182,212,0.15);color:#06B6D4;"><i class="fas fa-tag"></i></div><span style="color:#fff;font-size:13px;">' + tagLabel + '</span></div>';
    }

function onSlugInput() { const i = document.getElementById('slugInput'); i.value = i.value.toLowerCase().replace(/[^a-z0-9-]/g, '').substring(0, 30); }
async function saveSlug() {
    const newSlug = document.getElementById('slugInput').value.trim();
    if (!newSlug || newSlug.length < 3) { showToast('Min 3 chars', 'error'); return; }

    try {
        /* check if code taken */
        const existing = await db.collection('invitations')
            .where('code', '==', newSlug)
            .where('is_active', '==', true)
            .limit(1).get();
        if (!existing.empty) { showToast('This link is taken', 'error'); return; }

        /* deactivate old invitation for this chat if any */
        const oldSnap = await db.collection('invitations')
            .where('chat_id', '==', chatId)
            .where('is_active', '==', true)
            .get();
        const batch = db.batch();
        oldSnap.forEach(doc => batch.update(doc.ref, { is_active: false, revoked_at: firebase.firestore.FieldValue.serverTimestamp() }));

        /* create new invitation */
        const ref = db.collection('invitations').doc();
        batch.set(ref, {
            id: ref.id,
            chat_id: chatId,
            chat_name: chatData.name || chatName,
            chat_type: chatType,
            code: newSlug,
            link: 'https://' + SHORT_DOMAIN + '/join/' + newSlug,
            created_by: currentUserId,
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
            expires_at: null,
            max_uses: null,
            used_count: 0,
            is_active: true
        });
        batch.update(db.collection('chats').doc(chatId), {
            invitation: {
                code: newSlug,
                link: 'https://' + SHORT_DOMAIN + '/join/' + newSlug,
                enabled: true
            }
        });
        await batch.commit();

        showToast('Link saved', 'success');
        closeModal('slugModal');
    } catch(e) { showToast('Failed: ' + e.message, 'error'); }
}

    const wrap = document.getElementById('logList');
    wrap.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.3);">Loading...</div>';
    document.getElementById('logModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    try {
        const snap = await db.collection('chats').doc(chatId).collection('adminLog').orderBy('timestamp', 'desc').limit(100).get();
        if (snap.empty) { wrap.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.3);">No actions yet</div>'; return; }
        const icons = { pin:{i:'fa-thumbtack',c:'#8B5CF6'}, unpin:{i:'fa-thumbtack',c:'#888'}, delete:{i:'fa-trash',c:'#ef4444'}, slow_mode:{i:'fa-clock',c:'#FBBF24'}, self_destruct:{i:'fa-bomb',c:'#ef4444'}, tag:{i:'fa-tag',c:'#06B6D4'}, restrict:{i:'fa-gavel',c:'#ef4444'}, unrestrict:{i:'fa-gavel',c:'#4ADE80'}, permission:{i:'fa-user-shield',c:'#8B5CF6'}, approve_join:{i:'fa-user-check',c:'#4ADE80'}, reject_join:{i:'fa-user-times',c:'#ef4444'}, slug:{i:'fa-link',c:'#8B5CF6'}, join_mode:{i:'fa-door-open',c:'#8B5CF6'}, invite_users:{i:'fa-user-plus',c:'#4ADE80'}, ban_users:{i:'fa-ban',c:'#ef4444'} };
        let html = '';
        snap.forEach(function(doc) {
            const d = doc.data();
            const ico = icons[d.action] || { i: 'fa-circle-info', c: '#8B5CF6' };
            const ts = d.timestamp ? formatDate(d.timestamp) : '';
            html += '<div style="padding:10px 12px;background:rgba(255,255,255,0.03);border-radius:10px;margin-bottom:6px;display:flex;gap:10px;"><div style="width:30px;height:30px;border-radius:50%;background:rgba(139,92,246,0.15);color:' + ico.c + ';display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;"><i class="fas ' + ico.i + '"></i></div><div style="flex:1;"><div style="font-size:12.5px;color:#fff;line-height:1.4;"><b>' + escapeHtml(d.actor_name || 'Someone') + '</b> ' + escapeHtml(d.details || d.action) + '</div><div style="font-size:10px;color:rgba(255,255,255,0.35);margin-top:3px;">' + ts + '</div></div></div>';
        });
        wrap.innerHTML = html;
    } catch(e) { wrap.innerHTML = '<div style="text-align:center;padding:20px;">Failed</div>'; }
}
async function logAdminAction(action, details) {
    try { await db.collection('chats').doc(chatId).collection('adminLog').add({ action: action, details: details || '', actor_id: currentUserId, actor_name: getDisplayName(currentUserId), timestamp: firebase.firestore.FieldValue.serverTimestamp() }); } catch(e) {}
}

function showSettingsModal() {
    const s = channelData.settings || {};
    const toggles = [
        { k:'chat_disabled', l:'Disable Chat', sub:'Only admins can send messages', v: s.chat_disabled },
        { k:'file_sharing_disabled', l:'Disable File Sharing', sub:'Prevent sending files', v: s.file_sharing_disabled },
        { k:'polls_enabled', l:'Polls Enabled', v: s.polls_enabled !== false },
        { k:'reactions_enabled', l:'Reactions Enabled', v: s.reactions_enabled !== false },
        { k:'forwarding_enabled', l:'Allow Forwarding', v: s.forwarding_enabled !== false }
    ];
    let html = '';
    toggles.forEach(function(t) {
        html += '<label style="display:flex;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.02);margin-bottom:6px;cursor:pointer;"><input type="checkbox" ' + (t.v ? 'checked' : '') + ' onchange="updateSetting(\'' + t.k + '\', this.checked)" style="margin-right:12px;width:18px;height:18px;accent-color:#8B5CF6;" /><div style="flex:1;"><div style="font-size:13.5px;color:#fff;">' + t.l + '</div>';
        if (t.sub) html += '<div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">' + t.sub + '</div>';
        html += '</div></label>';
    });
    document.getElementById('settingsList').innerHTML = html;
    document.getElementById('settingsModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}
async function updateSetting(key, val) {
    try { await db.collection('chats').doc(chatId).update({ ['settings.' + key]: val }); showToast('Updated', 'success'); }
    catch(e) { showToast('Failed', 'error'); }
}

function startEdit() { isEditing = true; editPhotoUrl = channelData ? channelData.avatar_url : null; render(); setTimeout(function() { const el = document.getElementById('editNameInput'); if (el) el.focus(); }, 300); }
function cancelEdit() { isEditing = false; editPhotoUrl = null; render(); }
async function saveEdit() {
    const nameEl = document.getElementById('editNameInput');
    const descEl = document.getElementById('editDescInput');
    const name = nameEl ? nameEl.value.trim() : '';
    const description = descEl ? descEl.value.trim() : '';
    if (!name) { showToast('Name required', 'error'); return; }
    try {
        const updates = { name: name, description: description || null, updated_at: firebase.firestore.FieldValue.serverTimestamp() };
        if (editPhotoUrl) updates.avatar_url = editPhotoUrl;
        await db.collection('chats').doc(chatId).update(updates);
        if (channelData.slug) { try { await db.collection('slugs').doc(channelData.slug).update({ name: name, avatar_url: editPhotoUrl || channelData.avatar_url || null }); } catch(e) {} }
        isEditing = false; editPhotoUrl = null;
        showToast('Updated', 'success');
    } catch(e) { showToast('Failed', 'error'); }
}
function pickImage() { document.getElementById('imageInput').click(); }
async function handleImageUpload(event) {
    const file = event.target.files[0]; if (!file) return;
    try {
        const path = 'aurachat/permanent/avatars/groups/' + currentUserId + '/' + Date.now() + '_' + file.name;
        const ref = storage.ref().child(path);
        await ref.put(file);
        editPhotoUrl = await ref.getDownloadURL();
        render();
        showToast('Uploaded', 'success');
    } catch(e) { showToast('Failed: ' + e.message, 'error'); }
    event.target.value = '';
}

function leaveGroup() {
    if (myRole === 'owner') { showToast('Owner must delete instead', 'warning'); return; }
    showDialog('Leave Group?', 'You will no longer receive messages.', 'Leave', 'danger').then(async function(ok) {
        if (!ok) return;
        try {
            const doc = await db.collection('chats').doc(chatId).get();
            const cur = doc.data() || {};
            const parts = (Array.isArray(cur.participants) ? cur.participants : []).filter(function(id) { return id !== currentUserId; });
            const count = (typeof cur.member_count === 'number' ? cur.member_count : parts.length + 1) - 1;
            await db.collection('chats').doc(chatId).update({ participants: parts, member_count: Math.max(0, count), ['participants_data.' + currentUserId]: firebase.firestore.FieldValue.delete() });
            showToast('Left group', 'success');
            setTimeout(function() { window.location.href = 'chats.html'; }, 1000);
        } catch(e) { console.error(e); showToast('Failed: ' + e.message, 'error'); }
    });
}
function deleteGroup() {
    if (myRole !== 'owner') return;
    showDialog('Delete Group?', 'Permanently delete this group and all messages.', 'Delete', 'danger').then(async function(ok) {
        if (!ok) return;
        try {
            const msgs = await db.collection('chats').doc(chatId).collection('messages').get();
            const batch = db.batch();
            msgs.docs.forEach(function(d) { batch.delete(d.ref); });
            await batch.commit();
            if (channelData.slug) { try { await db.collection('slugs').doc(channelData.slug).delete(); } catch(e) {} }
            await db.collection('chats').doc(chatId).delete();
            showToast('Deleted', 'success');
            setTimeout(function() { window.location.href = 'chats.html'; }, 1200);
        } catch(e) { showToast('Failed: ' + e.message, 'error'); }
    });
}
function kickMember(uid) {
    closeModal('memberModal');
    showDialog('Kick ' + getDisplayName(uid) + '?', 'They will be removed.', 'Kick', 'warning').then(async function(ok) {
        if (!ok) return;
        try {
            const doc = await db.collection('chats').doc(chatId).get();
            const cur = doc.data() || {};
            const parts = (Array.isArray(cur.participants) ? cur.participants : []).filter(function(id) { return id !== uid; });
            const count = (typeof cur.member_count === 'number' ? cur.member_count : parts.length + 1) - 1;
            await db.collection('chats').doc(chatId).update({ participants: parts, member_count: Math.max(0, count), ['participants_data.' + uid]: firebase.firestore.FieldValue.delete() });
            logAdminAction('ban_users', 'kicked ' + getDisplayName(uid));
            showToast('Kicked', 'success');
        } catch(e) { console.error(e); showToast('Failed: ' + e.message, 'error'); }
    });
}
function banMember(uid) {
    closeModal('memberModal');
    showDialog('Ban ' + getDisplayName(uid) + '?', 'They will be removed and blocked.', 'Ban', 'danger').then(async function(ok) {
        if (!ok) return;
        try {
            const doc = await db.collection('chats').doc(chatId).get();
            const cur = doc.data() || {};
            const parts = (Array.isArray(cur.participants) ? cur.participants : []).filter(function(id) { return id !== uid; });
            const banned = Array.isArray(cur.banned_users) ? cur.banned_users.slice() : [];
            if (banned.indexOf(uid) < 0) banned.push(uid);
            const count = (typeof cur.member_count === 'number' ? cur.member_count : parts.length + 1) - 1;
            await db.collection('chats').doc(chatId).update({ participants: parts, banned_users: banned, member_count: Math.max(0, count), ['participants_data.' + uid]: firebase.firestore.FieldValue.delete() });
            logAdminAction('ban_users', 'banned ' + getDisplayName(uid));
            showToast('Banned', 'success');
        } catch(e) { console.error(e); showToast('Failed: ' + e.message, 'error'); }
    });
}

function showAddMembersModal() {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '<div style="text-align:center;padding:30px 0;color:rgba(255,255,255,0.25);font-size:13px;">Type to search users</div>';
    document.getElementById('addMembersModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    setTimeout(function() { document.getElementById('searchInput').focus(); }, 300);
}
let searchTimeout = null;
function setupSearch() {
    const s = document.getElementById('searchInput');
    if (!s) return;
    s.addEventListener('input', function(e) {
        const q = e.target.value.trim();
        if (searchTimeout) clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function() { searchUsers(q); }, 300);
    });
}
async function searchUsers(query) {
    if (!query || query.length < 2) { document.getElementById('searchResults').innerHTML = '<div style="text-align:center;padding:30px 0;color:rgba(255,255,255,0.25);font-size:13px;">Type to search</div>'; return; }
    try {
        const snap = await db.collection('users').where('username', '>=', query).where('username', '<=', query + '\uf8ff').limit(10).get();
        let html = '';
        snap.forEach(function(doc) {
            const d = doc.data();
            if (doc.id !== currentUserId) {
                const av = d.avatar_url ? '<img src="' + d.avatar_url + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />' : (d.username || 'U')[0].toUpperCase();
                html += '<div style="display:flex;align-items:center;padding:8px 12px;border-radius:8px;gap:10px;"><div style="width:36px;height:36px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#8B5CF6,#06B6D4);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;">' + av + '</div><div style="flex:1;"><div style="font-size:14px;color:#fff;">' + escapeHtml(d.display_name || d.username) + '</div><div style="font-size:11px;color:rgba(255,255,255,0.3);">@' + escapeHtml(d.username || '') + '</div></div><button onclick="addMember(\'' + doc.id + '\')" style="padding:5px 14px;border:none;border-radius:8px;background:#8B5CF6;color:#fff;font-size:11.5px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;">Add</button></div>';
            }
        });
        if (!html) html = '<div style="text-align:center;padding:30px 0;color:rgba(255,255,255,0.25);font-size:13px;">No users found</div>';
        document.getElementById('searchResults').innerHTML = html;
    } catch(e) { console.error(e); }
}
async function addMember(uid) {
    try {
        const doc = await db.collection('chats').doc(chatId).get();
        const cur = doc.data() || {};
        const parts = Array.isArray(cur.participants) ? cur.participants.slice() : [];
        if (parts.indexOf(uid) < 0) parts.push(uid);
        await db.collection('chats').doc(chatId).update({ participants: parts, member_count: parts.length, ['participants_data.' + uid]: { role: 'member', joined_at: firebase.firestore.FieldValue.serverTimestamp() } });
        logAdminAction('invite_users', 'added ' + getDisplayName(uid));
        showToast('Added', 'success');
        closeModal('addMembersModal');
    } catch(e) { showToast('Failed: ' + e.message, 'error'); }
}

function copyShortLink() {
    if (!channelData || !channelData.slug) { showToast('No slug set', 'error'); return; }
    const link = 'https://' + SHORT_DOMAIN + '/' + channelData.slug;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(function() { showToast('Copied', 'success'); }).catch(function() { fallbackCopy(link); });
    else fallbackCopy(link);
}
async function shareShortLink() {
    if (!channelData || !channelData.slug) { showToast('No slug', 'error'); return; }
    const link = 'https://' + SHORT_DOMAIN + '/' + channelData.slug;
    if (navigator.share) { try { await navigator.share({ title: chatName, url: link }); return; } catch(e) {} }
    fallbackCopy(link);
}
async function shareInvitation() {
    const link = channelData && channelData.slug ? 'https://' + SHORT_DOMAIN + '/' + channelData.slug : window.location.origin + '/group_chat.html?id=' + chatId;
    if (navigator.share) { try { await navigator.share({ title: 'Join ' + chatName, text: 'Join ' + chatName + ' on AURA', url: link }); return; } catch(e) {} }
    fallbackCopy(link);
}
function fallbackCopy(t) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('Copied', 'success'); } catch(e) {}
    document.body.removeChild(ta);
}

function showDialog(title, text, confirmText, type) {
    return new Promise(function(resolve) {
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmText').textContent = text;
        const btn = document.getElementById('confirmBtn');
        btn.textContent = confirmText;
        btn.style.background = type === 'danger' ? '#ef4444' : type === 'warning' ? '#f59e0b' : '#8B5CF6';
        pendingAction = resolve;
        document.getElementById('confirmDialog').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    });
}
function confirmAction() { closeDialog('confirmDialog'); if (pendingAction) { pendingAction(true); pendingAction = null; } }
function closeDialog(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
    document.body.style.overflow = '';
    if (pendingAction) { pendingAction(false); pendingAction = null; }
}
function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
    document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        document.querySelectorAll('[id$="Modal"], [id$="Dialog"]').forEach(function(el) { if (el.style.display === 'flex') el.style.display = 'none'; });
        document.body.style.overflow = '';
        if (pendingAction) { pendingAction(false); pendingAction = null; }
        if (isEditing) cancelEdit();
    }
});
document.querySelectorAll('[id$="Modal"], [id$="Dialog"]').forEach(function(el) {
    el.addEventListener('click', function(e) {
        if (e.target === el) {
            el.style.display = 'none';
            document.body.style.overflow = '';
            if (pendingAction) { pendingAction(false); pendingAction = null; }
        }
    });
});

async function init() {
    if (!checkAuth()) { window.location.href = 'email_verification.html'; return; }
    const params = getUrlParams();
    chatId = params.id;
    chatName = params.name || 'Group';
    chatType = params.type || 'group';
    chatAvatar = params.avatar || null;
    if (!chatId) { content.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">Invalid group</div>'; return; }
    await loadMyNicknames();
    subscribeToGroup();
    setupSearch();
}
document.addEventListener('DOMContentLoaded', function() {
    auth.onAuthStateChanged(function(user) {
        if (user) { currentUserId = user.uid; localStorage.setItem('mock_user_id', user.uid); init(); }
        else {
            const uid = localStorage.getItem('mock_user_id');
            if (uid) { currentUserId = uid; init(); }
            else window.location.href = 'email_verification.html';
        }
    });
});
</script>
