<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Discover</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 10px; }

        #app {
            height: 100vh; height: 100dvh;
            background: #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 16px 20px 8px 20px;
            display: flex; align-items: center; gap: 16px;
            flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            width: 40px; height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .header-title {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
        }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            padding: 16px 20px 8px 20px;
            flex-shrink: 0;
        }
        .search-container {
            display: flex; align-items: center;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            border: 2px solid rgba(139, 92, 246, 0.5);
            padding: 2px 16px;
            transition: border 0.3s ease;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
        }
        .search-container:focus-within {
            border-color: rgba(139, 92, 246, 0.9);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
        }
        .search-container .search-icon {
            color: rgba(255,255,255,0.4);
            font-size: 18px;
            margin-right: 12px;
        }
        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            padding: 14px 0;
            outline: none;
        }
        .search-container input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .clear-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: rgba(255,255,255,0.6);
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center; justify-content: center;
            font-size: 14px;
        }
        .clear-btn.show { display: flex; }

        /* ===== BODY ===== */
        .body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px 30px 20px;
        }

        /* ===== SECTION HEADER ===== */
        .section-header {
            font-size: 15px;
            font-weight: 700;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.3px;
            padding: 16px 4px 12px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header:first-child {
            padding-top: 8px;
        }
        .section-header .count-badge {
            background: rgba(139, 92, 246, 0.2);
            color: #8B5CF6;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            letter-spacing: 0;
        }

        /* ===== USER CARD ===== */
        .user-card {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .user-card:hover {
            background: rgba(255,255,255,0.05);
        }

        .user-avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }
        .user-avatar img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .user-avatar .online-dot {
            position: absolute;
            bottom: 2px; right: 2px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #06B6D4;
            border: 2px solid #0A0A0F;
            display: none;
        }
        .user-avatar .online-dot.show { display: block; }
        .user-avatar.bot-avatar {
            background: linear-gradient(135deg, #06B6D4, #10B981);
        }

        .user-info {
            flex: 1;
            margin-left: 14px;
            min-width: 0;
        }
        .user-name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-name .verified-badge {
            color: #1DA1F2;
            font-size: 13px;
            flex-shrink: 0;
        }
        .user-name .bot-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(6, 182, 212, 0.2);
            color: #06B6D4;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .user-username {
            font-size: 14px;
            color: #8B5CF6;
            font-weight: 500;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-bio {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-actions {
            display: flex;
            gap: 8px;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 44px; height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            background: rgba(139, 92, 246, 0.1);
            color: #8B5CF6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }
        .icon-btn:hover {
            background: rgba(139, 92, 246, 0.2);
        }
        .icon-btn:active {
            transform: scale(0.94);
        }
        .icon-btn.bot-chat {
            border-color: rgba(6, 182, 212, 0.4);
            background: rgba(6, 182, 212, 0.12);
            color: #06B6D4;
        }
        .icon-btn.bot-chat:hover {
            background: rgba(6, 182, 212, 0.22);
        }

        /* ===== GROUP CARD ===== */
        .group-card {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 16px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .group-card:hover {
            background: rgba(255,255,255,0.05);
        }

        .group-avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            flex-shrink: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }
        .group-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .group-info {
            flex: 1;
            margin-left: 14px;
            min-width: 0;
        }
        .group-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.8px;
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
        }
        .group-badge.group {
            background: rgba(139, 92, 246, 0.2);
            color: #8B5CF6;
        }
        .group-badge.channel {
            background: rgba(251, 146, 60, 0.2);
            color: #FB923C;
        }
        .group-name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .group-meta {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .join-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            transition: all 0.2s;
            color: #fff;
        }
        .join-btn:active {
            transform: scale(0.95);
        }
        .join-btn.group {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        .join-btn.group:hover {
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }
        .join-btn.channel {
            background: linear-gradient(135deg, #F97316, #EF4444);
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }
        .join-btn.channel:hover {
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.5);
        }
        .join-btn.joined {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: default;
            box-shadow: none;
        }

        /* ===== LOADING ===== */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            margin-top: 16px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }
        .empty-icon {
            font-size: 48px;
            color: rgba(255,255,255,0.1);
            margin-bottom: 16px;
            padding: 24px;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
        }
        .empty-title {
            color: rgba(255,255,255,0.5);
            font-size: 16px;
            font-weight: 600;
        }
        .empty-subtitle {
            color: rgba(255,255,255,0.25);
            font-size: 13px;
            margin-top: 6px;
        }

        /* ===== RECENT SEARCHES ===== */
        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 12px 4px;
        }
        .recent-title {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.5px;
        }
        .clear-recent {
            color: #8B5CF6;
            font-size: 13px;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .recent-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        .recent-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
        }
        .recent-chip i {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a103c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            z-index: 2000;
            display: none;
            max-width: 90%;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }
        .toast.show { display: block; }
        .toast.success { border-color: rgba(74, 222, 128, 0.5); background: rgba(74, 222, 128, 0.1); }
        .toast.error { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.1); }

        @media (max-width: 480px) {
            .user-avatar, .group-avatar { width: 50px; height: 50px; font-size: 20px; }
            .user-name, .group-name { font-size: 15px; }
            .icon-btn { width: 40px; height: 40px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='chats.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="header-title">Discover</div>
        </div>

        <div class="search-bar">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search users, bots, groups, channels..." autocomplete="off" />
                <button class="clear-btn" id="clearBtn" onclick="clearSearch()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <div class="body" id="body"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // FIREBASE
        // ═══════════════════════════════════════════════════════════
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ═══════════════════════════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════════════════════════
        let currentUserId = null;
        let currentUserEmail = '';
        let users = [];
        let bots = [];
        let groups = [];
        let channels = [];
        let recentSearches = [];
        let searchDebounce = null;
        let lastQuery = '';
        let searchToken = 0;
        const onlineStatus = {};
        const RECENT_KEY = 'global_search_recent';

        // ═══════════════════════════════════════════════════════════
        // DOM
        // ═══════════════════════════════════════════════════════════
        const bodyEl = document.getElementById('body');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const toast = document.getElementById('toast');

        // ═══════════════════════════════════════════════════════════
        // HELPERS
        // ═══════════════════════════════════════════════════════════
        function showToast(msg, type = '') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function checkAuth() {
            const userId = localStorage.getItem('mock_user_id');
            const email = localStorage.getItem('mock_email');
            if (userId) {
                currentUserId = userId;
                currentUserEmail = email || '';
                return true;
            }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                currentUserEmail = auth.currentUser.email || '';
                localStorage.setItem('mock_user_id', currentUserId);
                return true;
            }
            return false;
        }

        function isVerified(email) {
            if (!email) return false;
            return email.toLowerCase().trim().endsWith('@aurachat.app');
        }

        function isBotEmail(email) {
            if (!email) return false;
            return email.toLowerCase().trim().endsWith('@bot.aurachat.app');
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function escapeAttr(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '&quot;')
                .replace(/\n/g, ' ')
                .replace(/\r/g, ' ');
        }

        /**
         * Firestore prefix search using Unicode range trick.
         * Returns up to `limit` results.
         */
        async function prefixQuery(collection, field, term, limit = 20) {
            try {
                const snap = await db.collection(collection)
                    .where(field, '>=', term)
                    .where(field, '<=', term + '\uf8ff')
                    .limit(limit)
                    .get();
                return snap.docs;
            } catch (e) {
                console.warn(`prefixQuery ${collection}.${field} failed:`, e.message);
                return [];
            }
        }

        // ═══════════════════════════════════════════════════════════
        // RECENT SEARCHES
        // ═══════════════════════════════════════════════════════════
        function loadRecentSearches() {
            try {
                const raw = localStorage.getItem(RECENT_KEY);
                recentSearches = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(recentSearches)) recentSearches = [];
            } catch(e) { recentSearches = []; }
        }

        function saveRecentSearches() {
            try { localStorage.setItem(RECENT_KEY, JSON.stringify(recentSearches)); } catch(e) {}
        }

        function addRecentSearch(q) {
            q = (q || '').trim();
            if (!q) return;
            recentSearches = recentSearches.filter(s => s !== q);
            recentSearches.unshift(q);
            if (recentSearches.length > 8) recentSearches = recentSearches.slice(0, 8);
            saveRecentSearches();
        }

        function clearRecentSearches() {
            recentSearches = [];
            saveRecentSearches();
            renderBody();
        }

        // ═══════════════════════════════════════════════════════════
        // ONLINE STATUS LISTENER
        // ═══════════════════════════════════════════════════════════
        function subscribeToOnlineStatus() {
            db.collection('users').onSnapshot((snapshot) => {
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const lastSeen = data.last_seen;
                    if (data.is_online === true) {
                        onlineStatus[doc.id] = true;
                    } else if (lastSeen) {
                        const date = lastSeen.toDate ? lastSeen.toDate() : new Date(lastSeen);
                        onlineStatus[doc.id] = (new Date() - date) < 5 * 60 * 1000;
                    } else {
                        onlineStatus[doc.id] = false;
                    }
                });
                if (searchInput.value.trim().length > 0) renderBody();
            }, (err) => console.warn('Online status error:', err));
        }

        // ═══════════════════════════════════════════════════════════
        // SEARCH INPUT
        // ═══════════════════════════════════════════════════════════
        searchInput.addEventListener('input', (e) => {
            const value = e.target.value;
            clearBtn.classList.toggle('show', value.length > 0);

            if (searchDebounce) clearTimeout(searchDebounce);

            if (value.trim().length === 0) {
                users = []; bots = []; groups = []; channels = [];
                renderBody();
                return;
            }

            bodyEl.innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                    <div class="loading-text">Searching...</div>
                </div>
            `;

            searchDebounce = setTimeout(() => {
                performSearch(value.trim());
            }, 350);
        });

        // ═══════════════════════════════════════════════════════════
        // SEARCH
        // ═══════════════════════════════════════════════════════════
        async function performSearch(query) {
            const raw = query.trim();
            const term = raw.toLowerCase();
            const token = ++searchToken;
            lastQuery = query;

            try {
                // ═══ USERS ═══
                const userMap = new Map();
                const userSearches = [
                    prefixQuery('users', 'username', term, 20),
                    prefixQuery('users', 'display_name', term, 20),
                    prefixQuery('users', 'display_name_lower', term, 20),
                    prefixQuery('users', 'email', term, 10)
                ];
                const userSnaps = await Promise.all(userSearches);
                for (const docs of userSnaps) {
                    for (const doc of docs) {
                        if (doc.id === currentUserId) continue;
                        const data = doc.data();
                        if (isBotEmail(data.email)) continue; // skip bots here — they have their own section
                        userMap.set(doc.id, { id: doc.id, ...data });
                    }
                }
                users = Array.from(userMap.values());

                // ═══ BOTS ═══
                // Bots live in the `users` collection with email ending in @bot.aurachat.app
                // Also try a dedicated `bots` collection first if it exists.
                const botMap = new Map();

                // Try dedicated 'bots' collection
                const botSearches = await Promise.all([
                    prefixQuery('bots', 'username', term, 20),
                    prefixQuery('bots', 'display_name', term, 20),
                    prefixQuery('bots', 'name', term, 20)
                ]);
                for (const docs of botSearches) {
                    for (const doc of docs) {
                        botMap.set(doc.id, { id: doc.id, ...doc.data(), _fromBots: true });
                    }
                }

                // Also search 'users' collection for bot emails
                const botUserSearches = await Promise.all([
                    prefixQuery('users', 'username', term, 30),
                    prefixQuery('users', 'display_name', term, 30)
                ]);
                for (const docs of botUserSearches) {
                    for (const doc of docs) {
                        const data = doc.data();
                        if (!isBotEmail(data.email)) continue;
                        if (!botMap.has(doc.id)) {
                            botMap.set(doc.id, { id: doc.id, ...data, _fromUsers: true });
                        }
                    }
                }
                bots = Array.from(botMap.values());

                // ═══ GROUPS ═══
                const groupMap = new Map();
                const groupSearches = await Promise.all([
                    prefixQuery('chats', 'name', term, 30),
                    prefixQuery('chats', 'name_lower', term, 30)
                ]);
                for (const docs of groupSearches) {
                    for (const doc of docs) {
                        const data = doc.data();
                        if (data.type !== 'group') continue;
                        groupMap.set(doc.id, { id: doc.id, ...data });
                    }
                }
                groups = Array.from(groupMap.values());

                // ═══ CHANNELS ═══
                const channelMap = new Map();
                const channelSearches = await Promise.all([
                    prefixQuery('chats', 'name', term, 30),
                    prefixQuery('chats', 'name_lower', term, 30)
                ]);
                for (const docs of channelSearches) {
                    for (const doc of docs) {
                        const data = doc.data();
                        if (data.type !== 'channel') continue;
                        channelMap.set(doc.id, { id: doc.id, ...data });
                    }
                }
                channels = Array.from(channelMap.values());

                // Reject stale results
                if (token !== searchToken) return;

                addRecentSearch(raw);
                renderBody();

            } catch(e) {
                console.error('Search error:', e);
                if (token === searchToken) {
                    showToast('Search failed', 'error');
                    renderBody();
                }
            }
        }

        function clearSearch() {
            searchInput.value = '';
            clearBtn.classList.remove('show');
            users = []; bots = []; groups = []; channels = [];
            renderBody();
            searchInput.focus();
        }

        // ═══════════════════════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════════════════════
        function renderBody() {
            if (searchInput.value.trim().length === 0) {
                renderEmptyState();
                return;
            }

            const total = users.length + bots.length + groups.length + channels.length;

            if (total === 0) {
                bodyEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-search"></i></div>
                        <div class="empty-title">No results found</div>
                        <div class="empty-subtitle">Try a different search term</div>
                    </div>
                `;
                return;
            }

            let html = '';

            if (users.length > 0) {
                html += `<div class="section-header"><i class="fas fa-user"></i> Users <span class="count-badge">${users.length}</span></div>`;
                users.forEach(user => { html += renderUserCard(user, 'user'); });
            }

            if (bots.length > 0) {
                html += `<div class="section-header"><i class="fas fa-robot"></i> Bots <span class="count-badge">${bots.length}</span></div>`;
                bots.forEach(bot => { html += renderUserCard(bot, 'bot'); });
            }

            if (groups.length > 0) {
                html += `<div class="section-header"><i class="fas fa-users"></i> Groups <span class="count-badge">${groups.length}</span></div>`;
                groups.forEach(group => { html += renderGroupCard(group, 'group'); });
            }

            if (channels.length > 0) {
                html += `<div class="section-header"><i class="fas fa-bullhorn"></i> Channels <span class="count-badge">${channels.length}</span></div>`;
                channels.forEach(channel => { html += renderGroupCard(channel, 'channel'); });
            }

            bodyEl.innerHTML = html;
        }

        // ═══════════════════════════════════════════════════════════
        // USER CARD (also used for bots, with a flag)
        // ═══════════════════════════════════════════════════════════
        function renderUserCard(user, kind = 'user') {
            const uid = user.id;
            const username = user.username || 'Unknown';
            const displayName = user.display_name || user.name || username;
            const avatarUrl = user.avatar_url;
            const bio = user.bio || user.description || '';
            const email = user.email || '';
            const isOnline = onlineStatus[uid] === true;
            const verified = isVerified(email);
            const isBot = kind === 'bot';

            const initial = (displayName || 'U')[0].toUpperCase();

            let avatarHtml;
            if (avatarUrl) {
                avatarHtml = `<img src="${avatarUrl}" onerror="this.parentElement.innerHTML='${escapeAttr(initial)}'" />`;
            } else {
                avatarHtml = escapeHtml(initial);
            }

            const verifiedHtml = verified ? '<span class="verified-badge"><i class="fas fa-check-circle"></i></span>' : '';
            const botBadgeHtml = isBot ? '<span class="bot-badge"><i class="fas fa-robot"></i> BOT</span>' : '';

            const avatarClass = isBot ? 'user-avatar bot-avatar' : 'user-avatar';
            const chatBtnClass = isBot ? 'icon-btn bot-chat' : 'icon-btn';
            const chatBtnIcon = isBot ? 'fa-comment-dots' : 'fa-comment';
            const chatBtnTitle = isBot ? 'Chat with bot' : 'Message';
            const chatFn = isBot ? `startBotChat('${escapeAttr(uid)}')` : `startChat('${escapeAttr(uid)}')`;

            return `
                <div class="user-card">
                    <div class="${avatarClass}">
                        ${avatarHtml}
                        ${isBot ? '' : `<div class="online-dot ${isOnline ? 'show' : ''}"></div>`}
                    </div>
                    <div class="user-info">
                        <div class="user-name">
                            ${escapeHtml(displayName)}
                            ${botBadgeHtml}
                            ${verifiedHtml}
                        </div>
                        <div class="user-username">@${escapeHtml(username)}</div>
                        ${bio ? `<div class="user-bio">${escapeHtml(bio)}</div>` : ''}
                    </div>
                    <div class="user-actions">
                        <button class="icon-btn" onclick="viewProfile('${escapeAttr(uid)}', ${isBot})" title="View Profile">
                            <i class="fas fa-user"></i>
                        </button>
                        <button class="${chatBtnClass}" onclick="${chatFn}" title="${chatBtnTitle}">
                            <i class="fas ${chatBtnIcon}"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // ═══════════════════════════════════════════════════════════
        // GROUP / CHANNEL CARD
        // ═══════════════════════════════════════════════════════════
        function renderGroupCard(item, type) {
            const itemId = item.id;
            const name = item.name || 'Unknown';
            const avatarUrl = item.avatar_url;
            const description = item.description || '';
            const memberCount = item.member_count || (item.participants ? item.participants.length : 0);
            const participants = item.participants || [];
            const isJoined = participants.includes(currentUserId);

            const initial = (name || 'A')[0].toUpperCase();

            let avatarHtml;
            if (avatarUrl) {
                avatarHtml = `<img src="${avatarUrl}" onerror="this.parentElement.innerHTML='${escapeAttr(initial)}'" />`;
            } else {
                avatarHtml = escapeHtml(initial);
            }

            const isGroup = type === 'group';
            const badgeClass = isGroup ? 'group' : 'channel';
            const badgeText = isGroup ? 'GROUP' : 'CHANNEL';

            let joinBtnHtml;
            if (isJoined) {
                joinBtnHtml = `<button class="join-btn joined" onclick="openChat('${escapeAttr(itemId)}', '${escapeAttr(name)}', ${isGroup})">Open</button>`;
            } else if (isGroup) {
                joinBtnHtml = `<button class="join-btn group" onclick="joinItem('${escapeAttr(itemId)}', 'group')">Join</button>`;
            } else {
                joinBtnHtml = `<button class="join-btn channel" onclick="joinItem('${escapeAttr(itemId)}', 'channel')">Subscribe</button>`;
            }

            return `
                <div class="group-card">
                    <div class="group-avatar">${avatarHtml}</div>
                    <div class="group-info">
                        <div class="group-badge ${badgeClass}">${badgeText}</div>
                        <div class="group-name">${escapeHtml(name)}</div>
                        <div class="group-meta">${memberCount} member${memberCount !== 1 ? 's' : ''}${description ? ' • ' + escapeHtml(description) : ''}</div>
                    </div>
                    ${joinBtnHtml}
                </div>
            `;
        }

        // ═══════════════════════════════════════════════════════════
        // EMPTY STATE
        // ═══════════════════════════════════════════════════════════
        function renderEmptyState() {
            let html = '';

            if (recentSearches.length > 0) {
                html += `
                    <div class="recent-header">
                        <div class="recent-title">Recent</div>
                        <button class="clear-recent" onclick="clearRecentSearches()">Clear all</button>
                    </div>
                    <div class="recent-chips">
                `;
                recentSearches.forEach(s => {
                    html += `
                        <div class="recent-chip" onclick="useRecentSearch('${escapeAttr(s)}')">
                            <i class="fas fa-history"></i>
                            ${escapeHtml(s)}
                        </div>
                    `;
                });
                html += `</div>`;
            }

            html += `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-search"></i></div>
                    <div class="empty-title">Discover AURA</div>
                    <div class="empty-subtitle">Search for users, bots, groups and channels</div>
                </div>
            `;

            bodyEl.innerHTML = html;
        }

        function useRecentSearch(term) {
            searchInput.value = term;
            clearBtn.classList.add('show');
            performSearch(term);
        }

        // ═══════════════════════════════════════════════════════════
        // ACTIONS
        // ═══════════════════════════════════════════════════════════
        function viewProfile(uid, isBot) {
            if (isBot) {
                // Bots might not have a public profile; open bot page as fallback
                window.location.href = 'bot.html?id=' + encodeURIComponent(uid);
                return;
            }
            window.location.href = 'public_profile.html?userId=' + encodeURIComponent(uid);
        }

        /**
         * Start or open a DM chat with a user.
         */
        async function startChat(uid) {
            try {
                showToast('Opening chat...', '');

                // Check for existing direct chat
                const snap = await db.collection('chats')
                    .where('type', '==', 'direct')
                    .where('participants', 'array-contains', currentUserId)
                    .get();

                let existingChatId = null;
                snap.forEach(doc => {
                    const p = doc.data().participants || [];
                    if (p.includes(uid)) existingChatId = doc.id;
                });

                if (existingChatId) {
                    const chatDoc = await db.collection('chats').doc(existingChatId).get();
                    const chatData = chatDoc.data() || {};
                    window.location.href = `chat.html?id=${existingChatId}&name=${encodeURIComponent(chatData.name || 'Chat')}&avatar=${encodeURIComponent(chatData.avatar_url || '')}`;
                    return;
                }

                // Fetch other user data
                const userDoc = await db.collection('users').doc(uid).get();
                const u = userDoc.data() || {};
                const otherName = u.display_name || u.username || 'Unknown';
                const otherAvatar = u.avatar_url || '';

                // Create new chat
                const chatId = 'dm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                await db.collection('chats').doc(chatId).set({
                    id: chatId,
                    type: 'direct',
                    name: otherName,
                    avatar_url: otherAvatar,
                    participants: [currentUserId, uid],
                    participants_data: {
                        [currentUserId]: { role: 'member', joined_at: firebase.firestore.FieldValue.serverTimestamp() },
                        [uid]: { role: 'member', joined_at: firebase.firestore.FieldValue.serverTimestamp() }
                    },
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message: 'Chat started'
                });

                window.location.href = `chat.html?id=${chatId}&name=${encodeURIComponent(otherName)}&avatar=${encodeURIComponent(otherAvatar)}`;

            } catch(e) {
                console.error('Start chat error:', e);
                showToast('Failed to start chat', 'error');
            }
        }

        /**
         * Open or create the chat with a bot → bot.html?id=<botId>
         */
        async function startBotChat(botId) {
            try {
                showToast('Opening bot...', '');
                window.location.href = 'bot.html?id=' + encodeURIComponent(botId);
            } catch(e) {
                console.error('Start bot chat error:', e);
                showToast('Failed to open bot', 'error');
            }
        }

        /**
         * Join a group or subscribe to a channel.
         */
        async function joinItem(itemId, type) {
            try {
                showToast(type === 'group' ? 'Joining group...' : 'Subscribing...', '');

                const chatRef = db.collection('chats').doc(itemId);
                const chatDoc = await chatRef.get();
                if (!chatDoc.exists) {
                    showToast('Not found', 'error');
                    return;
                }

                const data = chatDoc.data();
                const participants = data.participants || [];

                if (participants.includes(currentUserId)) {
                    showToast('Already joined', '');
                    openChat(itemId, data.name || 'Chat', type === 'group');
                    return;
                }

                const banned = data.banned_users || [];
                if (banned.includes(currentUserId)) {
                    showToast('You are banned from this ' + type, 'error');
                    return;
                }

                const role = type === 'channel' ? 'subscriber' : 'member';
                const newMemberCount = (data.member_count || participants.length) + 1;

                const updateData = {};
                updateData.participants = firebase.firestore.FieldValue.arrayUnion(currentUserId);
                updateData[`participants_data.${currentUserId}`] = {
                    role: role,
                    joined_at: firebase.firestore.FieldValue.serverTimestamp()
                };
                updateData.member_count = newMemberCount;

                await chatRef.update(updateData);

                await chatRef.collection('messages').add({
                    type: 'system',
                    content: 'A new member joined',
                    created_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast(type === 'group' ? 'Joined group ✓' : 'Subscribed ✓', 'success');

                if (type === 'group') {
                    const g = groups.find(x => x.id === itemId);
                    if (g) {
                        g.participants = [...(g.participants || []), currentUserId];
                        g.member_count = newMemberCount;
                    }
                } else {
                    const c = channels.find(x => x.id === itemId);
                    if (c) {
                        c.participants = [...(c.participants || []), currentUserId];
                        c.member_count = newMemberCount;
                    }
                }
                renderBody();

            } catch(e) {
                console.error('Join error:', e);
                showToast('Failed to join: ' + e.message, 'error');
            }
        }

        function openChat(itemId, name, isGroup) {
            if (isGroup) {
                window.location.href = `group.html?id=${encodeURIComponent(itemId)}&name=${encodeURIComponent(name)}`;
            } else {
                window.location.href = `channel.html?id=${encodeURIComponent(itemId)}&name=${encodeURIComponent(name)}`;
            }
        }

        // ═══════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════
        function init() {
            if (!checkAuth()) {
                showToast('Please login first', 'error');
                setTimeout(() => window.location.href = 'email_verification.html', 1500);
                return;
            }

            loadRecentSearches();
            subscribeToOnlineStatus();
            renderBody();
            setTimeout(() => searchInput.focus(), 300);
        }

        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    currentUserEmail = user.email || '';
                    localStorage.setItem('mock_user_id', currentUserId);
                    init();
                } else {
                    const userId = localStorage.getItem('mock_user_id');
                    if (userId) {
                        currentUserId = userId;
                        currentUserEmail = localStorage.getItem('mock_email') || '';
                        init();
                    } else {
                        window.location.href = 'email_verification.html';
                    }
                }
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') searchInput.blur();
        });
    </script>

</body>
