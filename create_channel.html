<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Create Channel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 10px; }

        #app {
            height: 100vh; height: 100dvh;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            padding: 12px 16px;
            display: flex; align-items: center; gap: 12px;
            flex-shrink: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            min-height: 60px;
        }
        .back-btn {
            background: none; border: none; color: #fff; font-size: 18px;
            padding: 6px; cursor: pointer; border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
        }
        .header-title {
            flex: 1;
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #F97316, #EF4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .create-btn {
            background: none; border: none;
            color: #06B6D4; font-weight: 700;
            font-size: 15px; padding: 8px 16px;
            cursor: pointer; border-radius: 10px;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .create-btn:hover { background: rgba(6, 182, 212, 0.1); }
        .create-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* CONTENT */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 30px 20px;
        }

        /* AVATAR */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }
        .avatar-wrapper {
            position: relative;
            cursor: pointer;
        }
        .channel-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.2);
            border: 3px solid rgba(249, 115, 22, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            color: #F97316;
            overflow: hidden;
            transition: all 0.3s;
        }
        .channel-avatar:hover {
            border-color: #F97316;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.4);
        }
        .channel-avatar img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .avatar-camera-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #F97316, #EF4444);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            border: 3px solid #0A0A0F;
            cursor: pointer;
        }
        .avatar-uploading {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
        }
        .avatar-uploading.show { display: flex; }
        .avatar-uploading .spinner {
            width: 32px; height: 32px;
            border: 3px solid rgba(249, 115, 22, 0.2);
            border-top-color: #F97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .avatar-label {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 10px;
        }

        /* INPUTS */
        .input-group {
            margin-bottom: 18px;
        }
        .input-label {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
            display: block;
        }
        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border 0.2s;
        }
        .input-field:focus {
            border-color: #F97316;
            background: rgba(249, 115, 22, 0.05);
        }
        .input-field::placeholder {
            color: rgba(255,255,255,0.25);
        }
        textarea.input-field {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        /* INFO BANNER */
        .info-banner {
            padding: 14px 16px;
            background: rgba(249, 115, 22, 0.08);
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-radius: 14px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .info-banner .banner-icon {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F97316;
            font-size: 16px;
            flex-shrink: 0;
        }
        .info-banner .banner-text {
            flex: 1;
        }
        .info-banner .banner-title {
            font-size: 13px;
            font-weight: 700;
            color: #FB923C;
            margin-bottom: 2px;
        }
        .info-banner .banner-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            line-height: 1.4;
        }

        /* SELECTED MEMBERS */
        .selected-members {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 8px 4px;
            margin-bottom: 12px;
            min-height: 90px;
        }
        .selected-member {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            position: relative;
            width: 70px;
        }
        .selected-member-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #F97316, #EF4444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            border: 2px solid rgba(249, 115, 22, 0.4);
        }
        .selected-member-avatar img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .selected-member-remove {
            position: absolute;
            top: -2px;
            right: 6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ef4444;
            border: 2px solid #0A0A0F;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .selected-member-name {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
            max-width: 68px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        /* SEARCH RESULTS */
        .search-results {
            margin-top: 8px;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .search-result-item:hover {
            background: rgba(255,255,255,0.06);
        }
        .search-result-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #F97316, #EF4444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
            margin-right: 12px;
        }
        .search-result-avatar img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .search-result-info {
            flex: 1;
            min-width: 0;
        }
        .search-result-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        .search-result-username {
            font-size: 12px;
            color: #F97316;
            margin-top: 1px;
        }
        .search-result-check {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .search-result-check.selected {
            background: linear-gradient(135deg, #F97316, #EF4444);
            color: #fff;
            border-color: transparent;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a103c;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
            z-index: 5000;
            display: none;
            max-width: 90%;
            text-align: center;
            font-family: 'Inter', sans-serif;
            animation: slideUp 0.3s ease;
        }
        .toast.show { display: block; }
        .toast.success { border-color: rgba(74, 222, 128, 0.5); background: rgba(74, 222, 128, 0.15); }
        .toast.error { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.15); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* LOADING OVERLAY */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            z-index: 4000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }
        .loading-overlay.show { display: flex; }
        .loading-overlay .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(249, 115, 22, 0.2);
            border-top-color: #F97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-overlay .loading-text {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="file"] { display: none; }

        @media (max-width: 480px) {
            .header-title { font-size: 20px; }
            .channel-avatar { width: 96px; height: 96px; font-size: 38px; }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="header-title">New Channel</div>
            <button class="create-btn" id="createBtn" onclick="createChannel()">Create</button>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Avatar -->
            <div class="avatar-section">
                <div class="avatar-wrapper" onclick="pickChannelPhoto()">
                    <div class="channel-avatar" id="channelAvatar">
                        <i class="fas fa-bullhorn"></i>
                    </div>
                    <div class="avatar-camera-btn">
                        <i class="fas fa-camera"></i>
                    </div>
                    <div class="avatar-uploading" id="avatarUploading">
                        <div class="spinner"></div>
                    </div>
                </div>
                <div class="avatar-label">Tap to add photo</div>
            </div>

            <!-- Channel Name -->
            <div class="input-group">
                <label class="input-label">Channel Name *</label>
                <input type="text" class="input-field" id="channelName" placeholder="Enter channel name..." maxlength="50" />
            </div>

            <!-- Description -->
            <div class="input-group">
                <label class="input-label">Description</label>
                <textarea class="input-field" id="channelDescription" placeholder="What's this channel about? (optional)" maxlength="200"></textarea>
            </div>

            <!-- Invite Link Name -->
            <div class="input-group">
                <label class="input-label">Invitation Link Name</label>
                <input type="text" class="input-field" id="inviteName" placeholder="e.g., my-awesome-channel (optional)" maxlength="30" />
            </div>

            <!-- Info Banner -->
            <div class="info-banner">
                <div class="banner-icon"><i class="fas fa-bullhorn"></i></div>
                <div class="banner-text">
                    <div class="banner-title">One-Way Messaging</div>
                    <div class="banner-desc">Only admins and owner can post messages. Subscribers can only read.</div>
                </div>
            </div>

            <!-- Search Members -->
            <div class="input-group">
                <label class="input-label">Add Subscribers</label>
                <input type="text" class="input-field" id="searchInput" placeholder="Search by username..." oninput="handleSearch(this.value)" />
            </div>

            <!-- Selected Subscribers -->
            <div class="selected-members" id="selectedMembers"></div>

            <!-- Search Results -->
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelected(event)" />

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Creating channel...</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // FIREBASE
        // ═══════════════════════════════════════════════════════════
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ═══════════════════════════════════════════════════════════
        // CLOUDINARY
        // ═══════════════════════════════════════════════════════════
        const CLOUD_NAME = 'dn2mwp1lc';
        const UPLOAD_PRESET = 'aura_chat';

        // ═══════════════════════════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════════════════════════
        let currentUserId = null;
        let currentUserEmail = '';
        let channelPhotoUrl = null;
        let selectedMembers = [];
        let searchResults = [];
        let searchDebounce = null;

        // DOM
        const channelAvatar = document.getElementById('channelAvatar');
        const channelName = document.getElementById('channelName');
        const channelDescription = document.getElementById('channelDescription');
        const inviteName = document.getElementById('inviteName');
        const searchInput = document.getElementById('searchInput');
        const selectedMembersEl = document.getElementById('selectedMembers');
        const searchResultsEl = document.getElementById('searchResults');
        const createBtn = document.getElementById('createBtn');
        const toast = document.getElementById('toast');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const avatarUploading = document.getElementById('avatarUploading');

        // ═══════════════════════════════════════════════════════════
        // HELPERS
        // ═══════════════════════════════════════════════════════════
        function showToast(msg, type = '') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function showLoading(text = 'Creating channel...') {
            loadingText.textContent = text;
            loadingOverlay.classList.add('show');
        }

        function hideLoading() {
            loadingOverlay.classList.remove('show');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function checkAuth() {
            const userId = localStorage.getItem('mock_user_id');
            const email = localStorage.getItem('mock_email');
            if (userId) {
                currentUserId = userId;
                currentUserEmail = email || '';
                return true;
            }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                currentUserEmail = auth.currentUser.email || '';
                localStorage.setItem('mock_user_id', currentUserId);
                return true;
            }
            return false;
        }

        function goBack() {
            if (window.history.length > 1) window.history.back();
            else window.location.href = 'chats.html';
        }

        // ═══════════════════════════════════════════════════════════
        // CHANNEL PHOTO UPLOAD — CLOUDINARY
        // ═══════════════════════════════════════════════════════════
        function pickChannelPhoto() {
            document.getElementById('imageInput').click();
        }

        async function handleImageSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('Please select an image file', 'error');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showToast('Image too large (max 5MB)', 'error');
                return;
            }

            console.log('📤 Uploading channel photo:', file.name, file.size);

            avatarUploading.classList.add('show');
            showToast('Uploading photo...', '');

            try {
                const url = await uploadToCloudinary(file);
                channelPhotoUrl = url;
                updateAvatarPreview();
                avatarUploading.classList.remove('show');
                showToast('Photo uploaded ✓', 'success');
            } catch(e) {
                console.error('❌ Upload error:', e);
                avatarUploading.classList.remove('show');
                showToast('Upload failed: ' + e.message, 'error');
            }

            event.target.value = '';
        }

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('folder', `aura_chat/channels/${currentUserId}`);

            const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

            const response = await fetch(url, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            return data.secure_url;
        }

        function updateAvatarPreview() {
            if (channelPhotoUrl) {
                channelAvatar.innerHTML = `<img src="${channelPhotoUrl}" alt="Channel photo" />`;
            } else {
                channelAvatar.innerHTML = `<i class="fas fa-bullhorn"></i>`;
            }
        }

        // ═══════════════════════════════════════════════════════════
        // SEARCH USERS
        // ═══════════════════════════════════════════════════════════
        function handleSearch(query) {
            if (searchDebounce) clearTimeout(searchDebounce);

            if (!query || query.trim().length < 2) {
                searchResults = [];
                renderSearchResults();
                return;
            }

            searchDebounce = setTimeout(() => {
                searchUsers(query.trim());
            }, 350);
        }

        async function searchUsers(query) {
            try {
                const userResults = new Map();

                try {
                    const snap1 = await db.collection('users')
                        .where('username', '>=', query)
                        .where('username', '<=', query + '\uf8ff')
                        .limit(15).get();
                    snap1.forEach(doc => {
                        if (doc.id !== currentUserId) {
                            userResults.set(doc.id, { id: doc.id, ...doc.data() });
                        }
                    });
                } catch(e) {}

                try {
                    const snap2 = await db.collection('users')
                        .where('display_name', '>=', query)
                        .where('display_name', '<=', query + '\uf8ff')
                        .limit(15).get();
                    snap2.forEach(doc => {
                        if (doc.id !== currentUserId) {
                            userResults.set(doc.id, { id: doc.id, ...doc.data() });
                        }
                    });
                } catch(e) {}

                searchResults = Array.from(userResults.values());
                renderSearchResults();
            } catch(e) {
                console.error('Search error:', e);
            }
        }

        // ═══════════════════════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════════════════════
        function renderSelectedMembers() {
            if (selectedMembers.length === 0) {
                selectedMembersEl.innerHTML = '';
                return;
            }

            let html = '';
            selectedMembers.forEach(member => {
                const displayName = member.display_name || member.username || 'Unknown';
                const avatarUrl = member.avatar_url;

                let avatarHtml;
                if (avatarUrl) {
                    avatarHtml = `<img src="${avatarUrl}" onerror="this.parentElement.textContent='${displayName[0].toUpperCase()}'" />`;
                } else {
                    avatarHtml = displayName[0].toUpperCase();
                }

                html += `
                    <div class="selected-member">
                        <div class="selected-member-avatar">${avatarHtml}</div>
                        <div class="selected-member-remove" onclick="toggleMember('${member.id}')">
                            <i class="fas fa-times"></i>
                        </div>
                        <div class="selected-member-name">${escapeHtml(displayName)}</div>
                    </div>
                `;
            });
            selectedMembersEl.innerHTML = html;
        }

        function renderSearchResults() {
            if (searchResults.length === 0) {
                searchResultsEl.innerHTML = '';
                return;
            }

            let html = '';
            searchResults.forEach(user => {
                const isSelected = selectedMembers.some(m => m.id === user.id);
                const displayName = user.display_name || user.username || 'Unknown';
                const username = user.username || 'unknown';
                const avatarUrl = user.avatar_url;

                let avatarHtml;
                if (avatarUrl) {
                    avatarHtml = `<img src="${avatarUrl}" onerror="this.parentElement.textContent='${displayName[0].toUpperCase()}'" />`;
                } else {
                    avatarHtml = displayName[0].toUpperCase();
                }

                html += `
                    <div class="search-result-item" onclick="toggleMember('${user.id}')">
                        <div class="search-result-avatar">${avatarHtml}</div>
                        <div class="search-result-info">
                            <div class="search-result-name">${escapeHtml(displayName)}</div>
                            <div class="search-result-username">@${escapeHtml(username)}</div>
                        </div>
                        <div class="search-result-check ${isSelected ? 'selected' : ''}">
                            <i class="fas ${isSelected ? 'fa-check' : 'fa-plus'}"></i>
                        </div>
                    </div>
                `;
            });
            searchResultsEl.innerHTML = html;
        }

        function toggleMember(userId) {
            const idx = selectedMembers.findIndex(m => m.id === userId);
            if (idx >= 0) {
                selectedMembers.splice(idx, 1);
            } else {
                const user = searchResults.find(u => u.id === userId);
                if (user) selectedMembers.push(user);
            }
            renderSelectedMembers();
            renderSearchResults();
        }

        // ═══════════════════════════════════════════════════════════
        // CREATE CHANNEL
        // ═══════════════════════════════════════════════════════════
        async function createChannel() {
            const name = channelName.value.trim();
            if (!name) {
                showToast('Please enter a channel name', 'error');
                channelName.focus();
                return;
            }

            if (!currentUserId) {
                showToast('Please login first', 'error');
                return;
            }

            createBtn.disabled = true;
            showLoading('Creating channel...');

            try {
                const chatId = generateUUID();
                const participants = [currentUserId, ...selectedMembers.map(m => m.id)];
                const participantsData = {};

                participants.forEach(id => {
                    participantsData[id] = {
                        role: id === currentUserId ? 'owner' : 'subscriber',
                        joined_at: firebase.firestore.FieldValue.serverTimestamp()
                    };
                });

                const channelData = {
                    id: chatId,
                    name: name,
                    description: channelDescription.value.trim() || null,
                    avatar_url: channelPhotoUrl || null,
                    type: 'channel',
                    created_by: currentUserId,
                    created_by_email: currentUserEmail,
                    participants: participants,
                    participants_data: participantsData,
                    member_count: participants.length,
                    banned_users: [],
                    settings: {
                        chat_disabled: false,
                        file_sharing_disabled: false,
                        slow_mode_seconds: 0,
                        restrict_new_members_minutes: 0,
                        message_retention_days: 0,
                        welcome_message: `Welcome to ${name}!`,
                        rules: 'Be respectful and kind to all members.',
                        announcements_only: true,
                        polls_enabled: true,
                        reactions_enabled: true,
                        forwarding_enabled: true,
                        voice_chat_enabled: false
                    },
                    pinned_messages: [],
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    updated_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message: 'Channel created'
                };

                await db.collection('chats').doc(chatId).set(channelData);

                // System message
                try {
                    await db.collection('chats').doc(chatId).collection('messages').add({
                        type: 'system',
                        content: `${name} channel was created`,
                        created_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch(e) {}

                hideLoading();
                showToast('Channel created! 📢', 'success');

                setTimeout(() => {
                    window.location.href = `channel.html?id=${chatId}&name=${encodeURIComponent(name)}`;
                }, 800);

            } catch(e) {
                console.error('❌ Create channel error:', e);
                hideLoading();
                createBtn.disabled = false;
                showToast('Failed: ' + (e.code || e.message), 'error');
            }
        }

        // ═══════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    currentUserEmail = user.email || '';
                    localStorage.setItem('mock_user_id', currentUserId);
                } else {
                    if (!checkAuth()) {
                        window.location.href = 'email_verification.html';
                        return;
                    }
                }
                setTimeout(() => channelName.focus(), 300);
            });
        });

        channelName.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                channelDescription.focus();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (window.history.length > 1) window.history.back();
                else window.location.href = 'chats.html';
            }
        });
    </script>

</body>
</html>
