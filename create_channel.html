<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Create Channel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 10px;
        }

        #app {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 16px 16px 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .header-title {
            flex: 1;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .create-btn {
            background: none;
            border: none;
            color: #06B6D4;
            font-weight: bold;
            font-size: 16px;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .create-btn:hover {
            background: rgba(6, 182, 212, 0.1);
        }

        .create-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .create-btn .spinner-small {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #06B6D4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== CONTENT ===== */
        .content {
            padding: 16px 24px 24px 24px;
            overflow-y: auto;
            max-height: calc(100vh - 120px);
        }

        /* ===== AVATAR ===== */
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
        }

        .avatar-wrapper {
            position: relative;
            cursor: pointer;
        }

        .channel-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: #8B5CF6;
            overflow: hidden;
            border: 2px solid rgba(139, 92, 246, 0.3);
            transition: all 0.3s;
        }

        .channel-avatar:hover {
            border-color: #8B5CF6;
        }

        .channel-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-label {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 8px;
        }

        /* ===== INPUT FIELDS ===== */
        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .input-field:focus {
            border-color: #8B5CF6;
        }

        .input-field::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .input-field:disabled {
            opacity: 0.5;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon .input-field {
            padding-left: 48px;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 18px;
        }

        .input-with-icon .input-field.textarea {
            padding-top: 16px;
            min-height: 80px;
            resize: vertical;
        }

        .input-with-icon .input-icon.top {
            top: 18px;
            transform: none;
        }

        /* ===== CHANNEL INFO BANNER ===== */
        .info-banner {
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .info-banner .banner-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #8B5CF6;
            flex-shrink: 0;
        }

        .info-banner .banner-text .banner-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .info-banner .banner-text .banner-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        /* ===== GENERATED LINK ===== */
        .link-box {
            padding: 12px;
            background: rgba(0, 255, 0, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            margin-bottom: 16px;
            display: none;
        }

        .link-box.show {
            display: block;
        }

        .link-box .link-content {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4ade80;
            font-size: 12px;
        }

        .link-box .link-content .link-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== SELECTED MEMBERS ===== */
        .selected-members {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 8px 0;
            margin-bottom: 16px;
            min-height: 90px;
        }

        .selected-member {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            position: relative;
        }

        .selected-member-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            overflow: hidden;
            border: 2px solid rgba(139, 92, 246, 0.3);
        }

        .selected-member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .selected-member-remove {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ef4444;
            border: 2px solid #0A0A0F;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .selected-member-name {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== SEARCH RESULTS ===== */
        .search-results {
            margin-top: 8px;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-item:hover {
            background: rgba(255,255,255,0.06);
        }

        .search-result-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .search-result-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .search-result-info {
            flex: 1;
            min-width: 0;
        }

        .search-result-name {
            font-size: 14px;
            color: #fff;
            font-weight: 500;
        }

        .search-result-email {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }

        .search-result-check {
            color: #8B5CF6;
            font-size: 20px;
        }

        .search-result-add {
            color: rgba(255,255,255,0.4);
            font-size: 20px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a103c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            z-index: 2000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            border-color: rgba(74, 222, 128, 0.5);
            background: rgba(74, 222, 128, 0.1);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .content {
                padding: 12px 16px 16px 16px;
            }
            .channel-avatar {
                width: 80px;
                height: 80px;
                font-size: 40px;
            }
            .avatar-upload-btn {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
        }

        /* Hidden file input */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="header-title">New Channel</div>
            <button class="create-btn" id="createBtn" onclick="createChannel()">Create</button>
        </div>

        <!-- Content -->
        <div class="content" id="content">
            <!-- Avatar -->
            <div class="avatar-container">
                <div class="avatar-wrapper" onclick="pickImage()">
                    <div class="channel-avatar" id="channelAvatar">
                        <i class="fas fa-bullhorn"></i>
                    </div>
                    <div class="avatar-upload-btn">
                        <i class="fas fa-camera"></i>
                    </div>
                </div>
                <div class="avatar-label">Tap to add photo</div>
            </div>

            <!-- Channel Name -->
            <div class="input-group">
                <label class="input-label">Channel Name</label>
                <div class="input-with-icon">
                    <i class="fas fa-edit input-icon"></i>
                    <input class="input-field" id="channelName" placeholder="Enter channel name" />
                </div>
            </div>

            <!-- Description -->
            <div class="input-group">
                <label class="input-label">Description</label>
                <div class="input-with-icon">
                    <i class="fas fa-align-left input-icon top"></i>
                    <textarea class="input-field textarea" id="channelDescription" placeholder="Add a description (optional)"></textarea>
                </div>
            </div>

            <!-- Invitation Link Name -->
            <div class="input-group">
                <label class="input-label">Invitation Link Name</label>
                <div class="input-with-icon">
                    <i class="fas fa-link input-icon"></i>
                    <input class="input-field" id="inviteName" placeholder="e.g., my-awesome-channel (optional)" />
                </div>
            </div>

            <!-- Channel Info Banner -->
            <div class="info-banner">
                <div class="banner-icon"><i class="fas fa-bullhorn"></i></div>
                <div class="banner-text">
                    <div class="banner-title">One-Way Messaging</div>
                    <div class="banner-sub">Only admins and owner can post messages</div>
                </div>
            </div>

            <!-- Generated Link -->
            <div class="link-box" id="linkBox">
                <div class="link-content">
                    <i class="fas fa-check-circle"></i>
                    <span class="link-text" id="generatedLink">Link: </span>
                </div>
            </div>

            <!-- Search Users -->
            <div class="input-group">
                <label class="input-label">Add Subscribers</label>
                <div class="input-with-icon">
                    <i class="fas fa-search input-icon"></i>
                    <input class="input-field" id="searchInput" placeholder="Search users to add... (optional)" oninput="searchUsers(this.value)" />
                </div>
            </div>

            <!-- Selected Members -->
            <div class="selected-members" id="selectedMembers"></div>

            <!-- Search Results -->
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== LOADING OVERLAY ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)" />

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // ─── STATE ─────────────────────────────────────────────────────
        let currentUserId = null;
        let currentUserEmail = '';
        let channelPhotoUrl = null;
        let selectedMembers = [];
        let searchResults = [];
        let generatedLink = null;
        let isLoading = false;

        // ─── LOCAL STORAGE HELPERS ──────────────────────────────────
        function getFromLocalStorage(key) {
            try {
                const value = localStorage.getItem(key);
                if (!value) return null;
                try {
                    return JSON.parse(value);
                } catch {
                    return value;
                }
            } catch (e) {
                return null;
            }
        }

        function saveToLocalStorage(key, value) {
            try {
                if (typeof value === 'string') {
                    localStorage.setItem(key, value);
                } else {
                    localStorage.setItem(key, JSON.stringify(value));
                }
            } catch (e) {
                console.warn('Could not save to localStorage:', e);
            }
        }

        function removeFromLocalStorage(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) {}
        }

        // ─── DOM REFS ─────────────────────────────────────────────────
        const channelAvatar = document.getElementById('channelAvatar');
        const channelName = document.getElementById('channelName');
        const channelDescription = document.getElementById('channelDescription');
        const inviteName = document.getElementById('inviteName');
        const searchInput = document.getElementById('searchInput');
        const selectedMembersContainer = document.getElementById('selectedMembers');
        const searchResultsContainer = document.getElementById('searchResults');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const createBtn = document.getElementById('createBtn');
        const linkBox = document.getElementById('linkBox');
        const generatedLinkText = document.getElementById('generatedLink');
        const toast = document.getElementById('toast');

        // ─── TOAST ────────────────────────────────────────────────────
        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ─── NAVIGATION ──────────────────────────────────────────────
        function goBack() {
            window.history.back();
        }

        // ─── CHECK AUTH ──────────────────────────────────────────────
        function checkAuth() {
            const userId = getFromLocalStorage('mock_user_id');
            if (userId) {
                currentUserId = userId;
                currentUserEmail = getFromLocalStorage('mock_email') || '';
                return true;
            }
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
                currentUserEmail = auth.currentUser.email || '';
                saveToLocalStorage('mock_user_id', currentUserId);
                saveToLocalStorage('mock_email', currentUserEmail);
                return true;
            }
            return false;
        }

        // ─── GENERATE UUID ────────────────────────────────────────────
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // ─── IMAGE UPLOAD ────────────────────────────────────────────
        function pickImage() {
            document.getElementById('imageInput').click();
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            setLoading(true);

            try {
                const storageRef = storage.ref();
                const path = `aurachat/permanent/avatars/channels/${currentUserId}/${Date.now()}_${file.name}`;
                const fileRef = storageRef.child(path);
                await fileRef.put(file);
                const downloadUrl = await fileRef.getDownloadURL();

                channelPhotoUrl = downloadUrl;
                updateAvatar();
                showToast('Photo uploaded successfully!', 'success');
            } catch (e) {
                console.error('Upload failed:', e);
                showToast('Photo upload failed. Continuing without photo.', 'error');
            } finally {
                setLoading(false);
                event.target.value = '';
            }
        }

        function updateAvatar() {
            if (channelPhotoUrl) {
                channelAvatar.innerHTML = `<img src="${channelPhotoUrl}" alt="Channel avatar" />`;
            } else {
                channelAvatar.innerHTML = `<i class="fas fa-bullhorn"></i>`;
            }
        }

        // ─── SEARCH USERS ────────────────────────────────────────────
        async function searchUsers(query) {
            if (!query || query.length < 1) {
                searchResults = [];
                renderSearchResults();
                return;
            }

            try {
                const snapshot = await db.collection('users')
                    .where('username', '>=', query)
                    .where('username', '<=', query + '\uf8ff')
                    .limit(20)
                    .get();

                const results = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.id !== currentUserId) {
                        results.push({ id: doc.id, ...data });
                    }
                });

                searchResults = results;
                renderSearchResults();
            } catch (e) {
                console.error('Search error:', e);
            }
        }

        // ─── TOGGLE MEMBER ───────────────────────────────────────────
        function toggleMember(user) {
            const index = selectedMembers.findIndex(m => m.id === user.id);
            if (index >= 0) {
                selectedMembers.splice(index, 1);
            } else {
                selectedMembers.push(user);
            }
            renderSelectedMembers();
            renderSearchResults();
        }

        // ─── RENDER SELECTED MEMBERS ────────────────────────────────
        function renderSelectedMembers() {
            if (selectedMembers.length === 0) {
                selectedMembersContainer.innerHTML = '';
                return;
            }

            let html = '';
            selectedMembers.forEach(member => {
                const avatarHtml = member.avatar_url
                    ? `<img src="${member.avatar_url}" alt="${member.username || 'User'}" />`
                    : `<span>${(member.username || 'U')[0].toUpperCase()}</span>`;

                html += `
                    <div class="selected-member">
                        <div class="selected-member-avatar">${avatarHtml}</div>
                        <button class="selected-member-remove" onclick="toggleMember({id:'${member.id}', username:'${member.username || 'Unknown'}'})">
                            <i class="fas fa-times"></i>
                        </button>
                        <div class="selected-member-name">${escapeHtml(member.username || 'Unknown')}</div>
                    </div>
                `;
            });

            selectedMembersContainer.innerHTML = html;
        }

        // ─── RENDER SEARCH RESULTS ──────────────────────────────────
        function renderSearchResults() {
            if (searchResults.length === 0) {
                searchResultsContainer.innerHTML = '';
                return;
            }

            let html = '';
            searchResults.forEach(user => {
                const isSelected = selectedMembers.some(m => m.id === user.id);
                const avatarHtml = user.avatar_url
                    ? `<img src="${user.avatar_url}" alt="${user.username || 'User'}" />`
                    : `<span>${(user.username || 'U')[0].toUpperCase()}</span>`;

                html += `
                    <div class="search-result-item" onclick="toggleMember({id:'${user.id}', username:'${user.username || 'Unknown'}', avatar_url:'${user.avatar_url || ''}', email:'${user.email || ''}'})">
                        <div class="search-result-avatar">${avatarHtml}</div>
                        <div class="search-result-info">
                            <div class="search-result-name">${escapeHtml(user.username || 'Unknown')}</div>
                            <div class="search-result-email">${escapeHtml(user.email || '')}</div>
                        </div>
                        <div class="${isSelected ? 'search-result-check' : 'search-result-add'}">
                            <i class="fas ${isSelected ? 'fa-check-circle' : 'fa-plus-circle'}"></i>
                        </div>
                    </div>
                `;
            });

            searchResultsContainer.innerHTML = html;
        }

        // ─── CREATE CHANNEL ──────────────────────────────────────────
        async function createChannel() {
            const name = channelName.value.trim();
            if (!name) {
                showToast('Please enter a channel name', 'error');
                return;
            }

            setLoading(true);
            createBtn.disabled = true;
            createBtn.innerHTML = '<span class="spinner-small"></span>';

            try {
                const participants = [currentUserId, ...selectedMembers.map(m => m.id)];
                const participantsData = {};

                participants.forEach(id => {
                    participantsData[id] = {
                        role: id === currentUserId ? 'owner' : 'subscriber',
                        joined_at: firebase.firestore.FieldValue.serverTimestamp()
                    };
                });

                const chatId = generateUUID();

                await db.collection('chats').doc(chatId).set({
                    id: chatId,
                    name: name,
                    description: channelDescription.value.trim() || null,
                    avatar_url: channelPhotoUrl || null,
                    type: 'channel',
                    created_by: currentUserId,
                    created_by_email: currentUserEmail,
                    participants: participants,
                    participants_data: participantsData,
                    member_count: participants.length,
                    banned_users: [],
                    settings: {
                        chat_disabled: false,
                        file_sharing_disabled: false,
                        slow_mode_seconds: 0,
                        restrict_new_members_minutes: 0,
                        message_retention_days: 0,
                        welcome_message: `Welcome to ${name}!`,
                        rules: 'Be respectful and kind to all members.',
                        announcements_only: true,
                        polls_enabled: true,
                        reactions_enabled: true,
                        forwarding_enabled: true,
                        voice_chat_enabled: false
                    },
                    pinned_messages: [],
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    updated_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message: 'Channel created'
                });

                // Generate invitation link
                try {
                    const inviteLink = generateInvitationLink(chatId, name);
                    generatedLink = inviteLink;
                    linkBox.classList.add('show');
                    generatedLinkText.textContent = `Link: ${inviteLink}`;
                } catch (e) {
                    console.error('Invitation creation failed:', e);
                }

                setLoading(false);
                createBtn.innerHTML = 'Create';
                createBtn.disabled = false;
                showToast('Channel created successfully!', 'success');

                setTimeout(() => {
                    window.location.href = 'chats.html';
                }, 1500);

            } catch (e) {
                console.error('Create channel error:', e);
                setLoading(false);
                createBtn.innerHTML = 'Create';
                createBtn.disabled = false;
                showToast(`Error: ${e.message}`, 'error');
            }
        }

        // ─── GENERATE INVITATION LINK ────────────────────────────────
        function generateInvitationLink(chatId, chatName) {
            const baseUrl = window.location.origin;
            const inviteCode = generateUUID().substring(0, 8);
            return `${baseUrl}/join?code=${inviteCode}&chat=${chatId}`;
        }

        // ─── LOADING ──────────────────────────────────────────────────
        function setLoading(loading) {
            isLoading = loading;
            if (loading) {
                loadingOverlay.classList.add('active');
            } else {
                loadingOverlay.classList.remove('active');
            }
        }

        // ─── UTILITY ──────────────────────────────────────────────────
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ─── KEYBOARD SHORTCUTS ──────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                if (e.target.id === 'channelName' || e.target.id === 'channelDescription' || e.target.id === 'inviteName') {
                    createChannel();
                }
            }
        });

        // ─── INIT ─────────────────────────────────────────────────────
        function init() {
            if (!checkAuth()) {
                showToast('Please login first', 'error');
                setTimeout(() => {
                    window.location.href = 'email_verification.html';
                }, 1500);
                return;
            }

            console.log('📢 Create Channel Screen loaded');
            console.log('👤 User:', currentUserId);
        }

        // ─── START ────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUserId = user.uid;
                    currentUserEmail = user.email || '';
                    saveToLocalStorage('mock_user_id', user.uid);
                    saveToLocalStorage('mock_email', currentUserEmail);
                    init();
                } else {
                    const userId = getFromLocalStorage('mock_user_id');
                    if (userId) {
                        currentUserId = userId;
                        currentUserEmail = getFromLocalStorage('mock_email') || '';
                        init();
                    } else {
                        window.location.href = 'email_verification.html';
                    }
                }
            });
        });

        console.log('📢 AURA Chat — Create Channel');
        console.log('🔗 Firebase Project:', firebaseConfig.projectId);
    </script>

</body>
</html>
