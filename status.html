<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AURA - Status</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0A0A0F;
    color: #fff;
    overflow: hidden;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 10px; }

#app {
    height: 100vh; height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex; flex-direction: column;
    background:
        radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
        #0A0A0F;
    position: relative;
}

.app-bar {
    padding: 20px 20px 8px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 76px;
    flex-shrink: 0;
}
.app-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.app-bar-actions button {
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    padding: 8px;
    cursor: pointer;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.app-bar-actions button:hover { background: rgba(255,255,255,0.05); }

.my-status-bar {
    padding: 4px 20px 12px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.my-avatar-wrap {
    position: relative;
    width: 54px;
    height: 54px;
    flex-shrink: 0;
}
.my-avatar-ring {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    padding: 2px;
    background: rgba(139, 92, 246, 0.3);
}
.my-avatar-ring.has-status {
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
}
.my-avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #1a103c;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #8B5CF6;
    font-size: 20px;
    border: 2px solid #0A0A0F;
}
.my-avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
.plus-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    border: 2px solid #0A0A0F;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #fff;
}
.my-status-info { flex: 1; min-width: 0; }
.my-status-title {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
}
.my-status-sub {
    font-size: 12.5px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
}

.section-label {
    padding: 16px 20px 8px 20px;
    font-size: 11.5px;
    font-weight: 700;
    color: rgba(139, 92, 246, 0.9);
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

.status-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0 0 100px 0;
}

.status-list { list-style: none; }

.status-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s;
}
.status-item:hover { background: rgba(255,255,255,0.03); }
.status-item.mine { background: rgba(139, 92, 246, 0.04); }

.status-ring {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    flex-shrink: 0;
}
.status-ring.seen {
    background: rgba(255,255,255,0.15);
}
.status-ring-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #1a103c;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    border: 2px solid #0A0A0F;
}
.status-ring-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.status-info { flex: 1; min-width: 0; }
.status-name {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
}
.status-name .mine-badge {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    padding: 1px 6px;
    border-radius: 4px;
}
.status-meta {
    font-size: 12.5px;
    color: rgba(255,255,255,0.45);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 12px;
}
.status-meta .stat {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.status-meta .stat i { font-size: 11px; }

.status-thumb {
    width: 46px;
    height: 46px;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    background: rgba(255,255,255,0.05);
}
.status-thumb img { width: 100%; height: 100%; object-fit: cover; }
.status-thumb .text-thumb {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    font-size: 9px;
    color: #fff;
    text-align: center;
    overflow: hidden;
    line-height: 1.1;
}

.loading-wrap {
    display: flex;
    justify-content: center;
    padding: 60px 20px;
}
.spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(139, 92, 246, 0.2);
    border-top-color: #8B5CF6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 30px;
    text-align: center;
}
.empty-wrap i {
    font-size: 60px;
    color: rgba(255,255,255,0.08);
    margin-bottom: 16px;
}
.empty-title { color: rgba(255,255,255,0.35); font-size: 15px; font-weight: 500; }
.empty-sub { color: rgba(255,255,255,0.2); font-size: 13px; margin-top: 6px; line-height: 1.5; }

.fab {
    position: fixed;
    bottom: 24px;
    right: calc(50% - 240px + 24px);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(139, 92, 246, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: transform 0.2s;
}
.fab:hover { transform: scale(1.06); }
.fab:active { transform: scale(0.94); }
@media (max-width: 480px) {
    .fab { right: 24px; }
}

.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    display: none;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; }

.modal-content {
    background: #1a103c;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 20px 20px 30px 20px;
    animation: slideUp 0.25s ease-out;
    max-height: 80vh;
    overflow-y: auto;
}
@keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
.modal-handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    margin: 0 auto 18px auto;
}
.modal-item {
    display: flex;
    align-items: center;
    padding: 12px 12px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: background 0.15s;
}
.modal-item:hover { background: rgba(255,255,255,0.05); }
.modal-item-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 14px;
    font-size: 18px;
    flex-shrink: 0;
}
.modal-item-label { color: #fff; font-size: 15px; font-weight: 500; }
.modal-item-sub { color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 2px; }

.modal-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #fff;
}

.text-status-input {
    width: 100%;
    min-height: 100px;
    padding: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
}
.text-status-input:focus { border-color: #8B5CF6; }
.color-row {
    display: flex;
    gap: 8px;
    padding: 12px 0;
    flex-wrap: wrap;
}
.color-swatch {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
}
.color-swatch.active { border-color: #fff; }

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 16px;
}
.btn {
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
}
.btn-cancel { background: transparent; color: rgba(255,255,255,0.5); }
.btn-primary {
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    color: #fff;
}

.viewer {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    z-index: 3000;
    display: none;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
}
.viewer.active { display: flex; }

.progress-track {
    display: flex;
    gap: 3px;
    padding: 8px 8px 0 8px;
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
}
.progress-seg {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    overflow: hidden;
}
.progress-seg-fill {
    height: 100%;
    width: 0;
    background: #fff;
    border-radius: 2px;
}
.progress-seg.done .progress-seg-fill { width: 100%; }
.progress-seg.active .progress-seg-fill {
    animation: fillSeg var(--dur, 5s) linear forwards;
}
@keyframes fillSeg {
    from { width: 0; }
    to { width: 100%; }
}

.viewer-header {
    padding: 22px 14px 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 10;
}
.viewer-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: #8B5CF6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    border: 2px solid rgba(255,255,255,0.2);
}
.viewer-avatar img { width: 100%; height: 100%; object-fit: cover; }
.viewer-user-info { flex: 1; min-width: 0; }
.viewer-username {
    font-size: 14.5px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
}
.viewer-time {
    font-size: 11.5px;
    color: rgba(255,255,255,0.6);
    margin-top: 2px;
}
.viewer-close {
    background: rgba(0,0,0,0.4);
    border: none;
    color: #fff;
    font-size: 18px;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.viewer-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0 12px;
    overflow: hidden;
}
.viewer-body img, .viewer-body video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 12px;
}
.viewer-text-status {
    max-width: 85%;
    padding: 40px 28px;
    border-radius: 20px;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.35;
    text-align: center;
    color: #fff;
    word-wrap: break-word;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}
.viewer-caption {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    text-align: center;
    display: none;
}

.viewer-nav {
    position: absolute;
    top: 0; bottom: 0;
    width: 30%;
    z-index: 5;
    cursor: pointer;
}
.viewer-nav.left { left: 0; }
.viewer-nav.right { right: 0; }

.viewer-footer {
    padding: 12px 14px 20px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 10;
    background: linear-gradient(transparent, rgba(0,0,0,0.6));
}

.reply-field {
    flex: 1;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 22px;
    padding: 11px 16px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
}
.reply-field::placeholder { color: rgba(255,255,255,0.55); }
.reply-field:focus { border-color: rgba(139, 92, 246, 0.6); }

.footer-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
    transition: all 0.15s;
}
.footer-btn:hover { background: rgba(255,255,255,0.2); }
.footer-btn.send {
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    box-shadow: 0 4px 14px rgba(139, 92, 246, 0.5);
}

.emoji-tray {
    position: absolute;
    bottom: 78px;
    right: 14px;
    background: rgba(20, 20, 30, 0.96);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 10px 12px;
    display: none;
    gap: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.emoji-tray.show { display: flex; }
.emoji-tray .emoji {
    font-size: 24px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 10px;
    transition: transform 0.15s;
}
.emoji-tray .emoji:hover { transform: scale(1.25); }

.viewers-panel {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 3500;
    display: none;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(6px);
}
.viewers-panel.active { display: flex; }
.viewers-panel-content {
    background: #1a103c;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 18px 20px 30px 20px;
    max-height: 70vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease-out;
}
.viewers-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.viewers-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}
.viewers-tab {
    padding: 10px 14px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
}
.viewers-tab.active {
    color: #8B5CF6;
    border-bottom-color: #8B5CF6;
}
.viewer-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 4px;
}
.viewer-row-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(139, 92, 246, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-weight: 700;
    color: #8B5CF6;
    flex-shrink: 0;
    font-size: 16px;
}
.viewer-row-avatar img { width: 100%; height: 100%; object-fit: cover; }
.viewer-row-info { flex: 1; min-width: 0; }
.viewer-row-name {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
}
.viewer-row-time {
    font-size: 11.5px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
}
.viewer-row-emoji { font-size: 20px; flex-shrink: 0; }
.viewers-empty {
    text-align: center;
    padding: 30px 20px;
    color: rgba(255,255,255,0.35);
    font-size: 13.5px;
}

.toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 16, 60, 0.98);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: #fff;
    padding: 11px 22px;
    border-radius: 12px;
    font-size: 13px;
    z-index: 5000;
    display: none;
    max-width: 88%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
.toast.show { display: block; animation: toastIn 0.2s ease-out; }
@keyframes toastIn {
    from { transform: translate(-50%, 10px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
}
.toast.error { border-color: rgba(239, 68, 68, 0.4); }
.toast.success { border-color: rgba(74, 222, 128, 0.4); }
</style>
</head>
<body>

<div id="app">
    <div class="app-bar">
        <div class="app-title">AURA</div>
        <div class="app-bar-actions">
            <button onclick="window.location.href='global_search.html'">
                <i class="fas fa-search"></i>
            </button>
            <button onclick="window.location.href='chats.html'">
                <i class="fas fa-comment"></i>
            </button>
        </div>
    </div>

    <div class="my-status-bar" id="myStatusBar" onclick="onMyStatusTap()">
        <div class="my-avatar-wrap">
            <div class="my-avatar-ring" id="myAvatarRing">
                <div class="my-avatar-inner" id="myAvatarInner">
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <div class="plus-badge" onclick="event.stopPropagation();showAddStatusMenu()">
                <i class="fas fa-plus"></i>
            </div>
        </div>
        <div class="my-status-info">
            <div class="my-status-title">My Status</div>
            <div class="my-status-sub" id="myStatusSub">Tap + to add a status update</div>
        </div>
    </div>

    <div class="section-label" id="sectionLabel">Recent Updates</div>

    <div class="status-scroll">
        <div id="statusList">
            <div class="loading-wrap"><div class="spinner"></div></div>
        </div>
    </div>

    <button class="fab" onclick="showAddStatusMenu()">
        <i class="fas fa-camera"></i>
    </button>
</div>

<div class="modal-overlay" id="addMenuModal">
    <div class="modal-content">
        <div class="modal-handle"></div>
        <div class="modal-item" onclick="closeModal('addMenuModal');pickImage()">
            <div class="modal-item-icon" style="background:rgba(139,92,246,0.15);color:#8B5CF6;">
                <i class="fas fa-image"></i>
            </div>
            <div>
                <div class="modal-item-label">Photo</div>
                <div class="modal-item-sub">Pick from gallery</div>
            </div>
        </div>
        <div class="modal-item" onclick="closeModal('addMenuModal');pickVideo()">
            <div class="modal-item-icon" style="background:rgba(6,182,212,0.15);color:#06B6D4;">
                <i class="fas fa-video"></i>
            </div>
            <div>
                <div class="modal-item-label">Video</div>
                <div class="modal-item-sub">Pick from gallery</div>
            </div>
        </div>

</div>

        <div class="modal-handle"></div>
        <div class="modal-title">Text Status</div>
        <textarea class="text-status-input" id="textInput" placeholder="What's on your mind?" maxlength="200"></textarea>
        <div class="color-row" id="colorRow"></div>

<div class="viewer" id="viewerOverlay">

        <div class="viewer-avatar" id="viewerAvatar">?</div>

        </button>

            <i class="fas fa-eye"></i>

            <i class="fas fa-paper-plane"></i>
        </button>

        <span class="emoji" onclick="reactStatus('❤️')">❤️</span>
        <span class="emoji" onclick="reactStatus('😂')">😂</span>
        <span class="emoji" onclick="reactStatus('😮')">😮</span>
        <span class="emoji" onclick="reactStatus('😢')">😢</span>
        <span class="emoji" onclick="reactStatus('👍')">👍</span>
        <span class="emoji" onclick="reactStatus('🔥')">🔥</span>

<div class="toast" id="toast"></div>

<input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImagePicked(event)" />
<input type="file" id="videoInput" accept="video/*" style="display:none" onchange="handleVideoPicked(event)" />

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
    authDomain: "aurachat-85f54.firebaseapp.com",
    projectId: "aurachat-85f54",
    storageBucket: "aurachat-85f54.firebasestorage.app",
    messagingSenderId: "539789121540",
    appId: "1:539789121540:web:96ac597e52dd0a80573d51"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const CLOUD_NAME = 'dn2mwp1lc';
const UPLOAD_PRESET = 'aura_chat';

let currentUserId = null;
let myUserData = null;
let allStatuses = [];
let currentViewerIndex = 0;
let currentGroupStatuses = [];
let viewerTimer = null;
let currentViewingStatus = null;
let viewersTab = 'viewers';

const $ = id => document.getElementById(id);
const toast = $('toast');

const TEXT_COLORS = [
    'linear-gradient(135deg, #8B5CF6, #06B6D4)',
    'linear-gradient(135deg, #EF4444, #F59E0B)',
    'linear-gradient(135deg, #10B981, #06B6D4)',
    'linear-gradient(135deg, #EC4899, #8B5CF6)',
    'linear-gradient(135deg, #F59E0B, #EF4444)',
    'linear-gradient(135deg, #1E3A8A, #3B82F6)'
];
let selectedColor = TEXT_COLORS[0];

function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast show ' + (type || '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 2400);
}

function esc(t) {
    if (!t) return '';
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
}

function checkAuth() {
    const uid = localStorage.getItem('mock_user_id');
    if (uid) { currentUserId = uid; return true; }
    if (auth.currentUser) {
        currentUserId = auth.currentUser.uid;
        localStorage.setItem('mock_user_id', currentUserId);
        return true;
    }
    return false;
}

async function fetchMyUser() {
    try {
        const doc = await db.collection('users').doc(currentUserId).get();
        if (doc.exists) {
            myUserData = doc.data();
        } else {
            myUserData = { username: 'You', display_name: 'You', avatar_url: null };
        }
    } catch (e) {
        myUserData = { username: 'You', display_name: 'You', avatar_url: null };
    }
}

function timeAgo(date) {
    if (!date) return 'Just now';
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
}

function toDate(ts) {
    if (!ts) return new Date();
    if (ts.toDate) return ts.toDate();
    return new Date(ts);
}

async function uploadToCloudinary(file, type) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    fd.append('folder', 'aura_chat/statuses');

    const url = 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/' + type + '/upload';
    const r = await fetch(url, { method: 'POST', body: fd });
    if (!r.ok) {
        const t = await r.text();
        throw new Error('Upload ' + r.status + ': ' + t);
    }
    const d = await r.json();
    if (!d.secure_url) throw new Error('No URL');
    return d.secure_url;
}

async function loadStatuses() {
    try {
        const now = new Date();
        const snap = await db.collection('statuses')
            .where('expires_at', '>', now)
            .orderBy('expires_at', 'desc')
            .limit(100)
            .get();

        allStatuses = [];
        snap.forEach(doc => {
            const d = doc.data();
            d.id = doc.id;
            allStatuses.push(d);
        });

        allStatuses.sort((a, b) => {
            return toDate(b.created_at) - toDate(a.created_at);
        });

        renderMyStatus();
        renderStatusList();
    } catch (e) {
        console.error('Load statuses:', e);
        $('statusList').innerHTML = '<div class="empty-wrap"><i class="fas fa-triangle-exclamation"></i><div class="empty-title">Could not load statuses</div><div class="empty-sub">' + esc(e.message) + '</div></div>';
    }
}

function renderMyStatus() {
    const mine = allStatuses.filter(s => s.owner_id === currentUserId);

    const avatar = myUserData?.avatar_url;
    const innerHtml = avatar
        ? '<img src="' + avatar + '" />'
        : '<i class="fas fa-user"></i>';
    $('myAvatarInner').innerHTML = innerHtml;

    if (mine.length > 0) {
        $('myAvatarRing').classList.add('has-status');
        const latest = mine[0];
        const views = (latest.views || []).length;
        const reactions = Object.values(latest.reactions || {}).reduce((a, b) => a + b.length, 0);
        $('myStatusSub').textContent = mine.length + ' update' + (mine.length > 1 ? 's' : '') + ' · ' + views + ' view' + (views !== 1 ? 's' : '') + (reactions > 0 ? ' · ' + reactions + ' reaction' + (reactions > 1 ? 's' : '') : '');
    } else {
        $('myAvatarRing').classList.remove('has-status');
        $('myStatusSub').textContent = 'Tap + to add a status update';
    }
}

function renderStatusList() {
    const mine = allStatuses.filter(s => s.owner_id === currentUserId);
    const others = allStatuses.filter(s => s.owner_id !== currentUserId);

    const grouped = {};
    others.forEach(s => {
        if (!grouped[s.owner_id]) grouped[s.owner_id] = [];
        grouped[s.owner_id].push(s);
    });

    let html = '';

    if (mine.length > 0) {
        html += '<ul class="status-list"><li class="status-item mine" onclick="openMyStatus()">';
        const latest = mine[0];
        const thumb = renderThumb(latest);
        const views = (latest.views || []).length;
        const reactions = Object.values(latest.reactions || {}).reduce((a, b) => a + b.length, 0);
        html += '<div class="status-ring has-status"><div class="status-ring-inner">' + (myUserData?.avatar_url ? '<img src="' + myUserData.avatar_url + '" />' : '<i class="fas fa-user"></i>') + '</div></div>';
        html += '<div class="status-info">';
        html += '<div class="status-name">My Status <span class="mine-badge">YOU</span></div>';
        html += '<div class="status-meta">';
        html += '<span>' + mine.length + ' update' + (mine.length > 1 ? 's' : '') + '</span>';
        html += '<span class="stat"><i class="fas fa-eye"></i>' + views + '</span>';
        if (reactions > 0) html += '<span class="stat"><i class="fas fa-heart"></i>' + reactions + '</span>';
        html += '</div></div>';
        html += '<div class="status-thumb">' + thumb + '</div>';
        html += '</li></ul>';
    }

    const groupIds = Object.keys(grouped);
    if (groupIds.length === 0) {
        if (mine.length === 0) {
            $('sectionLabel').textContent = 'Recent Updates';
            $('statusList').innerHTML = html + '<div class="empty-wrap"><i class="fas fa-circle-dot"></i><div class="empty-title">No status updates</div><div class="empty-sub">When people you know post a status, it will show up here.</div></div>';
        } else {
            $('sectionLabel').textContent = 'Recent Updates';
            $('statusList').innerHTML = html + '<div class="empty-wrap"><i class="fas fa-circle-dot"></i><div class="empty-title">No updates from others</div><div class="empty-sub">Wait for others to post or share your status.</div></div>';
        }
        return;
    }

    $('sectionLabel').textContent = 'Recent Updates';

    html += '<ul class="status-list">';
    groupIds.forEach(ownerId => {
        const posts = grouped[ownerId];
        const latest = posts[0];
        const owner = latest.owner_name || 'User';
        const avatar = latest.owner_avatar;
        const hasSeen = posts.every(p => (p.views || []).includes(currentUserId));
        const thumb = renderThumb(latest);

        html += '<li class="status-item" onclick="openOwnerStatuses(\'' + ownerId + '\')">';
        html += '<div class="status-ring ' + (hasSeen ? 'seen' : '') + '"><div class="status-ring-inner">' + (avatar ? '<img src="' + avatar + '" />' : esc(owner.charAt(0).toUpperCase())) + '</div></div>';
        html += '<div class="status-info">';
        html += '<div class="status-name">' + esc(owner) + '</div>';
        html += '<div class="status-meta">' + posts.length + ' update' + (posts.length > 1 ? 's' : '') + ' · ' + timeAgo(toDate(latest.created_at)) + '</div>';
        html += '</div>';
        html += '<div class="status-thumb">' + thumb + '</div>';
        html += '</li>';
    });
    html += '</ul>';

    $('statusList').innerHTML = html;
}

function renderThumb(status) {
    if (status.type === 'image' && status.media_url) {
        return '<img src="' + status.media_url + '" />';
    }
    if (status.type === 'video' && status.media_url) {
        return '<div class="text-thumb" style="background:#000;"><i class="fas fa-play" style="font-size:16px;"></i></div>';
    }
    const text = (status.caption || 'Text').slice(0, 30);
    return '<div class="text-thumb" style="background:' + (status.color || TEXT_COLORS[0]) + ';">' + esc(text) + '</div>';
}

function showAddStatusMenu() {
    $('addMenuModal').classList.add('active');
}

function pickImage() { $('imageInput').click(); }
function pickVideo() { $('videoInput').click(); }

async function handleImagePicked(e) {
    const f = e.target.files[0];
    if (!f) return;
    e.target.value = '';
    await postMediaStatus(f, 'image');
}

async function handleVideoPicked(e) {
    const f = e.target.files[0];
    if (!f) return;
    e.target.value = '';
    await postMediaStatus(f, 'video');
}

async function postMediaStatus(file, type) {
    showToast('Uploading ' + type + '...');
    try {
        const url = await uploadToCloudinary(file, type);
        await saveStatus({
            type: type,
            media_url: url,
            caption: ''
        });
        showToast('Status posted', 'success');
        await loadStatuses();
    } catch (e) {
        console.error(e);
        showToast('Upload failed: ' + e.message, 'error');
    }
}

function showTextStatusModal() {
    selectedColor = TEXT_COLORS[0];
    $('textInput').value = '';
    renderColorRow();
    $('textStatusModal').classList.add('active');
    setTimeout(() => $('textInput').focus(), 250);
}

function renderColorRow() {
    let html = '';
    TEXT_COLORS.forEach((c, i) => {
        html += '<div class="color-swatch' + (c === selectedColor ? ' active' : '') + '" style="background:' + c + ';" onclick="selectColor(' + i + ')"></div>';
    });
    $('colorRow').innerHTML = html;
}

function selectColor(i) {
    selectedColor = TEXT_COLORS[i];
    renderColorRow();
}

async function postTextStatus() {
    const text = $('textInput').value.trim();
    if (!text) { showToast('Enter some text', 'error'); return; }

    $('textStatusModal').classList.remove('active');

    try {
        await saveStatus({
            type: 'text',
            media_url: null,
            caption: text,
            color: selectedColor
        });
        showToast('Status posted', 'success');
        await loadStatuses();
    } catch (e) {
        showToast('Error: ' + e.message, 'error');
    }
}

async function saveStatus(data) {
    const ref = db.collection('statuses').doc();
    const now = new Date();
    const expires = new Date(now.getTime() + 24 * 60 * 60 * 1000);

    await ref.set({
        id: ref.id,
        owner_id: currentUserId,
        owner_name: myUserData?.display_name || myUserData?.username || 'You',
        owner_avatar: myUserData?.avatar_url || null,
        type: data.type,
        media_url: data.media_url || null,
        caption: data.caption || '',
        color: data.color || null,
        created_at: firebase.firestore.FieldValue.serverTimestamp(),
        expires_at: expires,
        views: [],
        reactions: {}
    });
}

function openMyStatus() {
    const mine = allStatuses.filter(s => s.owner_id === currentUserId);
    if (mine.length === 0) { showAddStatusMenu(); return; }
    openOwnerStatuses(currentUserId);
}

function openOwnerStatuses(ownerId) {
    const posts = allStatuses.filter(s => s.owner_id === ownerId);
    if (posts.length === 0) return;
    posts.sort((a, b) => toDate(a.created_at) - toDate(b.created_at));
    currentGroupStatuses = posts;
    currentViewerIndex = 0;
    openViewer();
}

function openViewer() {
    const status = currentGroupStatuses[currentViewerIndex];
    if (!status) return;
    currentViewingStatus = status;
    const isMine = status.owner_id === currentUserId;

    $('viewerOverlay').classList.add('active');

    const owner = status.owner_name || 'User';
    const avatar = status.owner_avatar;
    $('viewerUsername').textContent = isMine ? 'You' : owner;
    if (avatar) {
        $('viewerAvatar').innerHTML = '<img src="' + avatar + '" />';
    } else {
        $('viewerAvatar').textContent = owner.charAt(0).toUpperCase();
    }
    $('viewerTime').textContent = timeAgo(toDate(status.created_at));

    const body = $('viewerBody');
    if (status.type === 'image' && status.media_url) {
        body.innerHTML = '<img src="' + status.media_url + '" />';
    } else if (status.type === 'video' && status.media_url) {
        body.innerHTML = '<video src="' + status.media_url + '" autoplay playsinline></video>';
    } else {
        body.innerHTML = '<div class="viewer-text-status" style="background:' + (status.color || TEXT_COLORS[0]) + ';">' + esc(status.caption) + '</div>';
    }

    const capEl = $('viewerCaption');
    if (status.type !== 'text' && status.caption) {
        capEl.textContent = status.caption;
        capEl.style.display = 'block';
    } else {
        capEl.style.display = 'none';
    }

    const emojiBtn = $('emojiBtn');
    const viewersBtn = $('viewersBtn');
    const sendBtn = $('sendBtn');
    const replyField = $('replyField');

    if (isMine) {
        emojiBtn.style.display = 'none';
        replyField.style.display = 'none';
        sendBtn.style.display = 'none';
        viewersBtn.style.display = 'flex';
    } else {
        emojiBtn.style.display = 'flex';
        replyField.style.display = 'block';
        sendBtn.style.display = 'flex';
        viewersBtn.style.display = 'none';
        replyField.value = '';

        markViewed(status);
    }

    renderProgress();
    startProgressTimer(status);
}

function renderProgress() {
    let html = '';
    currentGroupStatuses.forEach((_, i) => {
        let cls = 'progress-seg';
        if (i < currentViewerIndex) cls += ' done';
        if (i === currentViewerIndex) cls += ' active';
        html += '<div class="' + cls + '" style="--dur:' + getDuration(currentGroupStatuses[i]) + 's"><div class="progress-seg-fill"></div></div>';
    });
    $('progressTrack').innerHTML = html;
}

function getDuration(status) {
    if (status.type === 'video') return 30;
    if (status.type === 'text') return 5;
    return 5;
}

function startProgressTimer(status) {
    if (viewerTimer) clearTimeout(viewerTimer);
    const dur = getDuration(status) * 1000;
    viewerTimer = setTimeout(() => { nextStatus(); }, dur);
}

function nextStatus() {
    if (currentViewerIndex < currentGroupStatuses.length - 1) {
        currentViewerIndex++;
        openViewer();
    } else {
        closeViewer();
    }
}

function prevStatus() {
    if (currentViewerIndex > 0) {
        currentViewerIndex--;
        openViewer();
    }
}

function closeViewer() {
    if (viewerTimer) { clearTimeout(viewerTimer); viewerTimer = null; }
    $('viewerOverlay').classList.remove('active');
    $('emojiTray').classList.remove('show');
    currentViewingStatus = null;
    currentGroupStatuses = [];
    loadStatuses();
}

async function markViewed(status) {
    if ((status.views || []).includes(currentUserId)) return;
    try {
        await db.collection('statuses').doc(status.id).update({
            views: firebase.firestore.FieldValue.arrayUnion([currentUserId])
        });
        status.views = (status.views || []).concat([currentUserId]);
    } catch (e) { console.error(e); }
}

function toggleEmojiTray() {
    $('emojiTray').classList.toggle('show');
}

async function reactStatus(emoji) {
    if (!currentViewingStatus) return;
    const status = currentViewingStatus;
    $('emojiTray').classList.remove('show');

    try {
        const reactions = status.reactions || {};
        const users = (reactions[emoji] || []).slice();
        const isMine = users.includes(currentUserId);

        const update = {};
        if (isMine) {
            const updated = users.filter(u => u !== currentUserId);
            if (updated.length === 0) {
                update['reactions.' + emoji] = firebase.firestore.FieldValue.delete();
                delete reactions[emoji];
            } else {
                update['reactions.' + emoji] = updated;
                reactions[emoji] = updated;
            }
        } else {
            update['reactions.' + emoji] = firebase.firestore.FieldValue.arrayUnion(currentUserId);
            if (!reactions[emoji]) reactions[emoji] = [];
            reactions[emoji] = reactions[emoji].concat([currentUserId]);
        }

        await db.collection('statuses').doc(status.id).update(update);
        status.reactions = reactions;
        showToast(isMine ? 'Reaction removed' : 'Reacted ' + emoji, 'success');
    } catch (e) {
        console.error(e);
        showToast('Could not react: ' + e.message, 'error');
    }
}

async function sendReply() {
    if (!currentViewingStatus) return;
    const text = $('replyField').value.trim();
    if (!text) return;

    const status = currentViewingStatus;
    const ownerId = status.owner_id;

    if (ownerId === currentUserId) {
        showToast('You can\'t reply to your own status', 'error');
        return;
    }

    try {
        const replyRef = db.collection('statuses').doc(status.id).collection('replies').doc();
        await replyRef.set({
            id: replyRef.id,
            user_id: currentUserId,
            user_name: myUserData?.display_name || myUserData?.username || 'User',
            user_avatar: myUserData?.avatar_url || null,
            message: text,
            created_at: firebase.firestore.FieldValue.serverTimestamp()
        });

        const chatId = [currentUserId, ownerId].sort().join('_');
        const chatRef = db.collection('chats').doc(chatId);
        const chatSnap = await chatRef.get();

        if (!chatSnap.exists) {
            await chatRef.set({
                id: chatId,
                type: 'direct',
                participants: [currentUserId, ownerId],
                participants_data: {},
                created_at: firebase.firestore.FieldValue.serverTimestamp(),
                last_message: 'Replied to your status',
                last_message_at: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        const msgRef = chatRef.collection('messages').doc();
        await msgRef.set({
            id: msgRef.id,
            sender_id: currentUserId,
            sender_name: myUserData?.display_name || myUserData?.username || 'User',
            text: text,
            content: text,
            is_status_reply: true,
            status_preview_id: status.id,
            status_preview_type: status.type,
            status_preview_url: status.media_url || null,
            status_preview_caption: status.caption || '',
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
            is_read: false,
            is_edited: false,
            deleted_for_everyone: false,
            reactions: {}
        });

        await chatRef.update({
            last_message: '📸 Replied to status: ' + text.slice(0, 40),
            last_message_at: firebase.firestore.FieldValue.serverTimestamp(),
            ['unread_counts.' + ownerId]: firebase.firestore.FieldValue.increment(1)
        }).catch(() => {});

        $('replyField').value = '';
        showToast('Reply sent', 'success');
    } catch (e) {
        console.error(e);
        showToast('Could not send reply: ' + e.message, 'error');
    }
}

function openViewersPanel() {
    if (!currentViewingStatus) return;

    const status = currentViewingStatus;
    const views = status.views || [];
    const reactions = status.reactions || {};

    $('viewersCount').textContent = views.length;

    let totalReactions = 0;
    Object.values(reactions).forEach(arr => { totalReactions += arr.length; });
    $('reactionsCount').textContent = totalReactions;

    $('viewersTitle').textContent = 'Status Insights';
    $('viewersPanel').classList.add('active');
    viewersTab = 'viewers';
    $('tabViewers').classList.add('active');
    $('tabReactions').classList.remove('active');

    renderViewersList(status);
}

function switchViewersTab(tab) {
    viewersTab = tab;
    $('tabViewers').classList.toggle('active', tab === 'viewers');
    $('tabReactions').classList.toggle('active', tab === 'reactions');
    renderViewersList(currentViewingStatus);
}

async function renderViewersList(status) {
    const body = $('viewersListBody');
    body.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';

    if (!status) {
        body.innerHTML = '<div class="viewers-empty">No status selected</div>';
        return;
    }

    if (viewersTab === 'viewers') {
        const views = status.views || [];
        if (views.length === 0) {
            body.innerHTML = '<div class="viewers-empty">No views yet</div>';
            return;
        }
        let html = '';
        for (const uid of views) {
            const u = await fetchUser(uid);
            html += renderViewerRow(u, null);
        }
        body.innerHTML = html;
    } else {
        const reactions = status.reactions || {};
        const entries = [];
        Object.keys(reactions).forEach(emoji => {
            (reactions[emoji] || []).forEach(uid => {
                entries.push({ uid, emoji });
            });
        });

        if (entries.length === 0) {
            body.innerHTML = '<div class="viewers-empty">No reactions yet</div>';
            return;
        }

        let html = '';
        for (const e of entries) {
            const u = await fetchUser(e.uid);
            html += renderViewerRow(u, e.emoji);
        }
        body.innerHTML = html;
    }
}

async function fetchUser(uid) {
    try {
        const doc = await db.collection('users').doc(uid).get();
        if (doc.exists) {
            const d = doc.data();
            return {
                uid: uid,
                name: d.display_name || d.username || 'User',
                avatar: d.avatar_url || null
            };
        }
    } catch (e) {}
    return { uid: uid, name: 'User', avatar: null };
}

function renderViewerRow(user, emoji) {
    const avatar = user.avatar
        ? '<img src="' + user.avatar + '" />'
        : esc(user.name.charAt(0).toUpperCase());
    return '<div class="viewer-row">' +
        '<div class="viewer-row-avatar">' + avatar + '</div>' +
        '<div class="viewer-row-info">' +
            '<div class="viewer-row-name">' + esc(user.name) + '</div>' +
        '</div>' +
        (emoji ? '<div class="viewer-row-emoji">' + emoji + '</div>' : '') +
    '</div>';
}

function closeViewersPanel() {
    $('viewersPanel').classList.remove('active');
}

$('viewersPanel').addEventListener('click', (e) => {
    if (e.target === $('viewersPanel')) closeViewersPanel();
});

function closeModal(id) { $(id).classList.remove('active'); }
document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', (e) => {
        if (e.target === el) el.classList.remove('active');
    });
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if ($('viewerOverlay').classList.contains('active')) closeViewer();
        else if ($('viewersPanel').classList.contains('active')) closeViewersPanel();
        else document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
    }
    if (e.key === 'ArrowRight' && $('viewerOverlay').classList.contains('active')) nextStatus();
    if (e.key === 'ArrowLeft' && $('viewerOverlay').classList.contains('active')) prevStatus();
    if (e.key === 'Enter' && document.activeElement === $('replyField')) sendReply();
});

async function init() {
    if (!checkAuth()) { location.href = 'email_verification.html'; return; }
    await fetchMyUser();
    await loadStatuses();

    setInterval(() => {
        if (!$('viewerOverlay').classList.contains('active')) {
            loadStatuses();
        }
    }, 30000);
}

document.addEventListener('DOMContentLoaded', () => {
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUserId = user.uid;
            localStorage.setItem('mock_user_id', currentUserId);
            init();
        } else {
            const uid = localStorage.getItem('mock_user_id');
            if (uid) { currentUserId = uid; init(); }
            else location.href = 'email_verification.html';
        }
    });
});
</script>
