<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0F;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .loading {
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading AURA Chat...</div>
    </div>

    <script>
        // ─── CHECK AUTH AND REDIRECT ──────────────────────────────
        (function() {
            // Check localStorage for session
            const userId = localStorage.getItem('mock_user_id');
            const email = localStorage.getItem('mock_email');

            // Check if user is authenticated
            const isAuthenticated = userId && email;

            // Get the session token for middleware
            if (isAuthenticated) {
                // Save session to localStorage for middleware to read
                const session = {
                    userId: userId,
                    email: email,
                    timestamp: Date.now()
                };
                localStorage.setItem('aura_session', JSON.stringify(session));
                
                // Redirect to chats
                window.location.href = '/chats.html';
            } else {
                // Clear any stale session
                localStorage.removeItem('aura_session');
                // Redirect to login
                window.location.href = '/email_verification.html';
            }
        })();
    </script>
</body>
</html>
